<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Empleados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 820px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .nomina-total { background: var(--artal-blue); color: #fff; border-radius: 12px; padding: 12px 18px; margin-bottom: 12px; }
    .nomina-total .nt-lbl { font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: .5px; }
    .nomina-total .nt-big { font-size: 22px; font-weight: bold; margin-top: 2px; }
    .nomina-total .nt-sub { font-size: 12.5px; opacity: .9; margin-top: 3px; }
    .toolbar input.search { flex: 1; min-width: 180px; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; }
    .btn-nuevo { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .emp-card { display: flex; align-items: center; gap: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--artal-blue); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 17px; flex: 0 0 auto; }
    .emp-info { flex: 1; min-width: 0; }
    .emp-info b { color: var(--artal-blue); font-size: 15.5px; }
    .emp-info .meta { font-size: 12.5px; color: #667; margin-top: 3px; }
    .estado { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; letter-spacing: .5px; }
    .estado.activo { background: #e7f7ee; color: #1f9d61; }
    .estado.inactivo { background: #f1f1f4; color: #8a93a0; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button, .row-actions .b-exped { border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 38px; }
    .b-exped { display: inline-flex; align-items: center; box-sizing: border-box; background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; text-decoration: none; }
    .b-editar { background: var(--artal-blue); color: #fff; }
    .b-toggle { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 12px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 60px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .hint { font-size: 11.5px; color: #8a93a0; margin: 4px 0 0; }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-group { display: flex; flex-wrap: wrap; gap: 8px; border: 1.5px solid #ddd; border-radius: 8px; padding: 10px; min-height: 44px; box-sizing: border-box; }
    .chk-group label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 13.5px; font-weight: normal; color: #333; background: #f3f4f6; padding: 7px 12px; border-radius: 20px; cursor: pointer; }
    .chk-group input { width: auto; min-height: 0; margin: 0; }
    .chk-group .none { font-size: 12.5px; color: #8a93a0; align-self: center; }
    .docs-add { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .docs-add select { flex: 1; }
    .doc-add-btn { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 10px 14px; border: 1.5px dashed var(--artal-blue); border-radius: 8px; background: #fff; color: var(--artal-blue); font-weight: bold; font-size: 13px; cursor: pointer; min-height: 44px; box-sizing: border-box; }
    .doc-add-btn:hover { background: var(--artal-light); }
    .doc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f7f9fb; border-radius: 8px; margin-bottom: 6px; }
    .doc-item a { flex: 1; color: var(--artal-blue); font-weight: bold; font-size: 13px; text-decoration: none; word-break: break-word; }
    .doc-del { background: transparent; border: none; color: #c9ced6; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .doc-del:hover { color: #e74c3c; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; }
    .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="rrhh.html" title="Volver a RRHH">← RRHH</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Empleados</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="nomina-total" class="nomina-total" style="display:none"></div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-activos" onclick="setTab('activo')">Activos</button>
        <button class="tab-btn" id="tab-inactivos" onclick="setTab('inactivo')">Inactivos</button>
    </div>
    <div class="toolbar">
        <input type="text" class="search" id="search" placeholder="Buscar por nombre, cédula, cargo…" oninput="render()">
        <button class="btn-nuevo" onclick="abrirNuevo()">+ Nuevo empleado</button>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Nuevo empleado</h2>
        <label>Nombre completo *</label>
        <input type="text" id="f-nombre" placeholder="Nombre y apellido">
        <div class="grid2">
            <div>
                <label>Cédula</label>
                <input type="text" id="f-cedula" placeholder="000-0000000-0">
            </div>
            <div>
                <label>Teléfono</label>
                <input type="tel" id="f-telefono" placeholder="809-000-0000">
            </div>
        </div>
        <label>Correo</label>
        <input type="email" id="f-correo" placeholder="correo@ejemplo.com">
        <label>Cargo(s) <span class="lbl-opt">— puedes marcar varios</span></label>
        <div class="chk-group" id="f-cargos"></div>
        <div class="grid2">
            <div>
                <label>Departamento</label>
                <select id="f-departamento"></select>
            </div>
            <div>
                <label>Sucursal</label>
                <select id="f-sucursal"></select>
            </div>
        </div>
        <div class="grid2">
            <div>
                <label>Fecha de ingreso</label>
                <input type="date" id="f-ingreso">
            </div>
            <div>
                <label>Sueldo base mensual (opcional)</label>
                <input type="number" id="f-sueldo" min="0" step="0.01" placeholder="RD$" oninput="actualizarCostoPreview()">
                <label style="display:flex;align-items:center;gap:6px;font-weight:normal;margin-top:6px;font-size:12.5px;cursor:pointer">
                    <input type="checkbox" id="f-entss" checked onchange="actualizarCostoPreview()" style="width:auto;margin:0"> En nómina / seguridad social (TSS)
                </label>
                <div id="f-costo-preview" class="hint" style="margin-top:4px"></div>
                <label style="margin-top:8px">% de descuentos AFP/SFS/ISR <span style="font-weight:normal;color:#999">(100 = normal; ej. 50 si tiene beneficio de media retención)</span></label>
                <input type="number" id="f-descpct" min="0" max="100" step="1" value="100" placeholder="100">
            </div>
        </div>
        <p class="hint" id="cat-hint" style="display:none;">¿Faltan cargos, departamentos o sucursales? Agrégalos en <a href="rrhh-catalogos.html" target="_blank" style="color:var(--artal-blue);font-weight:bold;">Catálogos</a> (se abre en otra pestaña) y vuelve aquí.</p>
        <label>Dirección</label>
        <input type="text" id="f-direccion" placeholder="Dirección">
        <label>Notas (opcional)</label>
        <textarea id="f-notas" placeholder="Información adicional…"></textarea>

        <div id="emp-docs-section" style="display:none;">
            <label>Documentos del empleado <span class="lbl-opt">— contrato, cédula, etc. (PDF, imagen o texto)</span></label>
            <div class="docs-add">
                <select id="doc-categoria">
                    <option>Contrato de trabajo</option>
                    <option>Documento de identidad</option>
                    <option>Seguro médico</option>
                    <option>Otro documento</option>
                </select>
                <label class="doc-add-btn">＋ Subir<input type="file" id="doc-file" accept="image/*,application/pdf,.doc,.docx,.txt,.odt" multiple style="display:none" onchange="subirDocEmpleado(this)"></label>
            </div>
            <div id="emp-docs-list"></div>

            <label style="margin-top:14px;display:flex;align-items:center;gap:8px;">Ciclo del empleado <span class="lbl-opt">— ingreso, promociones, vacaciones, amonestaciones…</span></label>
            <div id="emp-ciclo-list"></div>
            <a id="emp-ciclo-link" href="#" style="display:inline-block;margin-top:6px;font-size:12.5px;font-weight:bold;color:#1c4e7a;text-decoration:none;">＋ Registrar evento en el Ciclo del empleado ↗</a>
        </div>

        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal: editar un evento del ciclo desde la ficha del empleado -->
<div class="modal-overlay" id="modal-evento">
    <div class="modal-box">
        <h2>Editar evento del ciclo</h2>
        <div class="grid2">
            <div><label>Tipo</label><select id="ev-tipo"></select></div>
            <div><label>Fecha</label><input type="date" id="ev-fecha"></div>
        </div>
        <label>Título</label>
        <input type="text" id="ev-titulo" placeholder="Ej: Aumento de sueldo, llegada tarde…">
        <label>Detalle</label>
        <textarea id="ev-detalle" placeholder="Descripción del evento"></textarea>
        <label style="display:flex;align-items:center;gap:8px;">Adjuntos <span class="lbl-opt">— PDF, imagen o documento</span>
            <label class="doc-add-btn" style="margin-left:auto;">＋ Subir<input type="file" id="ev-adjunto-file" accept="image/*,application/pdf,.doc,.docx,.txt,.odt" multiple style="display:none" onchange="subirAdjuntoEvento(this)"></label>
        </label>
        <div id="ev-adjuntos-list"></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrarEventoEdit()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarEventoEdit()">Guardar cambios</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { requirePin } from './pin-gate.js';
    import { db, storage } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    const usuario = await requireAuth([]);
    await requirePin(usuario);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    const iniciales = (n) => (String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('') || '?').toUpperCase();
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); };
    // Un empleado puede tener varios cargos (cargoNombres); compat. con el campo viejo cargoNombre.
    const cargosTexto = (e) => Array.isArray(e.cargoNombres) ? e.cargoNombres.join(', ') : (e.cargoNombre || '');
    const cargosIdsDe = (e) => Array.isArray(e.cargoIds) ? e.cargoIds : (e.cargoId ? [e.cargoId] : []);

    // ---- Costo laboral real (para costear obras) ----------------------------------------------
    // Reusa las tasas de Nómina (rrhhConfig/nomina). Sobre el sueldo bruto la empresa paga ENCIMA:
    // aportes patronales (AFP+SFS+SRL) + INFOTEP + regalía (doble sueldo, 1/12) + provisión de cesantía.
    // El ISR y la TSS del empleado NO se suman: salen de adentro del sueldo, no son costo extra.
    // Divisor de días fijo (23.83, estándar de ley) → costo por día estable para cotizar.
    const COSTO_DEFAULTS = { afpPat: 7.10, sfsPat: 7.09, srlPat: 1.15, topeAfp: 0, topeSfs: 0, infotepPat: 1.00, regaliaOn: true, cesantiaDiasAnio: 21, vacacionesDiasAnio: 0, diaDivisor: 23.83 };
    let costoCfg = Object.assign({}, COSTO_DEFAULTS);
    let costoCfgLoaded = false;
    getDoc(doc(db, 'rrhhConfig', 'nomina')).then(s => { if (s.exists()) costoCfg = Object.assign({}, COSTO_DEFAULTS, s.data()); costoCfgLoaded = true; render(); backfillCostos(); }).catch(() => { costoCfgLoaded = true; backfillCostos(); });
    // enTSS = false → empleado sin nómina/seguridad social (ej. salario no declarado): el salario es el
    // costo TOTAL, sin cargas patronales ni provisiones. Solo se prorratea por día.
    function costoLaboral(sueldoMes, enTSS) {
        const s = Number(sueldoMes) || 0;
        const c = costoCfg, div = c.diaDivisor > 0 ? c.diaDivisor : 23.83;
        if (s <= 0) return { mes: 0, dia: 0, cargas: 0, afp: 0, sfs: 0, srl: 0, infotep: 0, regalia: 0, cesantia: 0, vac: 0 };
        if (enTSS === false) return { mes: s, dia: s / div, cargas: 0, afp: 0, sfs: 0, srl: 0, infotep: 0, regalia: 0, cesantia: 0, vac: 0 };
        const baseAfp = c.topeAfp > 0 ? Math.min(s, c.topeAfp) : s;
        const baseSfs = c.topeSfs > 0 ? Math.min(s, c.topeSfs) : s;
        const afp = baseAfp * c.afpPat / 100, sfs = baseSfs * c.sfsPat / 100, srl = baseSfs * c.srlPat / 100;
        const infotep = s * (c.infotepPat || 0) / 100;
        const regalia = c.regaliaOn ? s / 12 : 0;
        const cesantia = c.cesantiaDiasAnio > 0 ? (c.cesantiaDiasAnio * (s / div)) / 12 : 0;
        const vac = c.vacacionesDiasAnio > 0 ? (c.vacacionesDiasAnio * (s / div)) / 12 : 0;
        const cargas = afp + sfs + srl + infotep + regalia + cesantia + vac;
        const mes = s + cargas;
        return { mes, dia: mes / div, cargas, afp, sfs, srl, infotep, regalia, cesantia, vac };
    }
    const fmtRD = (n) => 'RD$' + (Number(n) || 0).toLocaleString('es-DO', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

    let empleados = [];
    let cargos = [], departamentos = [], sucursales = [];
    let currentTab = 'activo';
    let editingId = null;

    let eventosCiclo = [];

    onSnapshot(collection(db, 'rrhhEmpleados'), (snap) => {
        empleados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
        backfillCostos();
        if (editingId && document.getElementById('modal').classList.contains('show')) { renderDocsEmpleado(); renderCicloEmpleado(); }
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });

    // Eventos del ciclo del empleado (rrhh-ciclo.html los crea). Aquí se muestran de solo lectura
    // en la ficha, junto al ingreso derivado de la fecha de ingreso del empleado.
    onSnapshot(collection(db, 'rrhhEventos'), (snap) => {
        eventosCiclo = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (editingId && document.getElementById('modal').classList.contains('show')) renderCicloEmpleado();
        if (editandoEventoId && document.getElementById('modal-evento').classList.contains('show')) renderEvAdjuntos();
    }, () => {});

    // Graba costoDiaReal/costoMesReal en las fichas que aún no lo tienen (empleados de antes de esta
    // función) o cuyo valor quedó desfasado si cambió una tasa. Solo escribe cuando el número cambia
    // de verdad (comparación redondeada) para no entrar en bucle con el propio onSnapshot.
    let backfillEnCurso = false;
    async function backfillCostos() {
        if (!costoCfgLoaded || backfillEnCurso) return;
        backfillEnCurso = true;
        try {
            for (const e of empleados) {
                if (!e.sueldoBase) continue;
                const k = costoLaboral(e.sueldoBase, e.enTSS !== false);
                const dia = Math.round(k.dia * 100) / 100, mes = Math.round(k.mes * 100) / 100;
                if (e.costoDiaReal !== dia || e.costoMesReal !== mes) {
                    try { await updateDoc(doc(db, 'rrhhEmpleados', e.id), { costoDiaReal: dia, costoMesReal: mes }); } catch (_) { }
                }
            }
        } finally { backfillEnCurso = false; }
    }

    // ---------- Subida de archivos (imagen se comprime a JPEG; PDF y documentos se suben tal cual) ----------
    function comprimirImg(file) {
        return new Promise((resolve) => {
            if (!file || !/^image\//.test(file.type)) { resolve(file); return; }
            const url = URL.createObjectURL(file); const img = new Image();
            img.onload = () => {
                const max = 1600; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }
    async function subirArchivo(file, pathPrefix) {
        const esImg = /^image\//.test(file.type);
        const esPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
        let blob = file, contentType = file.type || 'application/octet-stream';
        let ext = ((file.name || '').split('.').pop() || 'bin').toLowerCase();
        if (esImg) { blob = await comprimirImg(file).catch(() => file); contentType = 'image/jpeg'; ext = 'jpg'; }
        const nombre = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
        const r = ref(storage, `${pathPrefix}/${nombre}`);
        await uploadBytes(r, blob, { contentType });
        return { url: await getDownloadURL(r), nombre: file.name || ('archivo.' + ext), tipo: esImg ? 'img' : (esPdf ? 'pdf' : 'doc') };
    }
    const docIcon = (t) => t === 'pdf' ? '📄' : (t === 'img' ? '🖼️' : '📃');

    window.subirDocEmpleado = async function (input) {
        const files = Array.from(input.files || []); if (!files.length || !editingId) return;
        const categoria = document.getElementById('doc-categoria').value;
        const label = input.parentElement; input.disabled = true; if (label) label.style.opacity = '.5';
        try {
            const nuevos = [];
            for (const file of files) {
                const arch = await subirArchivo(file, `rrhhEmpleados/${editingId}`);
                nuevos.push({ ...arch, categoria, subidoPor: usuario.nombre });
            }
            const e = empleados.find(x => x.id === editingId) || {};
            const prev = Array.isArray(e.documentos) ? e.documentos : [];
            await updateDoc(doc(db, 'rrhhEmpleados', editingId), { documentos: prev.concat(nuevos) });
        } catch (err) { alert('No se pudo subir: ' + (err && err.message ? err.message : err)); }
        finally { input.value = ''; input.disabled = false; if (label) label.style.opacity = '1'; }
    };
    window.borrarDocEmpleado = async function (url) {
        if (!editingId || !confirm('¿Quitar este documento?')) return;
        const e = empleados.find(x => x.id === editingId) || {};
        const prev = Array.isArray(e.documentos) ? e.documentos : [];
        try { await updateDoc(doc(db, 'rrhhEmpleados', editingId), { documentos: prev.filter(d => d && d.url !== url) }); }
        catch (err) { alert('No se pudo: ' + err.message); }
    };
    function renderDocsEmpleado() {
        const cont = document.getElementById('emp-docs-list'); if (!cont || !editingId) return;
        const e = empleados.find(x => x.id === editingId) || {};
        const docs = Array.isArray(e.documentos) ? e.documentos : [];
        if (!docs.length) { cont.innerHTML = '<p class="hint">Aún no hay documentos cargados.</p>'; return; }
        cont.innerHTML = docs.map(d => `<div class="doc-item">
            <a href="${esc(d.url)}" target="_blank" rel="noopener">${docIcon(d.tipo)} ${d.categoria ? esc(d.categoria) + ' — ' : ''}${esc(d.nombre)}</a>
            <button class="doc-del" title="Quitar" onclick="borrarDocEmpleado('${esc(d.url)}')">×</button>
        </div>`).join('');
    }
    // Línea de tiempo del ciclo del empleado (solo lectura) dentro de su ficha.
    const CICLO_TIPOS = {
        ingreso: { label: 'Ingreso', icon: '🎯' },
        promocion: { label: 'Promoción / Cambio', icon: '⬆️' },
        vacaciones: { label: 'Vacaciones', icon: '🏖️' },
        amonestacion: { label: 'Amonestación', icon: '⚠️' },
        reconocimiento: { label: 'Reconocimiento', icon: '🏆' },
        capacitacion: { label: 'Capacitación', icon: '🎓' },
        nota: { label: 'Nota', icon: '📝' },
        salida: { label: 'Salida / Desvinculación', icon: '🚪' }
    };
    function renderCicloEmpleado() {
        const cont = document.getElementById('emp-ciclo-list'); if (!cont || !editingId) return;
        const e = empleados.find(x => x.id === editingId) || {};
        const link = document.getElementById('emp-ciclo-link'); if (link) link.href = 'rrhh-ciclo.html?emp=' + encodeURIComponent(editingId);
        const evs = eventosCiclo.filter(ev => ev.empleadoId === editingId).slice();
        // Ingreso derivado de la fecha de ingreso del empleado (no es un evento guardado).
        if (e.fechaIngreso) evs.push({ tipo: 'ingreso', fecha: e.fechaIngreso, titulo: 'Ingreso a la empresa', sintetico: true });
        if (!evs.length) { cont.innerHTML = '<p class="hint">Sin eventos en el ciclo todavía.</p>'; return; }
        evs.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
        cont.innerHTML = evs.map(ev => {
            const t = CICLO_TIPOS[ev.tipo] || { label: ev.tipo || 'Evento', icon: '•' };
            const adj = (Array.isArray(ev.adjuntos) ? ev.adjuntos : []).concat((ev.adjunto && ev.adjunto.url) ? [ev.adjunto] : []);
            const adjHTML = adj.map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener" style="margin-left:8px;font-size:12px;font-weight:bold;color:#1c4e7a;">${a.tipo === 'pdf' ? '📄' : (a.tipo === 'img' ? '🖼️' : '📎')} ver</a>`).join('');
            const detalle = [ev.titulo, ev.detalle].filter(Boolean).join(' — ');
            // El ingreso es derivado de la fecha de ingreso (no es un evento guardado): no se edita aquí,
            // se cambia en el campo "Fecha de ingreso" de la ficha.
            const acciones = ev.sintetico ? '<span style="font-size:11px;color:#8a93a0;">(desde Fecha de ingreso)</span>'
                : `<button type="button" onclick="abrirEventoEdit('${ev.id}')" style="border:none;background:transparent;cursor:pointer;color:#1c4e7a;font-weight:bold;font-size:12px;">✏</button>
                   <button type="button" onclick="borrarEventoFicha('${ev.id}')" style="border:none;background:transparent;cursor:pointer;color:#c0392b;font-weight:bold;font-size:13px;">🗑</button>`;
            return `<div style="padding:7px 0;border-bottom:1px solid #eef1f4;font-size:13px;line-height:1.4;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
                <span>${t.icon} <b>${esc(t.label)}</b>${detalle ? ' · ' + esc(detalle) : ''} <span style="color:#8a93a0;">${ev.fecha ? esc(fmtFecha(ev.fecha)) : ''}</span>${adjHTML}</span>
                <span style="white-space:nowrap;">${acciones}</span>
            </div>`;
        }).join('');
    }
    // ---- Editar / borrar un evento del ciclo desde la ficha ----
    let editandoEventoId = null;
    window.abrirEventoEdit = function (id) {
        const ev = eventosCiclo.find(x => x.id === id); if (!ev) return;
        editandoEventoId = id;
        const sel = document.getElementById('ev-tipo');
        sel.innerHTML = Object.entries(CICLO_TIPOS).filter(([v]) => v !== 'ingreso').map(([v, t]) => `<option value="${v}">${t.icon} ${t.label}</option>`).join('');
        sel.value = ev.tipo || 'nota';
        document.getElementById('ev-fecha').value = ev.fecha || '';
        document.getElementById('ev-titulo').value = ev.titulo || '';
        document.getElementById('ev-detalle').value = ev.detalle || '';
        renderEvAdjuntos();
        document.getElementById('modal-evento').classList.add('show');
    };
    window.cerrarEventoEdit = function () { document.getElementById('modal-evento').classList.remove('show'); editandoEventoId = null; };
    // Adjuntos del evento en edición (compat con el campo viejo `adjunto` singular).
    const evAdjuntosDe = (ev) => (Array.isArray(ev && ev.adjuntos) ? ev.adjuntos.slice() : []).concat((ev && ev.adjunto && ev.adjunto.url) ? [ev.adjunto] : []);
    function renderEvAdjuntos() {
        const cont = document.getElementById('ev-adjuntos-list'); if (!cont || !editandoEventoId) return;
        const ev = eventosCiclo.find(x => x.id === editandoEventoId) || {};
        const adj = evAdjuntosDe(ev);
        cont.innerHTML = adj.length ? adj.map(a => `<div class="doc-item">
            <a href="${esc(a.url)}" target="_blank" rel="noopener">${docIcon(a.tipo)} ${esc(a.nombre || 'ver')}</a>
            <button class="doc-del" title="Quitar" onclick="borrarAdjuntoEvento('${esc(a.url)}')">×</button>
        </div>`).join('') : '<p class="hint">Sin adjuntos.</p>';
    }
    // Sube adjuntos al evento Y los copia al expediente (mismo criterio que al crear el evento en Ciclo).
    window.subirAdjuntoEvento = async function (input) {
        const files = Array.from(input.files || []); if (!files.length || !editandoEventoId) return;
        const ev = eventosCiclo.find(x => x.id === editandoEventoId); if (!ev) return;
        const label = input.parentElement; input.disabled = true; if (label) label.style.opacity = '.5';
        try {
            const nuevos = [];
            for (const file of files) nuevos.push(await subirArchivo(file, `rrhhEventos/${editandoEventoId}`));
            await updateDoc(doc(db, 'rrhhEventos', editandoEventoId), { adjuntos: evAdjuntosDe(ev).concat(nuevos) });
            // También al expediente del empleado (documentos), etiquetados con el tipo de evento.
            if (ev.empleadoId) {
                const emp = empleados.find(e => e.id === ev.empleadoId) || {};
                const cat = (CICLO_TIPOS[ev.tipo] && CICLO_TIPOS[ev.tipo].label) || 'Ciclo del empleado';
                const prev = Array.isArray(emp.documentos) ? emp.documentos : [];
                const docsNuevos = nuevos.map(a => ({ ...a, categoria: cat, origen: 'ciclo', eventoId: editandoEventoId, subidoPor: usuario.nombre }));
                await updateDoc(doc(db, 'rrhhEmpleados', ev.empleadoId), { documentos: prev.concat(docsNuevos) });
            }
        } catch (e) { alert('No se pudo subir: ' + (e && e.message ? e.message : e)); }
        finally { input.value = ''; input.disabled = false; if (label) label.style.opacity = '1'; renderEvAdjuntos(); }
    };
    // Quita un adjunto del evento Y del expediente (por url + eventoId).
    window.borrarAdjuntoEvento = async function (url) {
        if (!editandoEventoId || !confirm('¿Quitar este adjunto?')) return;
        const ev = eventosCiclo.find(x => x.id === editandoEventoId); if (!ev) return;
        try {
            await updateDoc(doc(db, 'rrhhEventos', editandoEventoId), { adjuntos: evAdjuntosDe(ev).filter(a => a && a.url !== url), adjunto: null });
            if (ev.empleadoId) {
                const emp = empleados.find(e => e.id === ev.empleadoId) || {};
                const prev = Array.isArray(emp.documentos) ? emp.documentos : [];
                if (prev.some(d => d && d.url === url)) {
                    await updateDoc(doc(db, 'rrhhEmpleados', ev.empleadoId), { documentos: prev.filter(d => !(d && d.url === url)) });
                }
            }
        } catch (e) { alert('No se pudo quitar: ' + (e && e.message ? e.message : e)); }
        finally { renderEvAdjuntos(); }
    };
    window.guardarEventoEdit = async function () {
        if (!editandoEventoId) return;
        const fecha = document.getElementById('ev-fecha').value;
        const titulo = document.getElementById('ev-titulo').value.trim();
        const detalle = document.getElementById('ev-detalle').value.trim();
        if (!fecha) { alert('Indica la fecha.'); return; }
        if (!titulo && !detalle) { alert('Escribe al menos un título o un detalle.'); return; }
        const btn = document.querySelector('#modal-evento .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            await updateDoc(doc(db, 'rrhhEventos', editandoEventoId), { tipo: document.getElementById('ev-tipo').value, fecha, titulo, detalle });
            cerrarEventoEdit();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar cambios'; }
    };
    window.borrarEventoFicha = async function (id) {
        if (!confirm('¿Eliminar este evento del ciclo? También se quitarán del expediente los documentos que este evento haya adjuntado.')) return;
        try {
            const ev = eventosCiclo.find(x => x.id === id);
            await deleteDoc(doc(db, 'rrhhEventos', id));
            // Quita del expediente los documentos que este evento había copiado (por eventoId).
            if (ev && ev.empleadoId) {
                const emp = empleados.find(e => e.id === ev.empleadoId);
                if (emp && Array.isArray(emp.documentos) && emp.documentos.some(d => d && d.eventoId === id)) {
                    await updateDoc(doc(db, 'rrhhEmpleados', ev.empleadoId), { documentos: emp.documentos.filter(d => !(d && d.eventoId === id)) });
                }
            }
        } catch (e) { alert('No se pudo eliminar: ' + (e && e.message ? e.message : e)); }
    };

    // Catálogos para los selects.
    function opts(arr, sel) {
        return '<option value="">—</option>' + arr.map(c =>
            `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
    }
    onSnapshot(collection(db, 'rrhhCargos'), (s) => { cargos = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre); refreshSelects(); });
    onSnapshot(collection(db, 'rrhhDepartamentos'), (s) => { departamentos = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre); refreshSelects(); });
    onSnapshot(collection(db, 'rrhhSucursales'), (s) => { sucursales = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre); refreshSelects(); });
    const byNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es');

    // Cargos = varias casillas (un empleado puede tener más de un cargo).
    function cargosMarcados() {
        return Array.from(document.querySelectorAll('#f-cargos input:checked')).map(c => c.value);
    }
    function renderCargos(sel) {
        const box = document.getElementById('f-cargos');
        const marcados = sel || cargosMarcados();
        if (!cargos.length) { box.innerHTML = '<span class="none">Aún no hay cargos. Agrégalos en Catálogos.</span>'; return; }
        box.innerHTML = cargos.map(c =>
            `<label><input type="checkbox" value="${esc(c.id)}" ${marcados.includes(c.id) ? 'checked' : ''}>${esc(c.nombre)}</label>`).join('');
    }
    function refreshSelects() {
        const d = document.getElementById('f-departamento'), s = document.getElementById('f-sucursal');
        renderCargos();
        d.innerHTML = opts(departamentos, d.value); s.innerHTML = opts(sucursales, s.value);
        document.getElementById('cat-hint').style.display = (cargos.length && departamentos.length && sucursales.length) ? 'none' : 'block';
    }

    window.setTab = function (t) {
        currentTab = t;
        document.getElementById('tab-activos').classList.toggle('active', t === 'activo');
        document.getElementById('tab-inactivos').classList.toggle('active', t === 'inactivo');
        render();
    };

    window.render = function () {
        renderNominaTotal();
        const term = document.getElementById('search').value.trim().toLowerCase();
        const lista = empleados
            .filter(e => (e.estado || 'activo') === currentTab)
            .filter(e => !term || [e.nombre, e.cedula, cargosTexto(e), e.departamentoNombre, e.sucursalNombre].some(v => String(v || '').toLowerCase().includes(term)))
            .sort(byNombre);
        const cont = document.getElementById('lista');
        if (!lista.length) { cont.innerHTML = `<p class="empty">${currentTab === 'activo' ? 'No hay empleados activos.' : 'No hay empleados inactivos.'}</p>`; return; }
        cont.innerHTML = lista.map(cardHTML).join('');
    };

    // Total mensual de la nómina de ARTAL (empleados activos con sueldo): sueldos brutos y costo real
    // con cargas. Los que están fuera de nómina (enTSS=false) suman su salario tal cual al costo real.
    function renderNominaTotal() {
        const box = document.getElementById('nomina-total'); if (!box) return;
        const activos = empleados.filter(e => (e.estado || 'activo') === 'activo' && Number(e.sueldoBase) > 0);
        if (!activos.length) { box.style.display = 'none'; return; }
        let bruto = 0, real = 0;
        activos.forEach(e => { bruto += Number(e.sueldoBase) || 0; real += costoLaboral(e.sueldoBase, e.enTSS !== false).mes; });
        box.style.display = 'block';
        box.innerHTML =
            `<div class="nt-lbl">Nómina mensual de ARTAL · ${activos.length} empleado${activos.length === 1 ? '' : 's'}</div>` +
            `<div class="nt-big">${fmtRD(real)}/mes <span style="font-size:13px;font-weight:normal;opacity:.85">costo real con cargas</span></div>` +
            `<div class="nt-sub">Sueldos brutos: ${fmtRD(bruto)}/mes · Cargas y provisiones: ${fmtRD(real - bruto)}/mes</div>`;
    }

    function cardHTML(e) {
        const estado = e.estado || 'activo';
        const meta = [cargosTexto(e), e.departamentoNombre, e.sucursalNombre].filter(Boolean).join(' · ');
        const nDocs = Array.isArray(e.documentos) ? e.documentos.length : 0;
        const extra = [e.cedula ? '🪪 ' + esc(e.cedula) : '', e.telefono ? '📞 ' + esc(e.telefono) : '', e.fechaIngreso ? 'Ingreso: ' + esc(fmtFecha(e.fechaIngreso)) : '', nDocs ? '📎 ' + nDocs + ' doc' + (nDocs === 1 ? '' : 's') : ''].filter(Boolean).join('  ·  ');
        const costo = e.sueldoBase ? costoLaboral(e.sueldoBase, e.enTSS !== false) : null;
        return `
        <div class="order-card emp-card">
            <span class="avatar">${esc(iniciales(e.nombre))}</span>
            <div class="emp-info">
                <b>${esc(e.nombre) || 'Sin nombre'}</b> <span class="estado ${estado}">${estado}</span>
                ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
                ${extra ? `<div class="meta">${extra}</div>` : ''}
                ${costo ? `<div class="meta">💵 Sueldo <b>${fmtRD(e.sueldoBase)}/mes</b> · Costo real <b>${fmtRD(costo.dia)}/día</b> ${e.enTSS !== false ? '(' + fmtRD(costo.mes) + '/mes con cargas)' : '(salario total, fuera de nómina)'}</div>` : ''}
            </div>
            <div class="row-actions">
                <button class="b-editar" onclick="editar('${e.id}')">✏ Editar</button>
                <a class="b-exped" href="rrhh-ciclo.html?emp=${e.id}">📋 Expediente</a>
                <button class="b-toggle" onclick="toggle('${e.id}')">${estado === 'activo' ? 'Desactivar' : 'Reactivar'}</button>
                <button class="b-borrar" onclick="borrar('${e.id}')">🗑</button>
            </div>
        </div>`;
    }

    window.actualizarCostoPreview = function () {
        const box = document.getElementById('f-costo-preview');
        const s = Number(document.getElementById('f-sueldo').value) || 0;
        if (s <= 0) { box.textContent = ''; return; }
        const enTSS = document.getElementById('f-entss').checked;
        const k = costoLaboral(s, enTSS);
        box.innerHTML = enTSS
            ? `Costo real ≈ <b>${fmtRD(k.mes)}/mes</b> · <b>${fmtRD(k.dia)}/día</b> <span style="color:#8a93a0">(sueldo + ${((k.cargas / s) * 100).toFixed(0)}% cargas)</span>`
            : `Costo ≈ <b>${fmtRD(k.mes)}/mes</b> · <b>${fmtRD(k.dia)}/día</b> <span style="color:#8a93a0">(salario total, sin cargas — fuera de nómina)</span>`;
    };

    function limpiar() {
        editingId = null;
        ['f-nombre', 'f-cedula', 'f-telefono', 'f-correo', 'f-ingreso', 'f-sueldo', 'f-direccion', 'f-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('f-departamento').value = ''; document.getElementById('f-sucursal').value = '';
        document.getElementById('f-entss').checked = true;
        document.getElementById('f-descpct').value = 100;
        actualizarCostoPreview();
        refreshSelects();
        renderCargos([]);
    }
    window.abrirNuevo = function () { limpiar(); document.getElementById('modal-title').textContent = 'Nuevo empleado'; document.getElementById('emp-docs-section').style.display = 'none'; document.getElementById('modal').classList.add('show'); };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.editar = function (id) {
        const e = empleados.find(x => x.id === id); if (!e) return;
        limpiar(); editingId = id;
        document.getElementById('modal-title').textContent = 'Editar empleado';
        document.getElementById('f-nombre').value = e.nombre || '';
        document.getElementById('f-cedula').value = e.cedula || '';
        document.getElementById('f-telefono').value = e.telefono || '';
        document.getElementById('f-correo').value = e.correo || '';
        document.getElementById('f-ingreso').value = e.fechaIngreso || '';
        document.getElementById('f-sueldo').value = e.sueldoBase != null ? e.sueldoBase : '';
        document.getElementById('f-entss').checked = e.enTSS !== false;
        document.getElementById('f-descpct').value = e.descuentoPct != null ? e.descuentoPct : 100;
        actualizarCostoPreview();
        document.getElementById('f-direccion').value = e.direccion || '';
        document.getElementById('f-notas').value = e.notas || '';
        document.getElementById('f-departamento').value = e.departamentoId || '';
        document.getElementById('f-sucursal').value = e.sucursalId || '';
        renderCargos(cargosIdsDe(e));
        document.getElementById('emp-docs-section').style.display = 'block';
        renderDocsEmpleado();
        renderCicloEmpleado();
        document.getElementById('modal').classList.add('show');
    };

    window.guardar = async function () {
        const nombre = document.getElementById('f-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre del empleado.'); return; }
        const cargoIds = cargosMarcados();
        const cargoNombres = cargoIds.map(id => (cargos.find(x => x.id === id) || {}).nombre).filter(Boolean);
        const departamentoId = document.getElementById('f-departamento').value;
        const sucursalId = document.getElementById('f-sucursal').value;
        const nombreDe = (arr, id) => (arr.find(x => x.id === id) || {}).nombre || '';
        const sueldoRaw = document.getElementById('f-sueldo').value;
        const sueldoNum = sueldoRaw ? Number(sueldoRaw) : null;
        const enTSS = document.getElementById('f-entss').checked;
        const descuentoPct = Math.max(0, Math.min(100, Number(document.getElementById('f-descpct').value) || 100));
        const kCosto = costoLaboral(sueldoNum || 0, enTSS);
        const datos = {
            nombre,
            cedula: document.getElementById('f-cedula').value.trim(),
            telefono: document.getElementById('f-telefono').value.trim(),
            correo: document.getElementById('f-correo').value.trim(),
            direccion: document.getElementById('f-direccion').value.trim(),
            fechaIngreso: document.getElementById('f-ingreso').value || '',
            sueldoBase: sueldoNum,
            enTSS,
            descuentoPct,
            costoMesReal: sueldoNum ? Math.round(kCosto.mes * 100) / 100 : null,
            costoDiaReal: sueldoNum ? Math.round(kCosto.dia * 100) / 100 : null,
            notas: document.getElementById('f-notas').value.trim(),
            cargoIds, cargoNombres,
            departamentoId, departamentoNombre: nombreDe(departamentos, departamentoId),
            sucursalId, sucursalNombre: nombreDe(sucursales, sucursalId)
        };
        try {
            if (editingId) {
                await updateDoc(doc(db, 'rrhhEmpleados', editingId), datos);
                cerrar();
            } else {
                const ref = await addDoc(collection(db, 'rrhhEmpleados'), { ...datos, estado: 'activo', creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
                cerrar();
                // Integrante nuevo → ofrecer crear su reunión de integración (guion del día de entrada).
                if (confirm('✓ Empleado creado.\n\n¿Crear ahora su reunión de integración (guion del día de entrada / período de prueba)?')) {
                    window.open('rrhh-reuniones.html?nuevo=' + ref.id + '&plantilla=integracion', '_blank');
                }
            }
        } catch (e) { alert('No se pudo guardar: ' + e.message); }
    };

    window.toggle = async function (id) {
        const e = empleados.find(x => x.id === id); if (!e) return;
        const nuevo = (e.estado || 'activo') === 'activo' ? 'inactivo' : 'activo';
        try { await updateDoc(doc(db, 'rrhhEmpleados', id), { estado: nuevo }); } catch (err) { alert('No se pudo: ' + err.message); }
    };
    window.borrar = async function (id) {
        const e = empleados.find(x => x.id === id) || {};
        if (!confirm(`¿Eliminar a "${e.nombre || ''}" del sistema? Esta acción no se puede deshacer.\n\n(Si solo dejó de trabajar, mejor usa "Desactivar" para conservar su expediente.)`)) return;
        try { await deleteDoc(doc(db, 'rrhhEmpleados', id)); } catch (err) { alert('No se pudo eliminar: ' + err.message); }
    };
</script>

</body>
</html>
