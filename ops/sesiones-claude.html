<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Trabajos con Claude a medias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 860px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .kpi { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .kpi .n { font-size: 22px; font-weight: bold; color: var(--artal-blue, #0A3D62); }
    .kpi .l { font-size: 11.5px; color: #778; text-transform: uppercase; letter-spacing: .4px; }
    .kpi.mal .n { color: #c0392b; }
    .tabs { margin-bottom: 12px; }
    .ses { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 12px 14px; margin-bottom: 10px; border-left: 6px solid #cfd8e3; }
    .ses.hoy { border-left-color: #27ae60; } .ses.ayer { border-left-color: #f39c12; } .ses.vieja { border-left-color: #c0392b; }
    .ses.terminada, .ses.archivada { opacity: .75; border-left-color: #b8c2cc; }
    .ses-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
    .ses-head b { color: var(--artal-blue, #0A3D62); font-size: 15px; }
    .hace { font-size: 13px; font-weight: bold; white-space: nowrap; }
    .hace.hoy { color: #27ae60; } .hace.ayer { color: #b9770e; } .hace.vieja { color: #c0392b; }
    .chip { display: inline-block; font-size: 11px; border-radius: 100px; padding: 2px 8px; background: #eef4fb; color: var(--artal-blue, #0A3D62); margin-right: 4px; }
    .chip.viva { background: #e8f8ee; color: #1e8449; }
    .chip.espera { background: #fff3e0; color: #b9770e; }
    .meta { font-size: 12.5px; color: #667; margin-top: 4px; }
    .bloque { margin-top: 8px; font-size: 13px; color: #334; }
    .bloque .et { font-size: 11px; font-weight: bold; color: #889; text-transform: uppercase; letter-spacing: .4px; }
    .bloque .tx { white-space: pre-wrap; line-height: 1.35; background: #f7f9fb; border-radius: 8px; padding: 8px 10px; margin-top: 3px; max-height: 110px; overflow: hidden; position: relative; cursor: pointer; }
    .bloque .tx.abierto { max-height: none; }
    .bloque .tx:not(.abierto)::after { content: 'ver todo ▾'; position: absolute; right: 8px; bottom: 4px; font-size: 11px; color: var(--artal-blue, #0A3D62); background: #f7f9fb; padding-left: 8px; }
    .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .acciones button { border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 12.5px; font-family: 'Arimo'; cursor: pointer; }
    .b-term { background: #27ae60; color: #fff; } .b-arch { background: #95a5a6; color: #fff; } .b-reab { background: var(--artal-blue, #0A3D62); color: #fff; }
    .nota { flex: 1; min-width: 180px; padding: 8px; border: 1.5px solid #e3e8ee; border-radius: 8px; font-family: 'Arimo'; font-size: 13px; }
    .filtro { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .filtro button { background: #fff; border: 1.5px solid #dde3ea; border-radius: 100px; padding: 6px 12px; font-size: 12.5px; font-family: 'Arimo'; cursor: pointer; color: #334; }
    .filtro button.on { background: var(--artal-blue, #0A3D62); color: #fff; border-color: var(--artal-blue, #0A3D62); }
    .empty { color: #889; text-align: center; padding: 30px 10px; }
    .ayuda { font-size: 12px; color: #889; margin-top: 16px; line-height: 1.4; }
</style>
</head>
<body>
<header>
    <div class="header-title">
        <a class="btn-back" id="btn-back" href="index.html" title="Volver">← Volver</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Trabajos con Claude a medias</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>
<main>
    <div class="kpis" id="kpis"></div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-abiertas" onclick="setTab('abiertas')">A medias</button>
        <button class="tab-btn" id="tab-terminadas" onclick="setTab('terminadas')">Terminadas</button>
        <button class="tab-btn" id="tab-archivadas" onclick="setTab('archivadas')">Archivadas / rutinas</button>
    </div>
    <div class="filtro" id="filtro"></div>
    <div id="lista"><p class="empty">Cargando…</p></div>
    <p class="ayuda" id="ayuda"></p>
</main>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, doc, onSnapshot, updateDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    // Solo gerencia: son las sesiones de trabajo de Dylan con Claude (títulos, último pedido y última respuesta).
    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    wireBackButton(usuario.roles);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const AREA_TXT = { cuaderno: '📐 Cuaderno', sistema: '🖥️ Sistema', sitio: '🌐 Sitio web', b2b: '🛒 B2B', importaciones: '🚢 Importaciones', fabrica: '🏭 Fábrica', reuniones: '🤝 Reuniones' };
    let sesiones = [], tab = 'abiertas', filtro = 'todas', ultimoSync = '';
    const diasDesde = (iso) => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : 999;
    const haceTxt = (iso) => { const d = diasDesde(iso); if (d <= 0) { const h = Math.floor((Date.now() - new Date(iso).getTime()) / 3600000); return h <= 0 ? 'hace minutos' : `hace ${h} h`; } return d === 1 ? 'ayer' : `hace ${d} días`; };
    const clase = (iso) => { const d = diasDesde(iso); return d <= 0 ? 'hoy' : d <= 2 ? 'ayer' : 'vieja'; };
    const fechaTxt = (iso) => iso ? new Date(iso).toLocaleString('es-DO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const estadoDe = (s) => s.estado || 'abierta';

    onSnapshot(collection(db, 'sesionesClaude'), (snap) => {
        sesiones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        ultimoSync = sesiones.reduce((m, s) => (s.sincronizado || '') > m ? s.sincronizado : m, '');
        render();
    }, (e) => { document.getElementById('lista').innerHTML = `<p class="empty">No se pudo leer: ${esc(e.code || e.message)}</p>`; });

    window.setTab = (t) => { tab = t; ['abiertas', 'terminadas', 'archivadas'].forEach(k => document.getElementById('tab-' + k).classList.toggle('active', k === t)); render(); };
    window.setFiltro = (f) => { filtro = f; render(); };
    window.toggleTx = (el) => el.classList.toggle('abierto');

    function render() {
        const abiertas = sesiones.filter(s => estadoDe(s) === 'abierta');
        const aMedias = abiertas.filter(s => diasDesde(s.ultimaActividad) >= 3);
        const vivas = abiertas.filter(s => s.viva);
        document.getElementById('kpis').innerHTML =
            `<div class="kpi"><div class="n">${abiertas.length}</div><div class="l">Abiertas</div></div>` +
            `<div class="kpi ${aMedias.length ? 'mal' : ''}"><div class="n">${aMedias.length}</div><div class="l">≥ 3 días sin tocar</div></div>` +
            `<div class="kpi"><div class="n">${abiertas.filter(s => s.esperandoRespuesta).length}</div><div class="l">Esperan a Claude</div></div>` +
            `<div class="kpi"><div class="n">${vivas.length}</div><div class="l">Abiertas en la app ahora</div></div>`;
        document.getElementById('tab-abiertas').textContent = `A medias (${abiertas.length})`;
        let lista = tab === 'abiertas' ? abiertas : sesiones.filter(s => estadoDe(s) === (tab === 'terminadas' ? 'terminada' : 'archivada'));
        const areas = [...new Set(lista.map(s => s.area).filter(Boolean))];
        document.getElementById('filtro').innerHTML = [['todas', 'Todas'], ...areas.map(a => [a, AREA_TXT[a] || a])].map(([k, t]) => `<button class="${filtro === k ? 'on' : ''}" onclick="setFiltro('${esc(k)}')">${esc(t)}</button>`).join('');
        if (filtro !== 'todas') lista = lista.filter(s => s.area === filtro);
        lista = lista.slice().sort((a, b) => tab === 'abiertas' ? (a.ultimaActividad || '').localeCompare(b.ultimaActividad || '') : (b.estadoFecha || b.ultimaActividad || '').localeCompare(a.estadoFecha || a.ultimaActividad || ''));
        document.getElementById('lista').innerHTML = lista.length ? lista.map(card).join('') : `<p class="empty">${tab === 'abiertas' ? 'Nada a medias. 🎉' : 'Nada aquí.'}</p>`;
        document.getElementById('ayuda').innerHTML = `Se actualiza solo cada vez que escribes en una sesión de la app de Claude y al cerrar cada turno (última sincronización: ${esc(fechaTxt(ultimoSync)) || '—'}). «Terminada» = el trabajo se cerró; «Archivada» = no es un trabajo (rutinas, pruebas). Si una sesión terminada vuelve a moverse, regresa sola a «A medias». La nota es solo tuya.`;
    }
    function card(s) {
        const est = estadoDe(s), cl = est === 'abierta' ? clase(s.ultimaActividad) : est;
        const area = s.area ? `<span class="chip">${esc(AREA_TXT[s.area] || s.area)}</span>` : '';
        const viva = s.viva ? `<span class="chip viva">${s.vivaEstado === 'busy' ? '● trabajando ahora' : '● abierta en la app'}</span>` : '';
        const espera = s.esperandoRespuesta && est === 'abierta' ? `<span class="chip espera">tu último mensaje quedó sin respuesta</span>` : '';
        const rutina = s.rutina ? `<span class="chip">rutina</span>` : '';
        return `<div class="ses ${cl}" id="ses-${s.id}">
            <div class="ses-head"><div><b>${esc(s.titulo || s.id)}</b><div style="margin-top:4px">${area}${viva}${espera}${rutina}</div></div>
                <span class="hace ${clase(s.ultimaActividad)}">${esc(haceTxt(s.ultimaActividad))}</span></div>
            <div class="meta">Empezó ${esc(fechaTxt(s.inicio))} · última actividad ${esc(fechaTxt(s.ultimaActividad))}${s.tamanoMB ? ' · ' + s.tamanoMB + ' MB' : ''}${s.estadoFecha ? ' · ' + esc(est) + ' el ' + esc(fechaTxt(s.estadoFecha)) : ''}</div>
            ${s.ultimoPedido ? `<div class="bloque"><div class="et">Lo último que pediste${s.ultimoPedidoFecha ? ' · ' + esc(fechaTxt(s.ultimoPedidoFecha)) : ''}</div><div class="tx" onclick="toggleTx(this)">${esc(s.ultimoPedido)}</div></div>` : ''}
            ${s.ultimaRespuesta ? `<div class="bloque"><div class="et">Dónde quedó Claude${s.ultimaRespuestaFecha ? ' · ' + esc(fechaTxt(s.ultimaRespuestaFecha)) : ''}</div><div class="tx" onclick="toggleTx(this)">${esc(s.ultimaRespuesta)}</div></div>` : ''}
            <div class="acciones">
                ${est === 'abierta' ? `<button class="b-term" onclick="setEstado('${s.id}','terminada')">✓ Terminada</button><button class="b-arch" onclick="setEstado('${s.id}','archivada')">📦 Archivar</button>` : `<button class="b-reab" onclick="setEstado('${s.id}','abierta')">↩ Volver a «A medias»</button>`}
                <input class="nota" value="${esc(s.nota || '')}" placeholder="Nota para ti (qué falta, por qué paró)…" onchange="setNota('${s.id}', this.value)">
            </div>
        </div>`;
    }
    window.setEstado = async (id, estado) => {
        try { await updateDoc(doc(db, 'sesionesClaude', id), { estado, estadoFecha: new Date().toISOString(), estadoPor: usuario.nombre }); }
        catch (e) { alert('No se pudo: ' + (e.message || e)); }
    };
    window.setNota = async (id, nota) => {
        try { await updateDoc(doc(db, 'sesionesClaude', id), { nota: (nota || '').trim(), notaFecha: new Date().toISOString() }); }
        catch (e) { alert('No se pudo guardar la nota: ' + (e.message || e)); }
    };
</script>
</body>
</html>
