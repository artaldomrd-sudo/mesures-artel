<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Pendientes con Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 760px; }
    .intro { font-size: 13px; color: #667; margin: 0 0 12px; }
    .fila { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 12px 14px; margin-bottom: 8px; border-left: 5px solid #cfd8e3; }
    .fila.hoy { border-left-color: #27ae60; } .fila.ayer { border-left-color: #f39c12; } .fila.vieja { border-left-color: #c0392b; }
    .fila.cerrada { opacity: .7; }
    .cab { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .cab b { color: var(--artal-blue, #0A3D62); font-size: 15px; }
    .hace { font-size: 12.5px; font-weight: bold; white-space: nowrap; color: #889; }
    .hace.ayer { color: #b9770e; } .hace.vieja { color: #c0392b; }
    .pend { font-size: 13.5px; color: #334; white-space: pre-wrap; line-height: 1.35; margin-top: 6px; max-height: 60px; overflow: hidden; cursor: pointer; position: relative; }
    .pend.abierto { max-height: none; }
    .pend:not(.abierto)::after { content: '…más'; position: absolute; right: 0; bottom: 0; font-size: 11.5px; color: var(--artal-blue, #0A3D62); background: #fff; padding-left: 10px; }
    .detalle { display: none; margin-top: 8px; font-size: 12.5px; color: #556; background: #f7f9fb; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; line-height: 1.35; }
    .detalle.abierto { display: block; }
    .pie { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 12px; color: #889; flex-wrap: wrap; }
    .pie a { color: var(--artal-blue, #0A3D62); cursor: pointer; text-decoration: none; font-weight: bold; }
    .pie .listo { background: #27ae60; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 12.5px; font-family: 'Arimo'; cursor: pointer; }
    .otros { margin-top: 18px; font-size: 13px; color: #667; }
    .otros a { color: var(--artal-blue, #0A3D62); cursor: pointer; font-weight: bold; margin-right: 14px; }
    .empty { color: #889; text-align: center; padding: 30px 10px; }
    .agendado { font-size: 12px; color: #1e5aa8; background: #e7f1fb; border-radius: 100px; padding: 2px 9px; }
    .ag-form { display: none; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; background: #f7f9fb; border-radius: 8px; padding: 8px 10px; }
    .ag-form.abierto { display: flex; }
    .ag-form input { padding: 7px 9px; border: 1.5px solid #dde3ea; border-radius: 8px; font-family: 'Arimo'; font-size: 13px; }
    .ag-form button { border: none; border-radius: 8px; padding: 7px 12px; font-weight: bold; font-size: 12.5px; font-family: 'Arimo'; cursor: pointer; background: var(--artal-blue, #0A3D62); color: #fff; }
    .ag-form .cancel { background: transparent; color: #889; border: 1.5px solid #dde3ea; }
</style>
</head>
<body>
<header>
    <div class="header-title">
        <a class="btn-back" id="btn-back" href="index.html" title="Volver">← Volver</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Pendientes con Claude</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>
<main>
    <p class="intro" id="intro">Trabajos que empezaste en la app de Claude y no se han cerrado, el más viejo primero.</p>
    <div id="lista"><p class="empty">Cargando…</p></div>
    <div class="otros" id="otros"></div>
</main>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, doc, onSnapshot, updateDoc, addDoc, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth([]);   // solo gerencia: son las sesiones de trabajo de Dylan con Claude
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    wireBackButton(usuario.roles);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // El sync guarda las fechas como Timestamp (el helper REST convierte los ISO); la pantalla escribe strings ISO. Se aceptan las dos.
    const ms = (v) => v && typeof v.toDate === 'function' ? v.toDate().getTime() : (typeof v === 'string' || typeof v === 'number') ? new Date(v).getTime() : NaN;
    const dias = (v) => { const t = ms(v); return t > 0 ? Math.floor((Date.now() - t) / 86400000) : 999; };
    const hace = (v) => { const d = dias(v); if (d >= 999) return ''; if (d <= 0) { const h = Math.floor((Date.now() - ms(v)) / 3600000); return h <= 0 ? 'hace un momento' : `hace ${h} h`; } return d === 1 ? 'ayer' : `hace ${d} días`; };
    const clase = (v) => { const d = dias(v); return d <= 0 ? 'hoy' : d <= 2 ? 'ayer' : 'vieja'; };
    const fecha = (v) => { const t = ms(v); return t > 0 ? new Date(t).toLocaleString('es-DO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; };
    const estadoDe = (s) => s.estado || 'abierta';

    let sesiones = [], vista = 'abierta';
    onSnapshot(collection(db, 'sesionesClaude'), (snap) => { sesiones = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        (e) => { document.getElementById('lista').innerHTML = `<p class="empty">No se pudo leer: ${esc(e.code || e.message)}</p>`; });

    window.verVista = (v) => { vista = v; render(); };
    window.abrir = (el) => el.classList.toggle('abierto');
    window.detalle = (id) => document.getElementById('det-' + id).classList.toggle('abierto');
    // Agendar: crea un recordatorio de gerencia en `citas` (mismo formato que el Calendario) para quien está conectado, con el
    // título de la sesión y lo pendiente en la descripción; la Cloud Function manda el push al crearlo y a la hora. La sesión
    // guarda `agendadoFecha` / `agendadoCitaId` para mostrarlo aquí.
    const agendadoVigente = (s) => s.agendadoFecha && ms(s.agendadoFecha) > Date.now() - 12 * 3600000;
    function defaultAgenda() { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
    window.agendarForm = (id) => { const f = document.getElementById('ag-' + id); f.classList.toggle('abierto'); if (f.classList.contains('abierto')) f.querySelector('input').focus(); };
    window.agendar = async (id) => {
        const s = sesiones.find(x => x.id === id); const val = document.getElementById('ag-f-' + id).value;
        if (!s || !val) { alert('Elige fecha y hora.'); return; }
        const cuando = new Date(val); if (!(cuando.getTime() > Date.now())) { alert('La fecha tiene que ser futura.'); return; }
        const nombre = (usuario.nombre || '').split(' ')[0] || usuario.nombre;
        const pend = (s.pendiente || s.ultimaRespuesta || '').slice(0, 700);
        try {
            const ref = await addDoc(collection(db, 'citas'), {
                tipo: 'recordatorio', titulo: 'Retomar con Claude: ' + (s.titulo || id),
                descripcion: (pend ? 'Dónde quedó:\n' + pend + '\n\n' : '') + 'Abre la sesión «' + (s.titulo || id) + '» en la app de Claude.',
                fecha: Timestamp.fromDate(cuando), sinFecha: false, duracionMin: 0, orderId: null, cliente: '', obra: '',
                asignadoA: 'gerente', asignados: [{ nombre, email: usuario.email }], etapas: [], completadoPor: [],
                creadoPorNombre: usuario.nombre, recordatorios: [0], recordatoriosEnviados: [], recordatoriosPendientes: true,
                repetir: 'no', repetirGenerado: false, sesionClaudeId: id, fechaCreacion: serverTimestamp()
            });
            await updateDoc(doc(db, 'sesionesClaude', id), { agendadoFecha: cuando.toISOString(), agendadoCitaId: ref.id, agendadoPor: usuario.nombre });
        } catch (e) { alert('No se pudo agendar: ' + (e.message || e)); }
    };
    window.setEstado = async (id, estado) => {
        try { await updateDoc(doc(db, 'sesionesClaude', id), { estado, estadoFecha: new Date().toISOString(), estadoPor: usuario.nombre }); }
        catch (e) { alert('No se pudo: ' + (e.message || e)); }
    };

    function render() {
        const abiertas = sesiones.filter(s => estadoDe(s) === 'abierta'), term = sesiones.filter(s => estadoDe(s) === 'terminada'), arch = sesiones.filter(s => estadoDe(s) === 'archivada');
        let lista = vista === 'abierta' ? abiertas : vista === 'terminada' ? term : arch;
        lista = lista.slice().sort((a, b) => vista === 'abierta' ? (ms(a.ultimaActividad) || 0) - (ms(b.ultimaActividad) || 0) : (ms(b.estadoFecha || b.ultimaActividad) || 0) - (ms(a.estadoFecha || a.ultimaActividad) || 0));
        const ultimo = sesiones.reduce((m, s) => Math.max(m, ms(s.sincronizado) || 0), 0);
        document.getElementById('intro').textContent = vista === 'abierta'
            ? `${abiertas.length} trabajo${abiertas.length === 1 ? '' : 's'} a medias, el más viejo primero. Toca una línea para ver más; «Listo» lo quita de aquí.${ultimo ? ' Actualizado ' + hace(ultimo) + '.' : ''}`
            : (vista === 'terminada' ? 'Trabajos que marcaste como listos.' : 'Rutinas y sesiones que no son trabajos.');
        document.getElementById('lista').innerHTML = lista.length ? lista.map(fila).join('') : `<p class="empty">${vista === 'abierta' ? 'Nada a medias. 🎉' : 'Nada aquí.'}</p>`;
        document.getElementById('otros').innerHTML = [['abierta', `A medias (${abiertas.length})`], ['terminada', `Listos (${term.length})`], ['archivada', `Rutinas (${arch.length})`]]
            .filter(([v]) => v !== vista).map(([v, t]) => `<a onclick="verVista('${v}')">${t}</a>`).join('');
    }
    function fila(s) {
        const est = estadoDe(s), ab = est === 'abierta';
        const pend = s.pendiente || s.ultimaRespuesta || '';
        const viva = s.viva ? ` <span style="font-size:11px;color:#1e8449">● en la app</span>` : '';
        return `<div class="fila ${ab ? clase(s.ultimaActividad) : 'cerrada'}">
            <div class="cab"><b>${esc(s.titulo || s.id)}</b>${viva}<span class="hace ${clase(s.ultimaActividad)}">${esc(hace(s.ultimaActividad))}</span></div>
            ${pend ? `<div class="pend" onclick="abrir(this)">${esc(pend)}</div>` : ''}
            <div class="detalle" id="det-${s.id}">${s.ultimoPedido ? `<b>Lo último que pediste (${esc(fecha(s.ultimoPedidoFecha))}):</b>\n${esc(s.ultimoPedido)}\n\n` : ''}<b>Última respuesta de Claude (${esc(fecha(s.ultimaRespuestaFecha))}):</b>\n${esc(s.ultimaRespuesta || '')}</div>
            <div class="pie">
                ${ab ? `<button class="listo" onclick="setEstado('${s.id}','terminada')">✓ Listo</button>` : `<a onclick="setEstado('${s.id}','abierta')">↩ Volver a pendientes</a>`}
                ${ab ? (agendadoVigente(s) ? `<span class="agendado">📅 retomar el ${esc(fecha(s.agendadoFecha))}</span> <a onclick="agendarForm('${s.id}')" style="font-weight:normal">cambiar</a>` : `<a onclick="agendarForm('${s.id}')">📅 Agendar</a>`) : ''}
                <a onclick="detalle('${s.id}')">detalle</a>
                ${ab ? `<a onclick="setEstado('${s.id}','archivada')" style="font-weight:normal;color:#889">no es un trabajo</a>` : ''}
                <span>${esc(fecha(s.inicio))} → ${esc(fecha(s.ultimaActividad))}</span>
            </div>
            <div class="ag-form" id="ag-${s.id}">
                <span style="font-size:12.5px;color:#334;">Retomar el</span>
                <input type="datetime-local" id="ag-f-${s.id}" value="${esc(defaultAgenda())}">
                <button onclick="agendar('${s.id}')">Agendar en el Calendario</button>
                <button class="cancel" onclick="document.getElementById('ag-${s.id}').classList.remove('abierto')">Cancelar</button>
                <span style="font-size:11.5px;color:#889;">Te llega un aviso a esa hora (y uno al crearlo). Queda en tu Calendario como recordatorio de gerencia.</span>
            </div>
        </div>`;
    }
</script>
</body>
</html>
