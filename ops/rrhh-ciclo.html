<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Ciclo del empleado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 780px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 16px; }
    .bar select { flex: 1; min-width: 200px; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .emp-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--artal-blue); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 17px; flex: 0 0 auto; }
    .emp-head .n { font-weight: bold; color: var(--artal-blue); font-size: 17px; }
    .emp-head .s { font-size: 12.5px; color: #667; margin-top: 2px; }
    .estado-badge { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; letter-spacing: .4px; }
    .estado-badge.activo { background: #e7f7ee; color: #1f9d61; } .estado-badge.inactivo { background: #f1f1f4; color: #8a93a0; }

    .tl { position: relative; margin-left: 8px; padding-left: 22px; border-left: 2px solid #e3e7ec; }
    .tl-item { position: relative; padding: 0 0 16px; }
    .tl-dot { position: absolute; left: -31px; top: 2px; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 2px solid #e3e7ec; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .tl-card { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; }
    .tl-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .tl-top .tipo { font-weight: bold; color: var(--artal-blue); font-size: 14.5px; }
    .tl-top .fecha { font-size: 12px; color: #8a93a0; margin-left: auto; }
    .tl-det { font-size: 13.5px; color: #445; margin-top: 5px; white-space: pre-wrap; }
    .tl-meta { font-size: 11.5px; color: #8a93a0; margin-top: 6px; }
    .tl-card .justif-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: bold; color: var(--artal-blue); text-decoration: none; margin-top: 6px; }
    .tl-del { background: transparent; border: none; color: #c9ced6; cursor: pointer; font-size: 14px; padding: 2px 4px; }
    .tl-del:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 12px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 66px; }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .chk-line input { width: auto; min-height: 0; }
    .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .extra { display: none; } .extra.show { display: block; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="rrhh.html" title="Volver a RRHH">← RRHH</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Ciclo del empleado</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar">
        <select id="sel-emp" onchange="onSelEmp()"></select>
        <button class="btn-y" onclick="abrirEvento()">+ Registrar evento</button>
    </div>
    <div id="emp-head"></div>
    <div id="timeline"><p class="empty">Elige un empleado o mira todos los eventos recientes.</p></div>
</main>

<!-- Modal evento -->
<div class="modal-overlay" id="modal-evento">
    <div class="modal-box">
        <h2>Registrar evento</h2>
        <label>Empleado *</label>
        <select id="e-empleado"></select>
        <label>Tipo *</label>
        <select id="e-tipo" onchange="onTipo()"></select>
        <label>Fecha *</label>
        <input type="date" id="e-fecha">
        <label>Título</label>
        <input type="text" id="e-titulo" placeholder="Ej. Ascenso a encargado de taller">
        <label>Detalle</label>
        <textarea id="e-detalle" placeholder="Descripción, motivo, condiciones…"></textarea>

        <div class="extra" id="extra-promocion">
            <label>Nuevo sueldo base <span class="lbl-opt">— opcional</span></label>
            <input type="number" id="e-sueldo" min="0" step="0.01" placeholder="RD$">
            <div class="chk-line"><input type="checkbox" id="e-aplicar-sueldo" checked><label for="e-aplicar-sueldo">Actualizar el sueldo del empleado</label></div>
        </div>
        <div class="extra" id="extra-salida">
            <label>Tipo de salida *</label>
            <select id="e-tiposalida">
                <option value="Renuncia">Renuncia</option>
                <option value="Despido">Despido</option>
                <option value="Fin de contrato">Fin de contrato</option>
                <option value="Mutuo acuerdo">Mutuo acuerdo</option>
                <option value="Abandono de trabajo">Abandono de trabajo</option>
            </select>
            <div class="chk-line"><input type="checkbox" id="e-inactivo" checked><label for="e-inactivo">Marcar al empleado como inactivo</label></div>
        </div>

        <label>Adjunto <span class="lbl-opt">— PDF, imagen o documento (opcional)</span></label>
        <input type="file" id="e-adjunto" accept="image/*,application/pdf,.doc,.docx,.txt,.odt">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrarEvento()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarEvento()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db, storage } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const byNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es');
    const iniciales = (n) => (String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('') || '?').toUpperCase();
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    const TIPOS = {
        promocion: { label: 'Promoción / Cambio', icon: '⬆️' },
        amonestacion: { label: 'Amonestación', icon: '⚠️' },
        reconocimiento: { label: 'Reconocimiento', icon: '🏆' },
        capacitacion: { label: 'Capacitación', icon: '🎓' },
        nota: { label: 'Nota', icon: '📝' },
        salida: { label: 'Salida / Desvinculación', icon: '🚪' }
    };

    let empleados = [], eventos = [], selEmp = '';

    // Preselección por ?emp=ID (desde el botón Expediente en Empleados).
    const params = new URLSearchParams(location.search);
    selEmp = params.get('emp') || '';

    // Opciones de tipo en el modal.
    document.getElementById('e-tipo').innerHTML = Object.entries(TIPOS).map(([v, t]) => `<option value="${v}">${t.icon} ${t.label}</option>`).join('');

    onSnapshot(collection(db, 'rrhhEmpleados'), (snap) => {
        empleados = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre);
        llenarSelects(); render();
    });
    onSnapshot(collection(db, 'rrhhEventos'), (snap) => {
        eventos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    });

    function llenarSelects() {
        const opciones = '<option value="">— Todos (recientes) —</option>' + empleados.map(e =>
            `<option value="${esc(e.id)}">${esc(e.nombre)}${(e.estado || 'activo') === 'inactivo' ? ' (inactivo)' : ''}</option>`).join('');
        const sel = document.getElementById('sel-emp');
        sel.innerHTML = opciones; sel.value = selEmp;
        const em = document.getElementById('e-empleado');
        em.innerHTML = '<option value="">—</option>' + empleados.filter(e => (e.estado || 'activo') === 'activo').map(e => `<option value="${esc(e.id)}">${esc(e.nombre)}</option>`).join('');
    }
    window.onSelEmp = function () { selEmp = document.getElementById('sel-emp').value; render(); };

    function render() {
        const cont = document.getElementById('timeline'), head = document.getElementById('emp-head');
        let lista = eventos.slice();
        if (selEmp) {
            const emp = empleados.find(e => e.id === selEmp);
            if (emp) {
                const estado = emp.estado || 'activo';
                const meta = [emp.cargoNombres ? emp.cargoNombres.join(', ') : emp.cargoNombre, emp.departamentoNombre].filter(Boolean).join(' · ');
                head.innerHTML = `<div class="emp-head"><span class="avatar">${esc(iniciales(emp.nombre))}</span>
                    <div><div class="n">${esc(emp.nombre)} <span class="estado-badge ${estado}">${estado}</span></div>
                    ${meta ? `<div class="s">${esc(meta)}</div>` : ''}</div></div>`;
            } else head.innerHTML = '';
            lista = lista.filter(ev => ev.empleadoId === selEmp);
            // Evento sintético de ingreso (desde fechaIngreso del empleado; no se guarda).
            if (emp && emp.fechaIngreso) lista.push({ id: '__ingreso', sintetico: true, tipo: 'ingreso', fecha: emp.fechaIngreso, titulo: 'Ingreso a la empresa', empleadoNombre: emp.nombre });
        } else {
            head.innerHTML = '';
        }
        lista.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
        if (!lista.length) { cont.innerHTML = `<p class="empty">${selEmp ? 'Sin eventos registrados para este empleado.' : 'Sin eventos todavía. Elige un empleado y registra el primero.'}</p>`; return; }
        cont.innerHTML = '<div class="tl">' + lista.map(cardHTML).join('') + '</div>';
    }

    function cardHTML(ev) {
        const t = TIPOS[ev.tipo] || { label: ev.tipo === 'ingreso' ? 'Ingreso' : ev.tipo, icon: ev.tipo === 'ingreso' ? '🎯' : '•' };
        const extra = [];
        if (ev.tipoSalida) extra.push('Tipo: ' + ev.tipoSalida);
        if (ev.registradoPor) extra.push('Registró: ' + ev.registradoPor);
        const nombreTop = selEmp ? '' : `<span class="fecha" style="margin-left:0;color:#556;font-weight:bold">${esc(ev.empleadoNombre || '')}</span>`;
        const del = ev.sintetico ? '' : `<button class="tl-del" title="Eliminar" onclick="borrarEvento('${ev.id}')">🗑</button>`;
        const adj = (ev.adjunto && ev.adjunto.url)
            ? `<div><a class="justif-link" href="${esc(ev.adjunto.url)}" target="_blank" rel="noopener">${ev.adjunto.tipo === 'pdf' ? '📄' : (ev.adjunto.tipo === 'doc' ? '📃' : '🖼️')} Ver adjunto</a></div>` : '';
        return `<div class="tl-item">
            <div class="tl-dot">${t.icon}</div>
            <div class="tl-card">
                <div class="tl-top"><span class="tipo">${esc(ev.titulo || t.label)}</span>${nombreTop}<span class="fecha">${esc(fmtFecha(ev.fecha))}</span></div>
                ${ev.titulo && ev.titulo !== t.label ? `<div class="tl-meta">${t.icon} ${esc(t.label)}</div>` : ''}
                ${ev.detalle ? `<div class="tl-det">${esc(ev.detalle)}</div>` : ''}
                ${adj}
                ${extra.length ? `<div class="tl-meta">${esc(extra.join(' · '))} ${del}</div>` : `<div class="tl-meta" style="text-align:right">${del}</div>`}
            </div>
        </div>`;
    }

    // ---------- Adjunto (imagen se comprime; PDF tal cual) ----------
    function comprimirImg(file) {
        return new Promise((resolve) => {
            if (!file || !/^image\//.test(file.type)) { resolve(file); return; }
            const url = URL.createObjectURL(file); const img = new Image();
            img.onload = () => {
                const max = 1600; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }
    async function subirAdjunto(file, pathPrefix) {
        // Imagen se comprime a JPEG; PDF y documentos de texto se suben tal cual.
        const esImg = /^image\//.test(file.type);
        const esPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
        let blob = file, contentType = file.type || 'application/octet-stream';
        let ext = ((file.name || '').split('.').pop() || 'bin').toLowerCase();
        if (esImg) { blob = await comprimirImg(file).catch(() => file); contentType = 'image/jpeg'; ext = 'jpg'; }
        const nombre = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
        const r = ref(storage, `${pathPrefix}/${nombre}`);
        await uploadBytes(r, blob, { contentType });
        const url = await getDownloadURL(r);
        return { url, nombre: file.name || ('adjunto.' + ext), tipo: esImg ? 'img' : (esPdf ? 'pdf' : 'doc') };
    }

    // ---------- Modal ----------
    window.onTipo = function () {
        const t = document.getElementById('e-tipo').value;
        document.getElementById('extra-promocion').classList.toggle('show', t === 'promocion');
        document.getElementById('extra-salida').classList.toggle('show', t === 'salida');
    };
    window.abrirEvento = function () {
        document.getElementById('e-empleado').value = selEmp || '';
        document.getElementById('e-tipo').value = 'promocion';
        document.getElementById('e-fecha').value = hoyISO();
        document.getElementById('e-titulo').value = '';
        document.getElementById('e-detalle').value = '';
        document.getElementById('e-sueldo').value = '';
        document.getElementById('e-aplicar-sueldo').checked = true;
        document.getElementById('e-tiposalida').value = 'Renuncia';
        document.getElementById('e-inactivo').checked = true;
        document.getElementById('e-adjunto').value = '';
        onTipo();
        document.getElementById('modal-evento').classList.add('show');
    };
    window.cerrarEvento = function () { document.getElementById('modal-evento').classList.remove('show'); };

    window.guardarEvento = async function () {
        const empId = document.getElementById('e-empleado').value;
        const emp = empleados.find(x => x.id === empId);
        const tipo = document.getElementById('e-tipo').value;
        const fecha = document.getElementById('e-fecha').value;
        const titulo = document.getElementById('e-titulo').value.trim();
        const detalle = document.getElementById('e-detalle').value.trim();
        if (!empId) { alert('Elige el empleado.'); return; }
        if (!fecha) { alert('Indica la fecha.'); return; }
        if (!titulo && !detalle) { alert('Escribe al menos un título o un detalle.'); return; }
        const btn = document.querySelector('#modal-evento .btn-guardar');
        const file = (document.getElementById('e-adjunto').files || [])[0];
        if (btn) { btn.disabled = true; btn.textContent = file ? 'Subiendo…' : 'Guardando…'; }
        const datos = {
            empleadoId: empId, empleadoNombre: emp ? emp.nombre : '', tipo, fecha, titulo, detalle,
            registradoPor: usuario.nombre, fechaCreacion: serverTimestamp()
        };
        if (tipo === 'salida') datos.tipoSalida = document.getElementById('e-tiposalida').value;
        try {
            const refDoc = await addDoc(collection(db, 'rrhhEventos'), datos);
            if (file) {
                const adj = await subirAdjunto(file, `rrhhEventos/${refDoc.id}`);
                await updateDoc(doc(db, 'rrhhEventos', refDoc.id), { adjunto: adj });
            }
            // Efectos sobre el empleado.
            if (emp) {
                if (tipo === 'salida' && document.getElementById('e-inactivo').checked) {
                    await updateDoc(doc(db, 'rrhhEmpleados', empId), { estado: 'inactivo', fechaSalida: fecha, tipoSalida: datos.tipoSalida, motivoSalida: detalle });
                }
                if (tipo === 'promocion' && document.getElementById('e-aplicar-sueldo').checked) {
                    const nuevo = document.getElementById('e-sueldo').value;
                    if (nuevo) await updateDoc(doc(db, 'rrhhEmpleados', empId), { sueldoBase: Number(nuevo) });
                }
            }
            cerrarEvento();
            if (!selEmp) { selEmp = empId; document.getElementById('sel-emp').value = empId; render(); }
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; } }
    };

    window.borrarEvento = async function (id) {
        if (!confirm('¿Eliminar este evento del expediente?')) return;
        try { await deleteDoc(doc(db, 'rrhhEventos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };
</script>

</body>
</html>
