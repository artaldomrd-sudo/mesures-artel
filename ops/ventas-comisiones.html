<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Vendedores y Comisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 900px; }
    .panel { display: none; } .panel.show { display: block; }
    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 9px 15px; }
    .kpi .n { font-size: 17px; font-weight: bold; color: var(--artal-blue); line-height: 1; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar input.buscar, .bar select { padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .bar input.buscar { flex: 1; min-width: 150px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .sec-title { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; color: var(--artal-blue); margin: 18px 0 8px; }

    .vend-card, .com-card { display: flex; align-items: flex-start; gap: 12px; }
    .vend-card .info, .com-card .info { flex: 1; min-width: 0; }
    .vend-card .info b, .com-card .info b { color: var(--artal-blue); font-size: 15px; }
    .vend-card .info .l, .com-card .info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .pct-badge { font-size: 11px; font-weight: bold; background: #eef3ff; color: #3457b2; padding: 2px 9px; border-radius: 20px; }
    .estado-badge { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; letter-spacing: .3px; }
    .estado-badge.activo { background: #e7f7ee; color: #1f9d61; } .estado-badge.inactivo { background: #f1f1f4; color: #8a93a0; }
    .estado-badge.pendiente { background: #fff2dc; color: #c07a12; } .estado-badge.pagada { background: #e7f7ee; color: #1f9d61; }
    .com-monto { font-weight: bold; color: #1f9d61; font-size: 15px; white-space: nowrap; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button { border: none; border-radius: 8px; padding: 8px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 36px; }
    .b-editar { background: var(--artal-blue); color: #fff; } .b-ok { background: #2ecc71; color: #fff; }
    .b-toggle { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    table.res { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.res th { background: var(--artal-blue); color: #fff; font-size: 11px; text-transform: uppercase; padding: 8px 6px; text-align: right; }
    table.res th.l { text-align: left; }
    table.res td { padding: 8px 6px; border-bottom: 1px solid #eef1f4; text-align: right; font-variant-numeric: tabular-nums; }
    table.res td.l { text-align: left; font-weight: bold; color: var(--artal-blue); }
    table.res tr.tot td { font-weight: bold; border-top: 2px solid var(--artal-blue); background: #f7f9fb; }
    .pos { color: #1f9d61; } .warn { color: #c07a12; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 11px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="ventas.html" title="Volver a Ventas">← Ventas</a>
        <a class="btn-back" href="index.html" title="Ir al Panel de Control">🏠 Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Vendedores y Comisiones</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="tabs">
        <button class="tab-btn active" id="tab-vendedores" onclick="setTab('vendedores')">Vendedores</button>
        <button class="tab-btn" id="tab-comisiones" onclick="setTab('comisiones')">Comisiones</button>
        <button class="tab-btn" id="tab-resumen" onclick="setTab('resumen')">Resumen</button>
    </div>

    <!-- VENDEDORES -->
    <section class="panel show" id="panel-vendedores">
        <div class="bar"><button class="btn-y" onclick="abrirVendedor()">+ Nuevo vendedor</button></div>
        <div id="vend-lista"><p class="empty">Cargando…</p></div>
    </section>

    <!-- COMISIONES -->
    <section class="panel" id="panel-comisiones">
        <div class="bar">
            <button class="btn-y" onclick="abrirComision()">+ Registrar comisión</button>
            <select id="f-vendedor" onchange="renderComisiones()"><option value="">Todos los vendedores</option></select>
            <select id="f-estado" onchange="renderComisiones()"><option value="">Todas</option><option value="pendiente">Pendientes</option><option value="pagada">Pagadas</option></select>
        </div>
        <div id="com-lista"><p class="empty">Cargando…</p></div>
    </section>

    <!-- RESUMEN -->
    <section class="panel" id="panel-resumen">
        <div class="kpis" id="kpis"></div>
        <div id="res-cont"></div>
    </section>
</main>

<datalist id="clientes-list"></datalist>

<!-- Modal Vendedor -->
<div class="modal-overlay" id="modal-vend">
    <div class="modal-box">
        <h2 id="vend-title">Nuevo vendedor</h2>
        <label>Nombre *</label>
        <input type="text" id="v-nombre" placeholder="Nombre del vendedor">
        <div class="grid2">
            <div><label>Teléfono</label><input type="tel" id="v-telefono" placeholder="809-000-0000"></div>
            <div><label>Correo</label><input type="email" id="v-correo" placeholder="correo@ejemplo.com"></div>
        </div>
        <div class="grid2">
            <div><label>Comisión por defecto (%)</label><input type="number" id="v-pct" min="0" max="100" step="0.1" placeholder="Ej. 5"></div>
            <div><label>Meta mensual (RD$) <span class="lbl-opt">— opcional</span></label><input type="number" id="v-meta" min="0" step="0.01"></div>
        </div>
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <textarea id="v-notas" style="min-height:52px"></textarea>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrarVend()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarVend()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal Comisión -->
<div class="modal-overlay" id="modal-com">
    <div class="modal-box">
        <h2 id="com-title">Registrar comisión</h2>
        <label>Vendedor *</label>
        <select id="c-vendedor" onchange="onVendedorSel()"></select>
        <label>Concepto</label>
        <input type="text" id="c-concepto" placeholder="Ej. Cotización #0012 — ventanas">
        <label>Cliente</label>
        <input type="text" id="c-cliente" list="clientes-list" placeholder="Nombre del cliente">
        <div class="grid2">
            <div><label>Monto de la venta (RD$) *</label><input type="number" id="c-monto" min="0" step="0.01" oninput="recalcCom()"></div>
            <div><label>Comisión (%)</label><input type="number" id="c-pct" min="0" max="100" step="0.1" oninput="recalcCom()"></div>
        </div>
        <div class="grid2">
            <div><label>Comisión (RD$)</label><input type="number" id="c-comision" min="0" step="0.01"></div>
            <div><label>Fecha</label><input type="date" id="c-fecha"></div>
        </div>
        <label>Estado</label>
        <select id="c-estado"><option value="pendiente">Pendiente de pago</option><option value="pagada">Pagada</option></select>
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <textarea id="c-notas" style="min-height:48px"></textarea>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrarCom()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarCom()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['cotizaciones']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const byNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es');
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { maximumFractionDigits: 0 });
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    let vendedores = [], comisiones = [], editVend = null, editCom = null;

    onSnapshot(collection(db, 'ventasVendedores'), (snap) => {
        vendedores = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre);
        renderVendedores(); llenarSelectVendedores(); renderResumen();
    }, (err) => { document.getElementById('vend-lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'ventasComisiones'), (snap) => {
        comisiones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderComisiones(); renderResumen();
    });
    onSnapshot(collection(db, 'clientes'), (snap) => {
        const nombres = snap.docs.map(d => (d.data().nombre || '')).filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));
        document.getElementById('clientes-list').innerHTML = nombres.map(n => `<option value="${esc(n)}"></option>`).join('');
    }, () => {});

    window.setTab = function (t) {
        ['vendedores', 'comisiones', 'resumen'].forEach(k => {
            document.getElementById('tab-' + k).classList.toggle('active', k === t);
            document.getElementById('panel-' + k).classList.toggle('show', k === t);
        });
    };

    // ---------- VENDEDORES ----------
    const activoDe = (v) => v.activo !== false;
    window.abrirVendedor = function () {
        editVend = null; document.getElementById('vend-title').textContent = 'Nuevo vendedor';
        ['v-nombre', 'v-telefono', 'v-correo', 'v-pct', 'v-meta', 'v-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('modal-vend').classList.add('show');
    };
    window.editarVendedor = function (id) {
        const v = vendedores.find(x => x.id === id); if (!v) return;
        editVend = id; document.getElementById('vend-title').textContent = 'Editar vendedor';
        document.getElementById('v-nombre').value = v.nombre || '';
        document.getElementById('v-telefono').value = v.telefono || '';
        document.getElementById('v-correo').value = v.correo || '';
        document.getElementById('v-pct').value = v.comisionPct != null ? v.comisionPct : '';
        document.getElementById('v-meta').value = v.meta != null ? v.meta : '';
        document.getElementById('v-notas').value = v.notas || '';
        document.getElementById('modal-vend').classList.add('show');
    };
    window.cerrarVend = function () { document.getElementById('modal-vend').classList.remove('show'); };
    window.guardarVend = async function () {
        const nombre = document.getElementById('v-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre.'); return; }
        const metaRaw = document.getElementById('v-meta').value;
        const datos = {
            nombre, telefono: document.getElementById('v-telefono').value.trim(),
            correo: document.getElementById('v-correo').value.trim(),
            comisionPct: n2(document.getElementById('v-pct').value),
            meta: metaRaw ? n2(metaRaw) : null,
            notas: document.getElementById('v-notas').value.trim()
        };
        try {
            if (editVend) await updateDoc(doc(db, 'ventasVendedores', editVend), datos);
            else await addDoc(collection(db, 'ventasVendedores'), { ...datos, activo: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrarVend();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
    };
    window.toggleVend = async function (id) {
        const v = vendedores.find(x => x.id === id); if (!v) return;
        try { await updateDoc(doc(db, 'ventasVendedores', id), { activo: !activoDe(v) }); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrarVend = async function (id) {
        if (!confirm('¿Eliminar este vendedor? (sus comisiones registradas se conservan)')) return;
        try { await deleteDoc(doc(db, 'ventasVendedores', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    function renderVendedores() {
        const cont = document.getElementById('vend-lista');
        if (!vendedores.length) { cont.innerHTML = '<p class="empty">Aún no hay vendedores. Crea el primero.</p>'; return; }
        cont.innerHTML = vendedores.map(v => {
            const act = activoDe(v);
            const meta = [v.telefono ? '📞 ' + esc(v.telefono) : '', v.correo ? '✉ ' + esc(v.correo) : '', v.meta ? 'Meta ' + fmt0(v.meta) : ''].filter(Boolean).join('  ·  ');
            return `<div class="order-card vend-card"><div class="info">
                <b>${esc(v.nombre)}</b> <span class="pct-badge">${n2(v.comisionPct)}%</span> <span class="estado-badge ${act ? 'activo' : 'inactivo'}">${act ? 'Activo' : 'Inactivo'}</span>
                ${meta ? `<div class="l">${meta}</div>` : ''}
            </div><div class="row-actions">
                <button class="b-editar" onclick="editarVendedor('${v.id}')">✏ Editar</button>
                <button class="b-toggle" onclick="toggleVend('${v.id}')">${act ? 'Desactivar' : 'Activar'}</button>
                <button class="b-borrar" onclick="borrarVend('${v.id}')">🗑</button>
            </div></div>`;
        }).join('');
    }

    // ---------- COMISIONES ----------
    function llenarSelectVendedores() {
        const opts = vendedores.map(v => `<option value="${esc(v.id)}">${esc(v.nombre)}</option>`).join('');
        const cv = document.getElementById('c-vendedor'); const cur = cv.value;
        cv.innerHTML = '<option value="">— Elegir —</option>' + opts; cv.value = cur;
        const fv = document.getElementById('f-vendedor'); const curf = fv.value;
        fv.innerHTML = '<option value="">Todos los vendedores</option>' + opts; fv.value = curf;
    }
    window.onVendedorSel = function () {
        const v = vendedores.find(x => x.id === document.getElementById('c-vendedor').value);
        if (v && document.getElementById('c-pct').value === '') document.getElementById('c-pct').value = n2(v.comisionPct);
        if (v) { const p = document.getElementById('c-pct'); if (p.value === '' || p.value == '0') p.value = n2(v.comisionPct); }
        recalcCom();
    };
    window.recalcCom = function () {
        const monto = n2(document.getElementById('c-monto').value), pct = n2(document.getElementById('c-pct').value);
        document.getElementById('c-comision').value = Math.round(monto * pct) / 100;
    };
    window.abrirComision = function () {
        editCom = null; document.getElementById('com-title').textContent = 'Registrar comisión';
        ['c-concepto', 'c-cliente', 'c-monto', 'c-pct', 'c-comision', 'c-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('c-vendedor').value = '';
        document.getElementById('c-fecha').value = hoyISO();
        document.getElementById('c-estado').value = 'pendiente';
        document.getElementById('modal-com').classList.add('show');
    };
    window.editarComision = function (id) {
        const c = comisiones.find(x => x.id === id); if (!c) return;
        editCom = id; document.getElementById('com-title').textContent = 'Editar comisión';
        document.getElementById('c-vendedor').value = c.vendedorId || '';
        document.getElementById('c-concepto').value = c.concepto || '';
        document.getElementById('c-cliente').value = c.clienteNombre || '';
        document.getElementById('c-monto').value = c.montoVenta != null ? c.montoVenta : '';
        document.getElementById('c-pct').value = c.comisionPct != null ? c.comisionPct : '';
        document.getElementById('c-comision').value = c.comision != null ? c.comision : '';
        document.getElementById('c-fecha').value = c.fecha || hoyISO();
        document.getElementById('c-estado').value = c.estado || 'pendiente';
        document.getElementById('c-notas').value = c.notas || '';
        document.getElementById('modal-com').classList.add('show');
    };
    window.cerrarCom = function () { document.getElementById('modal-com').classList.remove('show'); };
    window.guardarCom = async function () {
        const vId = document.getElementById('c-vendedor').value;
        const v = vendedores.find(x => x.id === vId);
        if (!vId) { alert('Elige el vendedor.'); return; }
        const datos = {
            vendedorId: vId, vendedorNombre: v ? v.nombre : '',
            concepto: document.getElementById('c-concepto').value.trim(),
            clienteNombre: document.getElementById('c-cliente').value.trim(),
            montoVenta: n2(document.getElementById('c-monto').value),
            comisionPct: n2(document.getElementById('c-pct').value),
            comision: n2(document.getElementById('c-comision').value),
            fecha: document.getElementById('c-fecha').value || hoyISO(),
            estado: document.getElementById('c-estado').value,
            notas: document.getElementById('c-notas').value.trim(),
            actualizado: serverTimestamp()
        };
        try {
            if (editCom) await updateDoc(doc(db, 'ventasComisiones', editCom), datos);
            else await addDoc(collection(db, 'ventasComisiones'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrarCom();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
    };
    window.marcarPagada = async function (id, pagada) {
        try { await updateDoc(doc(db, 'ventasComisiones', id), { estado: pagada ? 'pagada' : 'pendiente', fechaPago: pagada ? hoyISO() : '' }); }
        catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrarCom = async function (id) {
        if (!confirm('¿Eliminar esta comisión?')) return;
        try { await deleteDoc(doc(db, 'ventasComisiones', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    function renderComisiones() {
        const fv = document.getElementById('f-vendedor').value, fe = document.getElementById('f-estado').value;
        let lista = comisiones.slice();
        if (fv) lista = lista.filter(c => c.vendedorId === fv);
        if (fe) lista = lista.filter(c => (c.estado || 'pendiente') === fe);
        lista.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
        const cont = document.getElementById('com-lista');
        if (!comisiones.length) { cont.innerHTML = '<p class="empty">Aún no hay comisiones registradas.</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin comisiones para el filtro.</p>'; return; }
        cont.innerHTML = lista.map(c => {
            const est = c.estado || 'pendiente';
            const sub = [c.concepto, c.clienteNombre, fmtFecha(c.fecha), 'venta ' + fmt0(c.montoVenta) + ' × ' + n2(c.comisionPct) + '%'].filter(Boolean).join('  ·  ');
            return `<div class="order-card com-card"><div class="info">
                <b>${esc(c.vendedorNombre || '')}</b> <span class="estado-badge ${est}">${est === 'pagada' ? 'Pagada' : 'Pendiente'}</span>
                <div class="l">${esc(sub)}</div>
                <div class="com-monto">${fmt(c.comision)}</div>
            </div><div class="row-actions">
                ${est === 'pendiente'
                    ? `<button class="b-ok" onclick="marcarPagada('${c.id}',true)">✓ Pagada</button>`
                    : `<button class="b-toggle" onclick="marcarPagada('${c.id}',false)">↩ Pendiente</button>`}
                <button class="b-editar" onclick="editarComision('${c.id}')">✏</button>
                <button class="b-borrar" onclick="borrarCom('${c.id}')">🗑</button>
            </div></div>`;
        }).join('');
    }

    // ---------- RESUMEN ----------
    function renderResumen() {
        const porVend = {};
        comisiones.forEach(c => {
            const k = c.vendedorId || '(sin vendedor)';
            const r = porVend[k] = porVend[k] || { nombre: c.vendedorNombre || '(sin vendedor)', vendido: 0, comision: 0, pagada: 0, pendiente: 0 };
            r.vendido += n2(c.montoVenta); r.comision += n2(c.comision);
            if ((c.estado || 'pendiente') === 'pagada') r.pagada += n2(c.comision); else r.pendiente += n2(c.comision);
        });
        // Incluye vendedores sin comisiones aún.
        vendedores.forEach(v => { if (!porVend[v.id]) porVend[v.id] = { nombre: v.nombre, vendido: 0, comision: 0, pagada: 0, pendiente: 0 }; });
        const filas = Object.values(porVend).sort((a, b) => b.comision - a.comision);
        const tot = filas.reduce((a, r) => ({ vendido: a.vendido + r.vendido, comision: a.comision + r.comision, pagada: a.pagada + r.pagada, pendiente: a.pendiente + r.pendiente }), { vendido: 0, comision: 0, pagada: 0, pendiente: 0 });

        document.getElementById('kpis').innerHTML = [
            ['Vendido total', fmt0(tot.vendido)], ['Comisión total', fmt0(tot.comision)], ['Pagada', fmt0(tot.pagada)], ['Pendiente de pago', fmt0(tot.pendiente)]
        ].map(([l, n]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

        const cont = document.getElementById('res-cont');
        if (!filas.length) { cont.innerHTML = '<p class="empty">Sin datos todavía. Agrega vendedores y registra comisiones.</p>'; return; }
        cont.innerHTML = `<div class="sec-title">Comisiones por vendedor</div>
        <div style="overflow-x:auto"><table class="res">
            <thead><tr><th class="l">Vendedor</th><th>Vendido</th><th>Comisión</th><th>Pagada</th><th>Pendiente</th></tr></thead>
            <tbody>${filas.map(r => `<tr>
                <td class="l">${esc(r.nombre)}</td><td>${fmt0(r.vendido)}</td><td>${fmt(r.comision)}</td>
                <td class="pos">${fmt(r.pagada)}</td><td class="warn">${fmt(r.pendiente)}</td>
            </tr>`).join('')}</tbody>
            <tfoot><tr class="tot"><td class="l">TOTAL</td><td>${fmt0(tot.vendido)}</td><td>${fmt(tot.comision)}</td><td>${fmt(tot.pagada)}</td><td>${fmt(tot.pendiente)}</td></tr></tfoot>
        </table></div>`;
    }

    // Pestaña inicial por ?tab=
    const tab0 = new URLSearchParams(location.search).get('tab');
    if (['vendedores', 'comisiones', 'resumen'].includes(tab0)) setTab(tab0);
    document.getElementById('c-fecha').value = hoyISO();
</script>

</body>
</html>
