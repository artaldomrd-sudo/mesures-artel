<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Impuestos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 820px; }
    .nota-citrus { background: #eef3ff; border: 1.5px solid #ccd9f5; color: #33518f; border-radius: 10px; padding: 9px 13px; font-size: 12.5px; margin: 0 0 12px; line-height: 1.5; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-o { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue); border-radius: 9px; padding: 10px 14px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .imp-card { display: flex; align-items: center; gap: 14px; }
    .imp-tasa { width: 62px; text-align: center; flex: 0 0 auto; }
    .imp-tasa .p { font-size: 20px; font-weight: bold; color: var(--artal-blue); line-height: 1; }
    .imp-tasa .u { font-size: 10px; color: #8a93a0; }
    .imp-info { flex: 1; min-width: 0; } .imp-info b { color: var(--artal-blue); font-size: 15px; }
    .imp-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .b { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; letter-spacing: .3px; }
    .b.itbis { background: #e6f7f6; color: #12908a; } .b.exento { background: #f1f1f4; color: #8a93a0; } .b.otro { background: #f3eefb; color: #7d3ac1; } .b.inactivo { background: #fdeaea; color: #d9483b; } .b.citrus { background: #eef3ff; color: #3457b2; }
    .row-actions { display: flex; gap: 6px; }
    .row-actions button { border: none; border-radius: 8px; padding: 8px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 36px; }
    .b-editar { background: var(--artal-blue); color: #fff; } .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 440px; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; } .chk-line input { width: auto; min-height: 0; } .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="productos.html" title="Volver">← Productos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Impuestos</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="nota-citrus">ℹ️ Tasas de impuesto (ITBIS y exento) que aplican los productos y cotizaciones. El campo <b>Código en Citrus</b> sirve para mapear cada tasa a los impuestos de Citrus (Impuesto1…5) cuando se conecte.</div>
    <div class="bar">
        <button class="btn-y" onclick="abrir()">+ Nueva tasa</button>
        <button class="btn-o" id="btn-seed" onclick="cargarTipicas()" style="display:none">Cargar tasas típicas de RD</button>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Nueva tasa de impuesto</h2>
        <label>Nombre *</label>
        <input type="text" id="t-nombre" placeholder="Ej. ITBIS 18%">
        <div class="grid2">
            <div><label>Tasa (%) *</label><input type="number" id="t-tasa" min="0" step="0.01" placeholder="18"></div>
            <div><label>Tipo</label><select id="t-tipo"><option value="itbis">ITBIS</option><option value="exento">Exento</option><option value="otro">Otro</option></select></div>
        </div>
        <label>Código en Citrus <span class="lbl-opt">— opcional (mapeo)</span></label>
        <input type="text" id="t-citrus" placeholder="Ej. Impuesto1">
        <div class="chk-line"><input type="checkbox" id="t-activo" checked><label for="t-activo">Activa</label></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const TIPO_LBL = { itbis: 'ITBIS', exento: 'Exento', otro: 'Otro' };

    let impuestos = [], editId = null;
    onSnapshot(collection(db, 'productosImpuestos'), (s) => { impuestos = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });

    window.abrir = function () {
        editId = null; document.getElementById('modal-title').textContent = 'Nueva tasa de impuesto';
        document.getElementById('t-nombre').value = ''; document.getElementById('t-tasa').value = ''; document.getElementById('t-tipo').value = 'itbis';
        document.getElementById('t-citrus').value = ''; document.getElementById('t-activo').checked = true;
        document.getElementById('modal').classList.add('show');
    };
    window.editar = function (id) {
        const t = impuestos.find(x => x.id === id); if (!t) return;
        editId = id; document.getElementById('modal-title').textContent = 'Editar tasa';
        document.getElementById('t-nombre').value = t.nombre || ''; document.getElementById('t-tasa').value = t.tasa != null ? t.tasa : '';
        document.getElementById('t-tipo').value = t.tipo || 'itbis'; document.getElementById('t-citrus').value = t.codigoCitrus || '';
        document.getElementById('t-activo').checked = t.activo !== false;
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const nombre = document.getElementById('t-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre de la tasa.'); return; }
        const datos = {
            nombre, tasa: n2(document.getElementById('t-tasa').value), tipo: document.getElementById('t-tipo').value,
            codigoCitrus: document.getElementById('t-citrus').value.trim(), activo: document.getElementById('t-activo').checked,
            actualizado: serverTimestamp(), actualizadoPor: usuario.nombre
        };
        const btn = document.querySelector('#modal .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            if (editId) await updateDoc(doc(db, 'productosImpuestos', editId), datos);
            else await addDoc(collection(db, 'productosImpuestos'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrar();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.borrar = async function (id) {
        if (!confirm('¿Eliminar esta tasa de impuesto?')) return;
        try { await deleteDoc(doc(db, 'productosImpuestos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.cargarTipicas = async function () {
        if (!confirm('¿Cargar las tasas típicas de RD (ITBIS 18% y Exento 0%)?')) return;
        const btn = document.getElementById('btn-seed'); btn.disabled = true;
        try {
            for (const t of [{ nombre: 'ITBIS 18%', tasa: 18, tipo: 'itbis' }, { nombre: 'Exento', tasa: 0, tipo: 'exento' }]) {
                await addDoc(collection(db, 'productosImpuestos'), { ...t, codigoCitrus: '', activo: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            }
        } catch (e) { alert('No se pudo: ' + e.message); }
        finally { btn.disabled = false; }
    };

    function render() {
        const cont = document.getElementById('lista');
        document.getElementById('btn-seed').style.display = impuestos.length ? 'none' : 'inline-flex';
        if (!impuestos.length) { cont.innerHTML = '<p class="empty">Aún no hay tasas de impuesto. Crea una con «+ Nueva tasa» o usa «Cargar tasas típicas de RD».</p>'; return; }
        const lista = impuestos.slice().sort((a, b) => n2(b.tasa) - n2(a.tasa) || String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));
        cont.innerHTML = lista.map(t => {
            const tipo = t.tipo || 'itbis';
            const badges = [
                `<span class="b ${tipo}">${TIPO_LBL[tipo] || tipo}</span>`,
                t.activo === false ? '<span class="b inactivo">Inactiva</span>' : '',
                t.codigoCitrus ? `<span class="b citrus">Citrus: ${esc(t.codigoCitrus)}</span>` : ''
            ].filter(Boolean).join(' ');
            return `<div class="order-card imp-card">
                <div class="imp-tasa"><div class="p">${n2(t.tasa)}%</div><div class="u">tasa</div></div>
                <div class="imp-info"><b>${esc(t.nombre)}</b> ${badges}</div>
                <div class="row-actions">
                    <button class="b-editar" onclick="editar('${t.id}')">✏</button>
                    <button class="b-borrar" onclick="borrar('${t.id}')">🗑</button>
                </div>
            </div>`;
        }).join('');
    }

    render();
</script>

</body>
</html>
