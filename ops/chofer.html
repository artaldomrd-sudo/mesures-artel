<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="ARTAL DOMINICANA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ARTAL — Transportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    .order-card { border-left-color: #2ecc71; }
    .checklist-note { font-size: 12.5px; color: #e67e22; margin-top: 8px; font-weight: bold; }
    .recepcion-form { margin-top: 12px; padding: 12px; background: var(--artal-light); border-radius: 8px; display: none; }
    .recepcion-form label { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); display: block; margin-bottom: 4px; }
    .recepcion-form input[type="text"] { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; min-height: 42px; }
    .signature-canvas { width: 100%; max-width: 320px; height: 130px; border: 1.5px solid #ddd; border-radius: 7px; background: #fff; touch-action: none; display: block; }
    .signature-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .signature-row button { background: transparent; border: 1.5px solid #ccc; color: #666; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: 'Arimo'; }
    .btn-enruta { background: #3498db; color: #fff; }
    .enruta-badge { font-size: 12.5px; color: #3498db; font-weight: bold; margin-top: 8px; }
    /* Aviso: pedidos en ruta hace rato sin marcar entregado */
    .aviso-ruta { background: #fff4e5; border: 1.5px solid #f0b429; border-left: 5px solid #e67e22; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; color: #8a5b0e; }
    .aviso-ruta .t { font-weight: bold; font-size: 14.5px; margin-bottom: 6px; }
    .aviso-ruta .t b { color: #c0392b; }
    .aviso-ruta .lst { font-size: 12.5px; line-height: 1.6; }
    .aviso-ruta button { margin-top: 9px; background: #e67e22; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 40px; }
    /* Modal "Salir en ruta": vehículo + recorrido + qué más va en el camión (costo del viaje por obra) */
    .vj-ov { position: fixed; inset: 0; background: rgba(10,61,98,.55); display: none; align-items: flex-end; justify-content: center; z-index: 9000; padding: 10px; }
    .vj-ov.show { display: flex; }
    .vj-box { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; padding: 18px 16px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    .vj-box h2 { margin: 0 0 4px; font-size: 18px; color: var(--artal-blue); }
    .vj-box .sub { font-size: 13px; color: #667; margin: 0 0 12px; }
    .vj-box label { display: block; font-size: 12.5px; font-weight: bold; color: var(--artal-blue); margin: 10px 0 4px; }
    .vj-box select, .vj-box input[type="number"] { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 15px; min-height: 46px; background: #fff; }
    .vj-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vj-chk { display: flex; align-items: center; gap: 10px; background: var(--artal-light); border-radius: 9px; padding: 10px 12px; margin-top: 6px; font-size: 14px; }
    .vj-chk input { width: 20px; height: 20px; }
    .vj-otros { max-height: 200px; overflow: auto; }
    .vj-costo { margin-top: 12px; background: #eef6ff; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #1e2a35; }
    .vj-costo b { color: var(--artal-blue); }
    .vj-acts { display: flex; gap: 10px; margin-top: 14px; }
    .vj-acts button { flex: 1; border: none; border-radius: 10px; padding: 13px; font-weight: bold; font-size: 15px; cursor: pointer; font-family: 'Arimo'; min-height: 48px; }
    .vj-acts .ok { background: #3498db; color: #fff; } .vj-acts .no { background: #eef1f4; color: #556; }
    .vj-info { font-size: 12px; color: #3498db; margin-top: 4px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver al panel">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Transportes</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos de citas en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="aviso-ruta" style="display:none;"></div>
    <p style="margin:0 0 10px;font-size:13px"><a href="academia.html" style="color:var(--artal-blue);font-weight:bold">🎓 Academia · guía de Transportes</a></p>
    <div class="tabs">
        <button class="tab-btn active" id="tab-espera" onclick="setTab('espera')">En espera</button>
        <button class="tab-btn" id="tab-ruta" onclick="setTab('ruta')">En ruta</button>
        <button class="tab-btn" id="tab-entregado" onclick="setTab('entregado')">Entregado</button>
    </div>
    <!-- Solo en "Entregado": filtro por período (últimas entregas primero) -->
    <div id="entregado-filtros" style="display:none;margin:0 0 12px;">
        <div class="per-tabs">
            <button class="per-btn active" data-per="semana" onclick="setPeriodo('semana')">Esta semana</button>
            <button class="per-btn" data-per="mes" onclick="setPeriodo('mes')">Este mes</button>
            <button class="per-btn" data-per="anio" onclick="setPeriodo('anio')">Este año</button>
            <button class="per-btn" data-per="todo" onclick="setPeriodo('todo')">Todo</button>
        </div>
        <p class="per-resumen" id="entregado-resumen"></p>
    </div>
    <div id="orders-list"><p class="empty">Cargando…</p></div>
</main>

<!-- Salir en ruta: el costo del viaje (combustible, desgaste, peajes y fijos del vehículo) se
     reparte entre las obras que van en el camión y alimenta el informe de costo de cada obra. -->
<div class="vj-ov" id="viaje-modal">
    <div class="vj-box">
        <h2>🚚 Salir en ruta</h2>
        <p class="sub" id="vj-sub"></p>
        <div class="vj-row">
            <div><label>Vehículo</label><select id="vj-veh"></select></div>
            <div><label>Recorrido</label><select id="vj-ruta" onchange="viajeRuta()"></select></div>
        </div>
        <div class="vj-row">
            <div><label>Km de ida</label><input type="number" id="vj-km" min="0" step="1" oninput="viajeRecalc()"></div>
            <div><label>&nbsp;</label><div class="vj-chk" style="margin-top:0"><input type="checkbox" id="vj-iv" checked onchange="viajeRecalc()"> Ida y vuelta</div></div>
        </div>
        <label>¿Qué más va en este mismo viaje?</label>
        <div class="vj-otros" id="vj-otros"></div>
        <div class="vj-costo" id="vj-costo"></div>
        <div class="vj-acts">
            <button class="no" onclick="viajeCerrar()">Cancelar</button>
            <button class="ok" id="vj-ok" onclick="viajeConfirmar()">Confirmar salida</button>
        </div>
    </div>
</div>
<style>
    .per-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .per-btn { border: 1.5px solid #d7dee6; background: #fff; color: var(--artal-blue); border-radius: 999px; padding: 8px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; min-height: 38px; }
    .per-btn.active { background: var(--artal-blue); color: #fff; border-color: var(--artal-blue); }
    .per-resumen { font-size: 12.5px; color: #667; margin: 8px 0 0; }
    .dia-sep { font-size: 12px; font-weight: bold; color: var(--artal-blue); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; padding-left: 4px; }
</style>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { enableNotifications } from './notifications.js';
    import { db } from './firebase-config.js';
    import './mensajeria-widget.js';   // botón flotante ✉️ de Mensajería ARTAL
    import { collection, query, where, onSnapshot, doc, updateDoc, getDoc, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { openOrderPreview } from './order-preview.js';
    import { setupSignaturePad } from './signature.js';
    window.openOrderPreview = openOrderPreview;

    const usuario = await requireAuth(['chofer']);
    wireBackButton(usuario.roles);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function checklistResuelto(o) {
        const items = o.items || [];
        if (!items.length) return true;
        const status = o.itemStatus || {};
        return items.every(it => status[it.id] && status[it.id].estado);
    }

    function orderCardHTML(id, o) {
        const resuelto = checklistResuelto(o);
        const esCompra = o.docType === 'COMPRA_DIRECTA';
        const esParcial = o.status === 'parcialmente_listo';
        const enRuta = o.enRuta === true;
        const entregado = o.entregado === true;
        const metaLine = esCompra
            ? `Compra directa · Proveedor: ${esc(o.proveedor)} · ${esc(o.totalItems) || 0} artículo(s) · <a href="${esc(o.compraPdfUrl)}" target="_blank">Ver orden de compra</a>`
            : `${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems · <a href="#" onclick="openOrderPreview('${id}', 'chofer'); return false;">Ver hoja de fabricación</a>`;
        const borderColor = entregado ? '#999' : (esParcial ? '#e67e22' : (enRuta ? '#3498db' : ''));

        // Pestaña "Entregado": solo lectura, sin formulario de recepción ni acciones de estado.
        if (entregado) {
            const rec = o.recepcionInstalador || {};
            const fecha = o.fechaEntregado && o.fechaEntregado.toDate ? o.fechaEntregado.toDate().toLocaleString('es-DO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
            return `
            <div class="order-card" style="border-left-color:${borderColor};">
                <div class="order-head">
                    <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
                </div>
                <div class="order-meta">
                    ${metaLine}
                    ${o.asignadoChoferNombre ? ' · 👤 Asignado a ' + esc(o.asignadoChoferNombre) : ''}
                </div>
                <div class="enruta-badge" style="color:#2ecc71;">✓ Entregado${fecha ? ' — ' + esc(fecha) : ''}${rec.nombre ? ' · recibió ' + esc(rec.nombre) : ''}</div>
            </div>`;
        }

        return `
        <div class="order-card" ${borderColor ? `style="border-left-color:${borderColor};"` : ''}>
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
            </div>
            <div class="order-meta">
                ${metaLine}
                ${o.asignadoChoferNombre ? ' · 👤 Asignado a ' + esc(o.asignadoChoferNombre) : ''}
            </div>
            ${esParcial ? `<div class="checklist-note" style="color:#e67e22;">⚠ Pedido PARCIAL — no todos los ítems están listos. Abre "Ver hoja" para ver cuáles sí, marcados en verde.</div>` : ''}
            ${resuelto ? '' : `<div class="checklist-note">⚠ Completa el checklist de cada ítem en "Ver hoja" antes de marcar entregado.</div>`}
            ${enRuta ? `<div class="enruta-badge">🚚 En ruta${o.viajeVehiculo ? ' · ' + esc(o.viajeVehiculo) + (o.viajeRuta ? ' · ' + esc(o.viajeRuta) : '') + (o.viajeCosto ? ' · costo de esta obra ' + fmtRD(o.viajeCosto) + (o.viajeObras > 1 ? ' (viaje repartido entre ' + o.viajeObras + ' obras)' : '') : '') : ''}</div>` : ''}
            <div class="actions">
                ${enRuta ? '' : `<button class="btn-enruta" onclick="marcarEnRuta('${id}')">🚚 En ruta</button>`}
                <button class="btn-listo" ${resuelto ? '' : 'disabled style="opacity:0.5;cursor:default;"'} onclick="${resuelto ? `abrirRecepcion('${id}')` : ''}">Entregado</button>
                ${esCompra ? '' : `<button class="btn-deshacer" onclick="regresarAFabrica('${id}')" title="Aún no está listo, regresar a fábrica">↩ No está listo</button>`}
            </div>
            <div class="recepcion-form" id="recepcion-${id}">
                <label>Nombre de quien recibe (instalador)</label>
                <input type="text" id="recepcion-nombre-${id}" placeholder="Nombre completo">
                <label>Firma de quien recibe</label>
                <canvas class="signature-canvas" id="firma-${id}" width="320" height="130"></canvas>
                <div class="signature-row">
                    <button type="button" onclick="limpiarFirma('${id}')">Borrar firma</button>
                </div>
                <button class="btn-listo" style="margin-top:10px;" onclick="confirmarEntrega('${id}')">Confirmar entrega</button>
            </div>
        </div>`;
    }

    let signaturePads = {};
    let currentTab = 'espera';
    let allDocs = [];

    window.setTab = function (tab) {
        currentTab = tab;
        document.getElementById('tab-espera').classList.toggle('active', tab === 'espera');
        document.getElementById('tab-ruta').classList.toggle('active', tab === 'ruta');
        document.getElementById('tab-entregado').classList.toggle('active', tab === 'entregado');
        document.getElementById('entregado-filtros').style.display = tab === 'entregado' ? '' : 'none';
        render(allDocs);
    };

    // Aviso: si un pedido lleva 4+ horas "en ruta" sin marcarse entregado, se lo recordamos arriba
    // (por si al chofer se le olvidó). Se recalcula en cada snapshot y cada minuto (para que aparezca
    // solo al cumplirse las 4 h aunque la app quede abierta).
    const HORAS_AVISO = 4;
    function horasEnRuta(o) {
        const f = (o.fechaEnRuta && o.fechaEnRuta.toDate) ? o.fechaEnRuta.toDate() : null;
        return f ? (Date.now() - f.getTime()) / 3600000 : null;
    }
    function renderAvisoRuta() {
        const box = document.getElementById('aviso-ruta');
        if (!box) return;
        const pend = allDocs.map(d => ({ id: d.id, o: d.data() }))
            .filter(x => !x.o.entregado && x.o.enRuta === true && horasEnRuta(x.o) != null && horasEnRuta(x.o) >= HORAS_AVISO);
        if (!pend.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
        box.style.display = 'block';
        box.innerHTML = `<div class="aviso-ruta">
            <div class="t">⚠️ Tienes ${pend.length} pedido(s) en ruta sin marcar como <b>entregado</b></div>
            <div class="lst">${pend.map(p => `• ${esc(p.o.cliente || 'Sin cliente')}${p.o.obra ? ' — ' + esc(p.o.obra) : ''} <span style="color:#a06a12">(en ruta hace ${Math.floor(horasEnRuta(p.o))} h)</span>`).join('<br>')}</div>
            <button onclick="setTab('ruta')">Ver pedidos en ruta</button>
        </div>`;
    }

    // Pestaña Entregado: últimas entregas primero, filtradas por período (semana/mes/año/todo) y
    // agrupadas por día — pedido del usuario 2026-09-17 (antes salían sin orden ni filtro).
    let periodo = 'semana';
    window.setPeriodo = function (p) {
        periodo = p;
        document.querySelectorAll('.per-btn').forEach(b => b.classList.toggle('active', b.dataset.per === p));
        render(allDocs);
    };
    const fechaEntregaMs = (o) => (o.fechaEntregado && o.fechaEntregado.toDate) ? o.fechaEntregado.toDate().getTime() : 0;
    function inicioPeriodo(p) {
        const d = new Date(); d.setHours(0, 0, 0, 0);
        if (p === 'semana') { const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); }   // lunes
        else if (p === 'mes') d.setDate(1);
        else if (p === 'anio') { d.setMonth(0, 1); }
        else return 0;
        return d.getTime();
    }
    const diaLabel = (ms) => {
        if (!ms) return 'Sin fecha de entrega';
        const d = new Date(ms), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const dd = new Date(d); dd.setHours(0, 0, 0, 0);
        const diff = Math.round((hoy - dd) / 86400000);
        const txt = d.toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() !== hoy.getFullYear() ? 'numeric' : undefined });
        return diff === 0 ? 'Hoy · ' + txt : diff === 1 ? 'Ayer · ' + txt : txt;
    };

    function render(docs) {
        allDocs = docs;
        renderAvisoRuta();
        const list = document.getElementById('orders-list');
        // Los pedidos "directo a instalación" no pasan por transporte (se instalan en obra): se
        // excluyen de Transportes para no confundir al chofer.
        docs = docs.filter(d => d.data().directoInstalacion !== true);
        // La asignación (ver historial.html) es solo informativa: cualquier chofer ve todos los
        // pedidos, así uno puede cubrir al otro si falta.
        let filtrados;
        if (currentTab === 'entregado') {
            filtrados = docs.filter(d => d.data().entregado === true);
        } else if (currentTab === 'ruta') {
            filtrados = docs.filter(d => !d.data().entregado && d.data().enRuta === true);
        } else {
            filtrados = docs.filter(d => !d.data().entregado && d.data().enRuta !== true);
        }
        signaturePads = {};
        if (currentTab === 'entregado') {
            const desde = inicioPeriodo(periodo);
            const total = filtrados.length;
            filtrados = filtrados.filter(d => fechaEntregaMs(d.data()) >= desde).sort((a, b) => fechaEntregaMs(b.data()) - fechaEntregaMs(a.data()));
            const nom = { semana: 'esta semana', mes: 'este mes', anio: 'este año', todo: 'en total' }[periodo];
            document.getElementById('entregado-resumen').textContent = filtrados.length + ' entrega(s) ' + nom + (periodo !== 'todo' ? ' · ' + total + ' en total' : '') + ' · las más recientes primero';
            if (!filtrados.length) { list.innerHTML = '<p class="empty">No hay entregas ' + nom + '.</p>'; return; }
            // Agrupadas por día de entrega.
            let html = '', ultimo = null;
            filtrados.forEach(d => {
                const lab = diaLabel(fechaEntregaMs(d.data()));
                if (lab !== ultimo) { html += `<div class="dia-sep">${lab}</div>`; ultimo = lab; }
                html += orderCardHTML(d.id, d.data());
            });
            list.innerHTML = html;
            return;
        }
        if (!filtrados.length) {
            list.innerHTML = currentTab === 'entregado' ? '<p class="empty">No hay pedidos entregados todavía.</p>'
                : currentTab === 'ruta' ? '<p class="empty">No hay pedidos en ruta ahora mismo.</p>'
                : '<p class="empty">No hay pedidos en espera.</p>';
            return;
        }
        list.innerHTML = filtrados.map(d => orderCardHTML(d.id, d.data())).join('');
        if (currentTab !== 'entregado') {
            filtrados.forEach(d => {
                const canvas = document.getElementById('firma-' + d.id);
                if (canvas) signaturePads[d.id] = setupSignaturePad(canvas);
            });
        }
    }

    // Incluye 'completado' para que los pedidos ya entregados (y, si corresponde, instalados)
    // sigan visibles en la pestaña "Entregado" en vez de desaparecer de esta pantalla.
    const q = query(collection(db, 'orders'), where('status', 'in', ['listo_para_cargar', 'parcialmente_listo', 'parcialmente_instalado', 'completado']));
    onSnapshot(q, (snap) => render(snap.docs), (err) => {
        document.getElementById('orders-list').innerHTML = '<p class="empty">Error cargando pedidos: ' + err.message + '</p>';
    });
    setInterval(renderAvisoRuta, 60 * 1000);   // reevalúa el aviso de "en ruta 4h+" aunque no lleguen cambios

    // El chofer marca "En ruta" apenas recoge el pedido — puramente informativo (no bloquea ni
    // exige nada para llegar a "Entregado"), solo para que se sepa que ya salió a la calle.
    // ---- Viaje: vehículo + recorrido; el costo se reparte entre las obras que van en el camión ----
    // (mismos catálogos y fórmula que el calculador de obra: ops/calculador-obra.html / index.html —
    // si cambian tarifas allá, cambiarlas aquí también). El precio del galón llega en vivo del MICM
    // (config/preciosCombustible); si no hay dato, se usa el de respaldo del vehículo.
    const CALC_VEHICULOS = [
        { id: 'F-01', nombre: 'Camión Kia K2700', precioKey: 'Gasoil Óptimo', rendKmGal: 36, precioGal: 293.10, mantCadaKm: 5000, mantCosto: 10000, seguroAnual: 69500, depreAnual: 197997 },
        { id: 'F-02', nombre: 'Minivan KYC V3', precioKey: 'Gasolina Premium', rendKmGal: 40, precioGal: 341.10, mantCadaKm: 0, mantCosto: 0, seguroAnual: 69500, depreAnual: 186225 },
        { id: 'F-03', nombre: 'Camioneta Hilux', precioKey: 'Gasoil Óptimo', rendKmGal: 45, precioGal: 293.10, mantCadaKm: 0, mantCosto: 0, seguroAnual: 100000, depreAnual: 0 },
    ];
    const CALC_RUTAS = [
        { id: 'local-terrenas', nombre: 'Local — Las Terrenas y alrededores', km: 8, peaje: 0 },
        { id: 'terrenas-samana', nombre: 'Las Terrenas ↔ Samaná / Las Galeras', km: 45, peaje: 0 },
        { id: 'sd-terrenas', nombre: 'Santo Domingo ↔ Las Terrenas', km: 163, peaje: 1700 },
        { id: 'sd-romana', nombre: 'Santo Domingo ↔ La Romana', km: 123, peaje: 400 },
        { id: 'sd-puntacana', nombre: 'Santo Domingo ↔ Punta Cana', km: 200, peaje: 600 },
        { id: 'sd-santiago', nombre: 'Santo Domingo ↔ Santiago', km: 155, peaje: 400 },
        { id: 'terrenas-romana', nombre: 'Las Terrenas ↔ La Romana', km: 214, peaje: 2100 },
        { id: 'terrenas-puntacana', nombre: 'Las Terrenas ↔ Punta Cana', km: 287, peaje: 2300 },
        { id: 'terrenas-santiago', nombre: 'Las Terrenas ↔ Santiago', km: 176, peaje: 800 },
    ];
    let PRECIOS = null;
    onSnapshot(doc(db, 'config', 'preciosCombustible'), (s) => { PRECIOS = s.exists() ? (s.data().precios || null) : null; }, () => {});
    const fmtRD = (n) => 'RD$ ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const normTxt = (x) => String(x || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
    const obraKeyDe = (c, o) => normTxt(c) + '|' + normTxt(o);
    let viajePedidoId = null;

    window.marcarEnRuta = function (id) {
        viajePedidoId = id;
        const d = allDocs.find(x => x.id === id); const o = d ? d.data() : {};
        document.getElementById('vj-sub').textContent = (o.cliente || 'Sin cliente') + ' — ' + (o.obra || '');
        const vsel = document.getElementById('vj-veh'), rsel = document.getElementById('vj-ruta');
        let ultimo = {}; try { ultimo = JSON.parse(localStorage.getItem('artal_viaje_ultimo') || '{}'); } catch (_) { }
        vsel.innerHTML = CALC_VEHICULOS.map(v => `<option value="${v.id}">${v.id} · ${esc(v.nombre)}</option>`).join('');
        vsel.value = ultimo.vehiculoId && CALC_VEHICULOS.some(v => v.id === ultimo.vehiculoId) ? ultimo.vehiculoId : 'F-01';
        rsel.innerHTML = CALC_RUTAS.map(r => `<option value="${r.id}">${esc(r.nombre)} — ${r.km} km ida</option>`).join('') + '<option value="__manual__">Otro recorrido (escribo los km)</option>';
        rsel.value = ultimo.rutaId && CALC_RUTAS.some(r => r.id === ultimo.rutaId) ? ultimo.rutaId : 'local-terrenas';
        viajeRuta();
        // Otros pedidos en espera (no en ruta, no entregados) que pueden ir en el mismo camión.
        const otros = allDocs.filter(x => x.id !== id && !x.data().entregado && x.data().enRuta !== true && x.data().directoInstalacion !== true);
        document.getElementById('vj-otros').innerHTML = otros.length ? otros.map(x => `<label class="vj-chk"><input type="checkbox" data-oid="${x.id}" onchange="viajeRecalc()"> ${esc(x.data().cliente || 'Sin cliente')} — ${esc(x.data().obra || '')}</label>`).join('')
            : '<p class="vj-info">No hay otros pedidos en espera. Este viaje va solo con esta obra.</p>';
        document.getElementById('vj-ok').disabled = false;
        document.getElementById('viaje-modal').classList.add('show');
        viajeRecalc();
    };
    window.viajeCerrar = function () { document.getElementById('viaje-modal').classList.remove('show'); viajePedidoId = null; };
    window.viajeRuta = function () {
        const r = CALC_RUTAS.find(x => x.id === document.getElementById('vj-ruta').value);
        document.getElementById('vj-km').value = r ? r.km : '';
        viajeRecalc();
    };
    function viajeLeer() {
        const veh = CALC_VEHICULOS.find(v => v.id === document.getElementById('vj-veh').value) || CALC_VEHICULOS[0];
        const rutaId = document.getElementById('vj-ruta').value; const ruta = CALC_RUTAS.find(x => x.id === rutaId) || null;
        const kmIda = Math.max(0, Number(document.getElementById('vj-km').value) || 0);
        const idaVuelta = document.getElementById('vj-iv').checked;
        const kmTot = kmIda * (idaVuelta ? 2 : 1);
        const precioLive = PRECIOS && typeof PRECIOS[veh.precioKey] === 'number' && PRECIOS[veh.precioKey] > 0 ? PRECIOS[veh.precioKey] : 0;
        const precioGal = precioLive || veh.precioGal;
        const combustible = veh.rendKmGal > 0 ? (kmTot / veh.rendKmGal) * precioGal : 0;
        const mantenimiento = veh.mantCadaKm > 0 ? kmTot * (veh.mantCosto / veh.mantCadaKm) : 0;
        const peajes = ruta ? (idaVuelta ? ruta.peaje : ruta.peaje / 2) : 0;
        const fijoVehiculo = ((veh.seguroAnual || 0) + (veh.depreAnual || 0)) / 365;
        const costoTotal = combustible + mantenimiento + peajes + fijoVehiculo;
        const ids = [viajePedidoId].concat(Array.from(document.querySelectorAll('#vj-otros input:checked')).map(i => i.dataset.oid));
        const pedidos = ids.map(id => { const d = allDocs.find(x => x.id === id); const o = d ? d.data() : {}; return { id, cliente: o.cliente || '', obra: o.obra || '', obraKey: obraKeyDe(o.cliente, o.obra) }; });
        const obrasMap = new Map(); pedidos.forEach(p => { if (!obrasMap.has(p.obraKey)) obrasMap.set(p.obraKey, { obraKey: p.obraKey, cliente: p.cliente, obra: p.obra, pedidos: [] }); obrasMap.get(p.obraKey).pedidos.push(p.id); });
        const obras = Array.from(obrasMap.values()); const porObra = obras.length ? costoTotal / obras.length : costoTotal;
        obras.forEach(o => o.costo = Math.round(porObra * 100) / 100);
        return { veh, ruta, rutaId, kmIda, idaVuelta, kmTot, precioGal, precioFuente: precioLive ? 'MICM (en vivo)' : 'respaldo', combustible, mantenimiento, peajes, fijoVehiculo, costoTotal, pedidos, obras };
    }
    window.viajeRecalc = function () {
        if (!viajePedidoId) return;
        const v = viajeLeer();
        document.getElementById('vj-costo').innerHTML = `Costo del viaje: <b>${fmtRD(v.costoTotal)}</b> — ${Math.round(v.kmTot)} km · combustible ${fmtRD(v.combustible)}${v.mantenimiento ? ' · desgaste ' + fmtRD(v.mantenimiento) : ''}${v.peajes ? ' · peajes ' + fmtRD(v.peajes) : ''} · fijos del día ${fmtRD(v.fijoVehiculo)}<br>` +
            (v.obras.length > 1 ? `Repartido entre <b>${v.obras.length} obras</b>: <b>${fmtRD(v.obras[0].costo)}</b> a cada una.` : `Va <b>una sola obra</b>: se le carga el viaje completo.`);
    };
    window.viajeConfirmar = async function () {
        if (!viajePedidoId) return;
        const v = viajeLeer();
        if (!(v.kmIda > 0)) { alert('Escribe los km de ida del recorrido.'); return; }
        const btn = document.getElementById('vj-ok'); btn.disabled = true;
        const hoy = new Date(), pad = (n) => String(n).padStart(2, '0'), fecha = hoy.getFullYear() + '-' + pad(hoy.getMonth() + 1) + '-' + pad(hoy.getDate());
        try {
            const ref = await addDoc(collection(db, 'viajes'), {
                fecha, salida: serverTimestamp(), choferEmail: usuario.email, choferNombre: usuario.nombre,
                vehiculoId: v.veh.id, vehiculoNombre: v.veh.id + ' · ' + v.veh.nombre, rutaId: v.rutaId, rutaNombre: v.ruta ? v.ruta.nombre : 'Otro recorrido',
                kmIda: v.kmIda, idaVuelta: v.idaVuelta, kmTot: v.kmTot, precioGal: v.precioGal, precioFuente: v.precioFuente,
                combustible: Math.round(v.combustible * 100) / 100, mantenimiento: Math.round(v.mantenimiento * 100) / 100, peajes: v.peajes, fijoVehiculo: Math.round(v.fijoVehiculo * 100) / 100,
                costoTotal: Math.round(v.costoTotal * 100) / 100, pedidos: v.pedidos, obras: v.obras, obrasKeys: v.obras.map(o => o.obraKey), pedidosIds: v.pedidos.map(p => p.id)
            });
            for (const p of v.pedidos) {
                const ob = v.obras.find(o => o.obraKey === p.obraKey) || {};
                await updateDoc(doc(db, 'orders', p.id), { enRuta: true, fechaEnRuta: serverTimestamp(), viajeId: ref.id, viajeVehiculo: v.veh.id, viajeRuta: v.ruta ? v.ruta.nombre : 'Otro recorrido', viajeCosto: ob.costo || 0, viajeObras: v.obras.length });
            }
            try { localStorage.setItem('artal_viaje_ultimo', JSON.stringify({ vehiculoId: v.veh.id, rutaId: v.rutaId })); } catch (_) { }
            viajeCerrar();
        } catch (e) { alert('No se pudo registrar la salida: ' + (e && e.message ? e.message : e)); btn.disabled = false; }
    };

    window.abrirRecepcion = function (id) {
        const form = document.getElementById('recepcion-' + id);
        if (form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
    };

    window.limpiarFirma = function (id) {
        if (signaturePads[id]) signaturePads[id].clear();
    };

    window.confirmarEntrega = async function (id) {
        const nombre = document.getElementById('recepcion-nombre-' + id).value.trim();
        const pad = signaturePads[id];
        if (!nombre) { alert('Escribe el nombre de quien recibe el material.'); return; }
        if (!pad || pad.isEmpty()) { alert('Falta la firma de quien recibe.'); return; }

        const snap = await getDoc(doc(db, 'orders', id));
        const d = snap.exists() ? snap.data() : {};
        // Un pedido pasa a "Completado" con solo la entrega si nunca hay instalador de por medio
        // (Compra Directa, ej. al almacén propio) o si un admin ya lo marcó "sin instalación"
        // desde ops/instalaciones.html — si no, hace falta ADEMÁS que el instalador confirme.
        // Antes esto exigía siempre las dos cosas, así que una Compra Directa entregada se
        // quedaba mostrando "Listo para cargar/instalar" para siempre (bug real reportado).
        const noNecesitaInstalador = d.docType === 'COMPRA_DIRECTA' || d.sinInstalacion === true;
        const yaInstalado = d.instalado === true || noNecesitaInstalador;
        await updateDoc(doc(db, 'orders', id), {
            entregado: true,
            fechaEntregado: serverTimestamp(),
            recepcionInstalador: { nombre, firma: pad.toDataUrl(), fecha: serverTimestamp() },
            ...(yaInstalado ? { status: 'completado' } : {})
        });
    };
    window.regresarAFabrica = async function (id) {
        if (!confirm('¿Regresar este pedido a fábrica? Saldrá de tu lista de entregas.')) return;
        // Se borra también la marca "en ruta": si no, cuando fábrica lo vuelva a dejar listo
        // reaparece aquí como "en ruta hace N horas" con la fecha vieja (bug real, Woof Woof 2026-09-21).
        await updateDoc(doc(db, 'orders', id), { status: 'en_fabrica', enRuta: false, fechaEnRuta: null });
    };
</script>
