<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Transportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    .order-card { border-left-color: #2ecc71; }
    .checklist-note { font-size: 12.5px; color: #e67e22; margin-top: 8px; font-weight: bold; }
    .recepcion-form { margin-top: 12px; padding: 12px; background: var(--artal-light); border-radius: 8px; display: none; }
    .recepcion-form label { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); display: block; margin-bottom: 4px; }
    .recepcion-form input[type="text"] { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; min-height: 42px; }
    .signature-canvas { width: 100%; max-width: 320px; height: 130px; border: 1.5px solid #ddd; border-radius: 7px; background: #fff; touch-action: none; display: block; }
    .signature-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .signature-row button { background: transparent; border: 1.5px solid #ccc; color: #666; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: 'Arimo'; }
    .btn-enruta { background: #3498db; color: #fff; }
    .enruta-badge { font-size: 12.5px; color: #3498db; font-weight: bold; margin-top: 8px; }
    /* Aviso: pedidos en ruta hace rato sin marcar entregado */
    .aviso-ruta { background: #fff4e5; border: 1.5px solid #f0b429; border-left: 5px solid #e67e22; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; color: #8a5b0e; }
    .aviso-ruta .t { font-weight: bold; font-size: 14.5px; margin-bottom: 6px; }
    .aviso-ruta .t b { color: #c0392b; }
    .aviso-ruta .lst { font-size: 12.5px; line-height: 1.6; }
    .aviso-ruta button { margin-top: 9px; background: #e67e22; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 40px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver al panel">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Transportes</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos de citas en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="aviso-ruta" style="display:none;"></div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-espera" onclick="setTab('espera')">En espera</button>
        <button class="tab-btn" id="tab-ruta" onclick="setTab('ruta')">En ruta</button>
        <button class="tab-btn" id="tab-entregado" onclick="setTab('entregado')">Entregado</button>
    </div>
    <div id="orders-list"><p class="empty">Cargando…</p></div>
</main>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { enableNotifications } from './notifications.js';
    import { db } from './firebase-config.js';
    import './mensajeria-widget.js';   // botón flotante ✉️ de Mensajería ARTAL
    import { collection, query, where, onSnapshot, doc, updateDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { openOrderPreview } from './order-preview.js';
    import { setupSignaturePad } from './signature.js';
    window.openOrderPreview = openOrderPreview;

    const usuario = await requireAuth(['chofer']);
    wireBackButton(usuario.roles);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function checklistResuelto(o) {
        const items = o.items || [];
        if (!items.length) return true;
        const status = o.itemStatus || {};
        return items.every(it => status[it.id] && status[it.id].estado);
    }

    function orderCardHTML(id, o) {
        const resuelto = checklistResuelto(o);
        const esCompra = o.docType === 'COMPRA_DIRECTA';
        const esParcial = o.status === 'parcialmente_listo';
        const enRuta = o.enRuta === true;
        const entregado = o.entregado === true;
        const metaLine = esCompra
            ? `Compra directa · Proveedor: ${esc(o.proveedor)} · ${esc(o.totalItems) || 0} artículo(s) · <a href="${esc(o.compraPdfUrl)}" target="_blank">Ver orden de compra</a>`
            : `${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems · <a href="#" onclick="openOrderPreview('${id}', 'chofer'); return false;">Ver hoja de fabricación</a>`;
        const borderColor = entregado ? '#999' : (esParcial ? '#e67e22' : (enRuta ? '#3498db' : ''));

        // Pestaña "Entregado": solo lectura, sin formulario de recepción ni acciones de estado.
        if (entregado) {
            const rec = o.recepcionInstalador || {};
            const fecha = o.fechaEntregado && o.fechaEntregado.toDate ? o.fechaEntregado.toDate().toLocaleString('es-DO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
            return `
            <div class="order-card" style="border-left-color:${borderColor};">
                <div class="order-head">
                    <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
                </div>
                <div class="order-meta">
                    ${metaLine}
                    ${o.asignadoChoferNombre ? ' · 👤 Asignado a ' + esc(o.asignadoChoferNombre) : ''}
                </div>
                <div class="enruta-badge" style="color:#2ecc71;">✓ Entregado${fecha ? ' — ' + esc(fecha) : ''}${rec.nombre ? ' · recibió ' + esc(rec.nombre) : ''}</div>
            </div>`;
        }

        return `
        <div class="order-card" ${borderColor ? `style="border-left-color:${borderColor};"` : ''}>
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
            </div>
            <div class="order-meta">
                ${metaLine}
                ${o.asignadoChoferNombre ? ' · 👤 Asignado a ' + esc(o.asignadoChoferNombre) : ''}
            </div>
            ${esParcial ? `<div class="checklist-note" style="color:#e67e22;">⚠ Pedido PARCIAL — no todos los ítems están listos. Abre "Ver hoja" para ver cuáles sí, marcados en verde.</div>` : ''}
            ${resuelto ? '' : `<div class="checklist-note">⚠ Completa el checklist de cada ítem en "Ver hoja" antes de marcar entregado.</div>`}
            ${enRuta ? '<div class="enruta-badge">🚚 En ruta</div>' : ''}
            <div class="actions">
                ${enRuta ? '' : `<button class="btn-enruta" onclick="marcarEnRuta('${id}')">🚚 En ruta</button>`}
                <button class="btn-listo" ${resuelto ? '' : 'disabled style="opacity:0.5;cursor:default;"'} onclick="${resuelto ? `abrirRecepcion('${id}')` : ''}">Entregado</button>
                ${esCompra ? '' : `<button class="btn-deshacer" onclick="regresarAFabrica('${id}')" title="Aún no está listo, regresar a fábrica">↩ No está listo</button>`}
            </div>
            <div class="recepcion-form" id="recepcion-${id}">
                <label>Nombre de quien recibe (instalador)</label>
                <input type="text" id="recepcion-nombre-${id}" placeholder="Nombre completo">
                <label>Firma de quien recibe</label>
                <canvas class="signature-canvas" id="firma-${id}" width="320" height="130"></canvas>
                <div class="signature-row">
                    <button type="button" onclick="limpiarFirma('${id}')">Borrar firma</button>
                </div>
                <button class="btn-listo" style="margin-top:10px;" onclick="confirmarEntrega('${id}')">Confirmar entrega</button>
            </div>
        </div>`;
    }

    let signaturePads = {};
    let currentTab = 'espera';
    let allDocs = [];

    window.setTab = function (tab) {
        currentTab = tab;
        document.getElementById('tab-espera').classList.toggle('active', tab === 'espera');
        document.getElementById('tab-ruta').classList.toggle('active', tab === 'ruta');
        document.getElementById('tab-entregado').classList.toggle('active', tab === 'entregado');
        render(allDocs);
    };

    // Aviso: si un pedido lleva 4+ horas "en ruta" sin marcarse entregado, se lo recordamos arriba
    // (por si al chofer se le olvidó). Se recalcula en cada snapshot y cada minuto (para que aparezca
    // solo al cumplirse las 4 h aunque la app quede abierta).
    const HORAS_AVISO = 4;
    function horasEnRuta(o) {
        const f = (o.fechaEnRuta && o.fechaEnRuta.toDate) ? o.fechaEnRuta.toDate() : null;
        return f ? (Date.now() - f.getTime()) / 3600000 : null;
    }
    function renderAvisoRuta() {
        const box = document.getElementById('aviso-ruta');
        if (!box) return;
        const pend = allDocs.map(d => ({ id: d.id, o: d.data() }))
            .filter(x => !x.o.entregado && x.o.enRuta === true && horasEnRuta(x.o) != null && horasEnRuta(x.o) >= HORAS_AVISO);
        if (!pend.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
        box.style.display = 'block';
        box.innerHTML = `<div class="aviso-ruta">
            <div class="t">⚠️ Tienes ${pend.length} pedido(s) en ruta sin marcar como <b>entregado</b></div>
            <div class="lst">${pend.map(p => `• ${esc(p.o.cliente || 'Sin cliente')}${p.o.obra ? ' — ' + esc(p.o.obra) : ''} <span style="color:#a06a12">(en ruta hace ${Math.floor(horasEnRuta(p.o))} h)</span>`).join('<br>')}</div>
            <button onclick="setTab('ruta')">Ver pedidos en ruta</button>
        </div>`;
    }

    function render(docs) {
        allDocs = docs;
        renderAvisoRuta();
        const list = document.getElementById('orders-list');
        // La asignación (ver historial.html) es solo informativa: cualquier chofer ve todos los
        // pedidos, así uno puede cubrir al otro si falta.
        let filtrados;
        if (currentTab === 'entregado') {
            filtrados = docs.filter(d => d.data().entregado === true);
        } else if (currentTab === 'ruta') {
            filtrados = docs.filter(d => !d.data().entregado && d.data().enRuta === true);
        } else {
            filtrados = docs.filter(d => !d.data().entregado && d.data().enRuta !== true);
        }
        signaturePads = {};
        if (!filtrados.length) {
            list.innerHTML = currentTab === 'entregado' ? '<p class="empty">No hay pedidos entregados todavía.</p>'
                : currentTab === 'ruta' ? '<p class="empty">No hay pedidos en ruta ahora mismo.</p>'
                : '<p class="empty">No hay pedidos en espera.</p>';
            return;
        }
        list.innerHTML = filtrados.map(d => orderCardHTML(d.id, d.data())).join('');
        if (currentTab !== 'entregado') {
            filtrados.forEach(d => {
                const canvas = document.getElementById('firma-' + d.id);
                if (canvas) signaturePads[d.id] = setupSignaturePad(canvas);
            });
        }
    }

    // Incluye 'completado' para que los pedidos ya entregados (y, si corresponde, instalados)
    // sigan visibles en la pestaña "Entregado" en vez de desaparecer de esta pantalla.
    const q = query(collection(db, 'orders'), where('status', 'in', ['listo_para_cargar', 'parcialmente_listo', 'parcialmente_instalado', 'completado']));
    onSnapshot(q, (snap) => render(snap.docs), (err) => {
        document.getElementById('orders-list').innerHTML = '<p class="empty">Error cargando pedidos: ' + err.message + '</p>';
    });
    setInterval(renderAvisoRuta, 60 * 1000);   // reevalúa el aviso de "en ruta 4h+" aunque no lleguen cambios

    // El chofer marca "En ruta" apenas recoge el pedido — puramente informativo (no bloquea ni
    // exige nada para llegar a "Entregado"), solo para que se sepa que ya salió a la calle.
    window.marcarEnRuta = async function (id) {
        if (!confirm('¿Marcar este pedido como "En ruta"?')) return;
        await updateDoc(doc(db, 'orders', id), { enRuta: true, fechaEnRuta: serverTimestamp() });
    };

    window.abrirRecepcion = function (id) {
        const form = document.getElementById('recepcion-' + id);
        if (form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
    };

    window.limpiarFirma = function (id) {
        if (signaturePads[id]) signaturePads[id].clear();
    };

    window.confirmarEntrega = async function (id) {
        const nombre = document.getElementById('recepcion-nombre-' + id).value.trim();
        const pad = signaturePads[id];
        if (!nombre) { alert('Escribe el nombre de quien recibe el material.'); return; }
        if (!pad || pad.isEmpty()) { alert('Falta la firma de quien recibe.'); return; }

        const snap = await getDoc(doc(db, 'orders', id));
        const d = snap.exists() ? snap.data() : {};
        // Un pedido pasa a "Completado" con solo la entrega si nunca hay instalador de por medio
        // (Compra Directa, ej. al almacén propio) o si un admin ya lo marcó "sin instalación"
        // desde ops/instalaciones.html — si no, hace falta ADEMÁS que el instalador confirme.
        // Antes esto exigía siempre las dos cosas, así que una Compra Directa entregada se
        // quedaba mostrando "Listo para cargar/instalar" para siempre (bug real reportado).
        const noNecesitaInstalador = d.docType === 'COMPRA_DIRECTA' || d.sinInstalacion === true;
        const yaInstalado = d.instalado === true || noNecesitaInstalador;
        await updateDoc(doc(db, 'orders', id), {
            entregado: true,
            fechaEntregado: serverTimestamp(),
            recepcionInstalador: { nombre, firma: pad.toDataUrl(), fecha: serverTimestamp() },
            ...(yaInstalado ? { status: 'completado' } : {})
        });
    };
    window.regresarAFabrica = async function (id) {
        if (!confirm('¿Regresar este pedido a fábrica? Saldrá de tu lista de entregas.')) return;
        await updateDoc(doc(db, 'orders', id), { status: 'en_fabrica' });
    };
</script>

</body>
</html>
