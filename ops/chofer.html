<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="ARTAL DOMINICANA">

<title>ARTAL — Transportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20261113">
<style>
    .order-card { border-left-color: #2ecc71; }
    .checklist-note { font-size: 12.5px; color: #e67e22; margin-top: 8px; font-weight: bold; }
    .recepcion-form { margin-top: 12px; padding: 12px; background: var(--artal-light); border-radius: 8px; display: none; }
    .recepcion-form label { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); display: block; margin-bottom: 4px; }
    .recepcion-form input[type="text"] { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; min-height: 42px; }
    .signature-canvas { width: 100%; max-width: 320px; height: 130px; border: 1.5px solid #ddd; border-radius: 7px; background: #fff; touch-action: none; display: block; }
    .signature-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .signature-row button { background: transparent; border: 1.5px solid #ccc; color: #666; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: 'Arimo'; }
    .btn-enruta { background: linear-gradient(180deg, #ffd634, var(--amarillo)); color: var(--azul-noche); }   /* principal al cargar: amarillo ARTAL */
    .actions .btn-listo:disabled { background: #e6eaef; color: #8a93a0; box-shadow: none; }
    .enruta-badge { font-size: 12.5px; color: #3498db; font-weight: bold; margin-top: 8px; }
    /* Qué recoger por ítem (2026-11-24): verde = listo en fábrica para cargar · gris = sigue en fábrica · ✓ en obra = ya entregado */
    .qr-box { margin-top: 8px; background: #f6f8fa; border-radius: 10px; padding: 9px 11px; }
    .qr-t { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); margin-bottom: 4px; }
    .qr-item { font-size: 13.5px; color: #1b2733; padding: 4px 0; border-top: 1px solid #e6eaef; } .qr-item:first-of-type { border-top: 0; }
    .qr-item b { display: block; font-size: 13px; }
    .qr-chip { display: inline-block; border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: bold; margin: 3px 4px 0 0; }
    .qr-chip.listo { background: #e7f7ee; color: #145c39; } .qr-chip.fab { background: #eef1f4; color: #6b7682; } .qr-chip.obra { background: #e3f0fb; color: #174a7a; }
    .rc-chip { display: inline-flex; gap: 6px; align-items: center; border: 2px solid #cfd8e3; background: #fff; color: #35424f; border-radius: 10px; padding: 8px 10px; font-size: 13.5px; font-weight: bold; margin: 4px 6px 0 0; cursor: pointer; min-height: 40px; }
    .rc-chip input { width: 18px; height: 18px; margin: 0; }
    .rc-chip.on { border-color: #1e8449; background: #e7f7ee; color: #145c39; }
    .rc-chip.falta { border-color: #d9483b; background: #fdeaea; color: #8b1e14; }
    .rc-chip.fab { border-style: dashed; color: #8a93a0; cursor: default; }
    .rc-res { margin-top: 10px; background: #fff7e0; border-radius: 10px; padding: 9px 11px; font-size: 13px; color: #35424f; line-height: 1.45; }
    .parada { font-size: 14px; font-weight: bold; color: #a0521c; background: #fff4e5; border-radius: 10px; padding: 9px 12px; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .parada .pa-t { flex: 1; min-width: 160px; }
    .parada button { background: var(--artal-blue); color: #fff; border: 0; border-radius: 9px; padding: 9px 12px; font-weight: bold; font-family: 'Arimo'; font-size: 13px; cursor: pointer; min-height: 40px; }
    .compra-card { padding: 10px 12px; }
    .cc-que { font-size: 15px; font-weight: bold; color: #1b2733; white-space: pre-wrap; }
    .cc-para { font-size: 13px; color: #556; margin-top: 3px; }
    .cc-acts { display: flex; gap: 8px; margin-top: 8px; }
    .cc-acts button { flex: 1; border: 0; border-radius: 9px; padding: 9px 10px; font-weight: bold; font-family: 'Arimo'; font-size: 13.5px; cursor: pointer; min-height: 40px; }
    .cc-acts .cc-ruta { background: linear-gradient(180deg, #ffd634, var(--amarillo)); color: var(--azul-noche); }
    .cc-acts .cc-ok { background: #fff; color: #1e8449; border: 2px solid #1e8449; }
    .cc-acts .btn-deshacer { flex: 1; }
    .parada small { display: block; font-weight: normal; color: #7a5200; font-size: 12.5px; }
    details.mas.fab-int summary { font-size: 13.5px; }
    .fi-row { background: #fff; border-radius: 10px; padding: 9px 12px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }
    .fi-row button { background: transparent; border: 1.5px solid #cfd8e3; color: var(--artal-blue); border-radius: 8px; padding: 7px 10px; font-weight: bold; font-family: 'Arimo'; cursor: pointer; min-height: 36px; white-space: nowrap; }
    /* Aviso: pedidos en ruta hace rato sin marcar entregado */
    .aviso-ruta { background: #fff4e5; border: 1.5px solid #f0b429; border-left: 5px solid #e67e22; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; color: #8a5b0e; }
    .aviso-ruta .t { font-weight: bold; font-size: 14.5px; margin-bottom: 6px; }
    .aviso-ruta .t b { color: #c0392b; }
    .aviso-ruta .lst { font-size: 12.5px; line-height: 1.6; }
    .aviso-ruta button { margin-top: 9px; background: #e67e22; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 40px; }
    /* Modal "Salir en ruta": vehículo + recorrido + qué más va en el camión (costo del viaje por obra) */
    .vj-ov { position: fixed; inset: 0; background: rgba(10,61,98,.55); display: none; align-items: flex-end; justify-content: center; z-index: 9000; padding: 10px; }
    .vj-ov.show { display: flex; }
    .vj-box { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; padding: 18px 16px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    .vj-box h2 { margin: 0 0 4px; font-size: 18px; color: var(--artal-blue); }
    .vj-box .sub { font-size: 13px; color: #667; margin: 0 0 12px; }
    .vj-box label { display: block; font-size: 12.5px; font-weight: bold; color: var(--artal-blue); margin: 10px 0 4px; }
    .vj-box select, .vj-box input[type="number"] { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 15px; min-height: 46px; background: #fff; }
    .vj-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vj-chk { display: flex; align-items: center; gap: 10px; background: var(--artal-light); border-radius: 9px; padding: 10px 12px; margin-top: 6px; font-size: 14px; }
    .vj-chk input { width: 20px; height: 20px; }
    .vj-otros { max-height: 200px; overflow: auto; }
    .vj-costo { margin-top: 12px; background: #eef6ff; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #1e2a35; }
    .vj-costo b { color: var(--artal-blue); }
    .vj-acts { display: flex; gap: 10px; margin-top: 14px; }
    .vj-acts button { flex: 1; border: none; border-radius: 10px; padding: 13px; font-weight: bold; font-size: 15px; cursor: pointer; font-family: 'Arimo'; min-height: 48px; }
    .vj-acts .ok { background: #3498db; color: #fff; } .vj-acts .no { background: #eef1f4; color: #556; }
    .vj-info { font-size: 12px; color: #3498db; margin-top: 4px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver al panel">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Transportes</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos de citas en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="aviso-ruta" style="display:none;"></div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-espera" onclick="setTab('espera')">En espera</button>
        <button class="tab-btn" id="tab-ruta" onclick="setTab('ruta')">En ruta</button>
        <button class="tab-btn" id="tab-entregado" onclick="setTab('entregado')">Entregado</button>
    </div>
    <!-- Solo en "Entregado": filtro por período (últimas entregas primero) -->
    <div id="entregado-filtros" style="display:none;margin:0 0 12px;">
        <div class="per-tabs">
            <button class="per-btn active" data-per="semana" onclick="setPeriodo('semana')">Esta semana</button>
            <button class="per-btn" data-per="mes" onclick="setPeriodo('mes')">Este mes</button>
            <button class="per-btn" data-per="anio" onclick="setPeriodo('anio')">Este año</button>
            <button class="per-btn" data-per="todo" onclick="setPeriodo('todo')">Todo</button>
        </div>
        <p class="per-resumen" id="entregado-resumen"></p>
    </div>
    <div id="orders-list"><p class="empty">Cargando…</p></div>
    <p style="margin:16px 0 0;font-size:13px;text-align:center"><a href="academia.html" style="color:var(--artal-blue);font-weight:bold">🎓 Guía de Transportes (Academia)</a></p><!-- (auditoría 2026-11-12) al pie, no compite con las pestañas -->
</main>

<!-- Salir en ruta: el costo del viaje (combustible, desgaste, peajes y fijos del vehículo) se
     reparte entre las obras que van en el camión y alimenta el informe de costo de cada obra. -->
<div class="vj-ov" id="viaje-modal">
    <div class="vj-box">
        <h2>🚚 Salir en ruta</h2>
        <p class="sub" id="vj-sub"></p>
        <div class="vj-row">
            <div><label>Vehículo</label><select id="vj-veh"></select></div>
            <div><label>Recorrido</label><select id="vj-ruta" onchange="viajeRuta()"></select></div>
        </div>
        <div class="vj-row">
            <div><label>Km de ida</label><input type="number" id="vj-km" min="0" step="1" oninput="viajeRecalc()"></div>
            <div><label>&nbsp;</label><div class="vj-chk" style="margin-top:0"><input type="checkbox" id="vj-iv" checked onchange="viajeRecalc()"> Ida y vuelta</div></div>
        </div>
        <label>¿Qué más va en este mismo viaje?</label>
        <div class="vj-otros" id="vj-otros"></div>
        <div class="vj-costo" id="vj-costo"></div>
        <div class="vj-acts">
            <button class="no" onclick="viajeCerrar()">Cancelar</button>
            <button class="ok" id="vj-ok" onclick="viajeConfirmar()">Confirmar salida</button>
        </div>
    </div>
</div>
<style>
    .per-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .per-btn { border: 1.5px solid #d7dee6; background: #fff; color: var(--artal-blue); border-radius: 999px; padding: 8px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; min-height: 38px; }
    .per-btn.active { background: var(--artal-blue); color: #fff; border-color: var(--artal-blue); }
    .per-resumen { font-size: 12.5px; color: #667; margin: 8px 0 0; }
    .dia-sep { font-size: 12px; font-weight: bold; color: var(--artal-blue); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; padding-left: 4px; }
    /* Móvil (auditoría 2026-11-12): nada que se toque por debajo de 16 px (iOS hace zoom) ni botón por debajo de 40 px. */
    @media (max-width: 640px) {
        main input:not([type="checkbox"]):not([type="radio"]), main select, main textarea, .vj-box input, .vj-box select { font-size: 16px; }
        main button, .vj-box button { min-height: 40px; }
    }
</style>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { idProyectoDe, idsProyectoObra, pryChipHTML } from './proyecto-id.js';   // Nº de proyecto (2026-11-03)
    import { enableNotifications } from './notifications.js';
    import { db } from './firebase-config.js';
    import './mensajeria-widget.js';   // botón flotante ✉️ de Mensajería ARTAL
    import { collection, query, where, onSnapshot, doc, updateDoc, getDoc, getDocs, addDoc, serverTimestamp, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { restoPendiente, restoTxt, fotoPartes, pestanaDe } from './chofer-pendientes.js';
    import { itemsDe, listasFabrica, recibidas, partesDeItem, refItem, labelParte, faltaEnFabrica, restoPorRecoger, estadoEntrega, partesTxt } from './partes.js';   // una sola regla de partes (2026-11-24)
    import { borrarConRegistro } from './papelera.js';
    import { viaDe, envioTxt, VIAS, marcarEntregado } from './envios.js';
    import { etiquetaPedido, ESTADO_PEDIDO } from './estados.js';   // nombres únicos de los estados (auditoría 2026-11-12)
    import { openOrderPreview } from './order-preview.js';
    import { setupSignaturePad } from './signature.js';
    window.openOrderPreview = openOrderPreview;

    const usuario = await requireAuth(['chofer']);
    // Nº de proyecto PRY-AAAA-NNN junto al cliente (2026-11-03). Una compra directa sin número propio no muestra nada.
    const pryO = (o) => pryChipHTML(idProyectoDe(o), { ocultarSin: o.docType === 'COMPRA_DIRECTA' });
    wireBackButton(usuario.roles);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Qué recoger de un pedido de fábrica, ítem por ítem (listo en fábrica / sigue en fábrica / ya en obra).
    function queRecogerHTML(o) {
        const items = itemsDe(o); if (!items.length) return '';
        const filas = items.map(iid => {
            const listas = listasFabrica(o, iid), ya = recibidas(o, iid), set = partesDeItem(o, iid);
            const chips = set.map(p => ya.includes(p.k) ? `<span class="qr-chip obra">✓ ${esc(p.l)} · en obra</span>` : listas.includes(p.k) ? `<span class="qr-chip listo">${esc(p.l)}</span>` : `<span class="qr-chip fab">${esc(p.l)} · en fábrica</span>`).join('');
            return `<div class="qr-item"><b>${esc(refItem(o, iid))}</b>${chips}</div>`;
        }).join('');
        const resto = restoPorRecoger(o), fab = faltaEnFabrica(o);
        const linea = !resto.length ? (fab.length ? 'Nada listo para recoger todavía.' : 'Todo entregado.') : (fab.length ? `Recoge lo verde. Sigue en fábrica: ${esc(partesTxt(o, fab))}.` : 'Está todo listo: recoge el pedido completo.');
        return `<div class="qr-box"><div class="qr-t">📦 Qué recoger</div>${filas}<div style="font-size:12.5px;color:#556;margin-top:6px;">${linea}</div></div>`;
    }
    // Recepción por partes (2026-11-24): viene marcado lo que fábrica dijo que está listo; el chofer quita lo que NO le entregan.
    function recepcionPartesHTML(id, o) {
        const items = itemsDe(o); if (!items.length) return '';
        return items.map(iid => {
            const listas = listasFabrica(o, iid), ya = recibidas(o, iid), set = partesDeItem(o, iid);
            const chips = set.map(p => {
                if (ya.includes(p.k)) return `<span class="rc-chip on" style="cursor:default"><input type="checkbox" checked disabled>${esc(p.l)} · ya en obra</span>`;
                if (listas.includes(p.k)) return `<label class="rc-chip on" data-rc="${id}" data-iid="${iid}" data-k="${p.k}"><input type="checkbox" checked onchange="rcToggle(this)">${esc(p.l)}</label>`;
                return `<span class="rc-chip fab">${esc(p.l)} · aún en fábrica</span>`;
            }).join('');
            return `<div style="margin-top:6px"><div style="font-size:13px;font-weight:bold;color:#1b2733;">${esc(refItem(o, iid))}</div>${chips}</div>`;
        }).join('');
    }
    window.rcToggle = function (inp) {
        const l = inp.closest('label'); if (!l) return;
        l.classList.toggle('on', inp.checked); l.classList.toggle('falta', !inp.checked);
        rcResumen(l.dataset.rc);
    };
    function rcLeer(id) {
        const partes = {}, faltan = {};
        document.querySelectorAll(`label.rc-chip[data-rc="${id}"]`).forEach(l => { const iid = l.dataset.iid, k = l.dataset.k; const ok = l.querySelector('input').checked; (ok ? partes : faltan)[iid] = ((ok ? partes : faltan)[iid] || []).concat([k]); });
        return { partes, faltan };
    }
    function rcResumen(id) {
        const box = document.getElementById('rc-res-' + id); if (!box) return;
        const d = allDocs.find(x => x.id === id); const o = d ? d.data() : {};
        const { partes, faltan } = rcLeer(id);
        const ahora = Object.entries(partes).map(([iid, ps]) => ({ iid, ref: refItem(o, iid), partes: ps }));
        const dif = Object.entries(faltan).map(([iid, ps]) => ({ iid, ref: refItem(o, iid), partes: ps }));
        const sim = { ...o, entregado: true, recibidoPartes: Object.fromEntries(itemsDe(o).map(iid => [iid, [...new Set([...recibidas(o, iid), ...(partes[iid] || [])])]])) };
        const fab = faltaEnFabrica(sim);
        const completa = !fab.length && !dif.length;
        box.innerHTML = `<b>Así queda el pedido:</b> ${completa ? '<span style="color:#1e8449">entregado completo.</span>' : '<span style="color:#b9770e">entregado en parte.</span>'}`
            + (ahora.length ? `<br>Llevas: ${esc(partesTxt(o, ahora))}.` : '<br>No marcaste nada: el pedido queda como estaba.')
            + (dif.length ? `<br><span style="color:#b3413a"><b>Fábrica lo marcó listo pero no te lo dieron:</b> ${esc(partesTxt(o, dif))}. La oficina recibe el aviso ahora.</span>` : '')
            + (fab.length ? `<br>Sigue en fábrica: ${esc(partesTxt(o, fab))}. Cuando lo marquen, vuelve solo a tu lista.` : '');
    }
    // Quién recibe: el instalador asignado a la obra o el cliente. El chofer solo si también es instalador de esa obra o tiene rol instalador.
    function quienRecibeOpts(o) {
        const n = [];
        (Array.isArray(o.asignadosInstalador) ? o.asignadosInstalador : []).forEach(a => { if (a && a.nombre) n.push(String(a.nombre).replace(/\s*\(contratista\)\s*/i, '')); });
        if (o.asignadoInstaladorNombre) n.push(o.asignadoInstaladorNombre);
        if (o.cliente) n.push('Cliente: ' + o.cliente);
        return [...new Set(n)];
    }

    function orderCardHTML(id, o) {
        const esCompra = o.docType === 'COMPRA_DIRECTA';
        const esParcial = o.status === 'parcialmente_listo';
        const enRuta = o.enRuta === true;
        const entregado = o.entregado === true;
        // Compra directa (Dylan 2026-11-03): lo primero que se lee es DÓNDE comprar o retirar y QUÉ; «Ver orden de compra» solo si hay PDF.
        const compraTop = esCompra ? `<div style="background:#fff4e5;border:1.5px solid #f0a35a;border-radius:10px;padding:10px 12px;margin:6px 0 4px;">
                <div style="font-size:15px;font-weight:bold;color:#a0521c;">🛒 Comprar o retirar en: ${esc(o.proveedor || 'proveedor sin indicar')}</div>
                ${o.descripcion ? `<div style="font-size:14px;color:#333;margin-top:4px;white-space:pre-wrap;">${esc(o.descripcion)}</div>` : ''}
                <div style="font-size:12.5px;color:#666;margin-top:4px;">Para: ${esc(o.cliente || '')}${o.obra ? ' — ' + esc(o.obra) : ''}${pryO(o)} · ${esc(o.totalItems) || 0} artículo(s)${o.compraPdfUrl ? ` · <a href="${esc(o.compraPdfUrl)}" target="_blank">📄 Ver orden de compra</a>` : ' · sin orden de compra adjunta'}</div></div>` : '';
        const metaLine = esCompra
            ? `Compra directa`
            : `${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems · <a href="#" onclick="openOrderPreview('${id}', 'chofer'); return false;">Ver hoja de fabricación</a>`;
        const resto = restoPendiente(o);
        const restoBox = resto.length ? `<div style="background:#fff0d9;border:1.5px solid #e67e22;border-radius:10px;padding:10px 12px;margin:6px 0 4px;">
                <div style="font-size:15px;font-weight:bold;color:#a0521c;">📦 Resto listo en fábrica para recoger</div>
                <div style="font-size:12.5px;color:#666;margin-top:4px;">Ya entregaste una parte${o.fechaEntregado && o.fechaEntregado.toDate ? ' el ' + esc(o.fechaEntregado.toDate().toLocaleDateString('es-DO', { day: 'numeric', month: 'short' })) : ''}. Al entregar esto, marca «Entregado» otra vez.</div></div>` : '';
        const borderColor = entregado ? (o.entregaCompleta === false ? '#e67e22' : '#999') : (esParcial ? '#e67e22' : (enRuta ? '#3498db' : ''));
        const estEnt = entregado && !esCompra ? estadoEntrega(o) : null;

        // Pestaña "Entregado": solo lectura, sin formulario de recepción ni acciones de estado (salvo que haya resto por recoger).
        if (entregado && !resto.length) {
            const rec = o.recepcionInstalador || {};
            const fecha = o.fechaEntregado && o.fechaEntregado.toDate ? o.fechaEntregado.toDate().toLocaleString('es-DO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
            return `
            <div class="order-card" style="border-left-color:${borderColor};">
                <div class="order-head">
                    <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}${pryO(o)}</b>
                </div>
                <div class="order-meta">
                    ${metaLine}
                    ${o.asignadoChoferNombre ? ' · 👤 Asignado a ' + esc(o.asignadoChoferNombre) : ''}
                </div>
                <div class="enruta-badge" style="color:${estEnt && estEnt.clave === 'parcial' ? '#b9770e' : '#2ecc71'};">${estEnt && estEnt.clave === 'parcial' ? '⚠ ' + esc(estEnt.txt) : '✓ Entregado' + (estEnt ? ' completo' : '')}${fecha ? ' — ' + esc(fecha) : ''}${rec.nombre ? ' · recibió ' + esc(rec.nombre) : ''}</div>
                ${estEnt && estEnt.clave === 'parcial' ? '<div style="font-size:12.5px;color:#666;margin-top:4px;">Cuando fábrica marque lo que falta, el pedido vuelve solo a «En espera» como resto por recoger.</div>' : ''}
            </div>`;
        }

        const sugeridos = esCompra ? [] : quienRecibeOpts(o);
        if (esCompra && !entregado) return `
        <div class="order-card compra-card" ${borderColor ? `style="border-left-color:${borderColor};"` : ''}>
            <div class="cc-que">${esc(o.descripcion || 'Compra directa')}</div>
            <div class="cc-para">Para: <b>${esc(o.cliente || '')}${o.obra ? ' — ' + esc(o.obra) : ''}</b>${pryO(o)} · ${esc(o.totalItems) || 0} artículo(s)${o.compraPdfUrl ? ` · <a href="${esc(o.compraPdfUrl)}" target="_blank">📄 orden de compra</a>` : ''}${o.asignadoChoferNombre ? ' · 👤 ' + esc(o.asignadoChoferNombre) : ''}</div>
            ${viaDe(o) === 'guagua' ? `<div style="font-size:13px;color:#174a7a;font-weight:bold;margin-top:4px;">🚌 Llega por guagua SDQ–LT${o.envio && o.envio.nota ? ' · ' + esc(o.envio.nota) : ''}</div>` : ''}
            ${enRuta ? `<div class="enruta-badge">🚚 En ruta${o.viajeVehiculo ? ' · ' + esc(o.viajeVehiculo) : ''}</div>` : ''}
            <div class="cc-acts">
                ${enRuta ? `<button class="btn-deshacer" onclick="quitarDeRuta('${id}')">↩ No va en ruta</button>` : `<button class="cc-ruta" onclick="marcarEnRuta('${id}')">🚚 En ruta</button>`}
                <button class="cc-ok" onclick="abrirRecepcion('${id}')">Entregado</button>
            </div>
            <div class="recepcion-form" id="recepcion-${id}">
                <label>Nombre de quien recibe</label>
                <input type="text" id="recepcion-nombre-${id}" placeholder="Nombre completo">
                <label>Firma de quien recibe</label>
                <canvas class="signature-canvas" id="firma-${id}" width="320" height="130"></canvas>
                <div class="signature-row"><button type="button" onclick="limpiarFirma('${id}')">Borrar firma</button></div>
                <button class="btn-listo" style="margin-top:10px;" onclick="confirmarEntrega('${id}')">Confirmar entrega</button>
            </div>
        </div>`;
        return `
        <div class="order-card" ${borderColor ? `style="border-left-color:${borderColor};"` : ''}>
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}${pryO(o)}</b>
            </div>
            <div class="order-meta">
                ${metaLine}
                ${o.asignadoChoferNombre ? ' · 👤 Asignado a ' + esc(o.asignadoChoferNombre) : ''}
            </div>
            ${viaDe(o) === 'guagua' ? `<div style="background:#eaf6ff;border:1.5px solid #7fb8e6;border-radius:10px;padding:8px 12px;margin:6px 0 4px;font-size:14px;color:#174a7a;font-weight:bold;">🚌 Llega por guagua SDQ–LT${o.envio && o.envio.nota ? ' · ' + esc(o.envio.nota) : ''}<div style="font-weight:normal;font-size:13px;color:#456;margin-top:2px;">Lo recoge en la parada quien pueda y marca «Entregado».</div></div>` : ''}
            ${compraTop}${restoBox}
            ${!esCompra && !['pendiente_fabrica', 'en_fabrica'].includes(o.status) ? queRecogerHTML(o) : ''}
            ${['pendiente_fabrica', 'en_fabrica'].includes(o.status) ? `<div class="checklist-note" style="color:#1f6aa5;background:#eef4fb;">🏭 ${esc(etiquetaPedido(o))} (fábrica interna) — si ya está hecho, «En ruta» lo pasa a ${esc(ESTADO_PEDIDO.listo_para_cargar)}.</div>` : ''}
            ${(enRuta && (!entregado || o.restoEnRuta === true)) ? `<div class="enruta-badge">🚚 En ruta${o.viajeVehiculo ? ' · ' + esc(o.viajeVehiculo) + (o.viajeRuta ? ' · ' + esc(o.viajeRuta) : '') + (o.viajeCosto ? ' · costo de esta obra ' + fmtRD(o.viajeCosto) + (o.viajeObras > 1 ? ' (viaje repartido entre ' + o.viajeObras + ' obras)' : '') : '') : ''}</div>` : ''}
            <div class="actions">
                ${(entregado ? o.restoEnRuta === true : enRuta) ? `<button class="btn-deshacer" onclick="quitarDeRuta('${id}')" title="Se marcó En ruta por error: vuelve a En espera y sale del viaje">↩ No va en ruta</button>` : `<button class="btn-enruta" onclick="marcarEnRuta('${id}')">🚚 En ruta</button>`}
                <button class="btn-listo" onclick="abrirRecepcion('${id}')">Entregado</button>
                ${(esCompra || entregado) ? '' : `<button class="btn-deshacer" onclick="regresarAFabrica('${id}')" title="Aún no está listo, regresar a fábrica">↩ No está listo</button>`}
            </div>
            <div class="recepcion-form" id="recepcion-${id}">
                ${esCompra ? '' : `<label>¿Qué te entregaron? Quita la marca a lo que NO te dieron</label>${recepcionPartesHTML(id, o)}<div class="rc-res" id="rc-res-${id}"></div>`}
                <label style="margin-top:10px">Nombre de quien recibe en la obra${sugeridos.length ? ' (instalador asignado o cliente)' : ''}</label>
                <input type="text" id="recepcion-nombre-${id}" list="recibe-${id}" placeholder="Nombre completo">
                ${sugeridos.length ? `<datalist id="recibe-${id}">${sugeridos.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>` : ''}
                <label>Firma de quien recibe</label>
                <canvas class="signature-canvas" id="firma-${id}" width="320" height="130"></canvas>
                <div class="signature-row">
                    <button type="button" onclick="limpiarFirma('${id}')">Borrar firma</button>
                </div>
                <button class="btn-listo" style="margin-top:10px;" onclick="confirmarEntrega('${id}')">Confirmar entrega</button>
            </div>
        </div>`;
    }
    // Fila compacta para lo que sigue en fábrica interna sin marcar listo (plegado; solo si la oficina lo pide).
    function fabricaInternaRowHTML(id, o) {
        return `<div class="fi-row"><div><b>${esc(o.cliente || 'Sin cliente')} — ${esc(o.obra || '')}</b><div style="font-size:12.5px;color:#667;">${esc(etiquetaPedido(o))} · ${esc(o.totalItems) || 0} ítems</div></div><button onclick="marcarEnRuta('${id}')">Ya lo tengo · En ruta</button></div>`;
    }

    let signaturePads = {};
    let currentTab = 'espera';
    let allDocs = [];

    window.setTab = function (tab) {
        currentTab = tab;
        document.getElementById('tab-espera').classList.toggle('active', tab === 'espera');
        document.getElementById('tab-ruta').classList.toggle('active', tab === 'ruta');
        document.getElementById('tab-entregado').classList.toggle('active', tab === 'entregado');
        document.getElementById('entregado-filtros').style.display = tab === 'entregado' ? '' : 'none';
        render(allDocs);
    };

    // Aviso: si un pedido lleva 4+ horas "en ruta" sin marcarse entregado, se lo recordamos arriba
    // (por si al chofer se le olvidó). Se recalcula en cada snapshot y cada minuto (para que aparezca
    // solo al cumplirse las 4 h aunque la app quede abierta).
    const HORAS_AVISO = 4;
    function horasEnRuta(o) {
        const f = (o.fechaEnRuta && o.fechaEnRuta.toDate) ? o.fechaEnRuta.toDate() : null;
        return f ? (Date.now() - f.getTime()) / 3600000 : null;
    }
    function renderAvisoRuta() {
        const box = document.getElementById('aviso-ruta');
        if (!box) return;
        const pend = allDocs.map(d => ({ id: d.id, o: d.data() }))
            .filter(x => !x.o.entregado && x.o.enRuta === true && horasEnRuta(x.o) != null && horasEnRuta(x.o) >= HORAS_AVISO);
        if (!pend.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
        box.style.display = 'block';
        box.innerHTML = `<div class="aviso-ruta">
            <div class="t">⚠️ Tienes ${pend.length} pedido(s) en ruta sin marcar como <b>entregado</b></div>
            <div class="lst">${pend.map(p => `• ${esc(p.o.cliente || 'Sin cliente')}${p.o.obra ? ' — ' + esc(p.o.obra) : ''} <span style="color:#a06a12">(en ruta hace ${Math.floor(horasEnRuta(p.o))} h)</span>`).join('<br>')}</div>
            <button onclick="setTab('ruta')">Ver pedidos en ruta</button>
        </div>`;
    }

    // Pestaña Entregado: últimas entregas primero, filtradas por período (semana/mes/año/todo) y
    // agrupadas por día — pedido del usuario 2026-09-17 (antes salían sin orden ni filtro).
    let periodo = 'semana';
    window.setPeriodo = function (p) {
        periodo = p;
        document.querySelectorAll('.per-btn').forEach(b => b.classList.toggle('active', b.dataset.per === p));
        render(allDocs);
    };
    const fechaEntregaMs = (o) => (o.fechaEntregado && o.fechaEntregado.toDate) ? o.fechaEntregado.toDate().getTime() : 0;
    function inicioPeriodo(p) {
        const d = new Date(); d.setHours(0, 0, 0, 0);
        if (p === 'semana') { const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); }   // lunes
        else if (p === 'mes') d.setDate(1);
        else if (p === 'anio') { d.setMonth(0, 1); }
        else return 0;
        return d.getTime();
    }
    const diaLabel = (ms) => {
        if (!ms) return 'Sin fecha de entrega';
        const d = new Date(ms), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const dd = new Date(d); dd.setHours(0, 0, 0, 0);
        const diff = Math.round((hoy - dd) / 86400000);
        const txt = d.toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() !== hoy.getFullYear() ? 'numeric' : undefined });
        return diff === 0 ? 'Hoy · ' + txt : diff === 1 ? 'Ayer · ' + txt : txt;
    };

    function render(docs) {
        renderAvisoRuta();
        const list = document.getElementById('orders-list');
        // Los pedidos "directo a instalación" no pasan por transporte (se instalan en obra): se
        // excluyen de Transportes para no confundir al chofer.
        docs = docs.filter(d => d.data().directoInstalacion !== true);
        docs = docs.filter(d => !['pendiente_fabrica', 'en_fabrica'].includes(d.data().status) || (d.data().destino === 'interno' && d.data().docType !== 'COMPRA_DIRECTA') || d.data().enRuta === true);   // si el camión ya lo lleva (En ruta) se ve siempre, aunque fábrica lo haya devuelto a «en fábrica»
        // Un pedido COMPLETADO (instalado) que nunca pasó por «Entregado» no vuelve a aparecer en espera/ruta (usuario 2026-10-06:
        // «aparecen cosas completadas hace mucho»; caso Marisol Acosta y Altea 11 barandas, cerrados por instalación).
        docs = docs.filter(d => d.data().entregado === true || (d.data().status !== 'completado' && d.data().instalado !== true));
        allDocs = docs;   // el aviso de «en ruta sin entregar» y los botones trabajan sobre la MISMA lista que se muestra
        // La asignación (ver historial.html) es solo informativa: cualquier chofer ve todos los
        // pedidos, así uno puede cubrir al otro si falta.
        // Pestaña de cada pedido (chofer-pendientes.js): un pedido entregado con «resto por recoger» vuelve a En espera / En ruta.
        const tabDe = (d) => pestanaDe(d.data());
        const cuenta = { espera: 0, ruta: 0, entregado: 0 }; docs.forEach(d => { const t = tabDe(d); if (t) cuenta[t]++; });
        document.getElementById('tab-espera').textContent = `En espera (${cuenta.espera})`;
        document.getElementById('tab-ruta').textContent = `En ruta (${cuenta.ruta})`;
        let filtrados = docs.filter(d => tabDe(d) === currentTab);
        signaturePads = {};
        if (currentTab === 'entregado') {
            const desde = inicioPeriodo(periodo);
            const total = filtrados.length;
            filtrados = filtrados.filter(d => fechaEntregaMs(d.data()) >= desde).sort((a, b) => fechaEntregaMs(b.data()) - fechaEntregaMs(a.data()));
            const nom = { semana: 'esta semana', mes: 'este mes', anio: 'este año', todo: 'en total' }[periodo];
            document.getElementById('entregado-resumen').textContent = filtrados.length + ' entrega(s) ' + nom + (periodo !== 'todo' ? ' · ' + total + ' en total' : '') + ' · las más recientes primero';
            if (!filtrados.length) { list.innerHTML = '<p class="empty">No hay entregas ' + nom + '.</p>'; return; }
            // Agrupadas por día de entrega.
            let html = '', ultimo = null;
            filtrados.forEach(d => {
                const lab = diaLabel(fechaEntregaMs(d.data()));
                if (lab !== ultimo) { html += `<div class="dia-sep">${lab}</div>`; ultimo = lab; }
                html += orderCardHTML(d.id, d.data());
            });
            list.innerHTML = html;
            return;
        }
        if (!filtrados.length) {
            list.innerHTML = currentTab === 'entregado' ? '<p class="empty">No hay pedidos entregados todavía.</p>'
                : currentTab === 'ruta' ? '<p class="empty">No hay pedidos en ruta ahora mismo.</p>'
                : '<p class="empty">No hay pedidos en espera.</p>';
            return;
        }
        if (currentTab === 'espera') {
            // Secciones (Dylan 2026-11-24, videos de la pantalla de Wilson): primero lo que hay que BUSCAR agrupado por PARADA (proveedor),
            // después el resto de pedidos ya entregados en parte, después los pedidos listos; lo que fábrica interna aún no marcó listo
            // va plegado, sin botones grandes, solo si la oficina lo pide.
            const sec = (titulo, arr) => arr.length ? `<div class="dia-sep" style="font-size:14px;">${titulo} (${arr.length})</div>` + arr.map(d => orderCardHTML(d.id, d.data())).join('') : '';
            const compras = filtrados.filter(d => d.data().docType === 'COMPRA_DIRECTA');
            const restos = filtrados.filter(d => d.data().docType !== 'COMPRA_DIRECTA' && d.data().entregado === true);
            const sinListo = (d) => ['pendiente_fabrica', 'en_fabrica'].includes(d.data().status);
            const pedidos = filtrados.filter(d => d.data().docType !== 'COMPRA_DIRECTA' && d.data().entregado !== true && !sinListo(d));
            const internos = filtrados.filter(d => d.data().docType !== 'COMPRA_DIRECTA' && d.data().entregado !== true && sinListo(d));
            const paradas = new Map();
            compras.forEach(d => { const k = normTxt(d.data().proveedor) || 'sin proveedor'; if (!paradas.has(k)) paradas.set(k, { nombre: d.data().proveedor || 'Proveedor sin indicar', docs: [] }); paradas.get(k).docs.push(d); });
            const comprasHtml = compras.length ? `<div class="dia-sep" style="font-size:14px;">🛒 Para buscar · ${paradas.size} parada${paradas.size > 1 ? 's' : ''} · ${compras.length} compra${compras.length > 1 ? 's' : ''}</div>`
                + [...paradas.values()].sort((a, b) => b.docs.length - a.docs.length).map(pa => { const enEspera = pa.docs.filter(d => d.data().enRuta !== true); return `<div class="parada"><div class="pa-t">📍 ${esc(pa.nombre)}<small>${pa.docs.length} cosa${pa.docs.length > 1 ? 's' : ''} que buscar aquí: ${esc(pa.docs.map(d => d.data().cliente || 'Sin cliente').filter((v, i, arr) => arr.indexOf(v) === i).join(', '))}</small></div>${enEspera.length > 1 ? `<button onclick="marcarEnRuta('${enEspera[0].id}', ${JSON.stringify(enEspera.slice(1).map(d => d.id)).replace(/"/g, '&quot;')})">🚚 En ruta con las ${enEspera.length}</button>` : ''}</div>` + pa.docs.map(d => orderCardHTML(d.id, d.data())).join(''); }).join('') : '';
            const internosHtml = internos.length ? `<details class="mas fab-int"><summary>🏭 Todavía en fábrica interna (${internos.length}) · no hay nada que buscar, salvo que la oficina te lo pida</summary>${internos.map(d => fabricaInternaRowHTML(d.id, d.data())).join('')}</details>` : '';
            list.innerHTML = comprasHtml + sec('📦 Resto por recoger en fábrica', restos) + sec('🚚 Pedidos listos para cargar', pedidos) + internosHtml;
        } else list.innerHTML = filtrados.map(d => orderCardHTML(d.id, d.data())).join('');
        if (currentTab !== 'entregado') {
            filtrados.forEach(d => {
                const canvas = document.getElementById('firma-' + d.id);
                if (canvas) signaturePads[d.id] = setupSignaturePad(canvas);
            });
        }
    }

    // Incluye 'completado' para que los pedidos ya entregados (y, si corresponde, instalados)
    // sigan visibles en la pestaña "Entregado" en vez de desaparecer de esta pantalla.
    // Fábrica interna (usuario 2026-10-01): Wilson puede recoger material que ya está hecho aunque la oficina no lo haya marcado
    // listo. Esos pedidos (destino 'interno', aún Pendiente/En fábrica) se ven aquí con un aviso; al marcarlos «En ruta» o
    // «Entregado» pasan solos a Listo para cargar (trigger pedidoEntregadoInterno). Los de ALUCUFEL NUNCA aparecen antes de
    // que fábrica los marque listos (ALUCUFEL manda).
    const q = query(collection(db, 'orders'), where('status', 'in', ['listo_para_cargar', 'parcialmente_listo', 'parcialmente_instalado', 'completado', 'pendiente_fabrica', 'en_fabrica']));
    onSnapshot(q, (snap) => render(snap.docs), (err) => {
        document.getElementById('orders-list').innerHTML = '<p class="empty">Error cargando pedidos: ' + err.message + '</p>';
    });
    setInterval(renderAvisoRuta, 60 * 1000);   // reevalúa el aviso de "en ruta 4h+" aunque no lleguen cambios

    // El chofer marca "En ruta" apenas recoge el pedido — puramente informativo (no bloquea ni
    // exige nada para llegar a "Entregado"), solo para que se sepa que ya salió a la calle.
    // ---- Viaje: vehículo + recorrido; el costo se reparte entre las obras que van en el camión ----
    // (mismos catálogos y fórmula que el calculador de obra: ops/calculador-obra.html / index.html —
    // si cambian tarifas allá, cambiarlas aquí también). El precio del galón llega en vivo del MICM
    // (config/preciosCombustible); si no hay dato, se usa el de respaldo del vehículo.
    const CALC_VEHICULOS = [
        { id: 'F-01', nombre: 'Camión Kia K2700', precioKey: 'Gasoil Óptimo', rendKmGal: 36, precioGal: 293.10, mantCadaKm: 5000, mantCosto: 10000, seguroAnual: 69500, depreAnual: 197997 },
        { id: 'F-02', nombre: 'Minivan KYC V3', precioKey: 'Gasolina Premium', rendKmGal: 40, precioGal: 341.10, mantCadaKm: 0, mantCosto: 0, seguroAnual: 69500, depreAnual: 186225 },
        { id: 'F-03', nombre: 'Camioneta Hilux', precioKey: 'Gasoil Óptimo', rendKmGal: 45, precioGal: 293.10, mantCadaKm: 0, mantCosto: 0, seguroAnual: 100000, depreAnual: 0 },
    ];
    const CALC_RUTAS = [
        { id: 'local-terrenas', nombre: 'Local — Las Terrenas y alrededores', km: 8, peaje: 0 },
        { id: 'terrenas-samana', nombre: 'Las Terrenas ↔ Samaná / Las Galeras', km: 45, peaje: 0 },
        { id: 'sd-terrenas', nombre: 'Santo Domingo ↔ Las Terrenas', km: 163, peaje: 1700 },
        { id: 'sd-romana', nombre: 'Santo Domingo ↔ La Romana', km: 123, peaje: 400 },
        { id: 'sd-puntacana', nombre: 'Santo Domingo ↔ Punta Cana', km: 200, peaje: 600 },
        { id: 'sd-santiago', nombre: 'Santo Domingo ↔ Santiago', km: 155, peaje: 400 },
        { id: 'terrenas-romana', nombre: 'Las Terrenas ↔ La Romana', km: 214, peaje: 2100 },
        { id: 'terrenas-puntacana', nombre: 'Las Terrenas ↔ Punta Cana', km: 287, peaje: 2300 },
        { id: 'terrenas-santiago', nombre: 'Las Terrenas ↔ Santiago', km: 176, peaje: 800 },
    ];
    let PRECIOS = null;
    onSnapshot(doc(db, 'config', 'preciosCombustible'), (s) => { PRECIOS = s.exists() ? (s.data().precios || null) : null; }, () => {});
    const fmtRD = (n) => 'RD$ ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const normTxt = (x) => String(x || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
    const obraKeyDe = (c, o) => normTxt(c) + '|' + normTxt(o);
    let viajePedidoId = null;

    window.marcarEnRuta = function (id, extra) {
        viajePedidoId = id; const pre = new Set(Array.isArray(extra) ? extra : []);
        const d = allDocs.find(x => x.id === id); const o = d ? d.data() : {};
        document.getElementById('vj-sub').textContent = (o.cliente || 'Sin cliente') + ' — ' + (o.obra || '');
        const vsel = document.getElementById('vj-veh'), rsel = document.getElementById('vj-ruta');
        let ultimo = {}; try { ultimo = JSON.parse(localStorage.getItem('artal_viaje_ultimo') || '{}'); } catch (_) { }
        vsel.innerHTML = CALC_VEHICULOS.map(v => `<option value="${v.id}">${v.id} · ${esc(v.nombre)}</option>`).join('');
        vsel.value = ultimo.vehiculoId && CALC_VEHICULOS.some(v => v.id === ultimo.vehiculoId) ? ultimo.vehiculoId : 'F-01';
        rsel.innerHTML = CALC_RUTAS.map(r => `<option value="${r.id}">${esc(r.nombre)} — ${r.km} km ida</option>`).join('') + '<option value="__manual__">Otro recorrido (escribo los km)</option>';
        rsel.value = ultimo.rutaId && CALC_RUTAS.some(r => r.id === ultimo.rutaId) ? ultimo.rutaId : 'local-terrenas';
        viajeRuta();
        // Otros pedidos en espera (no en ruta, no entregados) que pueden ir en el mismo camión.
        const otros = allDocs.filter(x => x.id !== id && pestanaDe(x.data()) === 'espera');
        document.getElementById('vj-otros').innerHTML = otros.length ? otros.map(x => `<label class="vj-chk"><input type="checkbox" data-oid="${x.id}" ${pre.has(x.id) ? 'checked' : ''} onchange="viajeRecalc()"> ${esc(x.data().cliente || 'Sin cliente')} — ${esc(x.data().obra || '')}${x.data().docType === 'COMPRA_DIRECTA' && x.data().proveedor ? ' <span style="color:#a0521c">· ' + esc(x.data().proveedor) + '</span>' : ''}</label>`).join('')
            : '<p class="vj-info">No hay otros pedidos en espera. Este viaje va solo con esta obra.</p>';
        document.getElementById('vj-ok').disabled = false;
        document.getElementById('viaje-modal').classList.add('show');
        viajeRecalc();
    };
    window.viajeCerrar = function () { document.getElementById('viaje-modal').classList.remove('show'); viajePedidoId = null; };
    window.viajeRuta = function () {
        const r = CALC_RUTAS.find(x => x.id === document.getElementById('vj-ruta').value);
        document.getElementById('vj-km').value = r ? r.km : '';
        viajeRecalc();
    };
    function viajeLeer() {
        const veh = CALC_VEHICULOS.find(v => v.id === document.getElementById('vj-veh').value) || CALC_VEHICULOS[0];
        const rutaId = document.getElementById('vj-ruta').value; const ruta = CALC_RUTAS.find(x => x.id === rutaId) || null;
        const kmIda = Math.max(0, Number(document.getElementById('vj-km').value) || 0);
        const idaVuelta = document.getElementById('vj-iv').checked;
        const kmTot = kmIda * (idaVuelta ? 2 : 1);
        const precioLive = PRECIOS && typeof PRECIOS[veh.precioKey] === 'number' && PRECIOS[veh.precioKey] > 0 ? PRECIOS[veh.precioKey] : 0;
        const precioGal = precioLive || veh.precioGal;
        const combustible = veh.rendKmGal > 0 ? (kmTot / veh.rendKmGal) * precioGal : 0;
        const mantenimiento = veh.mantCadaKm > 0 ? kmTot * (veh.mantCosto / veh.mantCadaKm) : 0;
        const peajes = ruta ? (idaVuelta ? ruta.peaje : ruta.peaje / 2) : 0;
        const fijoVehiculo = ((veh.seguroAnual || 0) + (veh.depreAnual || 0)) / 365;
        const costoTotal = combustible + mantenimiento + peajes + fijoVehiculo;
        const ids = [viajePedidoId].concat(Array.from(document.querySelectorAll('#vj-otros input:checked')).map(i => i.dataset.oid));
        const pedidos = ids.map(id => { const d = allDocs.find(x => x.id === id); const o = d ? d.data() : {}; return { id, cliente: o.cliente || '', obra: o.obra || '', obraKey: obraKeyDe(o.cliente, o.obra) }; });
        const obrasMap = new Map(); pedidos.forEach(p => { if (!obrasMap.has(p.obraKey)) obrasMap.set(p.obraKey, { obraKey: p.obraKey, cliente: p.cliente, obra: p.obra, pedidos: [] }); obrasMap.get(p.obraKey).pedidos.push(p.id); });
        const obras = Array.from(obrasMap.values()); const porObra = obras.length ? costoTotal / obras.length : costoTotal;
        obras.forEach(o => o.costo = Math.round(porObra * 100) / 100);
        return { veh, ruta, rutaId, kmIda, idaVuelta, kmTot, precioGal, precioFuente: precioLive ? 'MICM (en vivo)' : 'respaldo', combustible, mantenimiento, peajes, fijoVehiculo, costoTotal, pedidos, obras };
    }
    window.viajeRecalc = function () {
        if (!viajePedidoId) return;
        const v = viajeLeer();
        document.getElementById('vj-costo').innerHTML = `Costo del viaje: <b>${fmtRD(v.costoTotal)}</b> — ${Math.round(v.kmTot)} km · combustible ${fmtRD(v.combustible)}${v.mantenimiento ? ' · desgaste ' + fmtRD(v.mantenimiento) : ''}${v.peajes ? ' · peajes ' + fmtRD(v.peajes) : ''} · fijos del día ${fmtRD(v.fijoVehiculo)}<br>` +
            (v.obras.length > 1 ? `Repartido entre <b>${v.obras.length} obras</b>: <b>${fmtRD(v.obras[0].costo)}</b> a cada una.` : `Va <b>una sola obra</b>: se le carga el viaje completo.`);
    };
    window.viajeConfirmar = async function () {
        if (!viajePedidoId) return;
        const v = viajeLeer();
        if (!(v.kmIda > 0)) { alert('Escribe los km de ida del recorrido.'); return; }
        const btn = document.getElementById('vj-ok'); btn.disabled = true;
        const hoy = new Date(), pad = (n) => String(n).padStart(2, '0'), fecha = hoy.getFullYear() + '-' + pad(hoy.getMonth() + 1) + '-' + pad(hoy.getDate());
        // Los fijos del vehículo (seguro + depreciación / 365) se cobran UNA vez por vehículo y día: si ya hubo un viaje
        // hoy con este vehículo, este viaje no los vuelve a cargar (auditoría 2026-09-28: doble conteo con 2 viajes el mismo día).
        try {
            const prev = await getDocs(query(collection(db, 'viajes'), where('fecha', '==', fecha), where('vehiculoId', '==', v.veh.id)));
            if (!prev.empty && v.fijoVehiculo > 0) {
                v.costoTotal = Math.max(0, v.costoTotal - v.fijoVehiculo); v.fijoVehiculo = 0; v.fijosYaCobrados = true;
                const n = v.obras.length || 1; v.obras.forEach(o => { o.costo = Math.round(v.costoTotal / n * 100) / 100; });
            }
        } catch (_) { }
        try {
            const ref = await addDoc(collection(db, 'viajes'), {
                fecha, salida: serverTimestamp(), choferEmail: usuario.email, choferNombre: usuario.nombre,
                vehiculoId: v.veh.id, vehiculoNombre: v.veh.id + ' · ' + v.veh.nombre, rutaId: v.rutaId, rutaNombre: v.ruta ? v.ruta.nombre : 'Otro recorrido',
                kmIda: v.kmIda, idaVuelta: v.idaVuelta, kmTot: v.kmTot, precioGal: v.precioGal, precioFuente: v.precioFuente,
                combustible: Math.round(v.combustible * 100) / 100, mantenimiento: Math.round(v.mantenimiento * 100) / 100, peajes: v.peajes, fijoVehiculo: Math.round(v.fijoVehiculo * 100) / 100, fijosYaCobrados: !!v.fijosYaCobrados,
                costoTotal: Math.round(v.costoTotal * 100) / 100, pedidos: v.pedidos, obras: v.obras, obrasKeys: v.obras.map(o => o.obraKey), pedidosIds: v.pedidos.map(p => p.id)
            });
            for (const p of v.pedidos) {
                const ob = v.obras.find(o => o.obraKey === p.obraKey) || {};
                const yaEntregado = (allDocs.find(x => x.id === p.id) || { data: () => ({}) }).data().entregado === true;
                await updateDoc(doc(db, 'orders', p.id), { ...(yaEntregado ? { restoEnRuta: true, fechaRestoEnRuta: serverTimestamp() } : {}), enRuta: true, fechaEnRuta: serverTimestamp(), viajeId: ref.id, viajeVehiculo: v.veh.id, viajeRuta: v.ruta ? v.ruta.nombre : 'Otro recorrido', viajeCosto: ob.costo || 0, viajeObras: v.obras.length });
            }
            try { localStorage.setItem('artal_viaje_ultimo', JSON.stringify({ vehiculoId: v.veh.id, rutaId: v.rutaId })); } catch (_) { }
            viajeCerrar();
        } catch (e) { alert('No se pudo registrar la salida: ' + (e && e.message ? e.message : e)); btn.disabled = false; }
    };

    window.abrirRecepcion = function (id) {
        const form = document.getElementById('recepcion-' + id);
        if (!form) return;
        form.style.display = form.style.display === 'block' ? 'none' : 'block';
        if (form.style.display === 'block') { rcResumen(id); form.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    };

    window.limpiarFirma = function (id) {
        if (signaturePads[id]) signaturePads[id].clear();
    };

    window.confirmarEntrega = async function (id) {
        const nombre = document.getElementById('recepcion-nombre-' + id).value.trim();
        const pad = signaturePads[id];
        if (!nombre) { alert('Escribe el nombre de quien recibe el material.'); return; }
        if (!pad || pad.isEmpty()) { alert('Falta la firma de quien recibe.'); return; }
        const snap = await getDoc(doc(db, 'orders', id));
        const d = snap.exists() ? snap.data() : {};
        const esCompra = d.docType === 'COMPRA_DIRECTA';
        // Quién recibe (Dylan 2026-11-24): el instalador asignado o el cliente. El chofer solo si también instala (rol instalador):
        // Wilson sí; otro chofer no puede recibirse a sí mismo.
        const yo = normTxt(usuario.nombre), ella = normTxt(nombre);
        const soyInstalador = (usuario.roles || []).includes('instalador');
        if (!esCompra && ella && (ella === yo || (yo.split(' ')[0] && ella === yo.split(' ')[0])) && !soyInstalador) { alert('El chofer no puede recibir por la obra. Escribe el nombre del instalador asignado o del cliente que recibió.'); return; }
        const { partes, faltan } = esCompra ? { partes: null, faltan: {} } : rcLeer(id);
        if (!esCompra && !Object.keys(partes).length && !confirm('No marcaste ninguna parte como recibida.\n\n¿Confirmar igual? El pedido quedará como estaba (nada entregado ahora).')) return;
        const btn = document.querySelector(`#recepcion-${id} .btn-listo`); if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
        try {
            // (auditoría 2026-11-12) La escritura de «Entregado» vive en envios.js → marcarEntregado (la comparten Transportes, Instalación
            // y Mi día). Acumula lo recibido por partes; cierra el pedido solo si llegó TODO y no necesita instalador / ya está instalado.
            await marcarEntregado(db, id, d, usuario, { recibio: nombre, firma: pad.toDataUrl(), partes: partes || undefined });
            // Lo que fábrica marcó listo y NO entregó → itemStatus 'problema' (alerta roja en el Panel + push a fábrica). Lo recibido completo → 'cargado'.
            if (!esCompra) {
                const upd = {}; const ahoraISO = new Date().toISOString();
                Object.entries(faltan).forEach(([iid, ks]) => {
                    const recib = {}; partesDeItem(d, iid).forEach(p => { recib[p.k] = recibidas(d, iid).includes(p.k) || (partes[iid] || []).includes(p.k); });
                    upd[`itemStatus.${iid}`] = { estado: 'problema', partesRecibidas: recib, faltantes: ks.map(k => labelParte(d, iid, k)), comentario: 'Fábrica lo marcó listo pero no lo entregó al chofer', por: usuario.nombre, atendido: false, fecha: ahoraISO };
                });
                Object.keys(partes).filter(iid => !faltan[iid]).forEach(iid => {
                    const prev = (d.itemStatus || {})[iid];
                    // Un problema anterior («no me dieron X») se cierra solo cuando X llega en esta entrega.
                    const resuelve = prev && prev.estado === 'problema' && prev.atendido !== true && Array.isArray(prev.faltantes) && prev.faltantes.every(l => (partes[iid] || []).some(k => labelParte(d, iid, k) === l) || recibidas(d, iid).some(k => labelParte(d, iid, k) === l));
                    if (!prev || prev.estado !== 'problema' || prev.atendido === true || resuelve) upd[`itemStatus.${iid}`] = { estado: 'cargado', por: usuario.nombre, fecha: ahoraISO, ...(resuelve ? { atendido: true, resuelto: 'entregado en una entrega posterior' } : {}) };
                });
                if (Object.keys(upd).length) await updateDoc(doc(db, 'orders', id), upd);
            }
        } catch (e) { alert('No se pudo marcar entregado: ' + (e && e.message ? e.message : e)); if (btn) { btn.disabled = false; btn.textContent = 'Confirmar entrega'; } }
    };
    // «↩ No va en ruta» (Dylan 2026-11-05, caso Daria — Casa naranjitos marcado por inadvertencia): deshace «En ruta» de UN
    // pedido sin tocar los demás del mismo viaje: el pedido vuelve a «En espera» (o a «resto por recoger» si ya estaba
    // entregado) y sale del viaje; si su obra ya no tiene ningún otro pedido a bordo, el costo del viaje se reparte de
    // nuevo entre las obras que quedan (y se actualiza en sus pedidos); si el viaje queda vacío se borra con registro
    // en la papelera. Deja `enRutaDeshecho` en el pedido y `quitados[]` en el viaje para poder auditar.
    window.quitarDeRuta = async function (id) {
        const d = allDocs.find(x => x.id === id); const o = d ? d.data() : {};
        if (!confirm(`¿Quitar «${(o.cliente || '') + ' — ' + (o.obra || '')}» de la ruta?\n\nVuelve a «En espera» y sale del viaje; los demás pedidos del viaje no cambian.`)) return;
        const btns = document.querySelectorAll(`button[onclick="quitarDeRuta('${id}')"]`); btns.forEach(b => { b.disabled = true; });
        try {
            const viajeId = o.viajeId || null;
            if (viajeId) {
                const vs = await getDoc(doc(db, 'viajes', viajeId));
                if (vs.exists()) {
                    const v = vs.data();
                    const pedidos = (v.pedidos || []).filter(p => p.id !== id);
                    const obras = (v.obras || []).map(ob => ({ ...ob, pedidos: (ob.pedidos || []).filter(pid => pid !== id) })).filter(ob => ob.pedidos.length);
                    const quitado = { pedidoId: id, cliente: o.cliente || '', obra: o.obra || '', por: usuario.nombre || '', porEmail: usuario.email || '', fechaISO: new Date().toISOString() };
                    if (!pedidos.length) {
                        await borrarConRegistro({ coleccion: 'viajes', id: viajeId, datos: { ...v, quitados: [...(v.quitados || []), quitado] }, resumen: 'Viaje ' + (v.vehiculoNombre || '') + ' · ' + (v.rutaNombre || '') + ' · ' + (v.fecha || ''), usuario, pantalla: 'chofer.html', motivo: 'Se quitó de la ruta el único pedido del viaje (marcado por inadvertencia)' });
                    } else {
                        const n = obras.length || 1, costoObra = Math.round(((v.costoTotal || 0) / n) * 100) / 100;
                        const repartoCambio = obras.length !== (v.obras || []).length;
                        if (repartoCambio) obras.forEach(ob => { ob.costo = costoObra; });
                        await updateDoc(doc(db, 'viajes', viajeId), { pedidos, pedidosIds: pedidos.map(p => p.id), obras, obrasKeys: obras.map(ob => ob.obraKey), quitados: arrayUnion(quitado) });
                        if (repartoCambio) for (const p of pedidos) await updateDoc(doc(db, 'orders', p.id), { viajeCosto: costoObra, viajeObras: obras.length });
                    }
                }
            }
            const deshecho = { por: usuario.nombre || '', porEmail: usuario.email || '', fechaISO: new Date().toISOString(), viajeId: viajeId || '', eraResto: o.entregado === true };
            await updateDoc(doc(db, 'orders', id), o.entregado === true
                ? { restoEnRuta: false, fechaRestoEnRuta: null, viajeId: null, viajeVehiculo: null, viajeRuta: null, viajeCosto: null, viajeObras: null, enRutaDeshecho: deshecho }
                : { enRuta: false, fechaEnRuta: null, viajeId: null, viajeVehiculo: null, viajeRuta: null, viajeCosto: null, viajeObras: null, enRutaDeshecho: deshecho });
        } catch (e) { alert('No se pudo quitar de la ruta: ' + (e && e.message ? e.message : e)); btns.forEach(b => { b.disabled = false; }); }
    };
    window.regresarAFabrica = async function (id) {
        // Misma regla que «No está listo» en Instalación: motivo obligatorio que fábrica ve como instrucción roja (auditoría 2026-11-12).
        const motivo = prompt('¿Qué falta o qué está mal? Fábrica lo verá como instrucción.');
        if (motivo === null) return;
        if (!motivo.trim()) { alert('Escribe el motivo para que fábrica sepa qué corregir.'); return; }
        // Se borra también la marca "en ruta": si no, cuando fábrica lo vuelva a dejar listo
        // reaparece aquí como "en ruta hace N horas" con la fecha vieja (bug real, Woof Woof 2026-09-21).
        try {
            await updateDoc(doc(db, 'orders', id), {
                status: 'en_fabrica', enRuta: false, fechaEnRuta: null, listoAutomatico: null,
                noListoPor: usuario.nombre, noListoPorEmail: usuario.email, noListoFecha: serverTimestamp(), noListoMotivo: motivo.trim(),
                comentarioParaFabrica: '↩ Devuelto por transporte (' + usuario.nombre + '): ' + motivo.trim(), comentarioParaFabricaAtendido: false
            });
        } catch (e) { alert('No se pudo: ' + e.message); }
    };
</script>
