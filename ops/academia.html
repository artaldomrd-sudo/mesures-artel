        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.togglePublicado = async function (id) {
        const c = cursoById(id); if (!c) return;
        try { await updateDoc(doc(db, 'academiaCursos', id), { publicado: c.publicado === false }); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrarCurso = async function (id) {
        const lecs = leccionesDe(id);
        if (!confirm('¿Eliminar este curso' + (lecs.length ? ' y sus ' + lecs.length + ' lección(es)' : '') + '? No se puede deshacer.')) return;
        try {
            for (const l of lecs) await deleteDoc(doc(db, 'academiaLecciones', l.id));
            await deleteDoc(doc(db, 'academiaCursos', id));
            irA('cursos');
        } catch (e) { alert('No se pudo eliminar: ' + e.message); }
    };

    // ---------------- Lecciones (autor) ----------------
    window.abrirLeccion = function (cursoId) {
        editandoLeccionId = null;
        cursoSelId = cursoId;
        document.getElementById('lec-modal-title').textContent = 'Nueva lección';
        document.getElementById('l-titulo').value = '';
        document.getElementById('l-duracion').value = '';
        document.getElementById('l-video').value = '';
        document.getElementById('l-contenido').value = '';
        document.getElementById('l-notas').value = ''; document.getElementById('l-ia-msg').textContent = '';
        document.getElementById('l-adjuntos-wrap').style.display = 'none';   // se suben tras crearla
        document.getElementById('modal-leccion').classList.add('show');
    };
    window.abrirEditarLeccion = function (id) {
        const l = leccionById(id); if (!l) return;
        editandoLeccionId = id;
        document.getElementById('lec-modal-title').textContent = 'Editar lección';
        document.getElementById('l-titulo').value = l.titulo || '';
        document.getElementById('l-duracion').value = l.duracion != null ? l.duracion : '';
        document.getElementById('l-video').value = l.video || '';
        document.getElementById('l-contenido').value = l.contenido || '';
        document.getElementById('l-notas').value = ''; document.getElementById('l-ia-msg').textContent = '';
        renderLecAdjuntos(id);
        document.getElementById('l-adjuntos-wrap').style.display = 'block';
        document.getElementById('modal-leccion').classList.add('show');
    };
    function renderLecAdjuntos(id) {
        const l = leccionById(id) || {};
        document.getElementById('l-adjuntos').innerHTML =
            fotosThumbsHTML(l.fotos, { coleccion: 'academiaLecciones', id, campo: 'fotos', puedeBorrar: true }) +
            fotoAddBtnHTML({ coleccion: 'academiaLecciones', id, campo: 'fotos', label: '📎 Agregar foto/PDF', pdf: true });
    }
    window.guardarLeccion = async function () {
        const titulo = document.getElementById('l-titulo').value.trim();
        if (!titulo) { alert('Escribe el título de la lección.'); return; }
        const datos = {
            titulo, duracion: n2(document.getElementById('l-duracion').value),
            video: document.getElementById('l-video').value.trim(),
            contenido: document.getElementById('l-contenido').value.trim()
        };
        const btn = document.querySelector('#modal-leccion .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            if (editandoLeccionId) {
                await updateDoc(doc(db, 'academiaLecciones', editandoLeccionId), datos);
            } else {
                const orden = leccionesDe(cursoSelId).length;
                const r = await addDoc(collection(db, 'academiaLecciones'), { ...datos, cursoId: cursoSelId, orden, fotos: [], creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
                // Deja la lección abierta en edición para poder subirle fotos/PDF enseguida.
                editandoLeccionId = r.id;
                document.getElementById('lec-modal-title').textContent = 'Editar lección';
                renderLecAdjuntos(r.id);
                document.getElementById('l-adjuntos-wrap').style.display = 'block';
                btn.disabled = false; btn.textContent = 'Guardar';
                return;
            }
            cerrar('modal-leccion');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.moverLeccion = async function (id, dir) {
        const l = leccionById(id); if (!l) return;
        const lecs = leccionesDe(l.cursoId), i = lecs.findIndex(x => x.id === id), j = i + dir;
        if (j < 0 || j >= lecs.length) return;
        try {
            await updateDoc(doc(db, 'academiaLecciones', lecs[i].id), { orden: j });
            await updateDoc(doc(db, 'academiaLecciones', lecs[j].id), { orden: i });
        } catch (e) { alert('No se pudo reordenar: ' + e.message); }
    };
    window.borrarLeccion = async function (id) {
        if (!confirm('¿Eliminar esta lección?')) return;
        try { await deleteDoc(doc(db, 'academiaLecciones', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    // ---------------- Asistente IA ----------------
    // Convierte las notas en bruto del modal de lección en una lección estructurada.
    window.iaRedactarLeccion = async function () {
        let notas = document.getElementById('l-notas').value.trim();
        const msg = document.getElementById('l-ia-msg');
        if (!notas) {
            // Sin notas nuevas: desarrollar a partir del borrador que ya tiene la lección (resumen del esquema).
            notas = document.getElementById('l-contenido').value
                .replace(/^\[Borrador\]\s*/, '')
                .replace(/\(Abre esta lecci[oó]n[\s\S]*?\)/, '')
                .trim();
        }
        if (!notas) { msg.textContent = 'Escribe o dicta tus notas arriba primero (o parte de un borrador del esquema).'; return; }
        const btn = document.querySelector('#modal-leccion .btn-ia');
        btn.disabled = true; const t0 = btn.textContent; btn.textContent = '✨ Redactando…'; msg.textContent = 'La IA está armando la lección…';
        try {
            const r = await fetch(FN_ACADEMIA, {
                method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + await auth.currentUser.getIdToken() },
                body: JSON.stringify({ modo: 'leccion', notas, titulo: document.getElementById('l-titulo').value.trim(), curso: (cursoById(cursoSelId) || {}).titulo || '' })
            });
            const data = await r.json();
            if (!r.ok || data.error) throw new Error(data.error || 'error');
            if (data.contenido) document.getElementById('l-contenido').value = data.contenido;
            if (data.titulo && !document.getElementById('l-titulo').value.trim()) document.getElementById('l-titulo').value = data.titulo;
            msg.textContent = '✓ Listo. Revisa y ajusta lo que quieras antes de guardar.';
        } catch (e) {
            msg.textContent = 'No se pudo generar (¿está desplegada la función?). Detalle: ' + (e && e.message ? e.message : e);
        } finally { btn.disabled = false; btn.textContent = t0; }
    };

    // Un clic desde la vista de la lección: abre el editor con el borrador y desarrolla el contenido.
    window.desarrollarLeccionIA = function (id) {
        abrirEditarLeccion(id);          // llena título + contenido (borrador del esquema)
        iaRedactarLeccion();             // sin notas nuevas → parte del borrador existente
    };

    // Genera el esquema de un curso (lista de lecciones) desde un tema + notas.
    let esquemaActual = null;
    window.abrirEsquema = function (cursoId) {
        cursoSelId = cursoId;
        const c = cursoById(cursoId) || {};
        document.getElementById('e-tema').value = c.titulo || '';
        document.getElementById('e-notas').value = '';
        document.getElementById('e-resultado').innerHTML = '';
        document.getElementById('e-ia-msg').textContent = '';
        document.getElementById('e-crear-btn').style.display = 'none';
        esquemaActual = null;
        document.getElementById('modal-esquema').classList.add('show');
    };
    window.iaGenerarEsquema = async function () {
        const notas = document.getElementById('e-notas').value.trim();
        const tema = document.getElementById('e-tema').value.trim();
        const msg = document.getElementById('e-ia-msg');
        if (!notas && !tema) { msg.textContent = 'Escribe al menos el tema del curso.'; return; }
        const btn = document.querySelector('#modal-esquema .btn-ia');
        btn.disabled = true; const t0 = btn.textContent; btn.textContent = '✨ Pensando…'; msg.textContent = 'La IA está proponiendo las lecciones…';
        try {
            const r = await fetch(FN_ACADEMIA, {
                method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + await auth.currentUser.getIdToken() },
                body: JSON.stringify({ modo: 'esquema', curso: tema, notas: notas || tema })
            });
            const data = await r.json();
            if (!r.ok || data.error || !data.esquema) throw new Error(data.error || 'error');
            esquemaActual = data.esquema;
            const lecs = data.esquema.lecciones || [];
            document.getElementById('e-resultado').innerHTML = (data.esquema.descripcion ? `<p style="font-size:12.5px;color:#556;margin:10px 0 4px">${esc(data.esquema.descripcion)}</p>` : '') +
                lecs.map((l, i) => `<label class="esq-item"><input type="checkbox" class="esq-chk" data-i="${i}" checked><span><span class="t">${i + 1}. ${esc(l.titulo || '')}</span>${l.resumen ? `<div class="r">${esc(l.resumen)}</div>` : ''}</span></label>`).join('');
            document.getElementById('e-crear-btn').style.display = lecs.length ? 'block' : 'none';
            msg.textContent = '✓ Marca las que quieras crear.';
        } catch (e) {
            msg.textContent = 'No se pudo generar (¿está desplegada la función?). Detalle: ' + (e && e.message ? e.message : e);
        } finally { btn.disabled = false; btn.textContent = t0; }
    };
    window.crearLeccionesEsquema = async function () {
        if (!esquemaActual || !Array.isArray(esquemaActual.lecciones)) return;
        const marcadas = Array.from(document.querySelectorAll('#e-resultado .esq-chk')).filter(c => c.checked).map(c => esquemaActual.lecciones[+c.dataset.i]);
        if (!marcadas.length) { alert('Marca al menos una lección.'); return; }
        const btn = document.getElementById('e-crear-btn'); btn.disabled = true; btn.textContent = 'Creando…';
        try {
            let orden = leccionesDe(cursoSelId).length;
            for (const l of marcadas) {
                await addDoc(collection(db, 'academiaLecciones'), {
                    cursoId: cursoSelId, orden: orden++, titulo: l.titulo || 'Lección',
                    contenido: l.resumen ? ('[Borrador] ' + l.resumen + '\n\n(Abre esta lección y toca "✨ Desarrollar con IA" para escribir la clase completa.)') : '',
                    fotos: [], creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                });
            }
            cerrar('modal-esquema');
            irA('curso', cursoSelId);
        } catch (e) { alert('No se pudieron crear: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Crear lecciones marcadas'; }
    };

    // ---------------- Examen: editor (autor) ----------------
    let examenDraft = null, examenCursoId = null;
    // ---------------- Enviar curso a personas (Mensajería) ----------------
    let enviarCursoId = null;
    window.abrirEnviarCurso = function (cursoId) {
        const c = cursoById(cursoId); if (!c) return;
        enviarCursoId = cursoId;
        let m = document.getElementById('modal-enviar');
        if (!m) { m = document.createElement('div'); m.id = 'modal-enviar'; m.className = 'modal-overlay'; document.body.appendChild(m); }
        const rolesTxt = (u) => (Array.isArray(u.rol) ? u.rol : [u.rol]).filter(Boolean).join(', ');
        const veCurso = (u) => !Array.isArray(c.roles) || !c.roles.length || (Array.isArray(u.rol) ? u.rol : [u.rol]).some(r => c.roles.includes(r) || r === 'admin' || r === 'capacitador' || r === 'lector');
        const lista = equipo.filter(u => u.email !== usuario.email).sort((a, b) => String(a.nombre || a.email).localeCompare(String(b.nombre || b.email)));
        m.innerHTML = `<div class="modal-box">
            <h2>📨 Enviar «${esc(c.titulo || 'Curso')}» a…</h2>
            <p style="font-size:13px;color:#556;margin:0 0 6px">Cada persona marcada recibe un comunicado en Mensajería con un botón que abre este curso.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px"><button class="btn-ghost" style="padding:6px 10px" onclick="enviarMarcar(true)">Todos</button><button class="btn-ghost" style="padding:6px 10px" onclick="enviarMarcar(false)">Ninguno</button></div>
            <div id="env-lista" style="max-height:260px;overflow:auto;border:1.5px solid #eef1f4;border-radius:10px;padding:6px 10px">
                ${lista.length ? lista.map(u => `<label class="chk-line" style="margin:6px 0"><input type="checkbox" value="${esc(u.email)}"> ${esc(u.nombre || u.email)} <span style="font-size:11.5px;color:#889">${esc(rolesTxt(u))}${veCurso(u) ? '' : ' · ⚠ no ve este curso (Para quién)'}</span></label>`).join('') : '<p style="color:#889;font-size:13px">No hay personas en el equipo.</p>'}
            </div>
            <label>Mensaje (opcional)</label>
            <textarea id="env-nota" style="min-height:80px" placeholder="Ej. Léelo hoy, por favor: explica cómo llenar el parte diario paso a paso."></textarea>
            <div class="modal-actions"><button class="btn-ghost" onclick="cerrar('modal-enviar')">Cancelar</button><button class="btn-y btn-guardar" onclick="enviarCurso()">📨 Enviar</button></div>
        </div>`;
        m.classList.add('show');
    };
    window.enviarMarcar = (v) => document.querySelectorAll('#env-lista input').forEach(i => i.checked = v);
    window.enviarCurso = async function () {
        const c = cursoById(enviarCursoId); if (!c) return;
        const dest = Array.from(document.querySelectorAll('#env-lista input:checked')).map(i => i.value);
        if (!dest.length) { alert('Marca al menos una persona.'); return; }
        const nota = document.getElementById('env-nota').value.trim();
        const lecs = leccionesDe(c.id);
        const url = location.origin + location.pathname + '?curso=' + encodeURIComponent(c.id);
        const cuerpo = [nota, nota ? '' : null, `📚 Curso: ${c.titulo || ''}`, c.descripcion ? c.descripcion : null, lecs.length ? `Temas (${lecs.length}): ` + lecs.map(l => l.titulo).join(' · ') : null, '', 'Toca «Abrir el curso en la Academia» para leerlo. Puedes volver a consultarlo cuando quieras desde 🎓 Academia.'].filter(x => x !== null).join('\n');
        const btn = document.querySelector('#modal-enviar .btn-guardar'); btn.disabled = true; btn.textContent = 'Enviando…';
        try {
            await addDoc(collection(db, 'mensajes'), {
                estado: 'enviado', asunto: '📚 ' + (c.titulo || 'Curso') + ' — léelo en la Academia', cuerpo,
                remitenteEmail: usuario.email, remitenteNombre: usuario.nombre, fecha: serverTimestamp(),
                paraTodos: false, destinatarios: dest.map(e => String(e || '').trim().toLowerCase()), requiereFirma: false, adjuntos: [],
                enlace: { titulo: 'Abrir el curso en la Academia', url }, acuses: {}, tipo: 'curso', cursoId: c.id
            });
            cerrar('modal-enviar');
            alert('✓ Enviado a ' + dest.length + ' persona(s). Lo verán en Mensajería (✉️) con el botón para abrir el curso.');
        } catch (e) { alert('No se pudo enviar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = '📨 Enviar'; }
    };

    window.abrirExamen = function (cursoId) {
        const c = cursoById(cursoId); if (!c) return;
        examenCursoId = cursoId;
        const ex = c.examen;
        examenDraft = (ex && Array.isArray(ex.preguntas)) ? JSON.parse(JSON.stringify(ex)) : { activo: true, notaMinima: 70, puntos: 100, preguntas: [] };
        if (!examenDraft.preguntas.length) examenDraft.preguntas.push({ q: '', opciones: ['', ''], correcta: 0 });
        renderExamenEditor();
        document.getElementById('modal-examen').classList.add('show');
    };
    function leerExamenDOM() {
        if (!examenDraft) return;
        examenDraft.notaMinima = Math.max(1, Math.min(100, Number(document.getElementById('ex-min').value) || 70));
        examenDraft.puntos = Math.max(0, Number(document.getElementById('ex-pts').value) || 0);
        document.querySelectorAll('#ex-editor .ed-q').forEach((bl, qi) => {
            const p = examenDraft.preguntas[qi]; if (!p) return;
            p.q = bl.querySelector('.ed-qtext').value;
            p.opciones = Array.from(bl.querySelectorAll('.ed-op')).map(o => o.value);
            const sel = bl.querySelector('input[type=radio]:checked');
            p.correcta = sel ? +sel.value : 0;
        });
    }
    function renderExamenEditor() {
        const d = examenDraft;
        document.getElementById('ex-editor').innerHTML = `
            <div style="display:flex;gap:12px;flex-wrap:wrap">
                <div style="flex:1;min-width:120px"><label>Nota mínima para aprobar (%)</label><input id="ex-min" type="number" min="1" max="100" value="${d.notaMinima || 70}"></div>
                <div style="flex:1;min-width:120px"><label>Puntos al aprobar</label><input id="ex-pts" type="number" min="0" value="${d.puntos != null ? d.puntos : 100}"></div>
            </div>
            <div style="margin-top:10px">${d.preguntas.map((p, qi) => `<div class="ed-q">
                <label>Pregunta ${qi + 1}</label>
                <input class="ed-qtext" type="text" value="${esc(p.q || '')}" placeholder="Escribe la pregunta">
                <div style="font-size:11.5px;color:#8a93a0;margin:8px 0 2px">Opciones (marca la correcta):</div>
                ${(p.opciones || []).map((o, oi) => `<div class="op-row">
                    <input type="radio" name="correcta${qi}" value="${oi}" ${p.correcta === oi ? 'checked' : ''}>
                    <input class="ed-op" type="text" value="${esc(o)}" placeholder="Opción ${oi + 1}">
                    <button class="btn-ghost" style="min-height:34px;padding:4px 9px" onclick="exDelOpcion(${qi},${oi})">✕</button>
                </div>`).join('')}
                <div style="margin-top:6px"><button class="btn-ghost" style="min-height:34px;padding:6px 10px;font-size:12px" onclick="exAddOpcion(${qi})">＋ Opción</button>
                <button class="btn-ghost" style="min-height:34px;padding:6px 10px;font-size:12px;color:#c0392b" onclick="exDelPregunta(${qi})">🗑 Quitar pregunta</button></div>
            </div>`).join('')}</div>
            <button class="btn-ghost" onclick="exAddPregunta()">＋ Agregar pregunta</button>`;
    }
    window.exAddPregunta = () => { leerExamenDOM(); examenDraft.preguntas.push({ q: '', opciones: ['', ''], correcta: 0 }); renderExamenEditor(); };
    window.exDelPregunta = (qi) => { leerExamenDOM(); examenDraft.preguntas.splice(qi, 1); if (!examenDraft.preguntas.length) examenDraft.preguntas.push({ q: '', opciones: ['', ''], correcta: 0 }); renderExamenEditor(); };
    window.exAddOpcion = (qi) => { leerExamenDOM(); examenDraft.preguntas[qi].opciones.push(''); renderExamenEditor(); };
    window.exDelOpcion = (qi, oi) => { leerExamenDOM(); const p = examenDraft.preguntas[qi]; if (p.opciones.length <= 2) { alert('Deja al menos 2 opciones.'); return; } p.opciones.splice(oi, 1); if (p.correcta >= p.opciones.length) p.correcta = 0; renderExamenEditor(); };
    window.guardarExamen = async function () {
        leerExamenDOM();
        // Validación mínima: cada pregunta con texto y al menos 2 opciones con contenido.
        for (const p of examenDraft.preguntas) {
            if (!String(p.q || '').trim()) { alert('Hay una pregunta sin texto.'); return; }
            if ((p.opciones || []).filter(o => String(o).trim()).length < 2) { alert('Cada pregunta necesita al menos 2 opciones con texto.'); return; }
        }
        examenDraft.activo = true;
        try {
            await updateDoc(doc(db, 'academiaCursos', examenCursoId), { examen: examenDraft });
            cerrar('modal-examen');
        } catch (e) { alert('No se pudo guardar el examen: ' + (e.message || e)); }
    };
    window.quitarExamen = async function () {
        if (!confirm('¿Quitar el examen de este curso? El progreso de quienes ya lo aprobaron se conserva.')) return;
        try { await updateDoc(doc(db, 'academiaCursos', examenCursoId), { examen: { activo: false, preguntas: [] } }); cerrar('modal-examen'); }
        catch (e) { alert('No se pudo: ' + (e.message || e)); }
    };

    document.body.insertAdjacentHTML('beforeend', `<div class="modal-overlay" id="modal-examen"><div class="modal-box">
        <h2>Examen del curso</h2>
        <div id="ex-editor"></div>
        <div class="modal-actions">
            <button class="btn-ghost" onclick="quitarExamen()" style="color:#c0392b">Quitar examen</button>
            <button class="btn-ghost" onclick="cerrar('modal-examen')">Cancelar</button>
            <button class="btn-y" onclick="guardarExamen()">Guardar examen</button>
        </div>
    </div></div>`);

    render();
</script>

</body>
</html>
