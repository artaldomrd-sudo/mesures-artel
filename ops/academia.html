<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 820px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 16px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-ghost { background: transparent; border: 1.5px solid #cfd6dd; color: var(--artal-blue); border-radius: 9px; padding: 9px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; }
    .intro { font-size: 13px; color: #667; margin: 0 0 14px; line-height: 1.5; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .sec-cat { font-size: 13px; color: var(--artal-blue); text-transform: uppercase; letter-spacing: .05em; margin: 6px 0 10px; }
    .curso-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; cursor: pointer; border-top: 4px solid var(--artal-blue); transition: transform .08s, box-shadow .12s; position: relative; }
    .curso-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -10px rgba(0,0,0,.35); }
    .curso-card .emoji { font-size: 30px; }
    .curso-card .ttl { font-weight: bold; color: var(--artal-blue); font-size: 15.5px; margin: 6px 0 3px; }
    .curso-card .desc { font-size: 12.5px; color: #667; line-height: 1.4; }
    .curso-card .cat { display: inline-block; font-size: 10.5px; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; color: #6a7684; background: #eef1f4; border-radius: 20px; padding: 2px 9px; margin-top: 8px; }
    .badge-draft { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: bold; background: #fdeaea; color: #d9483b; border-radius: 20px; padding: 2px 8px; }
    .prog { margin-top: 10px; }
    .prog-bar { height: 7px; border-radius: 6px; background: #e9edf1; overflow: hidden; }
    .prog-bar > span { display: block; height: 100%; background: #2ecc71; }
    .prog-txt { font-size: 11px; color: #8a93a0; margin-top: 4px; }

    .lec-list { display: flex; flex-direction: column; gap: 8px; }
    .lec-row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 11px; box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; }
    .lec-row .num { width: 30px; height: 30px; border-radius: 50%; background: #eef1f4; color: var(--artal-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; flex: 0 0 auto; }
    .lec-row.done .num { background: #d5f5e3; color: #1e8449; }
    .lec-row .ttl { font-weight: bold; color: #2a3742; font-size: 14px; }
    .lec-row .meta { font-size: 11.5px; color: #8a93a0; margin-top: 2px; }
    .lec-row .adm { margin-left: auto; display: flex; gap: 4px; }
    .lec-row .adm button { background: transparent; border: none; cursor: pointer; font-size: 14px; color: #9aa4ae; }

    .lec-read h2 { color: var(--artal-blue); font-size: 20px; margin: 4px 0 2px; }
    .lec-read .meta { font-size: 12.5px; color: #8a93a0; margin-bottom: 14px; }
    .lec-read .cont { font-size: 15px; color: #2f3944; line-height: 1.6; white-space: pre-wrap; }
    /* Edición en pantalla + imágenes en medio del texto (Dylan 2026-10-28, video de Anny) */
    .lec-read .cont.editable { cursor: text; border-radius: 8px; transition: background .15s; }
    .lec-read .cont.editable:hover { background: #f7fafc; outline: 1px dashed #cfe0f2; }
    .lec-read h4.sec { color: var(--artal-blue); font-size: 14px; letter-spacing: .04em; margin: 18px 0 4px; display: flex; align-items: center; gap: 8px; }
    .lec-read h4.sec .figbtn { background: #eef4fb; color: #1f6aa5; border: 1px solid #cfe0f2; border-radius: 999px; font-size: 11px; padding: 2px 8px; cursor: pointer; font-family: 'Arimo'; font-weight: normal; }
    .lec-fig { margin: 12px auto; text-align: center; max-width: 720px; }
    .lec-fig img { max-width: 100%; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: block; margin: 0 auto; }
    .lec-fig figcaption { font-size: 12px; color: #8a93a0; margin-top: 4px; }
    .lec-fig .figdel { font-size: 11px; color: #c0392b; cursor: pointer; margin-left: 6px; }
    /* Edición por BLOQUE (Dylan 2026-11-03): cada párrafo, apartado o imagen se edita solo; «＋» entre bloques para añadir. */
    .lec-read .cont .blk { position: relative; border-radius: 6px; margin: 0 -8px; padding: 0 8px; }
    .lec-read .cont.editable .blk.txt:hover, .lec-read .cont.editable h4.blk:hover { background: #f4f8fc; outline: 1px dashed #cfe0f2; }
    .lec-read .cont .blk-pen { position: absolute; right: 4px; top: 2px; font-size: 12px; line-height: 1; background: #fff; border: 1px solid #cfe0f2; border-radius: 999px; padding: 3px 8px; color: #1f6aa5; cursor: pointer; opacity: 0; transition: opacity .15s; font-family: 'Arimo'; }
    .lec-read .cont .blk:hover > .blk-pen { opacity: 1; }
    @media (hover: none) { .lec-read .cont .blk-pen { opacity: .55; } }
    .lec-read .cont h4.blk { padding-right: 40px; }
    .lec-read .cont .blk-blank { height: 1em; }
    .lec-read .cont .clear { clear: both; }
    .blk-edit { margin: 2px -8px 6px; }
    .blk-edit textarea { width: 100%; min-height: 44px; font: 15px/1.6 'Arimo', Arial, sans-serif; color: #2f3944; padding: 8px 10px; border: 2px solid var(--artal-blue); border-radius: 8px; resize: none; box-sizing: border-box; overflow: hidden; }
    .blk-edit.titulo textarea { font-weight: bold; text-transform: uppercase; letter-spacing: .04em; font-size: 14px; color: var(--artal-blue); }
    .blk-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 6px; font-size: 12px; color: #8a93a0; }
    .blk-bar button { border: 1px solid #cfe0f2; background: #fff; border-radius: 8px; padding: 5px 10px; font-family: 'Arimo'; font-size: 12.5px; cursor: pointer; }
    .blk-bar button.save { background: var(--artal-blue); color: #fff; border-color: var(--artal-blue); font-weight: bold; }
    .blk-bar button.del { color: #c0392b; }
    .blk-gap { position: relative; height: 12px; margin: -5px -8px; display: flex; align-items: center; justify-content: center; }
    .blk-gap .gap-line { position: absolute; left: 8px; right: 8px; top: 50%; border-top: 1px dashed #b9d2ea; opacity: 0; }
    .blk-gap .gap-plus { position: relative; z-index: 1; opacity: 0; transition: opacity .15s; background: #fff; border: 1px solid #b9d2ea; color: #1f6aa5; border-radius: 999px; width: 22px; height: 22px; font-size: 17px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-family: 'Arimo'; }
    .blk-gap:hover .gap-line, .blk-gap:hover .gap-plus, .blk-gap.open .gap-plus { opacity: 1; }
    @media (hover: none) { .blk-gap .gap-plus { opacity: .35; } }
    .gap-menu { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px; background: #f7fafc; border: 1px solid #cfe0f2; border-radius: 10px; margin: 4px -8px 8px; font-size: 12px; color: #8a93a0; }
    .gap-menu button, .gap-menu .foto-add-btn { border: 1px solid #cfe0f2; background: #fff; border-radius: 8px; padding: 6px 10px; font-family: 'Arimo'; font-size: 12.5px; cursor: pointer; margin: 0; min-height: 0; font-weight: normal; color: #2f3944; }
    .gap-menu .img-picker { width: 100%; margin: 0; }
    .lec-fig.fig-izq { float: left; margin: 6px 16px 8px 0; max-width: 45%; }
    .lec-fig.fig-der { float: right; margin: 6px 0 8px 16px; max-width: 45%; }
    .fig-tools { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 4px; opacity: 0; transition: opacity .15s; }
    .lec-fig:hover .fig-tools { opacity: 1; }
    @media (hover: none) { .fig-tools { opacity: .85; } }
    .fig-tools button { border: 1px solid #cfe0f2; background: #fff; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-family: 'Arimo'; cursor: pointer; color: #1f6aa5; }
    .fig-tools button.on { background: var(--artal-blue); color: #fff; border-color: var(--artal-blue); }
    .fig-tools button.del { color: #c0392b; }
    .fig-tools .sep { color: #c5d3e3; font-size: 11px; }
    .lec-fig .pie-txt { cursor: text; border-bottom: 1px dashed #cfe0f2; }
    .lec-fig .figext { font-size: 10.5px; color: #b9770e; margin-left: 6px; }
    .inline-edit textarea { width: 100%; min-height: 320px; font: 15px/1.6 'Arimo', Arial, sans-serif; color: #2f3944; padding: 12px; border: 2px solid var(--artal-blue); border-radius: 10px; resize: vertical; box-sizing: border-box; }
    .inline-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    .inline-bar button { border: 1px solid #cfe0f2; background: #fff; border-radius: 8px; padding: 7px 11px; font-family: 'Arimo'; font-size: 13px; cursor: pointer; }
    .inline-bar button.save { background: var(--artal-blue); color: #fff; border-color: var(--artal-blue); font-weight: bold; }
    .inline-bar .hint { font-size: 12px; color: #8a93a0; }
    .img-picker { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #f7fafc; border: 1px solid #cfe0f2; border-radius: 10px; margin: 6px 0; }
    .img-picker img { width: 110px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .img-picker img:hover { border-color: var(--artal-blue); }
    .img-picker .empty { font-size: 12.5px; color: #8a93a0; }
    [contenteditable="true"].inline-txt { outline: 2px solid var(--artal-blue); border-radius: 6px; padding: 2px 6px; background: #fff; }
    .lec-fig img { cursor: zoom-in; }
    .lb { position: fixed; inset: 0; background: rgba(10,20,30,.92); display: none; align-items: center; justify-content: center; z-index: 9000; }
    .lb.show { display: flex; }
    .lb-body { max-width: 94vw; max-height: 92vh; text-align: center; }
    .lb-body img { max-width: 94vw; max-height: 84vh; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .lb-cap { color: #dbe7f3; font-size: 14px; margin-top: 10px; }
    .lb-x, .lb-nav { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lb-x { top: 14px; right: 14px; font-size: 20px; } .lb-prev { left: 12px; top: 50%; transform: translateY(-50%); } .lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
    .pres { position: fixed; inset: 0; background: linear-gradient(135deg, #12314B, #1C4E7A 60%, #2C6BA4); color: #fff; display: none; flex-direction: column; z-index: 9100; }
    .pres.show { display: flex; }
    .pres-top { display: flex; align-items: center; gap: 14px; padding: 12px 18px; font-size: 13px; color: #dbe7f3; }
    .pres-top #pres-tit { flex: 1; font-weight: bold; color: #fff; }
    .pres-top button { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 8px; padding: 7px 12px; font-family: 'Arimo'; cursor: pointer; }
    .pres-slide { flex: 1; overflow: auto; margin: 0 70px 24px; background: #fff; color: #2f3944; border-radius: 16px; padding: 28px 36px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .pres-slide h3 { color: var(--artal-blue); font-size: 26px; margin: 0 0 14px; }
    .pres-txt { font-size: 19px; line-height: 1.6; white-space: pre-wrap; }
    .pres-fig { margin: 16px auto; text-align: center; max-width: 860px; } .pres-fig img { max-width: 100%; max-height: 58vh; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.18); } .pres-fig figcaption { font-size: 13px; color: #8a93a0; margin-top: 6px; }
    .pres-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.16); color: #fff; border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 30px; cursor: pointer; }
    .pres-prev { left: 10px; } .pres-next { right: 10px; }
    @media (max-width: 700px) { .pres-slide { margin: 0 8px 60px; padding: 18px; } .pres-txt { font-size: 16px; } .pres-slide h3 { font-size: 20px; } .pres-nav { top: auto; bottom: 10px; transform: none; width: 44px; height: 44px; } }
    .lec-video { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 10px 0 16px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: #000; }
    .lec-video iframe, .lec-video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .lec-read .nav { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .btn-done { background: #2ecc71; color: #fff; border: none; border-radius: 9px; padding: 12px 18px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-done.is-done { background: #eaf7ef; color: #1e8449; }

    .crumbs { font-size: 12.5px; color: #8a93a0; margin-bottom: 10px; }
    .crumbs a { color: var(--artal-blue); font-weight: bold; text-decoration: none; cursor: pointer; }

    .fotos-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .foto-thumb { position: relative; display: inline-block; }
    .foto-thumb img { width: 92px; height: 92px; object-fit: cover; border-radius: 9px; border: 1.5px solid #e3e7ec; }
    .foto-thumb.foto-pdf a { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 92px; height: 92px; border-radius: 9px; border: 1.5px solid #e3e7ec; background: #f7f9fb; text-decoration: none; color: #556; font-size: 11px; }
    .foto-thumb.foto-pdf .pdf-ico { font-size: 24px; } .foto-thumb.foto-pdf .pdf-nom { padding: 0 4px; text-align: center; }
    .foto-del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #e74c3c; color: #fff; cursor: pointer; font-weight: bold; line-height: 1; }
    .foto-add-btn { display: inline-block; margin-top: 10px; background: var(--artal-blue); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: bold; cursor: pointer; }
    .foto-add-btn input { display: none; }

    .ai-box { background: #f4f2fd; border: 1.5px dashed #c3b9ef; border-radius: 10px; padding: 12px; margin-top: 14px; }
    .ai-box .ai-lbl { font-size: 12.5px; font-weight: bold; color: #5b3fd0; display: block; margin-bottom: 6px; }
    .ai-box textarea { min-height: 80px; }
    .btn-ia { background: #6a3df0; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; margin-top: 8px; }
    .btn-ia:disabled { opacity: .6; cursor: default; }
    .ai-msg { font-size: 12px; color: #667; margin-top: 8px; }
    .esq-item { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #eef1f4; }
    .esq-item input { width: auto; min-height: 0; margin-top: 3px; }
    .esq-item .t { font-weight: bold; color: #2a3742; font-size: 13.5px; } .esq-item .r { font-size: 12px; color: #778; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 12px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 130px; }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .chk-line input { width: auto; min-height: 0; }
    .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
    .empty { color: #8a93a0; text-align: center; padding: 30px 10px; }

    .examen-box { background: #f4f7fb; border: 1.5px solid #e0e8f1; border-radius: 12px; padding: 14px 16px; margin-top: 18px; }
    .examen-box.aprobado { background: #eef9f1; border-color: #c9ecd4; }
    .examen-box .ex-h { font-weight: bold; color: var(--artal-blue); font-size: 15px; }
    .examen-box .ex-info { font-size: 13px; color: #556; margin-top: 4px; }
    .ex-q { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
    .ex-qt { font-weight: bold; color: #33404a; font-size: 14.5px; margin-bottom: 8px; }
    .ex-opt { display: flex; align-items: center; gap: 9px; padding: 8px 6px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .ex-opt:hover { background: #f4f7fa; }
    .ex-opt input { width: 17px; height: 17px; }
    .ex-ok { background: #eef9f1; border: 1.5px solid #c9ecd4; border-radius: 10px; padding: 14px; color: #1e8449; font-weight: bold; }
    .ex-fail { background: #fdeeee; border: 1.5px solid #f2c9c4; border-radius: 10px; padding: 14px; color: #c0392b; font-weight: bold; }
    .ed-q { border: 1.5px solid #e3e9ef; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .ed-q .op-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .ed-q .op-row input[type=text] { flex: 1; min-height: 38px; }
    .ed-q .op-row input[type=radio] { width: 18px; height: 18px; flex: 0 0 auto; }

    .cert { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 8px; }
    .cert-in { border: 3px double var(--artal-blue); border-radius: 8px; padding: 34px 24px; text-align: center; }
    .cert-logo { height: 54px; width: auto; object-fit: contain; margin-bottom: 10px; }
    .cert-t { font-size: 24px; font-weight: bold; color: var(--artal-blue); letter-spacing: .02em; }
    .cert-sub { font-size: 13px; color: #667; margin-top: 14px; }
    .cert-name { font-size: 30px; font-weight: bold; color: #2a3742; margin: 6px 0; }
    .cert-curso { font-size: 18px; font-weight: bold; color: var(--artal-blue); margin: 6px 0; }
    .cert-meta { font-size: 13px; color: #667; margin-top: 12px; }
    .cert-firma { font-size: 12px; color: #8a93a0; margin-top: 26px; }
    @media print { header, .crumbs, .bar { display: none !important; } }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" id="btn-back" title="Volver">← Volver</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Academia</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="vista"></div>
</main>

<!-- Modal: curso -->
<div class="modal-overlay" id="modal-curso">
    <div class="modal-box">
        <h2 id="curso-modal-title">Nuevo curso</h2>
        <div class="grid2">
            <div><label>Emoji / ícono</label><input type="text" id="c-emoji" maxlength="4" placeholder="🎓"></div>
            <div><label>Categoría</label><input type="text" id="c-categoria" list="cat-cursos" placeholder="Ej. Inducción"></div>
        </div>
        <label>Título *</label>
        <input type="text" id="c-titulo" placeholder="Ej. Inducción del instalador">
        <label>Descripción</label>
        <textarea id="c-desc" style="min-height:70px" placeholder="De qué trata este curso…"></textarea>
        <label>Para quién <span style="font-weight:normal;color:#889">— sin marcar = todo el equipo</span></label>
        <div id="c-roles" style="display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 8px;font-size:13.5px;">
            <label class="chk-line" style="margin:0"><input type="checkbox" value="instalador"> Instaladores</label>
            <label class="chk-line" style="margin:0"><input type="checkbox" value="ayudante"> Ayudantes</label>
            <label class="chk-line" style="margin:0"><input type="checkbox" value="chofer"> Chofer</label>

<datalist id="cat-cursos">
    <option value="Inducción"></option><option value="Mentalidad de trabajo"></option>
    <option value="Instalación"></option><option value="Medición"></option>
    <option value="Producto nuevo"></option><option value="Herramientas y seguridad"></option>
</datalist>

<script type="module">
    import './mensajeria-widget.js';   // botón ✉️ Mensajes + banda roja de mensajes nuevos (2026-11-02)
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { fotoAddBtnHTML, fotosThumbsHTML, agregarFotoPorUrl } from './fotos.js';

    // Todo el equipo interno puede VER la academia (2026-09-22: abierta a instalador/ayudante/chofer/
    // cotizaciones/contable/comunicaciones; ALUCUFEL queda fuera). Editar el contenido queda gateado en
    // la UI a admin/capacitador (esAutor). No se bloquea por parte diario pendiente (auth-common.js).
    const usuario = await requireAuth(['capacitador', 'instalador', 'ayudante', 'chofer', 'cotizaciones', 'contable', 'comunicaciones']);
    wireBackButton(usuario.roles);
    // "Volver" contextual: dentro de la Academia navega atrás por vista (lección→curso→cursos);
    // solo desde la lista de cursos sale al inicio (Panel/ERP) con su enlace normal.
    document.getElementById('btn-back').addEventListener('click', (e) => {
        if (vista === 'cursos') return;                       // deja que el href lleve al inicio
        e.preventDefault();
        if (vista === 'curso' || vista === 'progreso') irA('cursos');
        else irA('curso', cursoSelId);                        // lección, examen, certificado → al curso
    });
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    const esAutor = usuario.roles.includes('admin') || usuario.roles.includes('capacitador');
    const FN_ACADEMIA = 'https://us-central1-artal-operaciones.cloudfunctions.net/academiaRedactar';

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const miClave = usuario.email.replace(/[^a-zA-Z0-9]/g, '_');

    let cursos = [], lecciones = [], progreso = [];
    let vista = 'cursos', cursoSelId = null, leccionSelId = null;
    let editandoCursoId = null, editandoLeccionId = null;

    let cursoURL = new URLSearchParams(location.search).get('curso') || '';   // academia.html?curso=ID (enlace desde Mensajería)
    onSnapshot(collection(db, 'academiaCursos'), (s) => { cursos = s.docs.map(d => ({ id: d.id, ...d.data() })); if (cursoURL && cursos.some(c => c.id === cursoURL)) { const id = cursoURL; cursoURL = ''; irA('curso', id); return; } render(); }, () => {});
    // Equipo (espejo no sensible usuarios → equipo/{email}): destinatarios de "Enviar curso a…".
    let equipo = [];
    onSnapshot(collection(db, 'equipo'), (s) => { equipo = s.docs.map(d => ({ email: d.id, ...d.data() })).filter(u => u.activo !== false); }, () => {});
    const puedeEnviar = usuario.roles.includes('admin') || usuario.roles.includes('comunicaciones');
    onSnapshot(collection(db, 'academiaLecciones'), (s) => {
        lecciones = s.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
        // Si el modal de edición está abierto, refresca sus adjuntos (fotos.js escribe en Firestore).
        if (editandoLeccionId && document.getElementById('modal-leccion').classList.contains('show')) renderLecAdjuntos(editandoLeccionId);
    }, () => {});
    onSnapshot(collection(db, 'academiaProgreso'), (s) => { progreso = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});

    const cursoById = (id) => cursos.find(c => c.id === id) || null;
    const leccionById = (id) => lecciones.find(l => l.id === id) || null;
    const leccionesDe = (cursoId) => lecciones.filter(l => l.cursoId === cursoId).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    const paraMi = (c) => !Array.isArray(c.roles) || !c.roles.length || c.roles.some(r => usuario.roles.includes(r)) || usuario.roles.includes('lector');
    const cursosVisibles = () => cursos.filter(c => esAutor || (c.publicado !== false && paraMi(c))).sort((a, b) => (a.orden || 0) - (b.orden || 0) || String(a.titulo || '').localeCompare(String(b.titulo || ''), 'es'));
    // Mi progreso de un curso: Set de leccionId completadas.
    function completadasDe(cursoId) {
        const p = progreso.find(x => x.id === miClave + '__' + cursoId);
        return new Set((p && Array.isArray(p.leccionesCompletadas)) ? p.leccionesCompletadas : []);
    }
    async function marcarLeccion(cursoId, leccionId, hecha) {
        const set = completadasDe(cursoId);
        if (hecha) set.add(leccionId); else set.delete(leccionId);
        const total = leccionesDe(cursoId).length;
        const arr = [...set];
        try {
            await setDoc(doc(db, 'academiaProgreso', miClave + '__' + cursoId), {
                email: usuario.email, nombre: usuario.nombre, cursoId,
                leccionesCompletadas: arr, completado: total > 0 && arr.length >= total,
                fechaActualizado: serverTimestamp()
            }, { merge: true });
        } catch (e) { alert('No se pudo guardar tu progreso: ' + (e && e.message ? e.message : e)); }
    }

    // ---------------- Examen (helpers) ----------------
    const progresoDe = (cursoId) => progreso.find(x => x.id === miClave + '__' + cursoId) || null;
    const tieneExamen = (c) => !!(c && c.examen && c.examen.activo && Array.isArray(c.examen.preguntas) && c.examen.preguntas.length);
    const examenAprobado = (cursoId) => { const p = progresoDe(cursoId); return !!(p && p.examenAprobado); };

    window.cerrar = (id) => document.getElementById(id).classList.remove('show');
    window.irA = function (v, cursoId, leccionId) { vista = v; if (cursoId !== undefined) cursoSelId = cursoId; if (leccionId !== undefined) leccionSelId = leccionId; render(); window.scrollTo(0, 0); };

    // ---------------- Render ----------------
    function render() {
        if (inlineEditando) return;   // no pisar una edición en pantalla con un refresco de Firestore
        try { colocarFotosPendientes(); } catch (_) { }
        const cont = document.getElementById('vista');
        if (vista === 'progreso' && esAutor) return renderProgreso(cont);
        if (vista === 'examen' && cursoById(cursoSelId)) return renderExamen(cont);
        if (vista === 'certificado' && cursoById(cursoSelId)) return renderCertificado(cont);
        if (vista === 'leccion' && leccionById(leccionSelId)) return renderLeccion(cont);
        if (vista === 'curso' && cursoById(cursoSelId)) return renderCurso(cont);
        vista = 'cursos'; renderCursos(cont);
    }

    // Buscador: filtra cursos por título/descripción/categoría Y por el título o texto de sus lecciones
    // (para resolver una duda concreta: "firma", "en ruta", "parte"…).
    let buscaTxt = '';
    window.buscarAcademia = function (v) { buscaTxt = String(v || '').trim().toLowerCase(); render(); const i = document.getElementById('buscador'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } };
    const coincide = (c) => {
        if (!buscaTxt) return true;
        const t = (s) => String(s || '').toLowerCase().includes(buscaTxt);
        return t(c.titulo) || t(c.descripcion) || t(c.categoria) || leccionesDe(c.id).some(l => t(l.titulo) || t(l.contenido));
    };
    function renderCursos(cont) {
        const list = cursosVisibles().filter(coincide);
        const nuevo = esAutor ? `<button class="btn-y" onclick="abrirCurso()">+ Nuevo curso</button><button class="btn-ghost" onclick="irA('progreso')">📊 Progreso del equipo</button>` : '';
        let html = `<p class="intro">📘 <b>Guías de la plataforma</b>: cómo usar cada pantalla, paso a paso — consúltalas cuando tengas una duda. 🎓 <b>Cursos</b>: clases para aprender a instalar y la forma de trabajar de ARTAL, con tu avance en cada uno.</p>
            <div class="bar"><input type="search" id="buscador" value="${esc(buscaTxt)}" oninput="buscarAcademia(this.value)" placeholder="🔎 ¿Tienes una duda? Busca: parte diario, en ruta, firma, gastos fijos…" style="flex:1;min-width:220px;padding:11px 12px;border:1.5px solid #ddd;border-radius:9px;font-family:'Arimo';font-size:14px;min-height:44px;">${nuevo}</div>`;
        if (!list.length) { cont.innerHTML = html + '<p class="empty">' + (buscaTxt ? 'Nada coincide con «' + esc(buscaTxt) + '».' : 'Aún no hay cursos. ' + (esAutor ? 'Crea el primero con «+ Nuevo curso».' : 'Pronto habrá contenido.')) + '</p>'; return; }
        // Agrupado por categoría: las "Guías · …" primero (en su orden), después el resto.
        const grupos = new Map();
        list.forEach(c => { const k = c.categoria || 'Cursos'; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(c); });
        const cats = [...grupos.keys()].sort((a, b) => { const ga = /^gu[ií]a/i.test(a), gb = /^gu[ií]a/i.test(b); if (ga !== gb) return ga ? -1 : 1; return a.localeCompare(b, 'es'); });
        const card = (c) => {
            const total = leccionesDe(c.id).length, hechas = completadasDe(c.id).size;
            const pct = total ? Math.round(hechas / total * 100) : 0;
            const esGuia = /^gu[ií]a/i.test(c.categoria || '');
            return `<div class="curso-card" onclick="irA('curso','${c.id}')" style="border-top-color:${c.publicado === false ? '#c9ced6' : (esGuia ? '#1f9d61' : 'var(--artal-blue)')}">
                ${c.publicado === false ? '<span class="badge-draft">Borrador</span>' : ''}
                <div class="emoji">${esc(c.emoji || '🎓')}</div>
                <div class="ttl">${esc(c.titulo || 'Curso')}</div>
                ${c.descripcion ? `<div class="desc">${esc(c.descripcion)}</div>` : ''}
                ${esAutor && Array.isArray(c.roles) && c.roles.length ? `<span class="cat">👥 ${esc(c.roles.join(', '))}</span>` : ''}
                ${esGuia ? `<div class="prog-txt" style="margin-top:8px">${total} tema(s)</div>` : `<div class="prog"><div class="prog-bar"><span style="width:${pct}%"></span></div><div class="prog-txt">${hechas}/${total} lecciones${pct === 100 && total ? ' · completado ✓' : ''}</div></div>`}
            </div>`;
        };
        html += cats.map(k => `<h2 class="sec-cat">${esc(k)}</h2><div class="grid">${grupos.get(k).map(card).join('')}</div>`).join('');
        cont.innerHTML = html;
    }

    function renderCurso(cont) {
        const c = cursoById(cursoSelId); if (!c) { irA('cursos'); return; }
        const lecs = leccionesDe(c.id), done = completadasDe(c.id);
        const admCurso = esAutor ? `${puedeEnviar ? `<button class="btn-ghost" style="border-color:var(--artal-blue)" onclick="abrirEnviarCurso('${c.id}')">📨 Enviar curso a…</button>` : ''}<button class="btn-ghost" onclick="abrirEditarCurso('${c.id}')">✏ Editar curso</button>
            <button class="btn-ghost" onclick="togglePublicado('${c.id}')">${c.publicado === false ? '👁 Publicar' : '🚫 Despublicar'}</button>
            <button class="btn-ghost" style="color:#c0392b;border-color:#f0c9c4" onclick="borrarCurso('${c.id}')">🗑 Eliminar</button>` : '';
        let html = `<div class="crumbs"><a onclick="irA('cursos')">← Cursos</a></div>
            <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;">
                <div style="font-size:34px">${esc(c.emoji || '🎓')}</div>
                <div><h2 style="color:var(--artal-blue);font-size:20px;margin:0" ${esAutor ? `title="Doble clic para corregir" ondblclick="inlineTexto(this, (v) => guardarCampoCurso('${c.id}', 'titulo', v))"` : ''}>${esc(c.titulo || 'Curso')}</h2>
                ${c.descripcion || esAutor ? `<div style="font-size:13.5px;color:#556;margin-top:3px" ${esAutor ? `title="Doble clic para corregir la descripción" ondblclick="inlineTexto(this, (v) => guardarCampoCurso('${c.id}', 'descripcion', v))"` : ''}>${esc(c.descripcion || (esAutor ? '(sin descripción — doble clic para escribirla)' : ''))}</div>` : ''}</div>
            </div>`;
        if (esAutor) html += `<div class="bar">${admCurso}<button class="btn-y" onclick="abrirLeccion('${c.id}')">+ Lección</button><button class="btn-ia" onclick="abrirEsquema('${c.id}')">✨ Generar curso con IA</button></div>`;
        if (!lecs.length) { cont.innerHTML = html + '<p class="empty">Este curso todavía no tiene lecciones.</p>'; return; }
        html += '<div class="lec-list">' + lecs.map((l, i) => {
            const isDone = done.has(l.id);
            const adm = esAutor ? `<div class="adm">
                <button title="Subir" onclick="event.stopPropagation();moverLeccion('${l.id}',-1)">▲</button>
                <button title="Bajar" onclick="event.stopPropagation();moverLeccion('${l.id}',1)">▼</button>
                <button title="Editar" onclick="event.stopPropagation();abrirEditarLeccion('${l.id}')">✏</button>
                <button title="Eliminar" style="color:#e74c3c" onclick="event.stopPropagation();borrarLeccion('${l.id}')">🗑</button>
            </div>` : `<div class="adm">${isDone ? '<span style="color:#1e8449;font-weight:bold;font-size:13px">✓</span>' : ''}</div>`;
            const nAdj = (Array.isArray(l.fotos) ? l.fotos.length : 0);
            const meta = [l.duracion ? '⏱ ' + n2(l.duracion) + ' min' : '', nAdj ? '📎 ' + nAdj : ''].filter(Boolean).join(' · ');
            return `<div class="lec-row ${isDone ? 'done' : ''}" onclick="irA('leccion','${c.id}','${l.id}')">
                <div class="num">${isDone ? '✓' : (i + 1)}</div>
                <div><div class="ttl">${esc(l.titulo || 'Lección')}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
                ${adm}
            </div>`;
        }).join('') + '</div>';
        html += renderExamenBloque(c, done, lecs);
        cont.innerHTML = html;
    }

    // Bloque de examen dentro de la vista del curso (autor: crear/editar; alumno: presentar/estado).
    function renderExamenBloque(c, done, lecs) {
        const total = lecs.length, hechas = done.size, todasHechas = total > 0 && hechas >= total;
        if (esAutor) {
            const info = tieneExamen(c)
                ? `Examen activo · ${c.examen.preguntas.length} pregunta(s) · aprueba con ${c.examen.notaMinima || 70}% · ${c.examen.puntos || 100} pts`
                : 'Sin examen todavía. Crea uno para evaluar y dar puntos al equipo.';
            return `<div class="examen-box"><div class="ex-h">📝 Examen del curso</div><div class="ex-info">${esc(info)}</div>
                <div class="bar" style="margin-top:8px"><button class="btn-ghost" onclick="abrirExamen('${c.id}')">${tieneExamen(c) ? '✏ Editar examen' : '＋ Crear examen'}</button></div></div>`;
        }
        if (!tieneExamen(c)) return '';
        const MAX = 2;
        const p = progresoDe(c.id);
        const intentos = (p && p.examenIntentos) || 0;
        if (p && p.examenAprobado) {
            return `<div class="examen-box aprobado"><div class="ex-h">✅ Examen aprobado</div>
                <div class="ex-info">Nota: ${p.examenNota || 0}% · ganaste ${c.examen.puntos || 100} puntos. Ya quedó validado: no se puede volver a tomar.</div>
                <div class="bar" style="margin-top:8px"><button class="btn-y" onclick="verCertificado('${c.id}')">🏅 Ver certificado</button></div></div>`;
        }
        if (p && p.examenBloqueado) {
            return `<div class="examen-box" style="background:#fdeeee;border-color:#f2c9c4"><div class="ex-h" style="color:#c0392b">❌ Examen no superado</div>
                <div class="ex-info">No aprobaste en ${MAX} intentos (última nota: ${p.examenNota || 0}%). Se agendó una reunión con tu supervisor para revisarlo juntos. Por ahora no se puede volver a intentar.</div></div>`;
        }
        const restante = MAX - intentos;
        return `<div class="examen-box"><div class="ex-h">📝 Examen del curso</div>
            <div class="ex-info">${todasHechas ? `Aprueba con ${c.examen.notaMinima || 70}% y gana ${c.examen.puntos || 100} puntos.${intentos > 0 ? ` <b>Te queda ${restante} intento.</b>` : ` Tienes ${MAX} intentos.`}` : `Primero completa las ${total} lecciones (llevas ${hechas}).`}</div>
            <div class="bar" style="margin-top:8px"><button class="btn-y" onclick="irA('examen','${c.id}')" ${todasHechas ? '' : 'disabled style="opacity:.5;cursor:default"'}>📝 ${intentos > 0 ? 'Reintentar (último intento)' : 'Presentar examen'}</button></div></div>`;
    }

    // ---------------- Examen: presentar (alumno) ----------------
    function renderExamen(cont) {
        const c = cursoById(cursoSelId);
        if (!tieneExamen(c)) { irA('curso', c ? c.id : undefined); return; }
        const pp = progresoDe(cursoSelId);
        if (pp && (pp.examenAprobado || pp.examenBloqueado)) { irA('curso', c.id); return; }  // ya validado o sin intentos
        const preg = c.examen.preguntas;
        cont.innerHTML = `<div class="crumbs"><a onclick="irA('curso','${c.id}')">← ${esc(c.titulo || 'Curso')}</a></div>
            <h2 style="color:var(--artal-blue);font-size:20px;margin:2px 0 4px">Examen — ${esc(c.titulo || '')}</h2>
            <div style="font-size:13px;color:#667;margin-bottom:16px">Responde todas las preguntas. Apruebas con ${c.examen.notaMinima || 70}%.</div>
            <div id="ex-preguntas">${preg.map((p, i) => `<div class="ex-q"><div class="ex-qt">${i + 1}. ${esc(p.q || '')}</div>
                ${(p.opciones || []).map((o, j) => `<label class="ex-opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}</div>
            <div id="ex-result" style="margin:14px 0"></div>
            <div class="bar"><button class="btn-y" onclick="entregarExamen('${c.id}')">Entregar examen</button><button class="btn-ghost" onclick="irA('curso','${c.id}')">Cancelar</button></div>`;
    }
    window.entregarExamen = async function (cursoId) {
        const c = cursoById(cursoId); if (!c || !tieneExamen(c)) return;
        const prevP = progresoDe(cursoId);
        if (prevP && (prevP.examenAprobado || prevP.examenBloqueado)) { irA('curso', cursoId); return; }  // no puede volver a tomarlo
        const preg = c.examen.preguntas;
        let aciertos = 0, respondidas = 0;
        preg.forEach((p, i) => { const sel = document.querySelector(`input[name="q${i}"]:checked`); if (sel) { respondidas++; if (+sel.value === p.correcta) aciertos++; } });
        const res = document.getElementById('ex-result');
        if (respondidas < preg.length) { res.innerHTML = '<div class="ex-fail">Responde todas las preguntas antes de entregar.</div>'; return; }
        const nota = Math.round(aciertos / preg.length * 100);
        const minimo = c.examen.notaMinima || 70;
        const aprob = nota >= minimo;
        const MAX = 2;
        const intentos = ((prevP && prevP.examenIntentos) || 0) + 1;
        const bloquear = !aprob && intentos >= MAX;
        try {
            await setDoc(doc(db, 'academiaProgreso', miClave + '__' + cursoId), {
                email: usuario.email, nombre: usuario.nombre, cursoId,
                examenNota: nota, examenIntentos: intentos, examenAprobado: aprob, examenBloqueado: bloquear,
                examenFecha: serverTimestamp()
            }, { merge: true });
            if (aprob) await otorgarPuntos(c);
            if (bloquear) await agendarCitaSupervisor(c, nota);
        } catch (e) { res.innerHTML = '<div class="ex-fail">No se pudo guardar: ' + esc(e.message || e) + '</div>'; return; }
        if (aprob) {
            res.innerHTML = `<div class="ex-ok">✅ ¡Aprobado! Nota: ${nota}%. Ganaste ${c.examen.puntos || 100} puntos.<br>Este examen queda validado (no se puede repetir).<br><button class="btn-ghost" style="margin-top:10px" onclick="verCertificado('${cursoId}')">🏅 Ver certificado</button></div>`;
        } else if (bloquear) {
            res.innerHTML = `<div class="ex-fail">❌ Nota: ${nota}%. No superaste el examen en ${MAX} intentos. Se agendó una reunión con tu supervisor para revisarlo juntos.<br><button class="btn-ghost" style="margin-top:10px" onclick="irA('curso','${cursoId}')">Volver al curso</button></div>`;
        } else {
            res.innerHTML = `<div class="ex-fail">❌ Nota: ${nota}%. Necesitas ${minimo}%. Te queda ${MAX - intentos} intento — repasa las lecciones y vuelve a intentarlo.<br><button class="btn-ghost" style="margin-top:10px" onclick="irA('curso','${cursoId}')">Volver al curso</button></div>`;
        }
        res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    // Al fallar 2 veces: agenda una cita/recordatorio para gerencia (supervisor) — usa el calendario
    // (colección citas) que ya dispara notificaciones. El cliente del empleado puede escribir en citas.
    async function agendarCitaSupervisor(c, nota) {
        try {
            await addDoc(collection(db, 'citas'), {
                tipo: 'recordatorio',
                titulo: 'Evaluar examen no superado — ' + usuario.nombre,
                descripcion: usuario.nombre + ' no aprobó el examen del curso "' + (c.titulo || '') + '" en 2 intentos (última nota ' + nota + '%). Reunirse para evaluar por qué y tomar medidas.',
                fecha: Timestamp.fromDate(new Date()),
                asignadoA: 'gerente', asignados: [{ nombre: 'Sara' }, { nombre: 'Anny' }, { nombre: 'Dylan' }],
                completadoPor: [], completada: false, creadoPorNombre: usuario.nombre,
                origen: 'academia_examen', ref: c.id, empleado: usuario.nombre, empleadoEmail: usuario.email
            });
        } catch (e) { /* best-effort: el bloqueo ya quedó guardado aunque falle la cita */ }
    }
    // Punto ganado → ledger `puntos` (lo contabilizará el futuro módulo de Nivel/Rango). ID
    // determinista email+curso → idempotente: repetir el examen no duplica puntos.
    async function otorgarPuntos(c) {
        try {
            await setDoc(doc(db, 'puntos', miClave + '__academia__' + c.id), {
                email: usuario.email, nombre: usuario.nombre, origen: 'academia',
                detalle: 'Aprobó examen: ' + (c.titulo || ''), puntos: Number(c.examen.puntos) || 100,
                ref: c.id, fecha: serverTimestamp()
            }, { merge: true });
        } catch (e) { /* best-effort: el examen ya quedó aprobado aunque falle el registro de puntos */ }
    }

    // ---------------- Panel de progreso del equipo (autor) ----------------
    function renderProgreso(cont) {
        const cursosL = cursosVisibles();
        // Todas las personas con algún progreso, ordenadas por nombre.
        const personas = [...new Map(progreso.map(p => [p.email, p.nombre || p.email])).entries()]
            .map(([email, nombre]) => ({ email, nombre })).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
        let html = `<div class="crumbs"><a onclick="irA('cursos')">← Cursos</a></div>
            <h2 style="color:var(--artal-blue);font-size:20px;margin:2px 0 6px">📊 Progreso del equipo</h2>
            <div style="font-size:13px;color:#667;margin-bottom:16px">Avance por curso: lecciones completadas y examen. Los puntos se acumulan para el módulo de niveles.</div>`;
        if (!personas.length) { cont.innerHTML = html + '<p class="empty">Todavía nadie ha registrado avance.</p>'; return; }
        cursosL.forEach(c => {
            const total = leccionesDe(c.id).length;
            const filas = personas.map(per => {
                const p = progreso.find(x => x.email === per.email && x.cursoId === c.id);
                const hechas = (p && Array.isArray(p.leccionesCompletadas)) ? p.leccionesCompletadas.length : 0;
                if (!p || (hechas === 0 && !(p && p.examenAprobado))) return '';
                const pct = total ? Math.round(hechas / total * 100) : 0;
                const exTxt = tieneExamen(c)
                    ? (p && p.examenAprobado ? `<span style="color:#1e8449;font-weight:bold">✅ ${p.examenNota || 0}%</span>`
                        : (p && p.examenBloqueado ? `<span style="color:#c0392b;font-weight:bold">🔒 no superó (${p.examenNota || 0}%)</span>`
                            : (p && p.examenNota != null ? `<span style="color:#c76a1c">✗ ${p.examenNota}% · reintenta</span>` : '—')))
                    : '<span style="color:#a3abb4">sin examen</span>';
                const pts = (p && p.examenAprobado && tieneExamen(c)) ? (c.examen.puntos || 100) : 0;
                return `<tr><td>${esc(per.nombre)}</td><td>${hechas}/${total} (${pct}%)</td><td>${exTxt}</td><td style="text-align:right">${pts ? '+' + pts : ''}</td></tr>`;
            }).filter(Boolean).join('');
            html += `<div style="background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px">
                <div style="font-weight:bold;color:var(--artal-blue);font-size:15px;margin-bottom:8px">${esc(c.emoji || '🎓')} ${esc(c.titulo || 'Curso')} <span style="color:#a3abb4;font-weight:normal;font-size:12.5px">· ${total} lección(es)</span></div>
                ${filas ? `<table style="width:100%;border-collapse:collapse;font-size:13.5px">
                    <thead><tr style="text-align:left;color:#8a93a0;font-size:11.5px"><th style="padding:6px 8px">Persona</th><th style="padding:6px 8px">Lecciones</th><th style="padding:6px 8px">Examen</th><th style="padding:6px 8px;text-align:right">Puntos</th></tr></thead>
                    <tbody>${filas.replace(/<tr>/g, '<tr style="border-top:1px solid #eef1f4">')}</tbody></table>`
                    : '<div style="color:#a3abb4;font-size:12.5px">Nadie ha empezado este curso.</div>'}
            </div>`;
        });
        cont.innerHTML = html;
    }

    // ---------------- Certificado ----------------
    window.verCertificado = (cursoId) => irA('certificado', cursoId);
    function renderCertificado(cont) {
        const c = cursoById(cursoSelId); if (!c) { irA('cursos'); return; }
        const p = progresoDe(cursoSelId);
        const aprob = p && p.examenAprobado;
        const fecha = (p && p.examenFecha && p.examenFecha.toDate) ? p.examenFecha.toDate() : new Date();
        const fTxt = fecha.toLocaleDateString('es-DO', { day: '2-digit', month: 'long', year: 'numeric' });
        cont.innerHTML = `<div class="crumbs"><a onclick="irA('curso','${c.id}')">← ${esc(c.titulo || 'Curso')}</a></div>
            ${aprob ? `<div class="cert" id="cert"><div class="cert-in">
                <img src="../logo.png" alt="ARTAL" class="cert-logo">
                <div class="cert-t">Certificado de aprobación</div>
                <div class="cert-sub">La Academia ARTAL certifica que</div>
                <div class="cert-name">${esc(usuario.nombre)}</div>
                <div class="cert-sub">completó y aprobó el curso</div>
                <div class="cert-curso">${esc(c.emoji || '🎓')} ${esc(c.titulo || '')}</div>
                <div class="cert-meta">Nota: ${p.examenNota || 0}% · ${esc(fTxt)}</div>
                <div class="cert-firma">ARTAL Dominicana · Formación interna</div>

            <div class="bar" style="margin-top:14px"><button class="btn-y" onclick="window.print()">🖨 Imprimir / guardar PDF</button><button class="btn-ghost" onclick="irA('curso','${c.id}')">Volver</button></div>`
            : '<div class="empty">Aún no has aprobado el examen de este curso.</div>'}`;

    // Saca el ID de un enlace de YouTube (watch, youtu.be, embed, shorts) o acepta el ID pelado.
    function ytId(url) {
        const s = String(url || '').trim(); if (!s) return '';
        let m = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/); if (m) return m[1];
        m = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/); if (m) return m[1];
        m = s.match(/youtube\.com\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{6,})/); if (m) return m[1];
        if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
        return '';
    }
    function videoEmbedHTML(url) {
        const id = ytId(url);
        if (id) return `<div class="lec-video"><iframe src="https://www.youtube.com/embed/${id}" title="Video de la lección" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
        if (/\.(mp4|webm|ogg)(\?|$)/i.test(url || '')) return `<div class="lec-video"><video src="${esc(url)}" controls playsinline></video></div>`;
        if (/^https?:\/\//i.test(url || '')) return `<a href="${esc(url)}" target="_blank" rel="noopener" class="btn-ghost" style="display:inline-block;margin:10px 0">▶ Ver video</a>`;
        return '';
    }

    function renderLeccion(cont) {
        const l = leccionById(leccionSelId); if (!l) { irA('curso', cursoSelId); return; }
        const c = cursoById(l.cursoId) || {};
        const lecs = leccionesDe(l.cursoId), idx = lecs.findIndex(x => x.id === l.id);
        const done = completadasDe(l.cursoId).has(l.id);
        const prev = idx > 0 ? lecs[idx - 1] : null, next = idx < lecs.length - 1 ? lecs[idx + 1] : null;
        // Las imágenes referenciadas dentro del texto ([img:N]) se ven en su sitio; abajo solo quedan las no usadas y los PDF.
        // Dylan 2026-10-28: NUNCA miniaturas de imágenes (abrían otra página). Las imágenes se ven grandes dentro del texto: en su
        // marca [img:N] o, si no se colocaron, al final del texto. Solo los PDF/documentos siguen como tarjeta de descarga.
        const docs = (Array.isArray(l.fotos) ? l.fotos : []).filter((f) => !(f.tipo === 'img' || /\.(png|jpe?g|webp|gif)(\?|$)/i.test(f.url || '')));
        const fotos = docs.length ? fotosThumbsHTML(docs, { coleccion: 'academiaLecciones', id: l.id, campo: 'fotos', puedeBorrar: false }) : '';
        const addBtn = esAutor ? fotoAddBtnHTML({ coleccion: 'academiaLecciones', id: l.id, campo: 'fotos', label: '📎 Agregar foto/PDF', pdf: true }) : '';
        cont.innerHTML = `<div class="crumbs"><a onclick="irA('cursos')">Cursos</a> › <a onclick="irA('curso','${l.cursoId}')">${esc(c.titulo || 'Curso')}</a></div>
            <div class="lec-read">
                <h2 ${esAutor ? `class="inline-txt-target" title="Doble clic para corregir el título" ondblclick="inlineTexto(this, (v) => guardarCampoLeccion('${l.id}', 'titulo', v))"` : ''}>${esc(l.titulo || 'Lección')}</h2>
                <div class="meta">Lección ${idx + 1} de ${lecs.length}${l.duracion ? ' · ⏱ ' + n2(l.duracion) + ' min' : ''}${esAutor ? ' · <span style="color:#1f6aa5">✎ doble clic en un párrafo o apartado para editarlo · ＋ entre bloques para añadir texto, apartado o imagen</span>' : ''}</div>
                ${videoEmbedHTML(l.video)}
                <div class="cont ${esAutor ? 'editable' : ''}" id="lec-cont">${contenidoHTML(l, esAutor)}</div>
                ${fotos}${addBtn}${esAutor && imgsDe(l).length ? `<div class="hint" style="font-size:12px;color:#8a93a0;margin-top:4px">Una imagen «sin colocar» se pone en su sitio con ＋ → 🖼️ Imagen. Para quitar un adjunto del todo: ✏ Editar lección → adjuntos.</div>` : ''}
                ${esAutor ? `<div class="bar" style="margin-top:14px"><button class="btn-ghost" onclick="abrirEditarLeccion('${l.id}')">✏ Editar lección</button><button class="btn-ghost" onclick="editarContenidoInline('${l.id}')" title="Todo el texto en una sola caja">📝 Editar todo el texto</button><button class="btn-ia" style="margin-top:0" onclick="desarrollarLeccionIA('${l.id}')">✨ Desarrollar con IA</button></div>` : ''}
                <div class="nav">
                    <button class="btn-done ${done ? 'is-done' : ''}" onclick="toggleHecha('${l.cursoId}','${l.id}')">${done ? '✓ Completada' : 'Marcar como completada'}</button>
                    <button class="btn-ghost" onclick="presentar('${l.id}')" title="Ver la lección como diapositivas, un apartado por pantalla">▶ Presentación</button>
                    ${prev ? `<button class="btn-ghost" onclick="irA('leccion','${l.cursoId}','${prev.id}')">← Anterior</button>` : ''}
                    ${next ? `<button class="btn-ghost" onclick="irA('leccion','${l.cursoId}','${next.id}')">Siguiente →</button>` : ''}
                </div>
            </div>`;
    }
    /* ===== Contenido con imágenes en medio del texto y edición en pantalla (Dylan 2026-10-28, video de Anny) =====
       El contenido sigue siendo texto plano. Dos marcas:
       · una línea TODA EN MAYÚSCULAS (3–80 caracteres) se muestra como título de apartado («QUÉ ES UNA CORREDERA»);
       · [img:N] (o [img:N|pie de foto]) muestra en ese punto la imagen Nº N de los adjuntos de la lección (1 = la primera).
       Las imágenes se suben como siempre con «📎 Agregar foto/PDF» y luego se colocan donde toca. */
    let inlineEditando = null;   // {id, campo} mientras hay una edición en pantalla abierta (render() no repinta)
    const imgsDe = (l) => (Array.isArray(l.fotos) ? l.fotos : []).map((f, i) => ({ ...f, n: i + 1 })).filter((f) => f.tipo === 'img' || /\.(png|jpe?g|webp|gif)(\?|$)/i.test(f.url || ''));
    function imagenesUsadas(txt) { const u = new Set(); String(txt || '').replace(/\[img:(\d+)(\|[^\]]*)?\]/g, (m, n) => { u.add(Number(n)); return m; }); return u; }
    // Título de apartado: línea corta en MAYÚSCULAS; se ignora lo que va entre paréntesis («MEDIDAS ESTÁNDAR (más baratas que a medida)»).
    const esTituloSeccion = (ln) => { const t = ln.trim().replace(/\s*\([^)]*\)\s*$/, ''); return t.length >= 3 && t.length <= 80 && /[A-ZÁÉÍÓÚÑ]{3}/.test(t) && t === t.toUpperCase() && !/\[img:/.test(ln); };
    // Marca de imagen ampliada (2026-11-03): [img:N|pie|al|tam] — al = izq|centro|der (texto al lado si izq/der), tam = 40|65|100 (% del ancho).
    // Las marcas viejas [img:N] y [img:N|pie] siguen valiendo tal cual.
    const IMG_RE_SRC = '\\[img:(\\d+)((?:\\|[^\\]|]*)*)\\]';
    function parseImg(n, rest) { const p = String(rest || '').split('|').slice(1); return { n: Number(n), pie: p[0] || '', al: ['izq', 'der'].includes(p[1]) ? p[1] : 'centro', size: [40, 65, 100].includes(Number(p[2])) ? Number(p[2]) : 100 }; }
    function imgTok(o) { const al = o.al && o.al !== 'centro' ? o.al : '', sz = o.size && Number(o.size) !== 100 ? String(o.size) : ''; const parts = [String(o.n)]; if (o.pie || al || sz) parts.push(o.pie || ''); if (al || sz) parts.push(al); if (sz) parts.push(sz); return '[img:' + parts.join('|') + ']'; }
    const esLineaImg = (ln) => /^\s*(\[img:[^\]]*\]\s*)+$/.test(ln);
    const lineasDe = (l) => String(l.contenido || '').split('\n');
    function figHTML(l, o, i, editor) {
        const f = (Array.isArray(l.fotos) ? l.fotos : [])[o.n - 1];
        if (!f || !f.url) return `<span style="color:#c0392b;font-size:12px">[imagen ${o.n} no existe]</span>`;
        const cap = esc(o.pie || f.nombre || '');
        const style = o.size !== 100 ? ` style="max-width:${o.size}%"` : '';
        const B = (on, t, fn, txt, cls = '') => `<button class="${on ? 'on ' : ''}${cls}" title="${t}" onclick="${fn}">${txt}</button>`;
        const tools = editor ? `<div class="fig-tools">
            ${B(o.al === 'izq', 'Imagen a la izquierda, texto al lado', `imgOpt('${l.id}',${i},${o.n},'al','izq')`, '◧ izq')}${B(o.al === 'centro', 'Imagen centrada, sola en su línea', `imgOpt('${l.id}',${i},${o.n},'al','centro')`, '▣ centro')}${B(o.al === 'der', 'Imagen a la derecha, texto al lado', `imgOpt('${l.id}',${i},${o.n},'al','der')`, '◨ der')}<span class="sep">·</span>
            ${B(o.size === 40, 'Pequeña (40 %)', `imgOpt('${l.id}',${i},${o.n},'size',40)`, 'S')}${B(o.size === 65, 'Mediana (65 %)', `imgOpt('${l.id}',${i},${o.n},'size',65)`, 'M')}${B(o.size === 100, 'Grande (todo el ancho)', `imgOpt('${l.id}',${i},${o.n},'size',100)`, 'L')}<span class="sep">·</span>
            ${B(false, 'Mover un bloque hacia arriba', `moverBloque('${l.id}',${i},-1)`, '↑')}${B(false, 'Mover un bloque hacia abajo', `moverBloque('${l.id}',${i},1)`, '↓')}<span class="sep">·</span>
            ${B(false, 'Quitar la imagen de este punto (sigue adjunta a la lección)', `quitarImagenInline('${l.id}',${i},${o.n})`, '✕ quitar', 'del')}</div>`.replace(/\n\s*/g, '') : '';   // sin saltos: .cont es pre-wrap
        const ext = editor && f.externa ? `<span class="figext" title="Imagen enlazada desde otra web: si esa página la quita, aquí desaparece. Mejor sube el archivo.">🔗 externa</span>` : '';
        const pie = editor ? `<span class="pie-txt" title="Doble clic para cambiar el pie de foto" ondblclick="event.stopPropagation(); editarPie('${l.id}', ${i}, ${o.n}, this)">${cap || '(sin pie de foto)'}</span>` : cap;
        return `<figure class="lec-fig fig-${o.al}"${style}><img src="${esc(f.url)}" loading="lazy" alt="${cap}" onclick="verImagen('${l.id}', ${o.n})" title="Toca para ampliar"><figcaption>${pie}${ext}</figcaption>${tools}</figure>`;
    }
    function lineaHTML(l, ln, i, editor) {
        const re = new RegExp(IMG_RE_SRC, 'g'); let out = '', last = 0, m;
        while ((m = re.exec(ln))) { out += esc(ln.slice(last, m.index)); out += figHTML(l, parseImg(m[1], m[2]), i, editor); last = re.lastIndex; }
        return out + esc(ln.slice(last));
    }
    // El contenido se pinta por BLOQUES (una línea = un bloque: párrafo, apartado en MAYÚSCULAS, imagen o línea en blanco).
    // Sin saltos de línea entre elementos: .cont es white-space: pre-wrap.
    function contenidoHTML(l, editor) {
        const id = l.id, lineas = lineasDe(l);
        const gap = (i) => editor ? `<div class="blk-gap" data-after="${i}"><span class="gap-line"></span><button class="gap-plus" title="Añadir aquí texto, un apartado o una imagen" onclick="abrirGap('${id}', ${i}, this)">＋</button></div>` : '';
        const pen = (i, t) => editor ? `<button class="blk-pen" title="${t}" onclick="editarBloque('${id}', ${i})">✎</button>` : '';
        const dbl = (i) => editor ? ` ondblclick="editarBloque('${id}', ${i})"` : '';
        let out = gap(-1);
        lineas.forEach((ln, i) => {
            if (!ln.trim()) { out += `<div class="blk-blank" data-i="${i}"></div>${gap(i)}`; return; }
            if (esLineaImg(ln)) { out += `<div class="blk fig-row" data-i="${i}">${lineaHTML(l, ln, i, editor)}</div>${gap(i)}`; return; }
            if (esTituloSeccion(ln)) { out += `<div class="clear"></div><h4 class="sec blk" data-i="${i}"${dbl(i)}>${esc(ln)}${pen(i, 'Editar este apartado')}</h4>${gap(i)}`; return; }
            out += `<div class="blk txt" data-i="${i}"${dbl(i)}>${lineaHTML(l, ln, i, editor)}${pen(i, 'Editar este párrafo')}</div>${gap(i)}`;
        });
        return out + '<div class="clear"></div>'
            + imgsDe(l).filter((f) => !imagenesUsadas(l.contenido).has(f.n)).map((f) => `<figure class="lec-fig"><img src="${esc(f.url)}" loading="lazy" alt="${esc(f.nombre || '')}" onclick="verImagen('${l.id}', ${f.n})" title="Toca para ampliar"><figcaption>${esc(f.nombre || '')}${editor ? ` <span class="figdel" style="color:#1f6aa5" title="Colocarla en un punto del texto: ＋ entre bloques → 🖼️ Imagen">(sin colocar en el texto)</span>` : ''}</figcaption></figure>`).join('');
    }
    // ---- Ampliar imagen en la misma página (sin abrir otra pestaña) con ‹ › entre las imágenes de la lección ----
