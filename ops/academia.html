<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 820px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 16px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-ghost { background: transparent; border: 1.5px solid #cfd6dd; color: var(--artal-blue); border-radius: 9px; padding: 9px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; }
    .intro { font-size: 13px; color: #667; margin: 0 0 14px; line-height: 1.5; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .curso-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; cursor: pointer; border-top: 4px solid var(--artal-blue); transition: transform .08s, box-shadow .12s; position: relative; }
    .curso-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -10px rgba(0,0,0,.35); }
    .curso-card .emoji { font-size: 30px; }
    .curso-card .ttl { font-weight: bold; color: var(--artal-blue); font-size: 15.5px; margin: 6px 0 3px; }
    .curso-card .desc { font-size: 12.5px; color: #667; line-height: 1.4; }
    .curso-card .cat { display: inline-block; font-size: 10.5px; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; color: #6a7684; background: #eef1f4; border-radius: 20px; padding: 2px 9px; margin-top: 8px; }
    .badge-draft { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: bold; background: #fdeaea; color: #d9483b; border-radius: 20px; padding: 2px 8px; }
    .prog { margin-top: 10px; }
    .prog-bar { height: 7px; border-radius: 6px; background: #e9edf1; overflow: hidden; }
    .prog-bar > span { display: block; height: 100%; background: #2ecc71; }
    .prog-txt { font-size: 11px; color: #8a93a0; margin-top: 4px; }

    .lec-list { display: flex; flex-direction: column; gap: 8px; }
    .lec-row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 11px; box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; }
    .lec-row .num { width: 30px; height: 30px; border-radius: 50%; background: #eef1f4; color: var(--artal-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; flex: 0 0 auto; }
    .lec-row.done .num { background: #d5f5e3; color: #1e8449; }
    .lec-row .ttl { font-weight: bold; color: #2a3742; font-size: 14px; }
    .lec-row .meta { font-size: 11.5px; color: #8a93a0; margin-top: 2px; }
    .lec-row .adm { margin-left: auto; display: flex; gap: 4px; }
    .lec-row .adm button { background: transparent; border: none; cursor: pointer; font-size: 14px; color: #9aa4ae; }

    .lec-read h2 { color: var(--artal-blue); font-size: 20px; margin: 4px 0 2px; }
    .lec-read .meta { font-size: 12.5px; color: #8a93a0; margin-bottom: 14px; }
    .lec-read .cont { font-size: 15px; color: #2f3944; line-height: 1.6; white-space: pre-wrap; }
    .lec-read .nav { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .btn-done { background: #2ecc71; color: #fff; border: none; border-radius: 9px; padding: 12px 18px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-done.is-done { background: #eaf7ef; color: #1e8449; }

    .crumbs { font-size: 12.5px; color: #8a93a0; margin-bottom: 10px; }
    .crumbs a { color: var(--artal-blue); font-weight: bold; text-decoration: none; cursor: pointer; }

    .fotos-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .foto-thumb { position: relative; display: inline-block; }
    .foto-thumb img { width: 92px; height: 92px; object-fit: cover; border-radius: 9px; border: 1.5px solid #e3e7ec; }
    .foto-thumb.foto-pdf a { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 92px; height: 92px; border-radius: 9px; border: 1.5px solid #e3e7ec; background: #f7f9fb; text-decoration: none; color: #556; font-size: 11px; }
    .foto-thumb.foto-pdf .pdf-ico { font-size: 24px; } .foto-thumb.foto-pdf .pdf-nom { padding: 0 4px; text-align: center; }
    .foto-del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #e74c3c; color: #fff; cursor: pointer; font-weight: bold; line-height: 1; }
    .foto-add-btn { display: inline-block; margin-top: 10px; background: var(--artal-blue); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: bold; cursor: pointer; }
    .foto-add-btn input { display: none; }

    .ai-box { background: #f4f2fd; border: 1.5px dashed #c3b9ef; border-radius: 10px; padding: 12px; margin-top: 14px; }
    .ai-box .ai-lbl { font-size: 12.5px; font-weight: bold; color: #5b3fd0; display: block; margin-bottom: 6px; }
    .ai-box textarea { min-height: 80px; }
    .btn-ia { background: #6a3df0; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; margin-top: 8px; }
    .btn-ia:disabled { opacity: .6; cursor: default; }
    .ai-msg { font-size: 12px; color: #667; margin-top: 8px; }
    .esq-item { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #eef1f4; }
    .esq-item input { width: auto; min-height: 0; margin-top: 3px; }
    .esq-item .t { font-weight: bold; color: #2a3742; font-size: 13.5px; } .esq-item .r { font-size: 12px; color: #778; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 12px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 130px; }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .chk-line input { width: auto; min-height: 0; }
    .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
    .empty { color: #8a93a0; text-align: center; padding: 30px 10px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" id="btn-back" title="Volver">← Volver</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Academia</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="vista"></div>
</main>

<!-- Modal: curso -->
<div class="modal-overlay" id="modal-curso">
    <div class="modal-box">
        <h2 id="curso-modal-title">Nuevo curso</h2>
        <div class="grid2">
            <div><label>Emoji / ícono</label><input type="text" id="c-emoji" maxlength="4" placeholder="🎓"></div>
            <div><label>Categoría</label><input type="text" id="c-categoria" list="cat-cursos" placeholder="Ej. Inducción"></div>
        </div>
        <label>Título *</label>
        <input type="text" id="c-titulo" placeholder="Ej. Inducción del instalador">
        <label>Descripción</label>
        <textarea id="c-desc" style="min-height:70px" placeholder="De qué trata este curso…"></textarea>
        <div class="chk-line"><input type="checkbox" id="c-publicado" checked><label for="c-publicado">Publicado (visible para el equipo)</label></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-curso')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarCurso()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal: lección -->
<div class="modal-overlay" id="modal-leccion">
    <div class="modal-box">
        <h2 id="lec-modal-title">Nueva lección</h2>
        <div class="grid2">
            <div><label>Título *</label><input type="text" id="l-titulo" placeholder="Ej. Cómo instalar una corredera"></div>
            <div><label>Duración (min) <span class="lbl-opt">— opcional</span></label><input type="number" id="l-duracion" min="0" step="1" placeholder="10"></div>
        </div>
        <div class="ai-box">
            <span class="ai-lbl">✨ Asistente IA — convierte tu conocimiento en clase</span>
            <textarea id="l-notas" placeholder="Escribe o DICTA (con el micrófono del teclado) tu conocimiento en bruto: cómo lo explicas tú, pasos, trucos, errores comunes… No importa el orden."></textarea>
            <button type="button" class="btn-ia" onclick="iaRedactarLeccion()">✨ Convertir en lección</button>
            <div class="ai-msg" id="l-ia-msg"></div>
        </div>
        <label>Contenido</label>
        <textarea id="l-contenido" placeholder="Aquí aparece la lección (puedes escribirla a mano o generarla con el asistente de arriba)."></textarea>
        <div id="l-adjuntos-wrap" style="display:none">
            <label>Fotos y PDF <span class="lbl-opt">— se guardan al instante</span></label>
            <div id="l-adjuntos"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-leccion')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarLeccion()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal: generar esquema del curso con IA -->
<div class="modal-overlay" id="modal-esquema">
    <div class="modal-box">
        <h2>✨ Generar curso con IA</h2>
        <p style="font-size:12.5px;color:#667;margin:0 0 6px;line-height:1.5;">Cuéntale a la IA de qué trata el curso y todo lo que se te ocurra. Te propone las lecciones en orden; tú eliges cuáles crear y luego las editas.</p>
        <label>Tema del curso</label>
        <input type="text" id="e-tema" placeholder="Ej. Instalación de ventanas correderas">
        <label>Notas / lo que sabes <span class="lbl-opt">— mientras más, mejor</span></label>
        <textarea id="e-notas" style="min-height:120px" placeholder="Escribe o dicta: qué debe aprender un instalador nuevo, en qué orden, trucos, pasos…"></textarea>
        <button type="button" class="btn-ia" onclick="iaGenerarEsquema()">✨ Proponer lecciones</button>
        <div class="ai-msg" id="e-ia-msg"></div>
        <div id="e-resultado"></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-esquema')">Cerrar</button>
            <button class="btn-guardar" id="e-crear-btn" style="display:none" onclick="crearLeccionesEsquema()">Crear lecciones marcadas</button>
        </div>
    </div>
</div>

<datalist id="cat-cursos">
    <option value="Inducción"></option><option value="Mentalidad de trabajo"></option>
    <option value="Instalación"></option><option value="Medición"></option>
    <option value="Producto nuevo"></option><option value="Herramientas y seguridad"></option>
</datalist>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { fotoAddBtnHTML, fotosThumbsHTML } from './fotos.js';

    // Todo el equipo puede VER la academia (admin/lector siempre pasan). Editar el contenido queda
    // gateado en la UI a admin/capacitador (esAutor).
    const usuario = await requireAuth(['instalador', 'ayudante', 'chofer', 'fabrica', 'contratista', 'cotizaciones', 'contable', 'capacitador']);
    wireBackButton(usuario.roles);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    const esAutor = usuario.roles.includes('admin') || usuario.roles.includes('capacitador');
    const FN_ACADEMIA = 'https://us-central1-artal-operaciones.cloudfunctions.net/academiaRedactar';

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const miClave = usuario.email.replace(/[^a-zA-Z0-9]/g, '_');

    let cursos = [], lecciones = [], progreso = [];
    let vista = 'cursos', cursoSelId = null, leccionSelId = null;
    let editandoCursoId = null, editandoLeccionId = null;

    onSnapshot(collection(db, 'academiaCursos'), (s) => { cursos = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    onSnapshot(collection(db, 'academiaLecciones'), (s) => {
        lecciones = s.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
        // Si el modal de edición está abierto, refresca sus adjuntos (fotos.js escribe en Firestore).
        if (editandoLeccionId && document.getElementById('modal-leccion').classList.contains('show')) renderLecAdjuntos(editandoLeccionId);
    }, () => {});
    onSnapshot(collection(db, 'academiaProgreso'), (s) => { progreso = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});

    const cursoById = (id) => cursos.find(c => c.id === id) || null;
    const leccionById = (id) => lecciones.find(l => l.id === id) || null;
    const leccionesDe = (cursoId) => lecciones.filter(l => l.cursoId === cursoId).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    const cursosVisibles = () => cursos.filter(c => esAutor || c.publicado !== false).sort((a, b) => (a.orden || 0) - (b.orden || 0) || String(a.titulo || '').localeCompare(String(b.titulo || ''), 'es'));
    // Mi progreso de un curso: Set de leccionId completadas.
    function completadasDe(cursoId) {
        const p = progreso.find(x => x.id === miClave + '__' + cursoId);
        return new Set((p && Array.isArray(p.leccionesCompletadas)) ? p.leccionesCompletadas : []);
    }
    async function marcarLeccion(cursoId, leccionId, hecha) {
        const set = completadasDe(cursoId);
        if (hecha) set.add(leccionId); else set.delete(leccionId);
        const total = leccionesDe(cursoId).length;
        const arr = [...set];
        try {
            await setDoc(doc(db, 'academiaProgreso', miClave + '__' + cursoId), {
                email: usuario.email, nombre: usuario.nombre, cursoId,
                leccionesCompletadas: arr, completado: total > 0 && arr.length >= total,
                fechaActualizado: serverTimestamp()
            }, { merge: true });
        } catch (e) { alert('No se pudo guardar tu progreso: ' + (e && e.message ? e.message : e)); }
    }

    window.cerrar = (id) => document.getElementById(id).classList.remove('show');
    window.irA = function (v, cursoId, leccionId) { vista = v; if (cursoId !== undefined) cursoSelId = cursoId; if (leccionId !== undefined) leccionSelId = leccionId; render(); };

    // ---------------- Render ----------------
    function render() {
        const cont = document.getElementById('vista');
        if (vista === 'leccion' && leccionById(leccionSelId)) return renderLeccion(cont);
        if (vista === 'curso' && cursoById(cursoSelId)) return renderCurso(cont);
        vista = 'cursos'; renderCursos(cont);
    }

    function renderCursos(cont) {
        const list = cursosVisibles();
        const nuevo = esAutor ? `<button class="btn-y" onclick="abrirCurso()">+ Nuevo curso</button>` : '';
        let html = `<p class="intro">Clases para aprender a instalar, la mentalidad de trabajo de ARTAL y todo lo necesario para integrarte al equipo. Ve tu avance en cada curso.</p><div class="bar">${nuevo}</div>`;
        if (!list.length) { cont.innerHTML = html + '<p class="empty">Aún no hay cursos. ' + (esAutor ? 'Crea el primero con «+ Nuevo curso».' : 'Pronto habrá contenido.') + '</p>'; return; }
        html += '<div class="grid">' + list.map(c => {
            const total = leccionesDe(c.id).length, hechas = completadasDe(c.id).size;
            const pct = total ? Math.round(hechas / total * 100) : 0;
            return `<div class="curso-card" onclick="irA('curso','${c.id}')" style="border-top-color:${c.publicado === false ? '#c9ced6' : 'var(--artal-blue)'}">
                ${c.publicado === false ? '<span class="badge-draft">Borrador</span>' : ''}
                <div class="emoji">${esc(c.emoji || '🎓')}</div>
                <div class="ttl">${esc(c.titulo || 'Curso')}</div>
                ${c.descripcion ? `<div class="desc">${esc(c.descripcion)}</div>` : ''}
                ${c.categoria ? `<span class="cat">${esc(c.categoria)}</span>` : ''}
                <div class="prog"><div class="prog-bar"><span style="width:${pct}%"></span></div><div class="prog-txt">${hechas}/${total} lecciones${pct === 100 && total ? ' · completado ✓' : ''}</div></div>
            </div>`;
        }).join('') + '</div>';
        cont.innerHTML = html;
    }

    function renderCurso(cont) {
        const c = cursoById(cursoSelId); if (!c) { irA('cursos'); return; }
        const lecs = leccionesDe(c.id), done = completadasDe(c.id);
        const admCurso = esAutor ? `<button class="btn-ghost" onclick="abrirEditarCurso('${c.id}')">✏ Editar curso</button>
            <button class="btn-ghost" onclick="togglePublicado('${c.id}')">${c.publicado === false ? '👁 Publicar' : '🚫 Despublicar'}</button>
            <button class="btn-ghost" style="color:#c0392b;border-color:#f0c9c4" onclick="borrarCurso('${c.id}')">🗑 Eliminar</button>` : '';
        let html = `<div class="crumbs"><a onclick="irA('cursos')">← Cursos</a></div>
            <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;">
                <div style="font-size:34px">${esc(c.emoji || '🎓')}</div>
                <div><h2 style="color:var(--artal-blue);font-size:20px;margin:0">${esc(c.titulo || 'Curso')}</h2>
                ${c.descripcion ? `<div style="font-size:13.5px;color:#556;margin-top:3px">${esc(c.descripcion)}</div>` : ''}</div>
            </div>`;
        if (esAutor) html += `<div class="bar">${admCurso}<button class="btn-y" onclick="abrirLeccion('${c.id}')">+ Lección</button><button class="btn-ia" onclick="abrirEsquema('${c.id}')">✨ Generar curso con IA</button></div>`;
        if (!lecs.length) { cont.innerHTML = html + '<p class="empty">Este curso todavía no tiene lecciones.</p>'; return; }
        html += '<div class="lec-list">' + lecs.map((l, i) => {
            const isDone = done.has(l.id);
            const adm = esAutor ? `<div class="adm">
                <button title="Subir" onclick="event.stopPropagation();moverLeccion('${l.id}',-1)">▲</button>
                <button title="Bajar" onclick="event.stopPropagation();moverLeccion('${l.id}',1)">▼</button>
                <button title="Editar" onclick="event.stopPropagation();abrirEditarLeccion('${l.id}')">✏</button>
                <button title="Eliminar" style="color:#e74c3c" onclick="event.stopPropagation();borrarLeccion('${l.id}')">🗑</button>
            </div>` : `<div class="adm">${isDone ? '<span style="color:#1e8449;font-weight:bold;font-size:13px">✓</span>' : ''}</div>`;
            const nAdj = (Array.isArray(l.fotos) ? l.fotos.length : 0);
            const meta = [l.duracion ? '⏱ ' + n2(l.duracion) + ' min' : '', nAdj ? '📎 ' + nAdj : ''].filter(Boolean).join(' · ');
            return `<div class="lec-row ${isDone ? 'done' : ''}" onclick="irA('leccion','${c.id}','${l.id}')">
                <div class="num">${isDone ? '✓' : (i + 1)}</div>
                <div><div class="ttl">${esc(l.titulo || 'Lección')}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
                ${adm}
            </div>`;
        }).join('') + '</div>';
        cont.innerHTML = html;
    }

    function renderLeccion(cont) {
        const l = leccionById(leccionSelId); if (!l) { irA('curso', cursoSelId); return; }
        const c = cursoById(l.cursoId) || {};
        const lecs = leccionesDe(l.cursoId), idx = lecs.findIndex(x => x.id === l.id);
        const done = completadasDe(l.cursoId).has(l.id);
        const prev = idx > 0 ? lecs[idx - 1] : null, next = idx < lecs.length - 1 ? lecs[idx + 1] : null;
        const fotos = fotosThumbsHTML(l.fotos, { coleccion: 'academiaLecciones', id: l.id, campo: 'fotos', puedeBorrar: esAutor });
        const addBtn = esAutor ? fotoAddBtnHTML({ coleccion: 'academiaLecciones', id: l.id, campo: 'fotos', label: '📎 Agregar foto/PDF', pdf: true }) : '';
        cont.innerHTML = `<div class="crumbs"><a onclick="irA('cursos')">Cursos</a> › <a onclick="irA('curso','${l.cursoId}')">${esc(c.titulo || 'Curso')}</a></div>
            <div class="lec-read">
                <h2>${esc(l.titulo || 'Lección')}</h2>
                <div class="meta">Lección ${idx + 1} de ${lecs.length}${l.duracion ? ' · ⏱ ' + n2(l.duracion) + ' min' : ''}</div>
                <div class="cont">${esc(l.contenido || '')}</div>
                ${fotos}${addBtn}
                ${esAutor ? `<div class="bar" style="margin-top:14px"><button class="btn-ghost" onclick="abrirEditarLeccion('${l.id}')">✏ Editar lección</button><button class="btn-ia" style="margin-top:0" onclick="desarrollarLeccionIA('${l.id}')">✨ Desarrollar con IA</button></div>` : ''}
                <div class="nav">
                    <button class="btn-done ${done ? 'is-done' : ''}" onclick="toggleHecha('${l.cursoId}','${l.id}')">${done ? '✓ Completada' : 'Marcar como completada'}</button>
                    ${prev ? `<button class="btn-ghost" onclick="irA('leccion','${l.cursoId}','${prev.id}')">← Anterior</button>` : ''}
                    ${next ? `<button class="btn-ghost" onclick="irA('leccion','${l.cursoId}','${next.id}')">Siguiente →</button>` : ''}
                </div>
            </div>`;
    }
    window.toggleHecha = async function (cursoId, leccionId) {
        const yes = !completadasDe(cursoId).has(leccionId);
        await marcarLeccion(cursoId, leccionId, yes);
    };

    // ---------------- Cursos (autor) ----------------
    window.abrirCurso = function () {
        editandoCursoId = null;
        document.getElementById('curso-modal-title').textContent = 'Nuevo curso';
        document.getElementById('c-emoji').value = '🎓';
        document.getElementById('c-categoria').value = '';
        document.getElementById('c-titulo').value = '';
        document.getElementById('c-desc').value = '';
        document.getElementById('c-publicado').checked = true;
        document.getElementById('modal-curso').classList.add('show');
    };
    window.abrirEditarCurso = function (id) {
        const c = cursoById(id); if (!c) return;
        editandoCursoId = id;
        document.getElementById('curso-modal-title').textContent = 'Editar curso';
        document.getElementById('c-emoji').value = c.emoji || '🎓';
        document.getElementById('c-categoria').value = c.categoria || '';
        document.getElementById('c-titulo').value = c.titulo || '';
        document.getElementById('c-desc').value = c.descripcion || '';
        document.getElementById('c-publicado').checked = c.publicado !== false;
        document.getElementById('modal-curso').classList.add('show');
    };
    window.guardarCurso = async function () {
        const titulo = document.getElementById('c-titulo').value.trim();
        if (!titulo) { alert('Escribe el título del curso.'); return; }
        const datos = {
            titulo, emoji: document.getElementById('c-emoji').value.trim() || '🎓',
            categoria: document.getElementById('c-categoria').value.trim(),
            descripcion: document.getElementById('c-desc').value.trim(),
            publicado: document.getElementById('c-publicado').checked
        };
        const btn = document.querySelector('#modal-curso .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            if (editandoCursoId) await updateDoc(doc(db, 'academiaCursos', editandoCursoId), datos);
            else { const orden = cursos.length; const r = await addDoc(collection(db, 'academiaCursos'), { ...datos, orden, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() }); cursoSelId = r.id; }
            cerrar('modal-curso');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.togglePublicado = async function (id) {
        const c = cursoById(id); if (!c) return;
        try { await updateDoc(doc(db, 'academiaCursos', id), { publicado: c.publicado === false }); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrarCurso = async function (id) {
        const lecs = leccionesDe(id);
        if (!confirm('¿Eliminar este curso' + (lecs.length ? ' y sus ' + lecs.length + ' lección(es)' : '') + '? No se puede deshacer.')) return;
        try {
            for (const l of lecs) await deleteDoc(doc(db, 'academiaLecciones', l.id));
            await deleteDoc(doc(db, 'academiaCursos', id));
            irA('cursos');
        } catch (e) { alert('No se pudo eliminar: ' + e.message); }
    };

    // ---------------- Lecciones (autor) ----------------
    window.abrirLeccion = function (cursoId) {
        editandoLeccionId = null;
        cursoSelId = cursoId;
        document.getElementById('lec-modal-title').textContent = 'Nueva lección';
        document.getElementById('l-titulo').value = '';
        document.getElementById('l-duracion').value = '';
        document.getElementById('l-contenido').value = '';
        document.getElementById('l-notas').value = ''; document.getElementById('l-ia-msg').textContent = '';
        document.getElementById('l-adjuntos-wrap').style.display = 'none';   // se suben tras crearla
        document.getElementById('modal-leccion').classList.add('show');
    };
    window.abrirEditarLeccion = function (id) {
        const l = leccionById(id); if (!l) return;
        editandoLeccionId = id;
        document.getElementById('lec-modal-title').textContent = 'Editar lección';
        document.getElementById('l-titulo').value = l.titulo || '';
        document.getElementById('l-duracion').value = l.duracion != null ? l.duracion : '';
        document.getElementById('l-contenido').value = l.contenido || '';
        document.getElementById('l-notas').value = ''; document.getElementById('l-ia-msg').textContent = '';
        renderLecAdjuntos(id);
        document.getElementById('l-adjuntos-wrap').style.display = 'block';
        document.getElementById('modal-leccion').classList.add('show');
    };
    function renderLecAdjuntos(id) {
        const l = leccionById(id) || {};
        document.getElementById('l-adjuntos').innerHTML =
            fotosThumbsHTML(l.fotos, { coleccion: 'academiaLecciones', id, campo: 'fotos', puedeBorrar: true }) +
            fotoAddBtnHTML({ coleccion: 'academiaLecciones', id, campo: 'fotos', label: '📎 Agregar foto/PDF', pdf: true });
    }
    window.guardarLeccion = async function () {
        const titulo = document.getElementById('l-titulo').value.trim();
        if (!titulo) { alert('Escribe el título de la lección.'); return; }
        const datos = {
            titulo, duracion: n2(document.getElementById('l-duracion').value),
            contenido: document.getElementById('l-contenido').value.trim()
        };
        const btn = document.querySelector('#modal-leccion .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            if (editandoLeccionId) {
                await updateDoc(doc(db, 'academiaLecciones', editandoLeccionId), datos);
            } else {
                const orden = leccionesDe(cursoSelId).length;
                const r = await addDoc(collection(db, 'academiaLecciones'), { ...datos, cursoId: cursoSelId, orden, fotos: [], creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
                // Deja la lección abierta en edición para poder subirle fotos/PDF enseguida.
                editandoLeccionId = r.id;
                document.getElementById('lec-modal-title').textContent = 'Editar lección';
                renderLecAdjuntos(r.id);
                document.getElementById('l-adjuntos-wrap').style.display = 'block';
                btn.disabled = false; btn.textContent = 'Guardar';
                return;
            }
            cerrar('modal-leccion');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.moverLeccion = async function (id, dir) {
        const l = leccionById(id); if (!l) return;
        const lecs = leccionesDe(l.cursoId), i = lecs.findIndex(x => x.id === id), j = i + dir;
        if (j < 0 || j >= lecs.length) return;
        try {
            await updateDoc(doc(db, 'academiaLecciones', lecs[i].id), { orden: j });
            await updateDoc(doc(db, 'academiaLecciones', lecs[j].id), { orden: i });
        } catch (e) { alert('No se pudo reordenar: ' + e.message); }
    };
    window.borrarLeccion = async function (id) {
        if (!confirm('¿Eliminar esta lección?')) return;
        try { await deleteDoc(doc(db, 'academiaLecciones', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    // ---------------- Asistente IA ----------------
    // Convierte las notas en bruto del modal de lección en una lección estructurada.
    window.iaRedactarLeccion = async function () {
        let notas = document.getElementById('l-notas').value.trim();
        const msg = document.getElementById('l-ia-msg');
        if (!notas) {
            // Sin notas nuevas: desarrollar a partir del borrador que ya tiene la lección (resumen del esquema).
            notas = document.getElementById('l-contenido').value
                .replace(/^\[Borrador\]\s*/, '')
                .replace(/\(Abre esta lecci[oó]n[\s\S]*?\)/, '')
                .trim();
        }
        if (!notas) { msg.textContent = 'Escribe o dicta tus notas arriba primero (o parte de un borrador del esquema).'; return; }
        const btn = document.querySelector('#modal-leccion .btn-ia');
        btn.disabled = true; const t0 = btn.textContent; btn.textContent = '✨ Redactando…'; msg.textContent = 'La IA está armando la lección…';
        try {
            const r = await fetch(FN_ACADEMIA, {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ modo: 'leccion', notas, titulo: document.getElementById('l-titulo').value.trim(), curso: (cursoById(cursoSelId) || {}).titulo || '' })
            });
            const data = await r.json();
            if (!r.ok || data.error) throw new Error(data.error || 'error');
            if (data.contenido) document.getElementById('l-contenido').value = data.contenido;
            if (data.titulo && !document.getElementById('l-titulo').value.trim()) document.getElementById('l-titulo').value = data.titulo;
            msg.textContent = '✓ Listo. Revisa y ajusta lo que quieras antes de guardar.';
        } catch (e) {
            msg.textContent = 'No se pudo generar (¿está desplegada la función?). Detalle: ' + (e && e.message ? e.message : e);
        } finally { btn.disabled = false; btn.textContent = t0; }
    };

    // Un clic desde la vista de la lección: abre el editor con el borrador y desarrolla el contenido.
    window.desarrollarLeccionIA = function (id) {
        abrirEditarLeccion(id);          // llena título + contenido (borrador del esquema)
        iaRedactarLeccion();             // sin notas nuevas → parte del borrador existente
    };

    // Genera el esquema de un curso (lista de lecciones) desde un tema + notas.
    let esquemaActual = null;
    window.abrirEsquema = function (cursoId) {
        cursoSelId = cursoId;
        const c = cursoById(cursoId) || {};
        document.getElementById('e-tema').value = c.titulo || '';
        document.getElementById('e-notas').value = '';
        document.getElementById('e-resultado').innerHTML = '';
        document.getElementById('e-ia-msg').textContent = '';
        document.getElementById('e-crear-btn').style.display = 'none';
        esquemaActual = null;
        document.getElementById('modal-esquema').classList.add('show');
    };
    window.iaGenerarEsquema = async function () {
        const notas = document.getElementById('e-notas').value.trim();
        const tema = document.getElementById('e-tema').value.trim();
        const msg = document.getElementById('e-ia-msg');
        if (!notas && !tema) { msg.textContent = 'Escribe al menos el tema del curso.'; return; }
        const btn = document.querySelector('#modal-esquema .btn-ia');
        btn.disabled = true; const t0 = btn.textContent; btn.textContent = '✨ Pensando…'; msg.textContent = 'La IA está proponiendo las lecciones…';
        try {
            const r = await fetch(FN_ACADEMIA, {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ modo: 'esquema', curso: tema, notas: notas || tema })
            });
            const data = await r.json();
            if (!r.ok || data.error || !data.esquema) throw new Error(data.error || 'error');
            esquemaActual = data.esquema;
            const lecs = data.esquema.lecciones || [];
            document.getElementById('e-resultado').innerHTML = (data.esquema.descripcion ? `<p style="font-size:12.5px;color:#556;margin:10px 0 4px">${esc(data.esquema.descripcion)}</p>` : '') +
                lecs.map((l, i) => `<label class="esq-item"><input type="checkbox" class="esq-chk" data-i="${i}" checked><span><span class="t">${i + 1}. ${esc(l.titulo || '')}</span>${l.resumen ? `<div class="r">${esc(l.resumen)}</div>` : ''}</span></label>`).join('');
            document.getElementById('e-crear-btn').style.display = lecs.length ? 'block' : 'none';
            msg.textContent = '✓ Marca las que quieras crear.';
        } catch (e) {
            msg.textContent = 'No se pudo generar (¿está desplegada la función?). Detalle: ' + (e && e.message ? e.message : e);
        } finally { btn.disabled = false; btn.textContent = t0; }
    };
    window.crearLeccionesEsquema = async function () {
        if (!esquemaActual || !Array.isArray(esquemaActual.lecciones)) return;
        const marcadas = Array.from(document.querySelectorAll('#e-resultado .esq-chk')).filter(c => c.checked).map(c => esquemaActual.lecciones[+c.dataset.i]);
        if (!marcadas.length) { alert('Marca al menos una lección.'); return; }
        const btn = document.getElementById('e-crear-btn'); btn.disabled = true; btn.textContent = 'Creando…';
        try {
            let orden = leccionesDe(cursoSelId).length;
            for (const l of marcadas) {
                await addDoc(collection(db, 'academiaLecciones'), {
                    cursoId: cursoSelId, orden: orden++, titulo: l.titulo || 'Lección',
                    contenido: l.resumen ? ('[Borrador] ' + l.resumen + '\n\n(Abre esta lección y toca "✨ Desarrollar con IA" para escribir la clase completa.)') : '',
                    fotos: [], creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                });
            }
            cerrar('modal-esquema');
            irA('curso', cursoSelId);
        } catch (e) { alert('No se pudieron crear: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Crear lecciones marcadas'; }
    };

    render();
</script>

</body>
</html>
