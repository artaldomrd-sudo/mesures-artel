<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 900px; }
    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 9px 15px; }
    .kpi .n { font-size: 16px; font-weight: bold; color: var(--artal-blue); line-height: 1; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar input.buscar, .bar select { padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .bar input.buscar { flex: 1; min-width: 150px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .cat-label { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; color: var(--artal-blue); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #eef1f4; }
    .it-card { display: flex; align-items: flex-start; gap: 12px; }
    .it-thumb { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; border: 1.5px solid #e3e7ec; flex: 0 0 auto; }
    .it-noimg { width: 50px; height: 50px; border-radius: 10px; background: #eef1f4; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
    .it-info { flex: 1; min-width: 0; }
    .it-info b { color: var(--artal-blue); font-size: 15px; }
    .it-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .it-precio { font-weight: bold; color: #1f9d61; font-size: 15px; margin-top: 3px; }
    .b { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; letter-spacing: .3px; }
    .b.producto { background: #eef3ff; color: #3457b2; } .b.servicio { background: #f3eefb; color: #7d3ac1; }
    .b.inactivo { background: #f1f1f4; color: #8a93a0; } .b.itbis { background: #e6f7f6; color: #12908a; }
    .b.margen { background: #e7f7ee; color: #1f9d61; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button { border: none; border-radius: 8px; padding: 8px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 36px; }
    .b-editar { background: var(--artal-blue); color: #fff; }
    .b-toggle { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 11px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 52px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; } .chk-line input { width: auto; min-height: 0; } .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="productos.html" title="Volver">← Productos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Catálogo</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="kpis" id="kpis"></div>
    <div class="bar">
        <button class="btn-y" onclick="abrirNuevo()">+ Nuevo ítem</button>
        <input class="buscar" id="buscar" placeholder="Buscar por nombre, código, categoría…" oninput="render()">
        <select id="f-tipo" onchange="render()"><option value="">Tipo: todos</option><option value="producto">Productos</option><option value="servicio">Servicios</option></select>
        <select id="f-cat" onchange="render()"><option value="">Categoría: todas</option></select>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Nuevo ítem</h2>
        <div class="grid2">
            <div><label>Tipo</label><select id="i-tipo" onchange="onTipo()"><option value="producto">Producto</option><option value="servicio">Servicio</option></select></div>
            <div><label>Código / SKU <span class="lbl-opt">— opcional</span></label><input type="text" id="i-codigo" placeholder="Ej. VEN-001"></div>
        </div>
        <label>Nombre *</label>
        <input type="text" id="i-nombre" placeholder="Ej. Ventana corredera de aluminio">
        <div class="grid2">
            <div><label>Categoría</label><input type="text" id="i-categoria" list="cat-list" placeholder="Ej. Ventanas"><datalist id="cat-list"><option value="Ventanas"></option><option value="Puertas"></option><option value="Correderas"></option><option value="Galandajes"></option><option value="Mamparas"></option><option value="Vidrio de ducha"></option><option value="Barandas"></option><option value="Vidrios"></option><option value="Perfiles de aluminio"></option><option value="Herrajes"></option><option value="Accesorios"></option><option value="Cortinas / enrollables"></option><option value="Servicio de instalación"></option><option value="Servicio de medición"></option><option value="Servicio de reparación"></option></datalist></div>
            <div><label>Unidad de medida</label><select id="i-unidad"></select></div>
        </div>
        <div class="grid2">
            <div><label>Precio de venta (RD$)</label><input type="number" id="i-precio" min="0" step="0.01" placeholder="0.00"></div>
            <div><label>Costo (RD$) <span class="lbl-opt">— opcional</span></label><input type="number" id="i-costo" min="0" step="0.01" placeholder="0.00"></div>
        </div>
        <div class="grid2">
            <div class="chk-line"><input type="checkbox" id="i-itbis" checked><label for="i-itbis">Aplica ITBIS</label></div>
            <div><label>ITBIS (%)</label><input type="number" id="i-itbispct" value="18" step="0.01"></div>
        </div>
        <div class="chk-line" id="stock-line"><input type="checkbox" id="i-stock"><label for="i-stock">Maneja inventario (stock)</label></div>
        <label>Descripción <span class="lbl-opt">— opcional</span></label>
        <textarea id="i-desc"></textarea>
        <label>Imagen <span class="lbl-opt">— opcional</span></label>
        <input type="file" id="i-foto" accept="image/*" multiple>
        <div class="chk-line"><input type="checkbox" id="i-activo" checked><label for="i-activo">Activo (disponible para cotizar)</label></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { requirePin } from './pin-gate.js';
    import { db, storage } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    const usuario = await requireAuth([]);
    await requirePin(usuario);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    // Unidades: valores viejos codificados (compat.) → texto lindo; una abreviatura nueva se muestra tal cual.
    const UNIDAD_LEGACY = { unidad: 'Unidad', m2: 'm²', ml: 'ml', pie: 'pie', pie2: 'pie²', juego: 'juego', par: 'par', hora: 'hora', servicio: 'servicio', kg: 'kg', litro: 'L' };
    const unidadTxt = (u) => UNIDAD_LEGACY[u] || u || 'unidad';
    const UNIDAD_DEFAULT = [['und', 'Unidad'], ['m²', 'Metro cuadrado'], ['ml', 'Metro lineal'], ['m', 'Metro'], ['pie', 'Pie'], ['pie²', 'Pie cuadrado'], ['pulg', 'Pulgada'], ['jgo', 'Juego'], ['par', 'Par'], ['hr', 'Hora'], ['serv', 'Servicio'], ['kg', 'Kilogramo'], ['L', 'Litro']];
    let unidadesCat = [];
    function opcionesUnidad() { return unidadesCat.length ? unidadesCat.map(u => [u.abreviatura || u.nombre, u.nombre]) : UNIDAD_DEFAULT; }
    function pintarUnidades(actual) {
        const sel = document.getElementById('i-unidad'); if (!sel) return;
        const arr = opcionesUnidad();
        let html = arr.map(([v, l]) => `<option value="${esc(v)}">${esc(l)} (${esc(v)})</option>`).join('');
        if (actual && !arr.some(([v]) => v === actual)) html = `<option value="${esc(actual)}">${esc(unidadTxt(actual))}</option>` + html;
        sel.innerHTML = html; if (actual) sel.value = actual;
    }

    let productos = [], editId = null;

    onSnapshot(collection(db, 'productos'), (snap) => {
        productos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        llenarFiltroCat(); render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });

    // Categorías gestionadas (módulo Categorías): se suman a las sugerencias del datalist.
    const CAT_DEFAULT = ['Ventanas', 'Puertas', 'Correderas', 'Galandajes', 'Mamparas', 'Vidrio de ducha', 'Barandas', 'Vidrios', 'Perfiles de aluminio', 'Herrajes', 'Accesorios', 'Cortinas / enrollables', 'Servicio de instalación', 'Servicio de medición', 'Servicio de reparación'];
    onSnapshot(collection(db, 'productosCategorias'), (snap) => {
        const gestionadas = snap.docs.map(d => (d.data().nombre || '').trim()).filter(Boolean);
        const todas = [...new Set([...CAT_DEFAULT, ...gestionadas])].sort((a, b) => a.localeCompare(b, 'es'));
        const dl = document.getElementById('cat-list');
        if (dl) dl.innerHTML = todas.map(n => `<option value="${esc(n)}"></option>`).join('');
    }, () => {});
    // Unidades gestionadas (módulo Unidades de Medida): pueblan el selector de unidad.
    onSnapshot(collection(db, 'productosUnidades'), (snap) => {
        unidadesCat = snap.docs.map(d => d.data()).sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));
        pintarUnidades(document.getElementById('i-unidad').value);
    }, () => {});

    function cats() { return [...new Set(productos.map(p => (p.categoria || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es')); }
    function llenarFiltroCat() {
        const sel = document.getElementById('f-cat'); const cur = sel.value;
        sel.innerHTML = '<option value="">Categoría: todas</option>' + cats().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
        sel.value = cur;
    }

    // ---------- Imagen ----------
    function comprimirImg(file) {
        return new Promise((resolve) => {
            if (!file || !/^image\//.test(file.type)) { resolve(file); return; }
            const url = URL.createObjectURL(file); const img = new Image();
            img.onload = () => {
                const max = 1400; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }
    async function subirFoto(file, id) {
        const blob = await comprimirImg(file).catch(() => file);
        const r = ref(storage, `productos/${id}/${Date.now()}.jpg`);
        await uploadBytes(r, blob, { contentType: 'image/jpeg' });
        return { url: await getDownloadURL(r), nombre: file.name || 'foto.jpg' };
    }

    // ---------- Modal ----------
    window.onTipo = function () {
        const esServ = document.getElementById('i-tipo').value === 'servicio';
        document.getElementById('stock-line').style.display = esServ ? 'none' : 'flex';
    };
    window.abrirNuevo = function () {
        editId = null; document.getElementById('modal-title').textContent = 'Nuevo ítem';
        document.getElementById('i-tipo').value = 'producto';
        ['i-codigo', 'i-nombre', 'i-categoria', 'i-precio', 'i-costo', 'i-desc', 'i-foto'].forEach(id => document.getElementById(id).value = '');
        pintarUnidades('');
        document.getElementById('i-itbis').checked = true;
        document.getElementById('i-itbispct').value = 18;
        document.getElementById('i-stock').checked = false;
        document.getElementById('i-activo').checked = true;
        onTipo(); document.getElementById('modal').classList.add('show');
    };
    window.editar = function (id) {
        const p = productos.find(x => x.id === id); if (!p) return;
        editId = id; document.getElementById('modal-title').textContent = 'Editar ítem';
        document.getElementById('i-tipo').value = p.tipo || 'producto';
        document.getElementById('i-codigo').value = p.codigo || '';
        document.getElementById('i-nombre').value = p.nombre || '';
        document.getElementById('i-categoria').value = p.categoria || '';
        pintarUnidades(p.unidad || '');
        document.getElementById('i-precio').value = p.precioVenta != null ? p.precioVenta : '';
        document.getElementById('i-costo').value = p.costo != null ? p.costo : '';
        document.getElementById('i-itbis').checked = p.itbisAplica !== false;
        document.getElementById('i-itbispct').value = p.itbisPct != null ? p.itbisPct : 18;
        document.getElementById('i-stock').checked = !!p.manejaStock;
        document.getElementById('i-desc').value = p.descripcion || '';
        document.getElementById('i-foto').value = '';
        document.getElementById('i-activo').checked = p.activo !== false;
        onTipo(); document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const nombre = document.getElementById('i-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre del ítem.'); return; }
        const tipo = document.getElementById('i-tipo').value;
        const datos = {
            tipo, codigo: document.getElementById('i-codigo').value.trim(), nombre,
            categoria: document.getElementById('i-categoria').value.trim(),
            unidad: document.getElementById('i-unidad').value,
            precioVenta: n2(document.getElementById('i-precio').value),
            costo: n2(document.getElementById('i-costo').value),
            itbisAplica: document.getElementById('i-itbis').checked,
            itbisPct: n2(document.getElementById('i-itbispct').value),
            manejaStock: tipo === 'producto' ? document.getElementById('i-stock').checked : false,
            descripcion: document.getElementById('i-desc').value.trim(),
            activo: document.getElementById('i-activo').checked,
            actualizado: serverTimestamp(), actualizadoPor: usuario.nombre
        };
        const files = Array.from(document.getElementById('i-foto').files || []);
        const btn = document.querySelector('#modal .btn-guardar');
        if (btn) { btn.disabled = true; btn.textContent = files.length ? 'Subiendo…' : 'Guardando…'; }
        try {
            let id = editId;
            if (editId) await updateDoc(doc(db, 'productos', editId), datos);
            else { const r = await addDoc(collection(db, 'productos'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() }); id = r.id; }
            if (files.length) {
                const nuevas = [];
                for (const file of files) nuevas.push(await subirFoto(file, id));
                const p = productos.find(x => x.id === id) || {};
                await updateDoc(doc(db, 'productos', id), { fotos: fotosDe(p).concat(nuevas) });
            }
            cerrar();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; } }
    };
    window.toggle = async function (id) {
        const p = productos.find(x => x.id === id); if (!p) return;
        try { await updateDoc(doc(db, 'productos', id), { activo: p.activo === false }); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrar = async function (id) {
        const p = productos.find(x => x.id === id) || {};
        if (!confirm('¿Eliminar "' + (p.nombre || '') + '" del catálogo?')) return;
        try { await deleteDoc(doc(db, 'productos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const term = (document.getElementById('buscar').value || '').toLowerCase().trim();
        const ft = document.getElementById('f-tipo').value, fc = document.getElementById('f-cat').value;
        document.getElementById('kpis').innerHTML = [
            ['Ítems', productos.length], ['Productos', productos.filter(p => (p.tipo || 'producto') === 'producto').length],
            ['Servicios', productos.filter(p => p.tipo === 'servicio').length], ['Activos', productos.filter(p => p.activo !== false).length]
        ].map(([l, n]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

        let lista = productos.slice();
        if (ft) lista = lista.filter(p => (p.tipo || 'producto') === ft);
        if (fc) lista = lista.filter(p => (p.categoria || '') === fc);
        if (term) lista = lista.filter(p => [p.nombre, p.codigo, p.categoria, p.descripcion].some(v => String(v || '').toLowerCase().includes(term)));

        const cont = document.getElementById('lista');
        if (!productos.length) { cont.innerHTML = '<p class="empty">Aún no hay ítems. Crea el primero con «+ Nuevo ítem».</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin resultados para el filtro.</p>'; return; }
        // Agrupar por categoría.
        const grupos = {};
        lista.forEach(p => { const c = (p.categoria || 'Sin categoría').trim() || 'Sin categoría'; (grupos[c] = grupos[c] || []).push(p); });
        const cs = Object.keys(grupos).sort((a, b) => a.localeCompare(b, 'es'));
        cont.innerHTML = cs.map(c => `<div class="cat-label">${esc(c)} (${grupos[c].length})</div>` +
            grupos[c].sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es')).map(cardHTML).join('')).join('');
    }

    // Fotos de un producto (soporta el campo viejo `foto` singular).
    function fotosDe(p) {
        const arr = Array.isArray(p && p.fotos) ? p.fotos.slice() : [];
        if (p && p.foto && p.foto.url) arr.push(p.foto);
        return arr;
    }
    function cardHTML(p) {
        const tipo = p.tipo || 'producto';
        const fts = fotosDe(p);
        const thumb = fts.length
            ? `<a href="${esc(fts[0].url)}" target="_blank" rel="noopener" style="position:relative;display:inline-block"><img class="it-thumb" src="${esc(fts[0].url)}" alt="">${fts.length > 1 ? `<span style="position:absolute;right:1px;bottom:1px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;border-radius:5px;padding:0 4px">+${fts.length - 1}</span>` : ''}</a>`
            : `<div class="it-noimg">${tipo === 'servicio' ? '🛠️' : '📦'}</div>`;
        const margen = (n2(p.costo) > 0 && n2(p.precioVenta) > 0) ? Math.round((p.precioVenta - p.costo) / p.precioVenta * 100) : null;
        const badges = [
            `<span class="b ${tipo}">${tipo === 'servicio' ? 'Servicio' : 'Producto'}</span>`,
            p.activo === false ? '<span class="b inactivo">Inactivo</span>' : '',
            p.itbisAplica !== false ? `<span class="b itbis">ITBIS ${n2(p.itbisPct) || 18}%</span>` : '<span class="b inactivo">Exento</span>',
            (margen != null) ? `<span class="b margen">Margen ${margen}%</span>` : ''
        ].filter(Boolean).join(' ');
        const meta = [p.codigo ? 'SKU ' + esc(p.codigo) : '', 'x ' + esc(unidadTxt(p.unidad)), p.manejaStock ? '📦 stock' : ''].filter(Boolean).join('  ·  ');
        return `<div class="order-card it-card">
            ${thumb}
            <div class="it-info">
                <b>${esc(p.nombre)}</b> ${badges}
                ${meta ? `<div class="l">${meta}</div>` : ''}
                <div class="it-precio">${fmt(p.precioVenta)}${p.costo ? ` <span class="l" style="display:inline;font-weight:normal">· costo ${fmt(p.costo)}</span>` : ''}</div>
                ${p.descripcion ? `<div class="l">${esc(p.descripcion)}</div>` : ''}
            </div>
            <div class="row-actions">
                <button class="b-editar" onclick="editar('${p.id}')">✏ Editar</button>
                <button class="b-toggle" onclick="toggle('${p.id}')">${p.activo === false ? 'Activar' : 'Desactivar'}</button>
                <button class="b-borrar" onclick="borrar('${p.id}')">🗑</button>
            </div>
        </div>`;
    }
</script>

</body>
</html>
