<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Vacaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 760px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar input.buscar, .bar select { padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .bar input.buscar { flex: 1; min-width: 160px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .anio-label { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; color: var(--artal-blue); margin: 18px 0 8px; }

    .vac-card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .vac-card .head b { color: var(--artal-blue); font-size: 15.5px; }
    .vac-card .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .estado-sel { padding: 6px 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 12.5px; min-height: 34px; margin-left: auto; }
    .estado-badge { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; letter-spacing: .4px; }
    .estado-badge.programada { background: #e9f0fb; color: #2f6fd0; } .estado-badge.en_curso { background: #fff2dc; color: #c07a12; }
    .estado-badge.completada { background: #e7f7ee; color: #1f9d61; } .estado-badge.cancelada { background: #fdeaea; color: #d9483b; }
    .badge-evt { font-size: 10px; font-weight: bold; background: #f3eefb; color: #7d3ac1; padding: 3px 8px; border-radius: 20px; }

    .docs { margin-top: 10px; }
    .doc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f7f9fb; border-radius: 8px; margin-bottom: 6px; }
    .doc-item a { flex: 1; color: var(--artal-blue); font-weight: bold; font-size: 13px; text-decoration: none; word-break: break-word; }
    .doc-del { background: transparent; border: none; color: #c9ced6; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .doc-del:hover { color: #e74c3c; }
    .doc-add-btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 12px; border: 1.5px dashed var(--artal-blue); border-radius: 8px; background: #fff; color: var(--artal-blue); font-weight: bold; font-size: 12.5px; cursor: pointer; min-height: 38px; box-sizing: border-box; }
    .doc-add-btn:hover { background: var(--artal-light); }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; border-radius: 8px; padding: 7px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 38px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 12px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="rrhh.html" title="Volver a RRHH">← RRHH</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Vacaciones</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar">
        <button class="btn-y" onclick="abrirNueva()">+ Nueva vacación</button>
        <input class="buscar" id="buscar" placeholder="Buscar por empleado o año…" oninput="render()">
        <select id="filtro-emp" onchange="render()"></select>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal Nueva vacación -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2>Nueva vacación</h2>
        <label>Empleado *</label>
        <select id="v-empleado"></select>
        <div class="grid2">
            <div><label>Año *</label><input type="number" id="v-anio" min="2020" max="2100"></div>
            <div><label>Estado</label><select id="v-estado"><option value="programada">Programada</option><option value="en_curso">En curso</option><option value="completada">Completada</option><option value="cancelada">Cancelada</option></select></div>
        </div>
        <div class="grid2">
            <div><label>Desde</label><input type="date" id="v-inicio"></div>
            <div><label>Hasta</label><input type="date" id="v-fin"></div>
        </div>
        <label>Notas</label>
        <textarea id="v-notas" placeholder="Opcional"></textarea>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Crear carpeta</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db, storage } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const byNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es');
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); };
    const docIcon = (t) => t === 'pdf' ? '📄' : (t === 'img' ? '🖼️' : '📃');
    const ESTADOS = [['programada', 'Programada'], ['en_curso', 'En curso'], ['completada', 'Completada'], ['cancelada', 'Cancelada']];

    let empleados = [], vacaciones = [];
    const params = new URLSearchParams(location.search);
    let filtroEmp = params.get('emp') || '';

    onSnapshot(collection(db, 'rrhhEmpleados'), (snap) => {
        empleados = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre);
        llenarSelects(); render();
    });
    onSnapshot(collection(db, 'rrhhVacaciones'), (snap) => {
        vacaciones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    });

    function llenarSelects() {
        const fe = document.getElementById('filtro-emp');
        fe.innerHTML = '<option value="">Todos los empleados</option>' + empleados.map(e => `<option value="${esc(e.id)}">${esc(e.nombre)}</option>`).join('');
        fe.value = filtroEmp;
        const ve = document.getElementById('v-empleado');
        const cur = ve.value;
        ve.innerHTML = '<option value="">—</option>' + empleados.filter(e => (e.estado || 'activo') === 'activo').map(e => `<option value="${esc(e.id)}">${esc(e.nombre)}</option>`).join('');
        ve.value = cur;
    }

    // ---------- Subida de archivos ----------
    function comprimirImg(file) {
        return new Promise((resolve) => {
            if (!file || !/^image\//.test(file.type)) { resolve(file); return; }
            const url = URL.createObjectURL(file); const img = new Image();
            img.onload = () => {
                const max = 1600; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }
    async function subirArchivo(file, pathPrefix) {
        const esImg = /^image\//.test(file.type);
        const esPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
        let blob = file, contentType = file.type || 'application/octet-stream';
        let ext = ((file.name || '').split('.').pop() || 'bin').toLowerCase();
        if (esImg) { blob = await comprimirImg(file).catch(() => file); contentType = 'image/jpeg'; ext = 'jpg'; }
        const nombre = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
        const r = ref(storage, `${pathPrefix}/${nombre}`);
        await uploadBytes(r, blob, { contentType });
        return { url: await getDownloadURL(r), nombre: file.name || ('archivo.' + ext), tipo: esImg ? 'img' : (esPdf ? 'pdf' : 'doc') };
    }

    window.subirDocVac = async function (id, input) {
        const file = (input.files || [])[0]; if (!file) return;
        const label = input.parentElement; input.disabled = true; if (label) label.style.opacity = '.5';
        try {
            const arch = await subirArchivo(file, `rrhhVacaciones/${id}`);
            const v = vacaciones.find(x => x.id === id) || {};
            const prev = Array.isArray(v.documentos) ? v.documentos : [];
            await updateDoc(doc(db, 'rrhhVacaciones', id), { documentos: prev.concat([{ ...arch, subidoPor: usuario.nombre }]) });
        } catch (e) { alert('No se pudo subir: ' + (e && e.message ? e.message : e)); }
        finally { input.value = ''; input.disabled = false; if (label) label.style.opacity = '1'; }
    };
    window.borrarDocVac = async function (id, url) {
        if (!confirm('¿Quitar este documento?')) return;
        const v = vacaciones.find(x => x.id === id) || {};
        const prev = Array.isArray(v.documentos) ? v.documentos : [];
        try { await updateDoc(doc(db, 'rrhhVacaciones', id), { documentos: prev.filter(d => d && d.url !== url) }); }
        catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.cambiarEstadoVac = async function (id, estado) {
        try { await updateDoc(doc(db, 'rrhhVacaciones', id), { estado }); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrarVac = async function (id) {
        if (!confirm('¿Eliminar esta carpeta de vacaciones y sus documentos de la lista?')) return;
        try { await deleteDoc(doc(db, 'rrhhVacaciones', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    // ---------- Modal ----------
    window.abrirNueva = function () {
        document.getElementById('v-empleado').value = filtroEmp || '';
        document.getElementById('v-anio').value = new Date().getFullYear();
        document.getElementById('v-estado').value = 'programada';
        document.getElementById('v-inicio').value = '';
        document.getElementById('v-fin').value = '';
        document.getElementById('v-notas').value = '';
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const empId = document.getElementById('v-empleado').value;
        const emp = empleados.find(x => x.id === empId);
        const anio = Number(document.getElementById('v-anio').value);
        if (!empId) { alert('Elige el empleado.'); return; }
        if (!anio) { alert('Indica el año.'); return; }
        try {
            await addDoc(collection(db, 'rrhhVacaciones'), {
                empleadoId: empId, empleadoNombre: emp ? emp.nombre : '', anio,
                titulo: 'Vacaciones ' + (emp ? emp.nombre : '') + ' ' + anio,
                fechaInicio: document.getElementById('v-inicio').value || '',
                fechaFin: document.getElementById('v-fin').value || '',
                estado: document.getElementById('v-estado').value,
                notas: document.getElementById('v-notas').value.trim(),
                documentos: [], origen: 'manual', creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            cerrar();
        } catch (e) { alert('No se pudo crear: ' + (e && e.message ? e.message : e)); }
    };

    // ---------- Render ----------
    window.render = function () {
        filtroEmp = document.getElementById('filtro-emp').value;
        const term = (document.getElementById('buscar').value || '').toLowerCase().trim();
        let lista = vacaciones.slice();
        if (filtroEmp) lista = lista.filter(v => v.empleadoId === filtroEmp);
        if (term) lista = lista.filter(v => [v.empleadoNombre, v.anio, v.titulo].some(x => String(x || '').toLowerCase().includes(term)));
        lista.sort((a, b) => (Number(b.anio) - Number(a.anio)) || byNombreV(a, b));
        const cont = document.getElementById('lista');
        if (!vacaciones.length) { cont.innerHTML = '<p class="empty">Aún no hay vacaciones. Créalas aquí o desde un evento «Vacaciones» en el Ciclo del empleado.</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin resultados para el filtro.</p>'; return; }
        // Agrupar por año.
        let html = '', anioActual = null;
        lista.forEach(v => {
            if (v.anio !== anioActual) { anioActual = v.anio; html += `<div class="anio-label">${esc(String(v.anio))}</div>`; }
            html += cardHTML(v);
        });
        cont.innerHTML = html;
    };
    const byNombreV = (a, b) => String(a.empleadoNombre || '').localeCompare(String(b.empleadoNombre || ''), 'es');

    function cardHTML(v) {
        const est = v.estado || 'programada';
        const docs = Array.isArray(v.documentos) ? v.documentos : [];
        const rango = (v.fechaInicio || v.fechaFin) ? `${fmtFecha(v.fechaInicio) || '—'} → ${fmtFecha(v.fechaFin) || '—'}` : '';
        const docsHTML = docs.map(d => `<div class="doc-item">
            <a href="${esc(d.url)}" target="_blank" rel="noopener">${docIcon(d.tipo)} ${esc(d.nombre)}</a>
            <button class="doc-del" title="Quitar" onclick="borrarDocVac('${v.id}','${esc(d.url)}')">×</button>
        </div>`).join('');
        const selEstado = `<select class="estado-sel" onchange="cambiarEstadoVac('${v.id}',this.value)">${ESTADOS.map(([val, l]) => `<option value="${val}" ${est === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
        return `<div class="order-card vac-card">
            <div class="head">
                <b>${esc(v.titulo || ('Vacaciones ' + (v.empleadoNombre || '') + ' ' + v.anio))}</b>
                <span class="estado-badge ${est}">${est.replace('_', ' ')}</span>
                ${v.origen === 'evento' ? '<span class="badge-evt">🏖️ desde evento</span>' : ''}
                ${selEstado}
            </div>
            ${rango ? `<div class="l">${esc(rango)}</div>` : ''}
            ${v.notas ? `<div class="l">“${esc(v.notas)}”</div>` : ''}
            <div class="docs">${docsHTML || '<p class="l" style="color:#8a93a0">Aún no hay documentos en esta carpeta.</p>'}</div>
            <div class="card-actions">
                <label class="doc-add-btn">＋ Documento<input type="file" accept="image/*,application/pdf,.doc,.docx,.txt,.odt" style="display:none" onchange="subirDocVac('${v.id}',this)"></label>
                <button class="b-borrar" onclick="borrarVac('${v.id}')">🗑 Eliminar carpeta</button>
            </div>
        </div>`;
    }
</script>

</body>
</html>
