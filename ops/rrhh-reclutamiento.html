<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Reclutamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 840px; }
    .panel { display: none; } .panel.show { display: block; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar select { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .resumen { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { font-size: 12px; font-weight: bold; padding: 6px 11px; border-radius: 20px; background: #eef1f4; color: #556; }
    .sec-title { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; color: var(--artal-blue); margin: 18px 0 8px; }

    .vac-card .info b { color: var(--artal-blue); font-size: 15.5px; }
    .vac-card .info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .vac-card .desc-txt { font-size: 13px; color: #556; margin-top: 6px; white-space: pre-wrap; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .row-actions button, .row-actions .lnk { border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 38px; box-sizing: border-box; display: inline-flex; align-items: center; text-decoration: none; }
    .b-editar { background: var(--artal-blue); color: #fff; } .b-sec { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }
    .b-ok { background: #2ecc71; color: #fff; }

    .estado-badge { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; letter-spacing: .4px; }
    .estado-badge.abierta { background: #e7f7ee; color: #1f9d61; } .estado-badge.pausada { background: #fff2dc; color: #c07a12; } .estado-badge.cerrada { background: #f1f1f4; color: #8a93a0; }

    .cand-card { display: flex; gap: 12px; align-items: flex-start; }
    .cand-card .info { flex: 1; min-width: 0; }
    .cand-card .info b { color: var(--artal-blue); font-size: 15px; }
    .cand-card .info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .contact-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
    .contact-row a { font-size: 12px; font-weight: bold; text-decoration: none; padding: 6px 10px; border-radius: 8px; min-height: 34px; display: inline-flex; align-items: center; gap: 4px; }
    .c-wa { background: #e7f7ee; color: #128c3e; } .c-tel { background: #e9f0fb; color: #2f6fd0; } .c-mail { background: #f3eefb; color: #7d3ac1; } .c-cv { background: #fff2dc; color: #c07a12; }
    .cand-etapa { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cand-etapa select { padding: 7px 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 13px; min-height: 38px; }
    .justif-add { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: bold; color: #c07a12; border: 1.5px dashed #c07a12; border-radius: 8px; padding: 6px 10px; cursor: pointer; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 12px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 64px; }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="rrhh.html" title="Volver a RRHH">← RRHH</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Reclutamiento</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="tabs">
        <button class="tab-btn active" id="tab-vacantes" onclick="setTab('vacantes')">Vacantes</button>
        <button class="tab-btn" id="tab-candidatos" onclick="setTab('candidatos')">Candidatos</button>
    </div>

    <!-- VACANTES -->
    <section class="panel show" id="panel-vacantes">
        <div class="bar"><button class="btn-y" onclick="abrirVacante()">+ Nueva vacante</button></div>
        <div id="vac-lista"><p class="empty">Cargando…</p></div>
    </section>

    <!-- CANDIDATOS -->
    <section class="panel" id="panel-candidatos">
        <div class="bar">
            <button class="btn-y" onclick="abrirCandidato()">+ Nuevo candidato</button>
            <select id="filtro-vac" onchange="renderCandidatos()"></select>
        </div>
        <div class="resumen" id="cand-resumen"></div>
        <div id="cand-lista"><p class="empty">Cargando…</p></div>
    </section>
</main>

<!-- Modal Vacante -->
<div class="modal-overlay" id="modal-vacante">
    <div class="modal-box">
        <h2 id="vac-title">Nueva vacante</h2>
        <label>Puesto / título *</label>
        <input type="text" id="v-titulo" placeholder="Ej. Instalador de aluminio">
        <div class="grid2">
            <div><label>Departamento</label><select id="v-departamento"></select></div>
            <div><label>Cargo</label><select id="v-cargo"></select></div>
        </div>
        <div class="grid2">
            <div><label>Sucursal</label><select id="v-sucursal"></select></div>
            <div><label>Plazas</label><input type="number" id="v-plazas" min="1" value="1"></div>
        </div>
        <label>Estado</label>
        <select id="v-estado"><option value="abierta">Abierta</option><option value="pausada">Pausada</option><option value="cerrada">Cerrada</option></select>
        <label>Descripción <span class="lbl-opt">— requisitos, funciones</span></label>
        <textarea id="v-descripcion" placeholder="Opcional"></textarea>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrarVacante()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarVacante()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal Candidato -->
<div class="modal-overlay" id="modal-candidato">
    <div class="modal-box">
        <h2 id="cand-title">Nuevo candidato</h2>
        <label>Nombre *</label>
        <input type="text" id="c-nombre" placeholder="Nombre y apellido">
        <div class="grid2">
            <div><label>Teléfono</label><input type="tel" id="c-telefono" placeholder="809-000-0000"></div>
            <div><label>Correo</label><input type="email" id="c-correo" placeholder="correo@ejemplo.com"></div>
        </div>
        <label>Vacante</label>
        <select id="c-vacante"></select>
        <div class="grid2">
            <div><label>Fuente</label><select id="c-fuente"><option>Referido</option><option>Sitio web</option><option>Redes sociales</option><option>Bolsa de empleo</option><option>Espontáneo</option><option>Otro</option></select></div>
            <div><label>Etapa</label><select id="c-etapa"></select></div>
        </div>
        <label>Fecha de entrevista <span class="lbl-opt">— opcional</span></label>
        <input type="date" id="c-entrevista">
        <label>Notas</label>
        <textarea id="c-notas" placeholder="Experiencia, impresión, referencias…"></textarea>
        <label>CV <span class="lbl-opt">— PDF o foto (opcional)</span></label>
        <input type="file" id="c-cv" accept="image/*,application/pdf">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrarCandidato()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarCandidato()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db, storage } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const byNombre = (a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es');
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function telDigits(t) { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10) d = '1' + d; return d; }

    const ETAPAS = [
        ['nuevo', 'Nuevos'], ['preseleccionado', 'Preseleccionados'], ['entrevista', 'En entrevista'],
        ['oferta', 'Oferta'], ['contratado', 'Contratados'], ['rechazado', 'Rechazados']
    ];
    const ETAPA_LABEL = Object.fromEntries(ETAPAS.map(([v, l]) => [v, l]));

    let vacantes = [], candidatos = [], departamentos = [], cargos = [], sucursales = [];
    let currentTab = 'vacantes', editVacId = null, editCandId = null;

    function opts(arr, sel) { return '<option value="">—</option>' + arr.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nombre)}</option>`).join(''); }

    onSnapshot(collection(db, 'rrhhVacantes'), (s) => { vacantes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderVacantes(); llenarVacanteSelects(); });
    onSnapshot(collection(db, 'rrhhCandidatos'), (s) => { candidatos = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCandidatos(); renderVacantes(); });
    onSnapshot(collection(db, 'rrhhDepartamentos'), (s) => { departamentos = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre); refreshCat(); });
    onSnapshot(collection(db, 'rrhhCargos'), (s) => { cargos = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre); refreshCat(); });
    onSnapshot(collection(db, 'rrhhSucursales'), (s) => { sucursales = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNombre); refreshCat(); });
    function refreshCat() {
        const d = document.getElementById('v-departamento'), c = document.getElementById('v-cargo'), su = document.getElementById('v-sucursal');
        d.innerHTML = opts(departamentos, d.value); c.innerHTML = opts(cargos, c.value); su.innerHTML = opts(sucursales, su.value);
    }

    // Selectores de etapa (modal candidato).
    document.getElementById('c-etapa').innerHTML = ETAPAS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');

    window.setTab = function (t) {
        currentTab = t;
        ['vacantes', 'candidatos'].forEach(k => { document.getElementById('tab-' + k).classList.toggle('active', k === t); document.getElementById('panel-' + k).classList.toggle('show', k === t); });
    };

    // ---------- Adjunto (imagen se comprime; PDF tal cual) ----------
    function comprimirImg(file) {
        return new Promise((resolve) => {
            if (!file || !/^image\//.test(file.type)) { resolve(file); return; }
            const url = URL.createObjectURL(file); const img = new Image();
            img.onload = () => {
                const max = 1600; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }
    async function subirArchivo(file, pathPrefix) {
        const esPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
        if (!esPdf && !/^image\//.test(file.type)) throw new Error('El archivo debe ser una imagen o un PDF.');
        const blob = esPdf ? file : await comprimirImg(file).catch(() => file);
        const ext = esPdf ? 'pdf' : 'jpg';
        const nombre = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
        const r = ref(storage, `${pathPrefix}/${nombre}`);
        await uploadBytes(r, blob, { contentType: esPdf ? 'application/pdf' : 'image/jpeg' });
        return { url: await getDownloadURL(r), nombre: file.name || ('cv.' + ext), tipo: esPdf ? 'pdf' : 'img' };
    }

    // ---------- VACANTES ----------
    const candsDeVacante = (vid) => candidatos.filter(c => c.vacanteId === vid && c.etapa !== 'rechazado' && c.etapa !== 'contratado').length;
    function llenarVacanteSelects() {
        const fv = document.getElementById('filtro-vac'), cv = document.getElementById('c-vacante');
        const abiertas = vacantes.slice().sort(byTitulo);
        fv.innerHTML = '<option value="">Todas las vacantes</option><option value="__sin">Sin vacante</option>' + abiertas.map(v => `<option value="${esc(v.id)}" ${fv.value === v.id ? 'selected' : ''}>${esc(v.titulo)}</option>`).join('');
        cv.innerHTML = '<option value="">— Sin vacante —</option>' + abiertas.map(v => `<option value="${esc(v.id)}">${esc(v.titulo)}</option>`).join('');
    }
    const byTitulo = (a, b) => String(a.titulo || '').localeCompare(String(b.titulo || ''), 'es');

    window.abrirVacante = function () {
        editVacId = null; document.getElementById('vac-title').textContent = 'Nueva vacante';
        document.getElementById('v-titulo').value = ''; document.getElementById('v-plazas').value = '1';
        document.getElementById('v-estado').value = 'abierta'; document.getElementById('v-descripcion').value = '';
        refreshCat(); ['v-departamento', 'v-cargo', 'v-sucursal'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('modal-vacante').classList.add('show');
    };
    window.editarVacante = function (id) {
        const v = vacantes.find(x => x.id === id); if (!v) return;
        editVacId = id; document.getElementById('vac-title').textContent = 'Editar vacante';
        document.getElementById('v-titulo').value = v.titulo || '';
        document.getElementById('v-plazas').value = v.plazas || 1;
        document.getElementById('v-estado').value = v.estado || 'abierta';
        document.getElementById('v-descripcion').value = v.descripcion || '';
        refreshCat();
        document.getElementById('v-departamento').value = v.departamentoId || '';
        document.getElementById('v-cargo').value = v.cargoId || '';
        document.getElementById('v-sucursal').value = v.sucursalId || '';
        document.getElementById('modal-vacante').classList.add('show');
    };
    window.cerrarVacante = function () { document.getElementById('modal-vacante').classList.remove('show'); };
    window.guardarVacante = async function () {
        const titulo = document.getElementById('v-titulo').value.trim();
        if (!titulo) { alert('Escribe el puesto/título.'); return; }
        const nombreDe = (arr, id) => (arr.find(x => x.id === id) || {}).nombre || '';
        const depId = document.getElementById('v-departamento').value, carId = document.getElementById('v-cargo').value, sucId = document.getElementById('v-sucursal').value;
        const datos = {
            titulo, plazas: Number(document.getElementById('v-plazas').value) || 1,
            estado: document.getElementById('v-estado').value, descripcion: document.getElementById('v-descripcion').value.trim(),
            departamentoId: depId, departamentoNombre: nombreDe(departamentos, depId),
            cargoId: carId, cargoNombre: nombreDe(cargos, carId),
            sucursalId: sucId, sucursalNombre: nombreDe(sucursales, sucId)
        };
        try {
            if (editVacId) await updateDoc(doc(db, 'rrhhVacantes', editVacId), datos);
            else await addDoc(collection(db, 'rrhhVacantes'), { ...datos, fechaApertura: hoyISO(), creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrarVacante();
        } catch (e) { alert('No se pudo guardar: ' + e.message); }
    };
    window.borrarVacante = async function (id) {
        const n = candidatos.filter(c => c.vacanteId === id).length;
        if (n > 0 && !confirm(`Esta vacante tiene ${n} candidato(s) asociados (no se borran, quedan sin vacante). ¿Eliminar la vacante?`)) return;
        if (n === 0 && !confirm('¿Eliminar esta vacante?')) return;
        try { await deleteDoc(doc(db, 'rrhhVacantes', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.verCandidatos = function (id) { setTab('candidatos'); document.getElementById('filtro-vac').value = id; renderCandidatos(); };

    function renderVacantes() {
        const cont = document.getElementById('vac-lista');
        if (!vacantes.length) { cont.innerHTML = '<p class="empty">Sin vacantes. Crea la primera arriba.</p>'; return; }
        const orden = { abierta: 0, pausada: 1, cerrada: 2 };
        const lista = vacantes.slice().sort((a, b) => (orden[a.estado] - orden[b.estado]) || byTitulo(a, b));
        cont.innerHTML = lista.map(v => {
            const meta = [v.departamentoNombre, v.cargoNombre, v.sucursalNombre].filter(Boolean).join(' · ');
            const activos = candsDeVacante(v.id);
            return `<div class="order-card vac-card"><div class="info">
                <b>${esc(v.titulo)}</b> <span class="estado-badge ${v.estado || 'abierta'}">${v.estado || 'abierta'}</span>
                <div class="l">${meta ? esc(meta) + ' · ' : ''}${v.plazas || 1} plaza${(v.plazas || 1) === 1 ? '' : 's'} · ${activos} candidato${activos === 1 ? '' : 's'} en proceso</div>
                ${v.descripcion ? `<div class="desc-txt">${esc(v.descripcion)}</div>` : ''}
                <div class="row-actions">
                    <button class="b-sec" onclick="verCandidatos('${v.id}')">👥 Candidatos</button>
                    <button class="b-editar" onclick="editarVacante('${v.id}')">✏ Editar</button>
                    <button class="b-borrar" onclick="borrarVacante('${v.id}')">🗑</button>
                </div>
            </div></div>`;
        }).join('');
    }

    // ---------- CANDIDATOS ----------
    window.abrirCandidato = function () {
        editCandId = null; document.getElementById('cand-title').textContent = 'Nuevo candidato';
        document.getElementById('c-nombre').value = ''; document.getElementById('c-telefono').value = '';
        document.getElementById('c-correo').value = ''; document.getElementById('c-fuente').value = 'Referido';
        document.getElementById('c-etapa').value = 'nuevo'; document.getElementById('c-entrevista').value = '';
        document.getElementById('c-notas').value = ''; document.getElementById('c-cv').value = '';
        const pre = document.getElementById('filtro-vac').value;
        document.getElementById('c-vacante').value = (pre && pre !== '__sin') ? pre : '';
        document.getElementById('modal-candidato').classList.add('show');
    };
    window.editarCandidato = function (id) {
        const c = candidatos.find(x => x.id === id); if (!c) return;
        editCandId = id; document.getElementById('cand-title').textContent = 'Editar candidato';
        document.getElementById('c-nombre').value = c.nombre || '';
        document.getElementById('c-telefono').value = c.telefono || '';
        document.getElementById('c-correo').value = c.correo || '';
        document.getElementById('c-vacante').value = c.vacanteId || '';
        document.getElementById('c-fuente').value = c.fuente || 'Referido';
        document.getElementById('c-etapa').value = c.etapa || 'nuevo';
        document.getElementById('c-entrevista').value = c.fechaEntrevista || '';
        document.getElementById('c-notas').value = c.notas || '';
        document.getElementById('c-cv').value = '';
        document.getElementById('modal-candidato').classList.add('show');
    };
    window.cerrarCandidato = function () { document.getElementById('modal-candidato').classList.remove('show'); };
    window.guardarCandidato = async function () {
        const nombre = document.getElementById('c-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre del candidato.'); return; }
        const vacId = document.getElementById('c-vacante').value;
        const vac = vacantes.find(v => v.id === vacId);
        const datos = {
            nombre, telefono: document.getElementById('c-telefono').value.trim(), correo: document.getElementById('c-correo').value.trim(),
            vacanteId: vacId, vacanteTitulo: vac ? vac.titulo : '',
            fuente: document.getElementById('c-fuente').value, etapa: document.getElementById('c-etapa').value,
            fechaEntrevista: document.getElementById('c-entrevista').value || '', notas: document.getElementById('c-notas').value.trim()
        };
        const btn = document.querySelector('#modal-candidato .btn-guardar');
        const file = (document.getElementById('c-cv').files || [])[0];
        if (btn) { btn.disabled = true; btn.textContent = file ? 'Subiendo…' : 'Guardando…'; }
        try {
            let id = editCandId;
            if (editCandId) await updateDoc(doc(db, 'rrhhCandidatos', editCandId), datos);
            else { const r = await addDoc(collection(db, 'rrhhCandidatos'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() }); id = r.id; }
            if (file) { const cv = await subirArchivo(file, `rrhhCandidatos/${id}`); await updateDoc(doc(db, 'rrhhCandidatos', id), { cv }); }
            cerrarCandidato();
            setTab('candidatos');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; } }
    };
    window.cambiarEtapa = async function (id, etapa) {
        try { await updateDoc(doc(db, 'rrhhCandidatos', id), { etapa }); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrarCandidato = async function (id) {
        if (!confirm('¿Eliminar este candidato?')) return;
        try { await deleteDoc(doc(db, 'rrhhCandidatos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.subirCV = async function (id, input) {
        const file = (input.files || [])[0]; if (!file) return;
        input.disabled = true;
        try { const cv = await subirArchivo(file, `rrhhCandidatos/${id}`); await updateDoc(doc(db, 'rrhhCandidatos', id), { cv }); }
        catch (e) { alert('No se pudo subir: ' + (e && e.message ? e.message : e)); }
        finally { input.value = ''; input.disabled = false; }
    };
    window.contratar = async function (id) {
        const c = candidatos.find(x => x.id === id); if (!c) return;
        if (c.empleadoCreadoId) { alert('Este candidato ya fue convertido en empleado.'); return; }
        if (!confirm(`¿Crear el empleado "${c.nombre}" a partir de este candidato? Se agregará a Empleados como activo con fecha de ingreso de hoy.`)) return;
        try {
            const emp = await addDoc(collection(db, 'rrhhEmpleados'), {
                nombre: c.nombre, telefono: c.telefono || '', correo: c.correo || '',
                cedula: '', direccion: '', fechaIngreso: hoyISO(), sueldoBase: null, notas: c.notas || '',
                cargoIds: [], cargoNombres: [], departamentoId: '', departamentoNombre: '', sucursalId: '', sucursalNombre: '',
                estado: 'activo', creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            await updateDoc(doc(db, 'rrhhCandidatos', id), { etapa: 'contratado', empleadoCreadoId: emp.id });
            alert('Empleado creado. Complétale cédula, cargo, departamento y sucursal en Empleados.');
        } catch (e) { alert('No se pudo crear el empleado: ' + (e && e.message ? e.message : e)); }
    };

    function renderCandidatos() {
        const filtro = document.getElementById('filtro-vac').value;
        let lista = candidatos.slice();
        if (filtro === '__sin') lista = lista.filter(c => !c.vacanteId);
        else if (filtro) lista = lista.filter(c => c.vacanteId === filtro);
        const cont = document.getElementById('cand-lista'), res = document.getElementById('cand-resumen');
        const cuenta = {}; ETAPAS.forEach(([v]) => cuenta[v] = 0);
        lista.forEach(c => { const e = c.etapa || 'nuevo'; if (cuenta[e] != null) cuenta[e]++; });
        res.innerHTML = ETAPAS.map(([v, l]) => `<span class="chip">${cuenta[v]} ${l.toLowerCase()}</span>`).join('');
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin candidatos' + (filtro ? ' para este filtro' : '') + '.</p>'; return; }
        let html = '';
        ETAPAS.forEach(([v, l]) => {
            const items = lista.filter(c => (c.etapa || 'nuevo') === v).sort(byNombre);
            if (!items.length) return;
            html += `<div class="sec-title">${l} (${items.length})</div>` + items.map(candHTML).join('');
        });
        cont.innerHTML = html;
    }

    function candHTML(c) {
        const etapa = c.etapa || 'nuevo';
        const wa = telDigits(c.telefono), tel = String(c.telefono || '').replace(/\s/g, '');
        const contacto = [
            wa ? `<a class="c-wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>` : '',
            tel ? `<a class="c-tel" href="tel:${esc(tel)}">📞 Llamar</a>` : '',
            c.correo ? `<a class="c-mail" href="mailto:${esc(c.correo)}">✉ Correo</a>` : '',
            (c.cv && c.cv.url) ? `<a class="c-cv" href="${esc(c.cv.url)}" target="_blank" rel="noopener">${c.cv.tipo === 'pdf' ? '📄' : '📎'} CV</a>` : ''
        ].filter(Boolean).join('');
        const cvAdd = (c.cv && c.cv.url) ? '' : `<label class="justif-add">📎 Subir CV<input type="file" accept="image/*,application/pdf" style="display:none" onchange="subirCV('${c.id}',this)"></label>`;
        const sel = `<select onchange="cambiarEtapa('${c.id}',this.value)">${ETAPAS.map(([v, l]) => `<option value="${v}" ${etapa === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
        const contratarBtn = (etapa === 'contratado' && !c.empleadoCreadoId) ? `<button class="b-ok" style="border:none;border-radius:8px;padding:7px 11px;font-weight:bold;font-size:12px;cursor:pointer;font-family:'Arimo';min-height:38px" onclick="contratar('${c.id}')">➕ Crear empleado</button>` : '';
        const yaEmp = c.empleadoCreadoId ? '<span class="estado-badge abierta">✓ Empleado creado</span>' : '';
        const sub = [c.vacanteTitulo || 'Sin vacante', c.fuente, c.fechaEntrevista ? '📅 Entrevista ' + fmtFecha(c.fechaEntrevista) : ''].filter(Boolean).join(' · ');
        return `<div class="order-card cand-card"><div class="info">
            <b>${esc(c.nombre)}</b> ${yaEmp}
            <div class="l">${esc(sub)}</div>
            ${c.notas ? `<div class="l">“${esc(c.notas)}”</div>` : ''}
            <div class="contact-row">${contacto}${cvAdd}</div>
            <div class="cand-etapa">Etapa: ${sel} ${contratarBtn}
                <button class="b-borrar" style="border-radius:8px;padding:7px 10px;font-weight:bold;font-size:12px;cursor:pointer;font-family:'Arimo';min-height:38px" onclick="editarCandidato('${c.id}')">✏</button>
                <button class="b-borrar" style="border-radius:8px;padding:7px 10px;font-weight:bold;font-size:12px;cursor:pointer;font-family:'Arimo';min-height:38px" onclick="borrarCandidato('${c.id}')">🗑</button>
            </div>
        </div></div>`;
    }

    llenarVacanteSelects();
</script>

</body>
</html>
