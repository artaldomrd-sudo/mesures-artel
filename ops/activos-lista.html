<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Activos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260805">
<style>
    main { max-width: 900px; }
    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 9px 15px; }
    .kpi .n { font-size: 16px; font-weight: bold; color: var(--artal-blue); line-height: 1; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
    .aviso { background: #fff5e0; border: 1.5px solid var(--artal-yellow); color: #7a5e13; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; line-height: 1.5; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar input.buscar, .bar select { padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .bar input.buscar { flex: 1; min-width: 150px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .act-card { display: flex; align-items: flex-start; gap: 12px; }
    .act-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; border: 1.5px solid #e3e7ec; flex: 0 0 auto; background: #f3f4f6; }
    .act-noimg { width: 54px; height: 54px; border-radius: 10px; background: #eef1f4; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 auto; }
    .act-info { flex: 1; min-width: 0; }
    .act-info b { color: var(--artal-blue); font-size: 15px; }
    .act-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .act-info .dep { font-size: 12px; color: #12908a; margin-top: 4px; font-weight: bold; }
    .b { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; letter-spacing: .3px; }
    .b.activo { background: #e7f7ee; color: #1f9d61; } .b.defectuoso { background: #fdeaea; color: #d9483b; }
    .b.prestado { background: #eef3ff; color: #3457b2; } .b.baja { background: #f1f1f4; color: #8a93a0; }
    .b.dr { background: #f3eefb; color: #7d3ac1; } .b.cod { background: #eef1f4; color: #556; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button { border: none; border-radius: 8px; padding: 8px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 36px; }
    .b-editar { background: var(--artal-blue); color: #fff; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 11px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 52px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="activos.html" title="Volver a Activos">← Activos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Activos</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="kpis" id="kpis"></div>
    <div class="aviso">La depreciación mostrada es un <b>estimado</b> según la categoría DR (Norma 05-07): Edificaciones 5% (línea recta), Vehículos/oficina/computadoras 25% y Otros bienes 15% (saldo decreciente). Confirma el cálculo fiscal exacto con tu contadora.</div>
    <div class="bar">
        <button class="btn-y" onclick="abrirNuevo()">+ Nuevo activo</button>
        <input class="buscar" id="buscar" placeholder="Buscar por nombre, código, categoría…" oninput="render()">
        <select id="f-estado" onchange="render()"><option value="">Estado: todos</option><option value="activo">Activos</option><option value="defectuoso">Defectuosos</option><option value="prestado">Prestados</option><option value="baja">Dados de baja</option></select>
        <select id="f-dr" onchange="render()"><option value="">Categoría DR: todas</option><option value="1">1 · Edificaciones</option><option value="2">2 · Vehíc./oficina</option><option value="3">3 · Otros bienes</option></select>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Nuevo activo</h2>
        <label>Nombre *</label>
        <input type="text" id="a-nombre" placeholder="Ej. Compresor de aire, Camioneta, Laptop Dell…">
        <div class="grid2">
            <div><label>Código / etiqueta <span class="lbl-opt">— opcional</span></label><input type="text" id="a-codigo" placeholder="Ej. ACT-001"></div>
            <div><label>Categoría</label><input type="text" id="a-categoria" list="cat-list" placeholder="Ej. Vehículo, Maquinaria…"><datalist id="cat-list"><option value="Computadora / equipo informático"></option><option value="Equipo de oficina"></option><option value="Mobiliario"></option><option value="Vehículo"></option><option value="Maquinaria"></option><option value="Herramienta"></option><option value="Edificación"></option><option value="Otro"></option></datalist></div>
        </div>
        <label>Categoría de depreciación (DR 05-07)</label>
        <select id="a-dr">
            <option value="">Sin depreciar</option>
            <option value="1">Categoría 1 — Edificaciones (5%)</option>
            <option value="2">Categoría 2 — Vehículos, equipo/muebles de oficina, computadoras (25%)</option>
            <option value="3">Categoría 3 — Otros bienes depreciables (15%)</option>
        </select>
        <div class="grid2">
            <div><label>Valor de adquisición (RD$)</label><input type="number" id="a-valor" min="0" step="0.01" placeholder="0.00"></div>
            <div><label>Fecha de adquisición</label><input type="date" id="a-fecha"></div>
        </div>
        <div class="grid2">
            <div><label>Estado</label><select id="a-estado"><option value="activo">Activo</option><option value="defectuoso">Defectuoso</option><option value="prestado">Prestado / rentado</option><option value="baja">Dado de baja</option></select></div>
            <div><label>Ubicación</label><input type="text" id="a-ubicacion" placeholder="Taller, oficina, obra…"></div>
        </div>
        <div class="grid2">
            <div><label>Responsable <span class="lbl-opt">— empleado/persona</span></label><input type="text" id="a-responsable"></div>
            <div><label>Proveedor</label><input type="text" id="a-proveedor"></div>
        </div>
        <label>Factura / documento <span class="lbl-opt">— nº o referencia</span></label>
        <input type="text" id="a-factura">
        <label>Foto <span class="lbl-opt">— opcional</span></label>
        <input type="file" id="a-foto" accept="image/*">
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <textarea id="a-notas"></textarea>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db, storage } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { maximumFractionDigits: 0 });
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    const DR_RATE = { '1': 0.05, '2': 0.25, '3': 0.15 };
    const DR_LABEL = { '1': 'DR 1 · 5%', '2': 'DR 2 · 25%', '3': 'DR 3 · 15%' };
    const estadoLabel = { activo: 'Activo', defectuoso: 'Defectuoso', prestado: 'Prestado', baja: 'Baja' };

    // Depreciación estimada: línea recta para edificaciones (cat 1), saldo decreciente para cat 2/3.
    function depreciacion(a) {
        const valor = n2(a.valorAdquisicion), cat = String(a.categoriaDR || ''), rate = DR_RATE[cat] || 0;
        if (!valor || !a.fechaAdquisicion || !rate || (a.estado === 'baja')) return { rate, anios: 0, acumulada: 0, libros: valor };
        const d0 = new Date(a.fechaAdquisicion + 'T00:00:00'); if (isNaN(d0)) return { rate, anios: 0, acumulada: 0, libros: valor };
        let anios = (Date.now() - d0.getTime()) / (365.25 * 86400000); if (anios < 0) anios = 0;
        let libros, acum;
        if (cat === '1') { acum = Math.min(valor, valor * rate * anios); libros = valor - acum; }
        else { libros = valor * Math.pow(1 - rate, anios); acum = valor - libros; }
        return { rate, anios, acumulada: acum, libros };
    }

    let activos = [], editId = null;

    onSnapshot(collection(db, 'activos'), (snap) => {
        activos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });

    // ---------- Foto ----------
    function comprimirImg(file) {
        return new Promise((resolve) => {
            if (!file || !/^image\//.test(file.type)) { resolve(file); return; }
            const url = URL.createObjectURL(file); const img = new Image();
            img.onload = () => {
                const max = 1600; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
                c.toBlob(b => resolve(b || file), 'image/jpeg', 0.82);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });
    }
    async function subirFoto(file, id) {
        const blob = await comprimirImg(file).catch(() => file);
        const r = ref(storage, `activos/${id}/${Date.now()}.jpg`);
        await uploadBytes(r, blob, { contentType: 'image/jpeg' });
        return { url: await getDownloadURL(r), nombre: file.name || 'foto.jpg' };
    }

    // ---------- Modal ----------
    window.abrirNuevo = function () {
        editId = null; document.getElementById('modal-title').textContent = 'Nuevo activo';
        ['a-nombre', 'a-codigo', 'a-categoria', 'a-valor', 'a-ubicacion', 'a-responsable', 'a-proveedor', 'a-factura', 'a-notas', 'a-foto'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('a-dr').value = '';
        document.getElementById('a-fecha').value = hoyISO();
        document.getElementById('a-estado').value = 'activo';
        document.getElementById('modal').classList.add('show');
    };
    window.editar = function (id) {
        const a = activos.find(x => x.id === id); if (!a) return;
        editId = id; document.getElementById('modal-title').textContent = 'Editar activo';
        document.getElementById('a-nombre').value = a.nombre || '';
        document.getElementById('a-codigo').value = a.codigo || '';
        document.getElementById('a-categoria').value = a.categoria || '';
        document.getElementById('a-dr').value = a.categoriaDR || '';
        document.getElementById('a-valor').value = a.valorAdquisicion != null ? a.valorAdquisicion : '';
        document.getElementById('a-fecha').value = a.fechaAdquisicion || '';
        document.getElementById('a-estado').value = a.estado || 'activo';
        document.getElementById('a-ubicacion').value = a.ubicacion || '';
        document.getElementById('a-responsable').value = a.responsable || '';
        document.getElementById('a-proveedor').value = a.proveedor || '';
        document.getElementById('a-factura').value = a.factura || '';
        document.getElementById('a-notas').value = a.notas || '';
        document.getElementById('a-foto').value = '';
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const nombre = document.getElementById('a-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre del activo.'); return; }
        const datos = {
            nombre, codigo: document.getElementById('a-codigo').value.trim(),
            categoria: document.getElementById('a-categoria').value.trim(),
            categoriaDR: document.getElementById('a-dr').value,
            valorAdquisicion: n2(document.getElementById('a-valor').value),
            fechaAdquisicion: document.getElementById('a-fecha').value || '',
            estado: document.getElementById('a-estado').value,
            ubicacion: document.getElementById('a-ubicacion').value.trim(),
            responsable: document.getElementById('a-responsable').value.trim(),
            proveedor: document.getElementById('a-proveedor').value.trim(),
            factura: document.getElementById('a-factura').value.trim(),
            notas: document.getElementById('a-notas').value.trim(),
            actualizado: serverTimestamp(), actualizadoPor: usuario.nombre
        };
        const file = (document.getElementById('a-foto').files || [])[0];
        const btn = document.querySelector('#modal .btn-guardar');
        if (btn) { btn.disabled = true; btn.textContent = file ? 'Subiendo…' : 'Guardando…'; }
        try {
            let id = editId;
            if (editId) await updateDoc(doc(db, 'activos', editId), datos);
            else { const r = await addDoc(collection(db, 'activos'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() }); id = r.id; }
            if (file) { const foto = await subirFoto(file, id); await updateDoc(doc(db, 'activos', id), { foto }); }
            cerrar();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; } }
    };
    window.borrar = async function (id) {
        const a = activos.find(x => x.id === id) || {};
        if (!confirm('¿Eliminar el activo "' + (a.nombre || '') + '"?')) return;
        try { await deleteDoc(doc(db, 'activos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const term = (document.getElementById('buscar').value || '').toLowerCase().trim();
        const fe = document.getElementById('f-estado').value, fd = document.getElementById('f-dr').value;
        // KPIs
        const vivos = activos.filter(a => (a.estado || 'activo') !== 'baja');
        const valor = vivos.reduce((s, a) => s + n2(a.valorAdquisicion), 0);
        let acum = 0, libros = 0;
        vivos.forEach(a => { const d = depreciacion(a); acum += d.acumulada; libros += d.libros; });
        document.getElementById('kpis').innerHTML = [
            ['Activos', vivos.length], ['Valor adquisición', fmt0(valor)], ['Dep. acum. (est.)', fmt0(acum)], ['Valor en libros (est.)', fmt0(libros)]
        ].map(([l, n]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

        let lista = activos.slice();
        if (fe) lista = lista.filter(a => (a.estado || 'activo') === fe);
        if (fd) lista = lista.filter(a => String(a.categoriaDR || '') === fd);
        if (term) lista = lista.filter(a => [a.nombre, a.codigo, a.categoria, a.ubicacion, a.responsable, a.proveedor].some(v => String(v || '').toLowerCase().includes(term)));
        lista.sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));

        const cont = document.getElementById('lista');
        if (!activos.length) { cont.innerHTML = '<p class="empty">Aún no hay activos. Crea el primero con «+ Nuevo activo».</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin resultados para el filtro.</p>'; return; }
        cont.innerHTML = lista.map(cardHTML).join('');
    }

    function cardHTML(a) {
        const est = a.estado || 'activo';
        const d = depreciacion(a);
        const thumb = (a.foto && a.foto.url) ? `<img class="act-thumb" src="${esc(a.foto.url)}" alt="">` : '<div class="act-noimg">📦</div>';
        const badges = [
            `<span class="b ${est}">${estadoLabel[est] || est}</span>`,
            a.categoriaDR ? `<span class="b dr">${DR_LABEL[a.categoriaDR]}</span>` : '',
            a.codigo ? `<span class="b cod">${esc(a.codigo)}</span>` : ''
        ].filter(Boolean).join(' ');
        const meta = [a.categoria, a.valorAdquisicion ? fmt0(a.valorAdquisicion) : '', a.fechaAdquisicion ? fmtFecha(a.fechaAdquisicion) : '', a.ubicacion ? '📍 ' + esc(a.ubicacion) : '', a.responsable ? '👤 ' + esc(a.responsable) : ''].filter(Boolean).join('  ·  ');
        const dep = (a.categoriaDR && a.valorAdquisicion) ? `Dep. acum. estimada ${fmt(d.acumulada)} · Valor en libros ${fmt(d.libros)}` : '';
        return `<div class="order-card act-card">
            ${thumb}
            <div class="act-info">
                <b>${esc(a.nombre)}</b> ${badges}
                ${meta ? `<div class="l">${meta}</div>` : ''}
                ${dep ? `<div class="dep">${dep}</div>` : ''}
                ${a.notas ? `<div class="l">“${esc(a.notas)}”</div>` : ''}
            </div>
            <div class="row-actions">
                <button class="b-editar" onclick="editar('${a.id}')">✏ Editar</button>
                <button class="b-borrar" onclick="borrar('${a.id}')">🗑</button>
            </div>
        </div>`;
    }
</script>

</body>
</html>
