<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Actividades CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260805">
<style>
    main { max-width: 900px; }
    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 9px 15px; }
    .kpi .n { font-size: 17px; font-weight: bold; line-height: 1; } .kpi .n.a { color: var(--artal-blue); } .kpi .n.p { color: #c07a12; } .kpi .n.v { color: #d9483b; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar input.buscar, .bar select { padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .bar input.buscar { flex: 1; min-width: 150px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .ac-card { display: flex; align-items: flex-start; gap: 12px; border-left: 4px solid #ccd; }
    .ac-card.pend { border-left-color: #f0a020; } .ac-card.venc { border-left-color: #e74c3c; } .ac-card.done { opacity: .72; }
    .ac-ic { width: 40px; height: 40px; border-radius: 10px; background: #eef4fb; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: 0 0 auto; }
    .ac-info { flex: 1; min-width: 0; } .ac-info b { color: var(--artal-blue); font-size: 14.5px; }
    .ac-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .ac-info .res { font-size: 12.5px; color: #445; margin-top: 3px; }
    .b { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 20px; background: #eef1f4; color: #556; }
    .b.cli { background: #eef3ff; color: #3457b2; }
    .seg { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; font-weight: bold; padding: 4px 9px; border-radius: 8px; }
    .seg.pend { background: #fff7e6; color: #c07a12; } .seg.venc { background: #fdeaea; color: #d9483b; } .seg.done { background: #e7f7ee; color: #1f9d61; }
    .seg .hecho { border: none; background: #2ecc71; color: #fff; border-radius: 7px; padding: 4px 9px; font-weight: bold; font-size: 11.5px; cursor: pointer; font-family: 'Arimo'; }
    .row-actions { display: flex; gap: 6px; flex-direction: column; }
    .row-actions button { background: transparent; border: none; cursor: pointer; font-size: 14px; color: #c9ced6; } .row-actions button:hover { color: var(--artal-blue); } .row-actions button.d:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 54px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="ventas.html" title="Volver a Ventas">← Ventas</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Actividades</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="kpis" id="kpis"></div>
    <div class="bar">
        <button class="btn-y" onclick="abrir()">+ Nueva actividad</button>
        <select id="f-tipo" onchange="render()"><option value="">Todos los tipos</option><option value="llamada">Llamadas</option><option value="reunion">Reuniones</option><option value="visita">Visitas</option><option value="correo">Correos</option><option value="tarea">Tareas</option><option value="nota">Notas</option></select>
        <select id="f-seg" onchange="render()"><option value="">Todas</option><option value="pend">Con seguimiento pendiente</option><option value="venc">Seguimiento vencido</option></select>
        <input class="buscar" id="buscar" placeholder="Buscar cliente, asunto…" oninput="render()">
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<datalist id="cli-dl"></datalist>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Nueva actividad</h2>
        <div class="grid2">
            <div><label>Tipo</label><select id="a-tipo"><option value="llamada">📞 Llamada</option><option value="reunion">🤝 Reunión</option><option value="visita">📍 Visita</option><option value="correo">✉️ Correo</option><option value="tarea">✅ Tarea</option><option value="nota">📝 Nota</option></select></div>
            <div><label>Fecha</label><input type="date" id="a-fecha"></div>
        </div>
        <label>Cliente <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="a-cliente" list="cli-dl" placeholder="Nombre del cliente">
        <label>Asunto *</label>
        <input type="text" id="a-asunto" placeholder="Ej. Llamada de seguimiento cotización COT-0012">
        <label>Detalle <span class="lbl-opt">— opcional</span></label>
        <textarea id="a-detalle" placeholder="Qué se habló / qué se hizo"></textarea>
        <label>Resultado <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="a-resultado" placeholder="Ej. Interesado, pidió ajustar precio">
        <div class="grid2">
            <div><label>Próximo seguimiento <span class="lbl-opt">— opcional</span></label><input type="date" id="a-seguimiento"></div>
            <div><label>Responsable</label><input type="text" id="a-responsable"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['cotizaciones']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: '2-digit', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    const ICO = { llamada: '📞', reunion: '🤝', visita: '📍', correo: '✉️', tarea: '✅', nota: '📝' };
    const TIPO_LBL = { llamada: 'Llamada', reunion: 'Reunión', visita: 'Visita', correo: 'Correo', tarea: 'Tarea', nota: 'Nota' };

    let actividades = [], editId = null;
    onSnapshot(collection(db, 'ventasActividades'), (s) => { actividades = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'clientes'), (s) => {
        const nombres = s.docs.map(d => (d.data().nombre || '')).filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));
        document.getElementById('cli-dl').innerHTML = nombres.map(n => `<option value="${esc(n)}"></option>`).join('');
    }, () => {});

    // Estado del seguimiento de una actividad: 'done' si ya se completó, 'venc' si la fecha pasó,
    // 'pend' si está por venir, o '' si no tiene seguimiento programado.
    function segEstado(a) {
        if (!a.seguimientoFecha) return '';
        if (a.seguimientoHecho) return 'done';
        return a.seguimientoFecha < hoyISO() ? 'venc' : 'pend';
    }

    window.abrir = function () {
        editId = null; document.getElementById('modal-title').textContent = 'Nueva actividad';
        document.getElementById('a-tipo').value = 'llamada';
        document.getElementById('a-fecha').value = hoyISO();
        ['a-cliente', 'a-asunto', 'a-detalle', 'a-resultado', 'a-seguimiento'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('a-responsable').value = usuario.nombre;
        document.getElementById('modal').classList.add('show');
    };
    window.editar = function (id) {
        const a = actividades.find(x => x.id === id); if (!a) return;
        editId = id; document.getElementById('modal-title').textContent = 'Editar actividad';
        document.getElementById('a-tipo').value = a.tipo || 'llamada';
        document.getElementById('a-fecha').value = a.fecha || hoyISO();
        document.getElementById('a-cliente').value = a.cliente || '';
        document.getElementById('a-asunto').value = a.asunto || '';
        document.getElementById('a-detalle').value = a.detalle || '';
        document.getElementById('a-resultado').value = a.resultado || '';
        document.getElementById('a-seguimiento').value = a.seguimientoFecha || '';
        document.getElementById('a-responsable').value = a.responsable || usuario.nombre;
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const asunto = document.getElementById('a-asunto').value.trim();
        if (!asunto) { alert('Escribe el asunto.'); return; }
        const datos = {
            tipo: document.getElementById('a-tipo').value, fecha: document.getElementById('a-fecha').value || hoyISO(),
            cliente: document.getElementById('a-cliente').value.trim(), asunto,
            detalle: document.getElementById('a-detalle').value.trim(), resultado: document.getElementById('a-resultado').value.trim(),
            seguimientoFecha: document.getElementById('a-seguimiento').value || '', responsable: document.getElementById('a-responsable').value.trim(),
            actualizado: serverTimestamp(), actualizadoPor: usuario.nombre
        };
        const btn = document.querySelector('#modal .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            if (editId) await updateDoc(doc(db, 'ventasActividades', editId), datos);
            else await addDoc(collection(db, 'ventasActividades'), { ...datos, seguimientoHecho: false, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrar();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.marcarHecho = async function (id) {
        try { await updateDoc(doc(db, 'ventasActividades', id), { seguimientoHecho: true, seguimientoHechoPor: usuario.nombre, seguimientoHechoFecha: serverTimestamp() }); }
        catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrar = async function (id) {
        if (!confirm('¿Eliminar esta actividad?')) return;
        try { await deleteDoc(doc(db, 'ventasActividades', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const hoy = hoyISO(), now = new Date();
        const pend = actividades.filter(a => segEstado(a) === 'pend').length;
        const venc = actividades.filter(a => segEstado(a) === 'venc').length;
        const mes = actividades.filter(a => { const d = new Date((a.fecha || '') + 'T00:00:00'); return !isNaN(d) && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }).length;
        document.getElementById('kpis').innerHTML =
            `<div class="kpi"><div class="n a">${mes}</div><div class="l">Actividades del mes</div></div>` +
            `<div class="kpi"><div class="n p">${pend}</div><div class="l">Seguimientos pendientes</div></div>` +
            `<div class="kpi"><div class="n v">${venc}</div><div class="l">Seguimientos vencidos</div></div>`;

        const ftipo = document.getElementById('f-tipo').value, fseg = document.getElementById('f-seg').value, term = (document.getElementById('buscar').value || '').toLowerCase().trim();
        let lista = actividades.slice();
        if (ftipo) lista = lista.filter(a => (a.tipo || '') === ftipo);
        if (fseg) lista = lista.filter(a => segEstado(a) === fseg);
        if (term) lista = lista.filter(a => [a.cliente, a.asunto, a.detalle, a.resultado, a.responsable].some(v => String(v || '').toLowerCase().includes(term)));
        // Orden: primero los seguimientos pendientes/vencidos por fecha de seguimiento, luego el resto por fecha desc.
        lista.sort((a, b) => {
            const sa = segEstado(a), sb = segEstado(b);
            const activoA = (sa === 'pend' || sa === 'venc'), activoB = (sb === 'pend' || sb === 'venc');
            if (activoA !== activoB) return activoA ? -1 : 1;
            if (activoA) return String(a.seguimientoFecha).localeCompare(String(b.seguimientoFecha));
            return String(b.fecha || '').localeCompare(String(a.fecha || ''));
        });

        const cont = document.getElementById('lista');
        if (!actividades.length) { cont.innerHTML = '<p class="empty">Aún no hay actividades. Registra la primera con «+ Nueva actividad».</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin actividades para el filtro.</p>'; return; }
        cont.innerHTML = lista.map(a => {
            const tipo = a.tipo || 'nota', seg = segEstado(a);
            const cls = seg === 'venc' ? 'venc' : (seg === 'pend' ? 'pend' : '');
            const meta = [fmtFecha(a.fecha), a.responsable ? 'por ' + esc(a.responsable) : ''].filter(Boolean).join('  ·  ');
            let segHtml = '';
            if (seg === 'done') segHtml = `<div class="seg done">✓ Seguimiento hecho (${esc(fmtFecha(a.seguimientoFecha))})</div>`;
            else if (seg) segHtml = `<div class="seg ${seg}">🔔 Seguimiento: ${esc(fmtFecha(a.seguimientoFecha))}${seg === 'venc' ? ' (vencido)' : ''} <button class="hecho" onclick="marcarHecho('${a.id}')">✓ Hecho</button></div>`;
            return `<div class="order-card ac-card ${cls}">
                <div class="ac-ic">${ICO[tipo] || '•'}</div>
                <div class="ac-info">
                    <b>${esc(a.asunto)}</b> <span class="b">${TIPO_LBL[tipo] || tipo}</span>${a.cliente ? ` <span class="b cli">${esc(a.cliente)}</span>` : ''}
                    ${meta ? `<div class="l">${meta}</div>` : ''}
                    ${a.detalle ? `<div class="res">${esc(a.detalle)}</div>` : ''}
                    ${a.resultado ? `<div class="res"><b style="color:#445">Resultado:</b> ${esc(a.resultado)}</div>` : ''}
                    ${segHtml}
                </div>
                <div class="row-actions">
                    <button onclick="editar('${a.id}')" title="Editar">✏</button>
                    <button class="d" onclick="borrar('${a.id}')" title="Eliminar">🗑</button>
                </div>
            </div>`;
        }).join('');
    }

    render();
</script>

</body>
</html>
