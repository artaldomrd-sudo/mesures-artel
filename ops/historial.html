<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Historial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 900px; }
    #search-input, #audit-search, #carpeta-search { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-family: 'Arimo'; font-size: 15px; min-height: 48px; background: #fff; box-sizing: border-box; }
    .carpeta-back { background: none; border: none; color: var(--artal-blue); font-weight: bold; font-family: 'Arimo'; font-size: 14px; cursor: pointer; padding: 4px 0 14px; }
    .carpeta-back:hover { text-decoration: underline; }
    .carpeta-cliente-titulo { color: var(--artal-blue); font-size: 18px; margin: 0 0 14px; }
    .carpeta { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 16px; border-left: 6px solid #8e44ad; }
    .carpeta.abierta { padding-bottom: 14px; }
    .carpeta-top { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .carpeta-info { flex: 1; min-width: 0; }
    .carpeta-info h3 { margin: 0 0 2px; color: var(--artal-blue); font-size: 16px; }
    .carpeta .cliente { font-size: 12px; color: #888; }
    .carpeta-doc { border-top: 1px solid #f0f0f0; padding: 9px 0; margin-top: 6px; }
    .carpeta-doc .doc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .doc-tag { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 12px; color: #fff; display: inline-block; }
    .doc-tag.cot { background: #3498db; }
    .doc-tag.fab { background: #8e44ad; }
    .doc-tag.compra { background: #16a085; }
    .carpeta-doc-obra { font-size: 12.5px; color: #8e44ad; font-weight: bold; }
    .carpeta-doc .doc-links { font-size: 12.5px; color: #666; margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
    .carpeta-doc .doc-links a { color: var(--artal-blue); font-weight: bold; text-decoration: none; }
    .audit-proyecto { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; border-left: 6px solid var(--artal-blue); }
    .audit-proyecto h3 { margin: 0 0 2px; color: var(--artal-blue); font-size: 16px; }
    .audit-proyecto .cliente { font-size: 12px; color: #888; font-weight: normal; }
    .audit-timeline { list-style: none; margin: 8px 0 0; padding: 0; }
    .audit-timeline li { font-size: 13px; color: #444; padding: 7px 0; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
    .audit-estado { font-weight: bold; }
    .audit-estado.completado { color: #2ecc71; }
    .audit-estado.en_proceso { color: #3498db; }
    .audit-estado.pendiente { color: #e67e22; }
    .audit-meta { color: #888; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 6px; }
    .cat-group-label { font-size: 12px; font-weight: bold; color: var(--artal-blue); text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; }
    .cat-group-label:first-of-type { margin-top: 10px; }
    .cat-tile {
        background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 14px;
        border: 3px solid transparent; cursor: pointer; text-align: center; font-family: 'Arimo';
        transition: 0.15s; color: var(--artal-blue);
    }
    .cat-tile:hover { transform: translateY(-2px); }
    .cat-tile.active { border-color: var(--artal-yellow); background: var(--artal-blue); color: #fff; }
    .cat-tile .emoji { font-size: 26px; }
    .cat-tile .count { font-size: 26px; font-weight: bold; margin-top: 4px; }
    .cat-tile .label { font-size: 12.5px; font-weight: bold; margin-top: 2px; }
    #alerts-section { display: none; }
    #alerts-section.show { display: flex; flex-direction: column; gap: 10px; }
    .alert-card { background: #fff; border-left: 6px solid #e74c3c; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
    .alert-card .alert-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .alert-card .alert-head b { color: var(--artal-blue); font-size: 15px; }
    .alert-card .alert-tag { font-size: 10.5px; font-weight: bold; text-transform: uppercase; background: #e74c3c; color: #fff; padding: 3px 8px; border-radius: 12px; }
    .alert-card p { font-size: 13px; color: #444; margin: 8px 0; }
    .alert-card button { padding: 8px 14px; border: none; border-radius: 7px; background: var(--artal-blue); color: #fff; font-weight: bold; font-family: 'Arimo'; cursor: pointer; }
    h2.section-title { font-size: 15px; color: #e74c3c; margin: 0; }
    .status-change-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .status-change-row select { flex: 1; min-width: 200px; padding: 9px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 13px; }
    .status-change-row button { padding: 9px 14px; border: none; border-radius: 7px; background: #e67e22; color: #fff; font-weight: bold; font-family: 'Arimo'; cursor: pointer; font-size: 13px; }
    .assign-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .assign-row label { font-size: 12px; color: #666; font-weight: bold; }
    .assign-row select { flex: 1; min-width: 160px; padding: 9px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 13px; }
    .assign-row button { padding: 9px 14px; border: none; border-radius: 7px; background: var(--artal-blue); color: #fff; font-weight: bold; font-family: 'Arimo'; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver al panel">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Historial</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="tabs">
        <button class="tab-btn active" id="tab-pedidos" onclick="setVista('pedidos')">Pedidos</button>
        <button class="tab-btn" id="tab-carpetas" onclick="setVista('carpetas')">Carpetas por obra</button>
        <button class="tab-btn" id="tab-auditoria" onclick="setVista('auditoria')">Auditoría</button>
    </div>

    <div id="pedidos-view">
        <h2 class="section-title" id="alerts-title" style="display:none;">⚠ Alertas pendientes</h2>
        <div id="alerts-section"></div>
        <input type="text" id="search-input" list="clientes-datalist" placeholder="🔎 Buscar por cliente u obra…" autocomplete="off">
        <datalist id="clientes-datalist"></datalist>
        <div id="cat-grid"></div>
        <div id="orders-list"><p class="empty">Cargando…</p></div>
    </div>

    <div id="carpetas-view" style="display:none;">
        <input type="text" id="carpeta-search" placeholder="🔎 Buscar obra o cliente…" autocomplete="off">
        <div id="carpetas-list"><p class="empty">Cargando…</p></div>
    </div>

    <div id="auditoria-view" style="display:none;">
        <input type="text" id="audit-search" placeholder="🔎 Buscar proyecto…" autocomplete="off">
        <div id="audit-list"><p class="empty">Cargando…</p></div>
    </div>
</main>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, doc, deleteDoc, updateDoc, onSnapshot, query, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { openOrderPreview } from './order-preview.js';
    import { buildClientMap, clientList } from './clients.js';
    window.openOrderPreview = openOrderPreview;

    // Solo admin: es un archivo histórico completo de todos los pedidos, no una pantalla
    // operativa de un rol específico. requireAuth([]) solo deja pasar a quien tenga rol admin.
    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const STATUS_LABEL = {
        solicitada: 'Cotización: solicitada al contratista',
        costeada: 'Cotización: costeada, falta enviar',
        enviada_cliente: 'Cotización: enviada al cliente',
        pendiente_proveedor: 'Compra: pendiente de confirmación de proveedor',
        pendiente_fabrica: 'Fabricación: pendiente',
        en_fabrica: 'Fabricación: en proceso',
        parcialmente_listo: 'Parcialmente listo para cargar',
        listo_para_cargar: 'Listo para cargar/instalar',
        parcialmente_instalado: 'Parcialmente instalado',
        completado: 'Completado (entregado e instalado)'
    };

    const STATUS_OPTIONS_BY_TYPE = {
        COTIZACION: ['solicitada', 'costeada', 'enviada_cliente'],
        FABRICACION: ['pendiente_fabrica', 'en_fabrica', 'parcialmente_listo', 'listo_para_cargar', 'parcialmente_instalado', 'completado'],
        COMPRA_DIRECTA: ['pendiente_proveedor', 'listo_para_cargar', 'completado']
    };

    // Un pedido de Fabricación y uno de Compra Directa pueden compartir el mismo status
    // (`listo_para_cargar`, `completado` — ver STATUS_OPTIONS_BY_TYPE arriba), así que filtrar
    // solo por status mezclaba ambos tipos en el mismo mosaico (caso real reportado: "Completadas"
    // mostraba Compras Directas y Fabricaciones juntas sin poder distinguirlas). Cada categoría
    // ahora también puede pedir un `tipo` (función que confirma el docType) para separarlas.
    function esFabricacion(o) { return (o.docType || '').indexOf('FAB') === 0; }
    function esCompraDirecta(o) { return o.docType === 'COMPRA_DIRECTA'; }
    function esCotizacion(o) { return !esFabricacion(o) && !esCompraDirecta(o); }

    // Grupos en el orden en que se muestran; cada categoría pertenece a uno solo (o a ninguno,
    // como "Todos", que queda aparte arriba de los grupos).
    const CATEGORIES = [
        { key: 'todos', emoji: '🗂️', label: 'Todos', group: null, statuses: null },

        { key: 'cot_pendiente', emoji: '📐', label: 'Pendiente', group: 'Cotización', statuses: ['solicitada', 'costeada'], tipo: esCotizacion },
        { key: 'cot_enviada', emoji: '💵', label: 'Enviada al cliente', group: 'Cotización', statuses: ['enviada_cliente'], tipo: esCotizacion },

        { key: 'fab_pendiente', emoji: '🏭', label: 'Pendiente', group: 'Fabricación', statuses: ['pendiente_fabrica', 'en_fabrica'], tipo: esFabricacion },
        { key: 'fab_parcial', emoji: '🟠', label: 'Parcialmente lista', group: 'Fabricación', statuses: ['parcialmente_listo'], tipo: esFabricacion },
        { key: 'fab_lista', emoji: '📦', label: 'Lista para cargar', group: 'Fabricación', statuses: ['listo_para_cargar'], tipo: esFabricacion },
        { key: 'fab_parcial_inst', emoji: '🟠', label: 'Parcialmente instalada', group: 'Fabricación', statuses: ['parcialmente_instalado'], tipo: esFabricacion },
        { key: 'fab_completa', emoji: '✅', label: 'Completada', group: 'Fabricación', statuses: ['completado'], tipo: esFabricacion },

        { key: 'compra_pendiente', emoji: '⏳', label: 'Pendiente de proveedor', group: 'Compra Directa', statuses: ['pendiente_proveedor'], tipo: esCompraDirecta },
        { key: 'compra_lista', emoji: '🧾', label: 'Lista para cargar', group: 'Compra Directa', statuses: ['listo_para_cargar'], tipo: esCompraDirecta },
        { key: 'compra_completa', emoji: '✅', label: 'Entregada', group: 'Compra Directa', statuses: ['completado'], tipo: esCompraDirecta }
    ];
    const CATEGORY_GROUPS = ['Cotización', 'Fabricación', 'Compra Directa'];
    let currentCategory = 'todos';

    function matchesCategory(cat, o) {
        if (!cat.statuses) return true; // "Todos"
        if (!cat.statuses.includes(o.status)) return false;
        if (cat.tipo && !cat.tipo(o)) return false;
        return true;
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Para agrupar carpetas: "Casa Aarón" y "casa aaron" (mismo nombre, distinta may/acento)
    // deben caer en la MISMA carpeta automáticamente. Nombres genuinamente distintos (con
    // palabras de más, ej. "Casa Aarón barandas" vs "Casa Aarón") quedan como carpetas
    // separadas — el sistema no puede adivinar si son el mismo sitio o no, y ya no hay un
    // botón de combinar manual (se quitó: con la navegación Cliente → Obra ya no hacía falta).
    function normTexto(s) {
        return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function itemLabel(o, itemId) {
        const it = (o.items || []).find(x => String(x.id) === String(itemId));
        return it ? `${it.tipo || 'Elemento'} — ${it.ubicacion || 'sin ubicación'}` : 'Ítem ' + itemId;
    }

    function collectAlerts() {
        const alerts = [];
        allOrders.forEach(({ id, data: o }) => {
            const nombre = (esc(o.cliente) || 'Sin cliente') + ' — ' + esc(o.obra);
            if (o.comentarioFabrica && o.comentarioFabricaAtendido !== true) {
                alerts.push({ orderId: id, nombre, tag: 'Fábrica', texto: o.comentarioFabrica, atender: () => atenderFabrica(id) });
            }
            Object.entries(o.itemStatus || {}).forEach(([itemId, s]) => {
                if (s && s.estado === 'problema' && s.atendido !== true) {
                    alerts.push({ orderId: id, nombre, tag: 'Chofer · ' + itemLabel(o, itemId), texto: s.comentario, atender: () => atenderItem(id, 'itemStatus', itemId) });
                }
            });
            Object.entries(o.itemStatusInstalador || {}).forEach(([itemId, s]) => {
                if (s && s.estado === 'problema' && s.atendido !== true) {
                    alerts.push({ orderId: id, nombre, tag: 'Instalador · ' + itemLabel(o, itemId), texto: s.comentario, atender: () => atenderItem(id, 'itemStatusInstalador', itemId) });
                }
            });
        });
        return alerts;
    }

    function renderAlerts() {
        const alerts = collectAlerts();
        const section = document.getElementById('alerts-section');
        const title = document.getElementById('alerts-title');
        if (!alerts.length) {
            section.classList.remove('show');
            title.style.display = 'none';
            section.innerHTML = '';
            return;
        }
        title.style.display = 'block';
        section.classList.add('show');
        section.innerHTML = alerts.map((a, idx) => `
            <div class="alert-card">
                <div class="alert-head">
                    <b>${a.nombre}</b>
                    <span class="alert-tag">${esc(a.tag)}</span>
                </div>
                <p>${esc(a.texto)}</p>
                <button data-idx="${idx}">Marcar atendido</button>
            </div>`).join('');
        section.querySelectorAll('button[data-idx]').forEach(btn => {
            btn.onclick = () => alerts[Number(btn.dataset.idx)].atender();
        });
    }

    window.atenderFabrica = async function (id) {
        await updateDoc(doc(db, 'orders', id), { comentarioFabricaAtendido: true });
    };
    window.atenderItem = async function (id, field, itemId) {
        await updateDoc(doc(db, 'orders', id), { [`${field}.${itemId}.atendido`]: true });
    };
    // Instrucción/nota de la OFICINA para fábrica (canal aparte de comentarioFabrica, que es
    // fábrica→oficina). Se guarda como pendiente para que le aparezca como alerta a ALUCUFEL en
    // su panel de fábrica; cuando fábrica la marca atendida, aquí se ve "✓ Fábrica ya la vio".
    window.guardarInstrFabrica = async function (id) {
        const el = document.getElementById('instr-fab-' + id); if (!el) return;
        const texto = el.value.trim();
        try {
            await updateDoc(doc(db, 'orders', id), {
                comentarioParaFabrica: texto,
                comentarioParaFabricaPor: usuario.nombre,
                comentarioParaFabricaFecha: serverTimestamp(),
                comentarioParaFabricaAtendido: texto ? false : true
            });
            alert(texto ? 'Instrucción enviada a fábrica. Le aparecerá como alerta en su panel.' : 'Instrucción borrada.');
        } catch (e) { alert('No se pudo guardar: ' + e.message); }
    };

    function tileHTML(cat) {
        const count = allOrders.filter(({ data: o }) => matchesCategory(cat, o)).length;
        return `
        <div class="cat-tile ${cat.key === currentCategory ? 'active' : ''}" onclick="setCategory('${cat.key}')">
            <div class="emoji">${cat.emoji}</div>
            <div class="count">${count}</div>
            <div class="label">${esc(cat.label)}</div>
        </div>`;
    }

    function renderTiles() {
        const grid = document.getElementById('cat-grid');
        const todos = CATEGORIES.find(c => c.key === 'todos');
        let html = `<div class="cat-grid">${tileHTML(todos)}</div>`;
        CATEGORY_GROUPS.forEach(g => {
            const cats = CATEGORIES.filter(c => c.group === g);
            html += `<div class="cat-group-label">${esc(g)}</div><div class="cat-grid">${cats.map(tileHTML).join('')}</div>`;
        });
        grid.innerHTML = html;
    }

    window.setCategory = function (key) {
        currentCategory = key;
        renderTiles();
        render();
    };

    let allOrders = [];
    let choferesCache = [];
    let instaladoresCache = [];

    onSnapshot(query(collection(db, 'usuarios'), where('rol', 'array-contains', 'chofer')), (snap) => {
        choferesCache = snap.docs.map(d => ({ email: d.id, ...d.data() }));
        render();
    });
    onSnapshot(query(collection(db, 'usuarios'), where('rol', 'array-contains', 'instalador')), (snap) => {
        instaladoresCache = snap.docs.map(d => ({ email: d.id, ...d.data() }));
        render();
    });

    function orderDate(o) {
        const f = o.fechaCotizado || o.fechaSolicitada || o.fechaCompra;
        return f && f.toMillis ? f.toMillis() : 0;
    }

    function progresoExtra(o) {
        const bits = [];
        if (o.enRuta && !o.entregado) bits.push('🚚 En ruta');
        if (o.entregado) bits.push('Entregado ✓');
        if (o.instalado) bits.push('Instalado ✓');
        return bits.length ? ' · ' + bits.join(' · ') : '';
    }

    // Control de chofer: Wilson por defecto (siempre), más los choferes registrados y la obra ya
    // asignada si es otra, más la opción de escribir un nombre nuevo a mano. La asignación de
    // chofer es solo informativa (no restringe acceso), así que basta con el nombre.
    function choferControlHTML(id, o) {
        const actual = o.asignadoChoferNombre != null ? o.asignadoChoferNombre : 'Wilson';
        const base = ['Wilson', ...choferesCache.map(u => u.nombre).filter(Boolean)];
        if (actual && !base.includes(actual)) base.push(actual);
        const nombres = [...new Set(base)];
        const opts = nombres.map(n => `<option value="${esc(n)}" ${n === actual ? 'selected' : ''}>${esc(n)}</option>`).join('');
        return `<select id="asignar-chofer-${id}" onchange="onChoferSel('${id}')">
                    ${opts}
                    <option value="" ${actual === '' ? 'selected' : ''}>(sin asignar — cualquiera)</option>
                    <option value="__nuevo__">➕ Escribir chofer nuevo…</option>
                </select>
                <input type="text" id="asignar-chofer-nuevo-${id}" placeholder="Nombre del chofer nuevo" style="display:none;flex:1;min-width:160px;padding:9px;border:1.5px solid #ddd;border-radius:7px;font-family:'Arimo';font-size:13px;">`;
    }
    window.onChoferSel = function (id) {
        const sel = document.getElementById('asignar-chofer-' + id);
        document.getElementById('asignar-chofer-nuevo-' + id).style.display = sel.value === '__nuevo__' ? 'block' : 'none';
    };

    function orderCardHTML(id, o) {
        const extraLinks = [];
        if (o.contratistaPdfUrl) extraLinks.push(`<a href="${esc(o.contratistaPdfUrl)}" target="_blank">PDF contratista</a>`);
        if (o.cotizacionFinalPdfUrl) extraLinks.push(`<a href="${esc(o.cotizacionFinalPdfUrl)}" target="_blank">PDF final cliente</a>`);
        if (o.compraPdfUrl) extraLinks.push(`<a href="${esc(o.compraPdfUrl)}" target="_blank">Orden de compra</a>`);
        if (o.recepcionInstalador && o.recepcionInstalador.firma) extraLinks.push(`<a href="#" onclick="verFirma('${id}','rec'); return false;">Firma recepción (${esc(o.recepcionInstalador.nombre)})</a>`);
        if (o.clienteAprobacion && o.clienteAprobacion.firma) extraLinks.push(`<a href="#" onclick="verFirma('${id}','cli'); return false;">Firma cliente (${esc(o.clienteAprobacion.nombre)})</a>`);

        const isFab = (o.docType || '').indexOf('FAB') === 0;
        const isCompra = o.docType === 'COMPRA_DIRECTA';
        const statusOptions = isCompra ? STATUS_OPTIONS_BY_TYPE.COMPRA_DIRECTA
            : isFab ? STATUS_OPTIONS_BY_TYPE.FABRICACION : STATUS_OPTIONS_BY_TYPE.COTIZACION;
        const metaLine = isCompra
            ? `Compra directa · Proveedor: ${esc(o.proveedor)} · ${esc(o.totalItems) || 0} artículo(s)${progresoExtra(o)}`
            : `${esc(o.docType)} · ${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems${progresoExtra(o)}`;
        const verLink = isCompra ? '' : `<a href="#" onclick="openOrderPreview('${id}'); return false;">Ver hoja</a>`;

        return `
        <div class="order-card">
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
                <span class="badge">${esc(STATUS_LABEL[o.status] || o.status)}</span>
            </div>
            <div class="order-meta">
                <span>${metaLine}</span>
                ${verLink}
                ${extraLinks.join(' ')}
                <a href="#" onclick="eliminarPedido('${id}'); return false;" style="color:#e74c3c;">🗑 Eliminar</a>
            </div>
            ${lineaTiempoHTML(o)}
            <div class="status-change-row">
                <select id="status-select-${id}">

            ${(isFab || isCompra) ? `
            <div class="assign-row">

                <label>Instalador:</label>
                <select id="asignar-instalador-${id}">

                <textarea id="instr-fab-${id}" placeholder="Ej: adelantar fabricación de las 2 PV3…" style="width:100%;min-height:44px;padding:8px;border:1.5px solid #ddd;border-radius:7px;font-family:'Arimo';font-size:13px;box-sizing:border-box;">${esc(o.comentarioParaFabrica || '')}</textarea>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;">
                    <button onclick="guardarInstrFabrica('${id}')" style="background:var(--artal-blue);color:#fff;border:none;border-radius:7px;padding:8px 12px;font-weight:bold;font-family:'Arimo';font-size:13px;cursor:pointer;">Enviar a fábrica</button>
                    ${o.comentarioParaFabrica ? (o.comentarioParaFabricaAtendido ? '<span style="font-size:12px;color:#16a085;font-weight:bold;">✓ Fábrica ya la vio</span>' : '<span style="font-size:12px;color:#b9770e;font-weight:bold;">⏳ Pendiente de que fábrica la marque</span>') : ''}
                </div>
            </div>` : ''}
        </div>`;
    }

    function render() {
        const term = document.getElementById('search-input').value.trim().toLowerCase();
        const cat = CATEGORIES.find(c => c.key === currentCategory);
        const filtered = allOrders.filter(({ data: o }) => {
            if (!matchesCategory(cat, o)) return false;
            if (!term) return true;
            const haystack = ((o.cliente || '') + ' ' + (o.obra || '')).toLowerCase();
            return haystack.includes(term);
        });
        const list = document.getElementById('orders-list');
        if (!filtered.length) { list.innerHTML = '<p class="empty">No se encontraron pedidos.</p>'; return; }
        list.innerHTML = filtered.map(({ id, data }) => orderCardHTML(id, data)).join('');
    }

    document.getElementById('search-input').addEventListener('input', render);

    window.eliminarPedido = async function (id) {
        const o = (allOrders.find(o => o.id === id) || {}).data || {};
        if (!confirm(`¿Eliminar definitivamente "${o.cliente || ''} — ${o.obra || ''}"? Esta acción no se puede deshacer.`)) return;
        try {
            await deleteDoc(doc(db, 'orders', id));
        } catch (e) {
            alert('No se pudo eliminar: ' + e.message);
        }
    };

    // Corrección manual de estado (ej. se marcó "listo para cargar" por error). Al mover un
    // pedido de fabricación a cualquier estado que no sea "completado", se destraban
    // entregado/instalado para que vuelva a aparecer en chofer/instalador si corresponde.
    window.cambiarEstado = async function (id) {
        const nuevoEstado = document.getElementById('status-select-' + id).value;
        const o = (allOrders.find(o => o.id === id) || {}).data || {};
        if (nuevoEstado === o.status) return;
        if (!confirm(`¿Cambiar el estado de "${o.cliente || ''} — ${o.obra || ''}" a "${STATUS_LABEL[nuevoEstado] || nuevoEstado}"?`)) return;
        try {
            const cambios = { status: nuevoEstado };
            if (nuevoEstado !== 'completado' && ('entregado' in o || 'instalado' in o)) {
                cambios.entregado = false;
                cambios.instalado = false;
            }
            await updateDoc(doc(db, 'orders', id), cambios);
        } catch (e) {
            alert('No se pudo cambiar el estado: ' + e.message);
        }
    };

    // Asignar chofer/instalador a un pedido de fabricación. Si se deja "(sin asignar)", el
    // pedido queda visible para cualquier chofer/instalador (bolsa compartida) — asignar solo
    // lo restringe a esa persona (más tú, que siempre ves todo).
    window.guardarAsignacion = async function (id) {
        const choferRaw = document.getElementById('asignar-chofer-' + id).value;
        const choferNombre = choferRaw === '__nuevo__'
            ? document.getElementById('asignar-chofer-nuevo-' + id).value.trim()
            : choferRaw;
        const instaladorEmail = document.getElementById('asignar-instalador-' + id).value;
        const chofer = choferesCache.find(u => u.nombre === choferNombre);
        const instalador = instaladoresCache.find(u => u.email === instaladorEmail);
        try {
            await updateDoc(doc(db, 'orders', id), {
                asignadoChoferEmail: chofer ? chofer.email : null,
                asignadoChoferNombre: choferNombre || null,
                asignadoInstaladorEmail: instaladorEmail || null,
                asignadoInstaladorNombre: instalador ? instalador.nombre : null
            });
            alert('Asignación guardada.');
        } catch (e) {
            alert('No se pudo guardar la asignación: ' + e.message);

    };

    renderTiles();

    let clientesCache = [];
    function refreshClientesDatalist() {
        document.getElementById('clientes-datalist').innerHTML =
            clientList(buildClientMap(allOrders.map(o => o.data), clientesCache)).map(c => `<option value="${esc(c.nombre)}">`).join('');
    }
    onSnapshot(collection(db, 'clientes'), (snap) => { clientesCache = snap.docs.map(d => d.data()); refreshClientesDatalist(); });

    onSnapshot(collection(db, 'orders'), (snap) => {
        allOrders = snap.docs.map(d => ({ id: d.id, data: d.data() }));
        allOrders.sort((a, b) => orderDate(b.data) - orderDate(a.data));

    });

    // ============ Auditoría por proyecto ============
    // Muestra el registro de cambios de estado de las instalaciones (colección append-only
    // movimientosInstalaciones), agrupado por obra/proyecto, con quién y cuándo hizo cada cambio.
    const AUDIT_ESTADO = { pendiente: 'Pendiente', en_proceso: 'En proceso', completado: 'Completado' };
    let auditMovs = [];

    // Ver firma: la firma se guarda como imagen incrustada (data:image...). Los navegadores
    // bloquean abrir un data: en pestaña nueva (por eso salía about:blank), así que la mostramos
    // en un recuadro dentro de la página.
    window.verFirma = function (orderId, tipo) {
        const o = (allOrders.find(x => x.id === orderId) || {}).data || {};
        const info = tipo === 'rec' ? o.recepcionInstalador : o.clienteAprobacion;

    window.setVista = function (v) {
        ['pedidos', 'carpetas', 'auditoria'].forEach(k => {
            document.getElementById('tab-' + k).classList.toggle('active', v === k);
            document.getElementById(k + '-view').style.display = v === k ? 'block' : 'none';
        });
        if (v === 'carpetas') {
            // Siempre entra por el nivel de Clientes, aunque la última vez se haya quedado

    };

    function fmtFechaHora(ts) {
        return (ts && ts.toDate) ? ts.toDate().toLocaleString('es-DO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    }

    // ---- Línea de tiempo de un pedido (fechas de cada etapa + duraciones para comparar tiempos) ----
    function fFechaCorta(ts) { return (ts && ts.toDate) ? ts.toDate().toLocaleDateString('es-DO', { day: '2-digit', month: 'short', year: 'numeric' }) : ''; }
    function duracion(a, b) {
        if (!a || !a.toDate || !b || !b.toDate) return null;
        const ms = b.toDate() - a.toDate();
        if (ms < 0) return null;
        const dias = ms / 86400000;
        if (dias < 1) { const h = Math.max(1, Math.round(ms / 3600000)); return h + ' h'; }
        const d = Math.round(dias); return d + (d === 1 ? ' día' : ' días');
    }
    function lineaTiempoHTML(o) {
        const HITOS = [
            ['fechaSolicitada', '📤 Cotización enviada al contratista'],
            ['fechaCotizado', '📤 Enviado a fábrica'],
            ['fechaCompra', '🧾 Compra registrada'],
            ['fechaCosteada', '💲 Costeada por el contratista'],
            ['fechaEnviadaCliente', '✉️ Cotización enviada al cliente'],
            ['fechaEnFabrica', '🏭 Fábrica: puesto en proceso'],
            ['fechaParcialListo', '🟠 Fábrica: entrega parcial'],
            ['fechaListoParaCargar', '📦 Fábrica: entrega total (listo)'],
            ['fechaEntregado', '🚚 Entregado por el chofer'],
            ['fechaInstalado', '🔧 Instalado']
        ].filter(([k]) => o[k] && o[k].toDate);
        if (!hitosVale(o, HITOS)) return '';
        const filas = HITOS.map(([k, lbl]) =>
            `<div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #eef1f4;"><span style="color:#445;">${lbl}</span><span style="color:#0A3D62;font-weight:bold;white-space:nowrap;font-variant-numeric:tabular-nums;">${fFechaCorta(o[k])}</span></div>`).join('');
        const durs = [];
        const dResp = duracion(o.fechaSolicitada, o.fechaCosteada);
        if (dResp) durs.push('Respuesta del contratista: ' + dResp);
        const dFab = duracion(o.fechaEnFabrica || o.fechaCotizado, o.fechaListoParaCargar || o.fechaParcialListo);
        if (dFab) durs.push('En fábrica: ' + dFab);
        const dTotal = duracion(o[HITOS[0][0]], o[HITOS[HITOS.length - 1][0]]);
        if (dTotal) durs.push('Total: ' + dTotal);
        const durHtml = durs.length ? `<div style="margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;">${durs.map(d => `<span style="background:#eef3ff;color:#33518f;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:bold;">⏱ ${d}</span>`).join('')}</div>` : '';
        return `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12.5px;font-weight:bold;color:var(--artal-blue);">🕒 Fechas y tiempos</summary><div style="margin-top:6px;">${filas}${durHtml}</div></details>`;
    }
    function hitosVale(o, hitos) { return hitos.length > 0; }

    function renderAudit() {
        const term = document.getElementById('audit-search').value.trim().toLowerCase();
        const list = document.getElementById('audit-list');
        // Agrupa por proyecto (cliente + obra). La clave conserva el texto original para el título.
        const grupos = new Map();
        auditMovs.forEach(m => {
            const obra = (m.obra || '').trim();
            const cliente = (m.cliente || '').trim();
            const titulo = obra || cliente || 'Sin proyecto';
            const key = (cliente + '|||' + obra).toLowerCase();
            if (!grupos.has(key)) grupos.set(key, { titulo, cliente, movs: [] });
            grupos.get(key).movs.push(m);
        });

        let grupos2 = Array.from(grupos.values());
        if (term) grupos2 = grupos2.filter(g => (g.titulo + ' ' + g.cliente).toLowerCase().includes(term));
        // Cada grupo: entradas en orden cronológico; grupos ordenados por actividad más reciente.
        grupos2.forEach(g => g.movs.sort((a, b) => (a.fecha && a.fecha.toMillis ? a.fecha.toMillis() : 0) - (b.fecha && b.fecha.toMillis ? b.fecha.toMillis() : 0)));
        grupos2.sort((a, b) => {
            const la = a.movs[a.movs.length - 1], lb = b.movs[b.movs.length - 1];
            return (lb.fecha && lb.fecha.toMillis ? lb.fecha.toMillis() : 0) - (la.fecha && la.fecha.toMillis ? la.fecha.toMillis() : 0);
        });

        if (!grupos2.length) { list.innerHTML = '<p class="empty">No hay registros de auditoría todavía.</p>'; return; }

        list.innerHTML = grupos2.map(g => `
            <div class="audit-proyecto">
                <h3>${esc(g.titulo)}</h3>
                ${g.cliente && g.cliente.toLowerCase() !== g.titulo.toLowerCase() ? `<div class="cliente">${esc(g.cliente)}</div>` : ''}
                <ul class="audit-timeline">
                    ${g.movs.map(m => `
                        <li>
                            <span class="audit-estado ${esc(m.estado)}">${esc(AUDIT_ESTADO[m.estado] || m.estado)}</span>
                            <span class="audit-meta">· ${esc(m.por) || esc(m.porEmail) || 'alguien'} · ${esc(fmtFechaHora(m.fecha))}</span>
                        </li>`).join('')}
                </ul>
            </div>`).join('');
    }

    document.getElementById('audit-search').addEventListener('input', renderAudit);

    // ============ Carpetas por obra ============
    // Agrupa TODOS los documentos (cotización, fabricación, compra) por cliente+obra, para tener
    // el expediente completo de cada obra en un solo lugar. Así, cuando llega la fabricación de
    // una obra que ya tenía cotización, ambas quedan reunidas en la misma "carpeta".
    function docTag(o) {
        if (o.docType === 'COMPRA_DIRECTA') return { cls: 'compra', label: 'Compra directa' };
        if ((o.docType || '').indexOf('FAB') === 0) return { cls: 'fab', label: 'Fabricación' };
        return { cls: 'cot', label: 'Cotización' };
    }

    // Todas las obras (cliente+obra), sin filtrar — se repuebla en cada renderCarpetas().
    let carpetasArr = [];

    // Navegación de 3 niveles (como el Panel de Control → Cliente → Obra → Documentos), en vez
    // de una sola lista larga. `carpetaClienteSel`/`carpetaObraSel` guardan la clave normalizada
    // del cliente/obra abiertos (no un índice: el orden de las listas cambia con la búsqueda y
    // con la fecha del documento más reciente, así que un índice fijo apuntaría a otra carpeta
    // en el próximo render). Solo se resetea al hacer clic en la pestaña "Carpetas por obra"
    // (ver setVista) — un refresco en vivo de Firestore no debe sacar al usuario de donde está.
    let carpetaNivel = 'clientes'; // 'clientes' | 'obras' | 'docs'
    let carpetaClienteSel = null;
    let carpetaObraSel = null;

    // Los cards leen la clave desde `data-*` (vía `this.dataset`, decodificado por el propio
    // navegador) en vez de interpolar el texto crudo dentro del onclick — así un nombre de
    // cliente/obra con comillas no rompe el atributo HTML. No puede ser un índice fijo porque
    // el array se reordena entre renders (búsqueda, nuevo pedido que cambia "más reciente").
    window.carpetaAbrirCliente = function (el) {
        carpetaClienteSel = el.dataset.ckey;
        carpetaNivel = 'obras';
        document.getElementById('carpeta-search').value = '';
        renderCarpetas();
    };
    window.carpetaAbrirObra = function (el) {
        carpetaObraSel = el.dataset.okey;
        carpetaNivel = 'docs';
        renderCarpetas();
    };
    window.carpetaVolver = function (nivel) {
        carpetaNivel = nivel;
        if (nivel === 'clientes') carpetaClienteSel = null;
        carpetaObraSel = null;
        document.getElementById('carpeta-search').value = '';
        renderCarpetas();
    };

    function renderCarpetas() {
        const grupos = new Map();
        allOrders.forEach(({ id, data: o }) => {
            const cliente = (o.cliente || '').trim();
            const obra = (o.obra || '').trim();
            const titulo = obra || cliente || 'Sin obra';
            const key = normTexto(cliente) + '|||' + normTexto(obra);
            if (!grupos.has(key)) grupos.set(key, { key, titulo, cliente: cliente || 'Sin cliente', docs: [] });
            grupos.get(key).docs.push({ id, o });
        });
        carpetasArr = Array.from(grupos.values());

        const search = document.getElementById('carpeta-search');
        const list = document.getElementById('carpetas-list');

        if (carpetaNivel === 'docs') { search.style.display = 'none'; renderCarpetasDocs(list); return; }
        search.style.display = '';

        if (carpetaNivel === 'obras') { search.placeholder = '🔎 Buscar obra…'; renderCarpetasObras(list); return; }

        search.placeholder = '🔎 Buscar cliente…';
        renderCarpetasClientes(list);
    }

    // Nivel 1: un card por cliente (mismo estilo que el Panel de Control), con cuántas obras y
    // documentos tiene en total.
    function renderCarpetasClientes(list) {
        const term = normTexto(document.getElementById('carpeta-search').value);
        const clientesMap = new Map();
        carpetasArr.forEach(g => {
            const ckey = normTexto(g.cliente);
            if (!clientesMap.has(ckey)) clientesMap.set(ckey, { ckey, cliente: g.cliente, obras: 0, docs: 0, ultima: 0 });
            const c = clientesMap.get(ckey);
            c.obras++;
            c.docs += g.docs.length;
            c.ultima = Math.max(c.ultima, ...g.docs.map(d => orderDate(d.o)));
        });
        let clientes = Array.from(clientesMap.values());
        if (term) clientes = clientes.filter(c => normTexto(c.cliente).includes(term) ||
            carpetasArr.some(g => normTexto(g.cliente) === c.ckey && normTexto(g.titulo).includes(term)));
        clientes.sort((a, b) => b.ultima - a.ultima);

        if (!clientes.length) { list.innerHTML = '<p class="empty">No hay clientes registrados.</p>'; return; }

        list.innerHTML = `<div class="grid">` + clientes.map(c => `
            <a class="card-link" href="#" data-ckey="${esc(c.ckey)}" onclick="carpetaAbrirCliente(this); return false;">
                <div class="emoji">👤</div>
                <div class="title">${esc(c.cliente)}</div>
                <div class="desc">${c.obras} obra${c.obras === 1 ? '' : 's'} · ${c.docs} doc${c.docs === 1 ? '' : 's'}</div>
            </a>`).join('') + `</div>`;
    }

    // ¿"wa" y "wb" (arrays de palabras normalizadas) son el mismo proyecto? Dos patrones,
    // palabra por palabra (nunca por caracteres — así "Casa Bel" no matchea "Casa Beltrán"):
    //  1. Extensión: TODAS las palabras de la más corta calzan al principio de la más larga
    //     — ej. "Casa Aarón" + "Casa Aarón barandas" (la cotización se dividió en partes).
    //  2. Mismo largo, difieren solo en la última palabra — ej. "Altea Villa 11 ventanas" +
    //     "Altea Villa 11 barandas" (ninguna es prefijo de la otra, pero comparten todo salvo
    //     el descriptor final). Exige al menos 3 palabras para que el prefijo compartido tenga
    //     contenido real — con solo 2 palabras ("Villa Marisa" vs "Villa Castillo") la primera
    //     palabra sola no alcanza para asumir que es el mismo sitio.
    function mismoProyecto(wa, wb) {
        const corta = wa.length <= wb.length ? wa : wb;
        const larga = wa.length <= wb.length ? wb : wa;
        if (corta.every((palabra, i) => palabra === larga[i])) return true;
        if (wa.length === wb.length && wa.length >= 3) {
            for (let i = 0; i < wa.length - 1; i++) if (wa[i] !== wb[i]) return false;
            return true;
        }
        return false;
    }

    // Junta, DENTRO de un mismo cliente, las obras que son el mismo proyecto según
    // `mismoProyecto` — el caso real que motivó esto: una obra medida/cotizada en partes
    // ("ventanas", "barandas") quedaba repartida en carpetas distintas. Unión-búsqueda (no
    // comparación 1-a-1 simple) para que la transitividad funcione: si A se junta con B y B con
    // C, A/B/C terminan en el mismo proyecto aunque A y C solas no calcen entre sí. La obra con
    // menos palabras del grupo resultante es la "raíz" — su texto es el nombre del proyecto.
    function agruparPorProyecto(obrasDeCliente) {
        const items = obrasDeCliente.map(g => ({ g, palabras: normTexto(g.titulo).split(/\s+/).filter(Boolean) }));
        const parent = items.map((_, i) => i);
        const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
        const union = (i, j) => { const ri = find(i), rj = find(j); if (ri !== rj) parent[ri] = rj; };
        for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
                if (mismoProyecto(items[i].palabras, items[j].palabras)) union(i, j);
            }
        }

        const grupos = new Map(); // índice raíz del union-find -> items del grupo
        items.forEach((it, i) => {
            const r = find(i);
            if (!grupos.has(r)) grupos.set(r, []);
            grupos.get(r).push(it);
        });
        return Array.from(grupos.values()).map(grupo => {
            grupo.sort((a, b) => a.palabras.length - b.palabras.length || a.g.titulo.localeCompare(b.g.titulo, 'es'));
            const raiz = grupo[0];
            return { rootKey: raiz.palabras.join(' '), rootTitulo: raiz.g.titulo, obras: grupo.map(it => it.g) };
        });
    }

    // Nivel 2: un card por proyecto del cliente elegido (uno o varios "obra" agrupados).
    function renderCarpetasObras(list) {
        const term = normTexto(document.getElementById('carpeta-search').value);
        let obrasCliente = carpetasArr.filter(g => normTexto(g.cliente) === carpetaClienteSel);
        const clienteTexto = obrasCliente.length ? obrasCliente[0].cliente : carpetaClienteSel;
        let proyectos = agruparPorProyecto(obrasCliente);
        if (term) proyectos = proyectos.filter(p => p.obras.some(g => normTexto(g.titulo).includes(term)));
        proyectos.sort((a, b) =>
            Math.max(...b.obras.flatMap(g => g.docs.map(d => orderDate(d.o)))) -
            Math.max(...a.obras.flatMap(g => g.docs.map(d => orderDate(d.o)))));

        const volver = `<button class="carpeta-back" onclick="carpetaVolver('clientes')">← Clientes</button>`;
        if (!proyectos.length) { list.innerHTML = volver + `<p class="empty">No hay obras para este cliente.</p>`; return; }

        list.innerHTML = volver + `<h2 class="carpeta-cliente-titulo">${esc(clienteTexto)}</h2>` +
            `<div class="grid">` + proyectos.map(p => {
                const docs = p.obras.flatMap(g => g.docs);
                const ultimo = docs.slice().sort((a, b) => orderDate(b.o) - orderDate(a.o))[0].o;
                const t = docTag(ultimo);
                return `
            <a class="card-link" href="#" data-okey="${esc(p.rootKey)}" onclick="carpetaAbrirObra(this); return false;">
                <div class="emoji">📁</div>
                <div class="title">${esc(p.rootTitulo)}</div>
                <div class="desc">${docs.length} doc${docs.length === 1 ? '' : 's'} · <span class="doc-tag ${t.cls}">${t.label}</span></div>
            </a>`;
            }).join('') + `</div>`;
    }

    // Nivel 3: los documentos reales del proyecto elegido — puede incluir varias "obras" (ej.
    // ventanas + barandas) fusionadas por `agruparPorProyecto`. Cada documento muestra su propio
    // texto de obra si difiere del título de la carpeta, para no perder esa distinción.
    function renderCarpetasDocs(list) {
        const obrasCliente = carpetasArr.filter(g => normTexto(g.cliente) === carpetaClienteSel);
        const proyecto = agruparPorProyecto(obrasCliente).find(p => p.rootKey === carpetaObraSel);
        if (!proyecto) {
            list.innerHTML = `<button class="carpeta-back" onclick="carpetaVolver('clientes')">← Clientes</button><p class="empty">Esta obra ya no existe.</p>`;
            return;
        }
        const cliente = proyecto.obras[0].cliente;
        const docsOrdenados = proyecto.obras.flatMap(g => g.docs.map(d => ({ ...d, obraTexto: g.titulo })))
            .sort((a, b) => orderDate(b.o) - orderDate(a.o));

        list.innerHTML = `<button class="carpeta-back" onclick="carpetaVolver('obras')">← ${esc(cliente)}</button>` + `
            <div class="carpeta abierta">
                <div class="carpeta-top" style="cursor:default;">
                    <div class="carpeta-info">
                        <h3>${esc(proyecto.rootTitulo)}</h3>
                        ${cliente && cliente.toLowerCase() !== proyecto.rootTitulo.toLowerCase() ? `<div class="cliente">${esc(cliente)}</div>` : ''}
                    </div>
                </div>
                ${docsOrdenados.map(({ id, o, obraTexto }) => {
                    const t = docTag(o);
                    const links = [];
                    if (o.docType !== 'COMPRA_DIRECTA') links.push(`<a href="#" onclick="openOrderPreview('${id}'); return false;">Ver ficha</a>`);
                    if (o.contratistaPdfUrl) links.push(`<a href="${esc(o.contratistaPdfUrl)}" target="_blank">PDF contratista</a>`);
                    if (o.cotizacionFinalPdfUrl) links.push(`<a href="${esc(o.cotizacionFinalPdfUrl)}" target="_blank">PDF final cliente</a>`);
                    if (o.compraPdfUrl) links.push(`<a href="${esc(o.compraPdfUrl)}" target="_blank">Orden de compra</a>`);
                    if (o.recepcionInstalador && o.recepcionInstalador.firma) links.push(`<a href="#" onclick="verFirma('${id}','rec'); return false;">Firma recepción</a>`);
                    if (o.clienteAprobacion && o.clienteAprobacion.firma) links.push(`<a href="#" onclick="verFirma('${id}','cli'); return false;">Firma cliente</a>`);
                    return `
                    <div class="carpeta-doc">
                        <div class="doc-head">
                            <span class="doc-tag ${t.cls}">${t.label}</span>
                            ${normTexto(obraTexto) !== normTexto(proyecto.rootTitulo) ? `<span class="carpeta-doc-obra">${esc(obraTexto)}</span>` : ''}
                            <span style="font-size:12.5px;color:#555;">${esc(STATUS_LABEL[o.status] || o.status)}${progresoExtra(o)}</span>
                        </div>
                        ${(o.descripcion || o.proveedor) ? `<div style="font-size:12.5px;color:#556;margin-top:3px;">${o.descripcion ? '📝 ' + esc(o.descripcion) : ''}${o.proveedor ? (o.descripcion ? '  ·  ' : '') + '🏭 ' + esc(o.proveedor) : ''}</div>` : ''}
                        <div class="doc-links">${links.join('')}</div>
                    </div>`;
                }).join('')}
            </div>`;
    }

    document.getElementById('carpeta-search').addEventListener('input', renderCarpetas);

    onSnapshot(collection(db, 'movimientosInstalaciones'), (snap) => {
        auditMovs = snap.docs.map(d => d.data());
        renderAudit();
    }, (err) => {
        document.getElementById('audit-list').innerHTML = '<p class="empty">Error cargando auditoría: ' + err.message + '</p>';
    });
</script>

</body>
</html>
