<title>Artal Dominicana · Normas internas y firma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --grafito:#1B2224;
  --grafito-2:#2C3639;
  --aluminio:#8D9A9E;
  --aluminio-cl:#C3CDCF;
  --canto:#2F6E5E;        /* canto verde del vidrio float */
  --canto-cl:#E4EFEB;
  --cristal:#F1F4F3;
  --papel:#FFFFFF;
  --alerta:#9E3B2C;
  --ambar:#8A6320;
  --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cristal);
  color:var(--grafito);
  font:400 16px/1.55 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.mono-lbl,button,.eyebrow{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif}

/* ---------- cabecera ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--grafito);color:#fff;
  border-bottom:3px solid var(--canto);
}
.top-in{max-width:820px;margin:0 auto;padding:11px 18px 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.marca{font:700 19px/1 "Barlow Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase}
.rnc{font-size:11.5px;color:var(--aluminio);letter-spacing:.04em}
.doc-cod{margin-left:auto;font-size:11.5px;color:var(--aluminio);letter-spacing:.06em;text-transform:uppercase}

/* barra de avance: sección de perfil de aluminio que se llena */
.perfil{max-width:820px;margin:0 auto;padding:0 18px 12px;display:flex;gap:3px}
.pane{flex:1;height:7px;background:var(--grafito-2);border-radius:1px;transition:background .35s ease}
.pane.done{background:var(--canto)}
.pane.now{background:var(--aluminio-cl)}

/* ---------- lienzo ---------- */
main{max-width:820px;margin:0 auto;padding:26px 18px 132px}
.eyebrow{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--canto);font-weight:600;margin:0 0 6px
}
h1{font-size:31px;line-height:1.08;letter-spacing:.005em;margin:0 0 6px;font-weight:700}
h2{font-size:25px;line-height:1.14;margin:0 0 4px;font-weight:700}
.sub{color:#4C595C;font-size:15px;margin:0 0 22px}
.card{
  background:var(--papel);border:1px solid #DDE4E4;border-radius:var(--r);
  padding:20px;margin:0 0 16px
}
p{margin:0 0 12px}
ul.reglas{list-style:none;margin:0 0 14px;padding:0}
ul.reglas li{position:relative;padding:0 0 0 21px;margin:0 0 10px}
ul.reglas li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:9px;height:2px;background:var(--canto)
}
h3{font-size:19px;margin:22px 0 9px;font-weight:600;letter-spacing:.01em}
h3:first-child{margin-top:0}
.nota{
  border-left:3px solid var(--ambar);background:#FBF7EF;
  padding:12px 14px;font-size:14.5px;margin:0 0 14px
}
.grave{border-left-color:var(--alerta);background:#FBF0EE}

/* ---------- datos ---------- */
.fila{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid #E8EDED;font-size:15px}
.fila:last-child{border-bottom:0}
.fila dt{flex:0 0 42%;color:#5A6669;font-size:13.5px;letter-spacing:.02em}
.fila dd{margin:0;font-weight:600}
dl{margin:0}

.campo{margin:0 0 15px}
label{display:block;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  color:#4C595C;font-weight:600;margin:0 0 5px;font-family:"Barlow Condensed",sans-serif;font-size:14px}
.req{color:var(--alerta)}
input[type=text],input[type=email],input[type=tel]{
  width:100%;padding:11px 12px;font:400 16px/1.3 "IBM Plex Sans",sans-serif;
  border:1px solid #C6D0D0;border-radius:var(--r);background:#fff;color:var(--grafito)
}
input:focus-visible,button:focus-visible,.check:focus-within{
  outline:2px solid var(--canto);outline-offset:2px
}
input.mal{border-color:var(--alerta);background:#FDF6F5}
.hint{font-size:13px;color:#687578;margin:5px 0 0}
.err{font-size:13.5px;color:var(--alerta);margin:5px 0 0;font-weight:500;display:none}
.err.on{display:block}

/* ---------- casillas ---------- */
.check{
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  background:var(--canto-cl);border:1px solid #C2DAD2;border-radius:var(--r);
  padding:14px 15px;margin:16px 0 0;transition:background .18s
}
.check.pend{background:#FBF7EF;border-color:#E4D6B6}
.check input{width:21px;height:21px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--canto)}
.check span{font-size:14.5px;line-height:1.45}

/* ---------- selector de empleado ---------- */
.emp{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--papel);border:1px solid #DDE4E4;border-left:3px solid var(--aluminio-cl);
  border-radius:var(--r);padding:15px 16px;margin:0 0 9px;
  font-family:"IBM Plex Sans",sans-serif;transition:border-color .18s,background .18s
}
.emp:hover{border-left-color:var(--canto);background:#FAFCFB}
.emp-n{font-weight:600;font-size:16.5px;display:block}
.emp-p{font-size:13.5px;color:#5A6669;margin-top:2px;display:block}

/* ---------- firma ---------- */
.pad-wrap{position:relative;background:#fff;border:1px solid #C6D0D0;border-radius:var(--r);overflow:hidden}
.pad-wrap.mal{border-color:var(--alerta)}
canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.pad-base{
  position:absolute;left:22px;right:22px;bottom:44px;height:1px;background:#D6DEDE;pointer-events:none
}
.pad-ph{
  position:absolute;left:0;right:0;bottom:20px;text-align:center;
  font-size:13px;color:#93A0A2;pointer-events:none;letter-spacing:.02em
}
.pad-tools{display:flex;justify-content:flex-end;padding:8px 0 0}
.lnk{background:none;border:0;color:var(--canto);font-size:14px;font-weight:600;
  cursor:pointer;padding:6px 2px;font-family:"IBM Plex Sans",sans-serif;text-decoration:underline}

/* ---------- pie de navegación ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.97);border-top:1px solid #D6DEDE;
  backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)
}
.nav-in{max-width:820px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.paso{font-size:12.5px;color:#687578;letter-spacing:.06em;text-transform:uppercase;
  font-family:"Barlow Condensed",sans-serif;font-size:14px}
button.b{
  font:600 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  padding:14px 24px;border-radius:var(--r);border:1px solid transparent;cursor:pointer
}
.b-pri{background:var(--canto);color:#fff;margin-left:auto}
.b-pri:hover:not(:disabled){background:#25594B}
.b-pri:disabled{background:#CBD5D3;color:#8A9694;cursor:not-allowed}
.b-sec{background:transparent;color:var(--grafito-2);border-color:#C6D0D0}
.b-sec:hover{background:#EAEFEF}
.bloqueo{
  max-width:820px;margin:0 auto;padding:0 18px 11px;font-size:13.5px;
  color:var(--alerta);font-weight:500;display:none
}
.bloqueo.on{display:block}

/* ---------- acuse final ---------- */
.sello{
  border:1px solid var(--canto);border-top:5px solid var(--canto);
  background:#fff;border-radius:var(--r);padding:22px
}
.sello h2{color:var(--canto)}
.ev{font-size:13.5px;border-collapse:collapse;width:100%;margin:12px 0 0}
.ev td{border-bottom:1px solid #E8EDED;padding:8px 0;vertical-align:top}
.ev td:first-child{color:#5A6669;width:44%;padding-right:12px}
.ev td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
.acc{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.acc .b{flex:1 1 auto;min-width:190px;margin:0}

@media (max-width:560px){
  h1{font-size:26px}h2{font-size:22px}
  main{padding:22px 15px 138px}
  .card{padding:16px}
  .fila{flex-direction:column;gap:2px}
  .fila dt{flex:none}
  .nav-in{padding:11px 15px}
  .paso{display:none}
  .b-pri{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.nav,.acc{display:none}}
</style>

<header class="top">
  <div class="top-in">
    <span class="marca">Artal Dominicana</span>
    <span class="rnc">RNC 1-32-42965-6</span>

<main id="lienzo"></main>

<nav class="nav">
  <div class="bloqueo" id="bloqueo"></div>
  <div class="nav-in">
    <button class="b b-sec" id="atras" type="button">Atrás</button>
    <span class="paso" id="paso"></span>
    <button class="b b-pri" id="siga" type="button">Continuar</button>
  </div>
</nav>

       "Este documento no sustituye ni modifica el Reglamento Interior de Trabajo de la empresa, sino que lo complementa en lo específico del puesto. En caso de contradicción, prevalece el Código de Trabajo, seguido del Reglamento Interior de Trabajo depositado ante el Ministerio de Trabajo."],
   sub:[{h:"Marco legal aplicable",i:MARCO}],
   ack:"He leído el objeto de este documento y el marco legal que lo sustenta."});

  const fun = mods.map(m=>({h: multi ? "Como "+m.nombre : "Funciones esenciales", i:m.fun}));

  if(mods.some(m=>m.prueba)){

  const nor = [];
  mods.forEach(m=>m.nor.forEach(b=>nor.push({h:b.h+(multi?"  ·  "+m.nombre:""),i:b.i})));

   p:[],sub:[{h:"Obligaciones de reserva",i:CONFID}],

   VALIDACIÓN
   ============================================================ */
const RE_MAIL=/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
const soloDig = s=>(s||"").replace(/\D/g,"");
const norm = s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();

function valida(){
  const n=ST.paso;
  if(!ST.emp) return {ok:false,msg:"Selecciona tu nombre para continuar."};
  if(n===1){
    const d=ST.datos,f=[];
    if(!RE_MAIL.test(d.correo)) f.push(["correo","Escribe un correo válido, por ejemplo nombre@correo.com"]);
    if(soloDig(d.tel).length<10) f.push(["tel","El teléfono debe tener 10 dígitos."]);
    if((d.dir||"").trim().length<8) f.push(["dir","Escribe tu dirección completa."]);
    if((d.emgNombre||"").trim().length<5) f.push(["emgNombre","Escribe el nombre completo del contacto."]);
    if(soloDig(d.emgTel).length<10) f.push(["emgTel","El teléfono debe tener 10 dígitos."]);
    return f.length ? {ok:false,msg:"Faltan "+f.length+" campo"+(f.length>1?"s":"")+" por completar.",campos:f}
                    : {ok:true};
  }
  if(n>=2 && n<2+ST.secciones.length){
    return ST.acks[n-2] ? {ok:true} : {ok:false,msg:"Marca la casilla de lectura para continuar."};
  }
  if(n===2+ST.secciones.length){
    const f=[];
    if(norm(ST.nombreEsc)!==norm(ST.emp.nombre)) f.push(["nom","Escribe tu nombre completo tal como aparece arriba."]);
    if(!ST.declara) return {ok:false,msg:"Confirma la declaración para poder firmar.",campos:f};
    if(!ST.firma)   return {ok:false,msg:"Traza tu firma en el recuadro.",campos:f};
    return f.length ? {ok:false,msg:"El nombre no coincide con el registrado.",campos:f} : {ok:true};
  }
  return {ok:true};
}

function refrescaBoton(){
  const v=valida(), fin=ST.paso===2+ST.secciones.length;
  btnSiga.disabled=!v.ok;
  btnSiga.textContent = !ST.emp ? "Continuar" : fin ? "Firmar documento" : "Continuar";
  lblBloq.textContent = v.ok?"":(v.msg||"");
  lblBloq.classList.toggle("on",!v.ok && ST.paso>0);
  btnAtras.style.visibility = ST.paso>0 && !ST.resultado ? "visible":"hidden";
  btnSiga.style.display = ST.resultado ? "none":"";
  lblPaso.textContent = ST.emp&&!ST.resultado ? "Paso "+(ST.paso+1)+" de "+totalPasos() : "";
  lblCod.textContent = ST.emp ? ST.emp.cod : "";
}

function render(){
  lienzo.innerHTML=pantalla();
  dibujaPerfil(); refrescaBoton();
  window.scrollTo({top:0,behavior:"instant"});

  lienzo.querySelectorAll("[data-emp]").forEach(b=>b.addEventListener("click",()=>{
    ST.emp=EMPLEADOS.find(x=>x.id===b.dataset.emp);
    ST.secciones=armar(ST.emp); ST.acks={}; ST.datos.tel=ST.emp.tel;
    ST.paso=1; render();
  }));

  ["correo","tel","dir","emgNombre","emgTel"].forEach(k=>{
    const el=$("#f_"+k); if(!el) return;
    el.addEventListener("input",()=>{ST.datos[k]=el.value; el.classList.remove("mal");
      const e=$("#e_"+k); if(e){e.textContent="";e.classList.remove("on");} refrescaBoton();});
  });

  const ack=$("#ack");
  if(ack) ack.addEventListener("change",()=>{
    ST.acks[ST.paso-2]=ack.checked;
    ack.closest(".check").classList.toggle("pend",!ack.checked);
    refrescaBoton();
  });

  const nom=$("#f_nom");
  if(nom) nom.addEventListener("input",()=>{ST.nombreEsc=nom.value;nom.classList.remove("mal");
    const e=$("#e_nom"); if(e){e.textContent="";e.classList.remove("on");} refrescaBoton();});

  const dec=$("#dec");
  if(dec) dec.addEventListener("change",()=>{ST.declara=dec.checked;
    dec.closest(".check").classList.toggle("pend",!dec.checked); refrescaBoton();});

  if($("#pad")) montaPad();
  if($("#pdf")) $("#pdf").addEventListener("click",hacerPDF);
  if($("#enviar")) $("#enviar").addEventListener("click",enviar);
}

/* ---------- firma ---------- */
let ctx,pad,pintando=false,trazos=0;
function montaPad(){
  pad=$("#pad");
  const dpr=window.devicePixelRatio||1, w=pad.offsetWidth, h=190;
  pad.width=w*dpr; pad.height=h*dpr;
  ctx=pad.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1B2224";
  if(ST.firma){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,w,h); im.src=ST.firma; $("#padph").style.display="none"; }
  const pos=ev=>{const r=pad.getBoundingClientRect();const p=ev.touches?ev.touches[0]:ev;
    return {x:p.clientX-r.left,y:p.clientY-r.top};};
  const ini=ev=>{ev.preventDefault();pintando=true;trazos++;const p=pos(ev);
    ctx.beginPath();ctx.moveTo(p.x,p.y);$("#padph").style.display="none";$("#padw").classList.remove("mal");};
  const mov=ev=>{if(!pintando)return;ev.preventDefault();const p=pos(ev);ctx.lineTo(p.x,p.y);ctx.stroke();};
  const fin=()=>{if(!pintando)return;pintando=false;
    if(trazos>0){ST.firma=pad.toDataURL("image/png");refrescaBoton();}};
  ["mousedown","touchstart"].forEach(t=>pad.addEventListener(t,ini,{passive:false}));
  ["mousemove","touchmove"].forEach(t=>pad.addEventListener(t,mov,{passive:false}));
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(t=>pad.addEventListener(t,fin));
  $("#limpiar").addEventListener("click",()=>{
    ctx.clearRect(0,0,pad.width,pad.height);ST.firma=null;trazos=0;
    $("#padph").style.display="";refrescaBoton();});
}

/* ---------- navegación ---------- */
btnAtras.addEventListener("click",()=>{ if(ST.paso>0){ST.paso--; render();} });

btnSiga.addEventListener("click",async ()=>{
  const v=valida();
  if(!v.ok){
    (v.campos||[]).forEach(([id,msg])=>{
      const i=$("#f_"+id), e=$("#e_"+id);
      if(i)i.classList.add("mal");
      if(e){e.textContent=msg;e.classList.add("on");}
    });
    if(ST.paso===2+ST.secciones.length && !ST.firma) $("#padw")?.classList.add("mal");
    const primero=lienzo.querySelector(".mal");
    if(primero) primero.scrollIntoView({block:"center",behavior:"smooth"});
    lblBloq.textContent=v.msg; lblBloq.classList.add("on");
    return;
  }
  if(ST.paso===2+ST.secciones.length){

    if(CONFIG.ENDPOINT) enviar();
    return;

});

/* ---------- sellado: hash + evidencia ---------- */
function textoPlano(){
  const e=ST.emp;
  let t=["ARTAL DOMINICANA, SRL — RNC 1-32-42965-6",e.cod,
    "RESPONSABILIDADES Y NORMAS INTERNAS",e.nombre,e.puesto,
    e.docLbl+": "+e.docNum,"Ingreso: "+e.ingreso,"Área: "+e.area,
    "Reporta a: "+e.reporta,"Personal a su cargo: "+e.cargo,
    "Correo: "+ST.datos.correo,"Teléfono: "+ST.datos.tel,
    "Dirección: "+ST.datos.dir,
    "Contacto de emergencia: "+ST.datos.emgNombre+" — "+ST.datos.emgTel];
  ST.secciones.forEach(s=>{
    t.push("== "+s.t+" ==");
    s.p.forEach(p=>t.push(p));
    s.sub.forEach(b=>{t.push("-- "+b.h);b.i.forEach(x=>t.push("• "+x));});
    if(s.cierre)t.push(s.cierre);
    t.push("[Aceptado] "+s.ack);
  });
  return t.join("\n");
}

async function sellar(){
  const d=new Date();
  const txt=textoPlano()+"\n"+ST.nombreEsc+"\n"+d.toISOString();
  let hash="no disponible";
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
    hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(err){ hash="no disponible (navegador sin soporte)"; }
  ST.resultado={
    fecha:d.toISOString(),
    fechaTxt:d.toLocaleString("es-DO",{dateStyle:"long",timeStyle:"short"}),
    hash:hash,
    disp:(navigator.userAgent||"").slice(0,110)
  };
}

/* ---------- PDF ---------- */
function nombrePDF(){
  const e=ST.emp;
  return "Normas-"+e.nombre.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,"").split(" ").slice(0,2).join("-")+".pdf";
}

function hacerPDF(){
  const est=$("#estado");
  const doc=construirPDF();
  if(!doc){ if(est) est.textContent="No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a intentar."; return; }
  doc.save(nombrePDF());
  if(est) est.textContent="Descargado. Guarda el archivo en tu teléfono.";
}

function construirPDF(){
  if(!window.jspdf) return null;
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"pt",format:"letter"});
  const e=ST.emp,r=ST.resultado,ML=56,MR=556,PIE=740;
  let y=0,pag=0;

  const nuevaPag=()=>{
    pag++; doc.setPage(pag);
    doc.setDrawColor(47,110,94); doc.setLineWidth(2.4); doc.line(ML,44,MR,44);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(27,34,36);
    doc.text("ARTAL DOMINICANA, SRL",ML,38);
    doc.setFont("helvetica","normal"); doc.setTextColor(120,130,132);
    doc.text("RNC 1-32-42965-6   ·   "+e.cod,MR,38,{align:"right"});
    doc.setFontSize(8);
    doc.text("Firmado electrónicamente conforme a la Ley No. 126-02   ·   Página "+pag,ML,PIE+22);
    doc.setTextColor(27,34,36); y=76;
  };
  const salto=(alto)=>{ if(y+alto>PIE){ doc.addPage(); nuevaPag(); } };
  const par=(txt,size,estilo,gap,color)=>{
    doc.setFont("helvetica",estilo||"normal"); doc.setFontSize(size||10);
    doc.setTextColor.apply(doc,color||[27,34,36]);
    const ln=doc.splitTextToSize(txt,MR-ML);
    ln.forEach(l=>{ salto(14); doc.text(l,ML,y); y+=size?size+3.4:13.4; });
    y+=gap||6;
  };
  const vin=(txt)=>{
    doc.setFont("helvetica","normal"); doc.setFontSize(9.6); doc.setTextColor(27,34,36);
    const ln=doc.splitTextToSize(txt,MR-ML-16);
    ln.forEach((l,i)=>{ salto(13);
      if(i===0){ doc.setDrawColor(47,110,94); doc.setLineWidth(1.6); doc.line(ML,y-3.2,ML+8,y-3.2); }
      doc.text(l,ML+16,y); y+=12.6; });
    y+=3.6;
  };
  const tit=(txt)=>{ salto(46); y+=8;
    doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(27,34,36);
    doc.text(txt.toUpperCase(),ML,y); y+=6;
    doc.setDrawColor(200,210,210); doc.setLineWidth(.7); doc.line(ML,y,MR,y); y+=17; };
  const sub=(txt)=>{ salto(30); y+=5;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.4); doc.setTextColor(47,110,94);
    doc.text(txt,ML,y); y+=14; doc.setTextColor(27,34,36); };
  const dato=(k,v)=>{ salto(15);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.4); doc.setTextColor(110,120,122);
    doc.text(k,ML,y);
    doc.setFont("helvetica","bold"); doc.setTextColor(27,34,36);
    const ln=doc.splitTextToSize(String(v),MR-ML-190);
    ln.forEach((l,i)=>doc.text(l,ML+190,y+i*12));
    y+=Math.max(15,ln.length*12+3);
    doc.setDrawColor(232,237,237); doc.setLineWidth(.5); doc.line(ML,y-5,MR,y-5); };

  nuevaPag();
  doc.setFont("helvetica","normal"); doc.setFontSize(8.6); doc.setTextColor(47,110,94);
  doc.text("ANEXO AL CONTRATO INDIVIDUAL DE TRABAJO",ML,y); y+=20;
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(27,34,36);
  doc.text("Responsabilidades y normas internas",ML,y); y+=24;
  doc.setFontSize(14); doc.text(e.nombre,ML,y); y+=17;
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(70,85,88);
  doc.text(e.puesto,ML,y); y+=22;

  tit("1. Datos del trabajador");
  dato("Nombre y apellidos",e.nombre); dato(e.docLbl,e.docNum);
  dato("Puesto",e.puesto); dato("Área",e.area);
  dato("Reporta a",e.reporta); dato("Personal a su cargo",e.cargo);
  dato("Fecha de ingreso",e.ingreso); dato("Lugar habitual de trabajo",e.sede);
  dato("Correo electrónico",ST.datos.correo); dato("Teléfono celular",ST.datos.tel);
  dato("Dirección de residencia",ST.datos.dir);
  dato("Contacto de emergencia",ST.datos.emgNombre+" — "+ST.datos.emgTel);

  ST.secciones.forEach((s,i)=>{
    tit((i+2)+". "+s.t);
    s.p.forEach(p=>par(p,10,"normal",7));
    s.sub.forEach(b=>{ sub(b.h); b.i.forEach(vin); });
    if(s.cierre) par(s.cierre,9.8,"italic",8,[110,120,122]);
    par("Aceptado por el trabajador: "+s.ack,9,"bold",10,[47,110,94]);
  });

  doc.addPage(); nuevaPag();
  tit((ST.secciones.length+2)+". Firma y evidencia electrónica");
  par("Leído y aceptado en todas sus partes. El trabajador declara que recibió, leyó y comprendió este documento, que se le explicó en lenguaje claro, que tuvo oportunidad de preguntar antes de firmarlo y que recibió copia del Reglamento Interior de Trabajo de ARTAL DOMINICANA, SRL.",10,"normal",14);

  if(ST.firma){
    salto(120);
    try{ doc.addImage(ST.firma,"PNG",ML,y,214,72); }catch(err){}
    doc.setDrawColor(160,172,174); doc.setLineWidth(.7); doc.line(ML,y+80,ML+250,y+80);
    doc.setFont("helvetica","bold"); doc.setFontSize(10);
    doc.text(e.nombre,ML,y+94);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(110,120,122);
    doc.text(e.docLbl+": "+e.docNum,ML,y+107);
    doc.text("Nombre escrito al firmar: "+ST.nombreEsc,ML,y+119);
    doc.setDrawColor(160,172,174); doc.line(MR-250,y+80,MR,y+80);
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(27,34,36);
    doc.text("ARTAL DOMINICANA, SRL",MR-250,y+94);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(110,120,122);
    doc.text("Gerencia — firma digital cualificada",MR-250,y+107);
    y+=140; doc.setTextColor(27,34,36);
  }

  sub("Registro de evidencia electrónica");
  dato("Fecha y hora de la firma (GMT-4)",r.fechaTxt);
  dato("Fecha y hora (UTC)",r.fecha);
  dato("Correo registrado",ST.datos.correo);
  dato("Teléfono registrado",ST.datos.tel);
  dato("Dispositivo utilizado",r.disp);
  dato("Huella criptográfica SHA-256",r.hash);
  y+=8;
  par("Esta huella se calcula sobre el texto íntegro del documento, el nombre escrito por el firmante y la marca de tiempo. Cualquier alteración posterior del contenido produce una huella distinta y es detectable.",9,"italic",6,[110,120,122]);

  return doc;
}

/* ---------- envío ---------- */
async function enviar(){
  const est=$("#estado"),e=ST.emp,r=ST.resultado;
  if(est) est.textContent="Enviando…";

  let pdf64="";
  try{
    const doc=construirPDF();
    if(doc) pdf64=doc.output("datauristring").split(",")[1];
  }catch(err){}

  const carga={
    documento:e.cod, empleado:e.nombre, identificacion:e.docNum, puesto:e.puesto,
    correo:ST.datos.correo, telefono:ST.datos.tel, direccion:ST.datos.dir,
    emergenciaNombre:ST.datos.emgNombre, emergenciaTel:ST.datos.emgTel,
    firmadoUTC:r.fecha, firmadoLocal:r.fechaTxt, hash:r.hash, dispositivo:r.disp,
    nombreEscrito:ST.nombreEsc, firmaPNG:ST.firma,
    archivo:nombrePDF(), pdfBase64:pdf64
  };

  if(!CONFIG.ENDPOINT){
    const cuerpo=encodeURIComponent(
      "Documento: "+e.cod+"\nEmpleado: "+e.nombre+"\nIdentificación: "+e.docNum+
      "\nPuesto: "+e.puesto+"\nCorreo: "+ST.datos.correo+"\nTeléfono: "+ST.datos.tel+
      "\nDirección: "+ST.datos.dir+
      "\nContacto de emergencia: "+ST.datos.emgNombre+" — "+ST.datos.emgTel+
      "\nFirmado: "+r.fechaTxt+"\nHuella SHA-256: "+r.hash+
      "\n\nAdjunta aquí el PDF descargado.");
    location.href="mailto:"+CONFIG.CORREO_EMPRESA+"?subject="+
      encodeURIComponent("Normas internas firmadas — "+e.nombre)+"&body="+cuerpo;
    if(est) est.textContent="Se abrió tu correo. Adjunta el PDF descargado antes de enviarlo.";
    return false;
  }

  try{
    await fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(carga)});
    if(est) est.textContent="Enviado a la empresa. Descarga también tu copia para ti.";
    return true;
  }catch(err){
    if(est) est.textContent="No se pudo enviar. Descarga el PDF y entrégalo a la Gerencia.";
    return false;
  }
}
