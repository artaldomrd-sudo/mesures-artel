<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Cierres de Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 900px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar select { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .cl-card { display: flex; align-items: center; gap: 12px; border-left: 4px solid #2f6fd0; }
    .cl-card.dif { border-left-color: #e67e22; }
    .cl-ic { width: 40px; height: 40px; border-radius: 10px; background: #e9f0fb; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: 0 0 auto; }
    .cl-info { flex: 1; min-width: 0; } .cl-info b { color: var(--artal-blue); font-size: 14.5px; }
    .cl-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .cl-nums { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 5px; font-size: 12.5px; }
    .cl-nums span b { font-variant-numeric: tabular-nums; }
    .dif-tag { font-weight: bold; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dif-tag.ok { color: #1f9d61; } .dif-tag.sob { color: #2f6fd0; } .dif-tag.fal { color: #d9483b; }
    .del-btn { background: transparent; border: none; color: #c9ced6; cursor: pointer; font-size: 15px; } .del-btn:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 46px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
    @media (max-width: 480px) { .grid2, .grid3 { grid-template-columns: 1fr 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .sec-h { font-size: 12px; font-weight: bold; color: var(--artal-blue); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #eef1f4; }

    .den-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .den-tbl th { font-size: 10.5px; color: #778; text-transform: uppercase; text-align: right; padding: 2px 6px; }
    .den-tbl th.l { text-align: left; }
    .den-tbl td { padding: 3px 6px; text-align: right; }
    .den-tbl td.l { text-align: left; font-weight: bold; color: #445; }
    .den-tbl input { width: 68px; padding: 6px; min-height: 34px; text-align: right; }
    .den-tbl td.sub { font-variant-numeric: tabular-nums; color: #556; }

    .resumen { background: #f7f9fc; border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
    .resumen .row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; }
    .resumen .row.big { font-size: 15px; font-weight: bold; border-top: 1.5px dashed #ccd; margin-top: 5px; padding-top: 8px; }
    .resumen .row b { font-variant-numeric: tabular-nums; }
    .resumen .dif.ok { color: #1f9d61; } .resumen .dif.sob { color: #2f6fd0; } .resumen .dif.fal { color: #d9483b; }

    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="bancos.html" title="Volver">← Bancos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Cierres de Caja</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar">
        <button class="btn-y" onclick="abrir()">+ Nuevo cierre</button>
        <select id="f-suc" onchange="render()"><option value="">Todas las sucursales</option></select>
        <select id="f-periodo" onchange="render()"><option value="mes">Este mes</option><option value="anio">Este año</option><option value="todo">Todo</option></select>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<datalist id="suc-list"></datalist>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2>Cierre de caja del día</h2>
        <div class="grid3">
            <div><label>Fecha</label><input type="date" id="c-fecha"></div>
            <div><label>Sucursal</label><input type="text" id="c-suc" list="suc-list" placeholder="Sucursal"></div>
            <div><label>Responsable</label><input type="text" id="c-resp" placeholder="Nombre"></div>
        </div>

        <div class="sec-h">Movimientos de efectivo del día</div>
        <div class="grid3">
            <div><label>Fondo inicial</label><input type="number" id="c-fondo" min="0" step="0.01" value="0" oninput="recalc()"></div>
            <div><label>Ingresos efectivo</label><input type="number" id="c-ing" min="0" step="0.01" value="0" oninput="recalc()"></div>
            <div><label>Salidas efectivo</label><input type="number" id="c-sal" min="0" step="0.01" value="0" oninput="recalc()"></div>
        </div>

        <div class="sec-h">Conteo físico del efectivo</div>
        <table class="den-tbl">
            <thead><tr><th class="l">Denominación</th><th>Cantidad</th><th>Subtotal</th></tr></thead>
            <tbody id="den-body"></tbody>
        </table>

        <div class="resumen" id="resumen"></div>

        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <textarea id="c-notas" placeholder="Ej. faltante por vuelto de cliente, pendiente confirmar…"></textarea>

        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar cierre</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { requirePin } from './pin-gate.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['contable']);
    await requirePin(usuario);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { maximumFractionDigits: 0 });
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    // Denominaciones del peso dominicano (billetes y monedas).
    const DENOMS = [2000, 1000, 500, 200, 100, 50, 25, 10, 5, 1];
    let cierres = [];

    onSnapshot(collection(db, 'bancosCierres'), (s) => { cierres = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'rrhhSucursales'), (s) => {
        const nombres = s.docs.map(d => (d.data().nombre || '')).filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));
        document.getElementById('suc-list').innerHTML = nombres.map(n => `<option value="${esc(n)}"></option>`).join('');
        const fs = document.getElementById('f-suc'); const cur = fs.value;
        fs.innerHTML = '<option value="">Todas las sucursales</option>' + nombres.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join(''); fs.value = cur;
    }, () => {});

    // ---------- Modal ----------
    function buildDenoms() {
        document.getElementById('den-body').innerHTML = DENOMS.map(d => `<tr>
            <td class="l">RD$ ${d.toLocaleString('es-DO')}</td>
            <td><input type="number" id="den-${d}" min="0" step="1" value="0" oninput="recalc()"></td>
            <td class="sub" id="sub-${d}">RD$ 0</td>
        </tr>`).join('');
    }
    window.recalc = function () {
        let contado = 0;
        DENOMS.forEach(d => {
            const cant = Math.max(0, Math.floor(n2(document.getElementById('den-' + d).value)));
            const sub = cant * d; contado += sub;
            document.getElementById('sub-' + d).textContent = fmt0(sub);
        });
        const fondo = n2(document.getElementById('c-fondo').value);
        const ing = n2(document.getElementById('c-ing').value);
        const sal = n2(document.getElementById('c-sal').value);
        const esperado = fondo + ing - sal;
        const dif = contado - esperado;
        const cls = Math.abs(dif) < 0.005 ? 'ok' : (dif > 0 ? 'sob' : 'fal');
        const etq = Math.abs(dif) < 0.005 ? 'Cuadrado ✓' : (dif > 0 ? 'Sobrante ' + fmt(dif) : 'Faltante ' + fmt(Math.abs(dif)));
        document.getElementById('resumen').innerHTML =
            `<div class="row"><span>Efectivo esperado</span><b>${fmt(esperado)}</b></div>
             <div class="row"><span>Efectivo contado</span><b>${fmt(contado)}</b></div>
             <div class="row big"><span>Diferencia</span><b class="dif ${cls}">${etq}</b></div>`;
        return { contado, esperado, dif };
    };
    window.abrir = function () {
        document.getElementById('c-fecha').value = hoyISO();
        ['c-suc', 'c-resp', 'c-notas'].forEach(id => document.getElementById(id).value = '');
        ['c-fondo', 'c-ing', 'c-sal'].forEach(id => document.getElementById(id).value = '0');
        document.getElementById('c-resp').value = usuario.nombre;
        buildDenoms(); recalc();
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const r = recalc();
        const denoms = {}; DENOMS.forEach(d => { const c = Math.max(0, Math.floor(n2(document.getElementById('den-' + d).value))); if (c) denoms[d] = c; });
        const btn = document.querySelector('#modal .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            await addDoc(collection(db, 'bancosCierres'), {
                fecha: document.getElementById('c-fecha').value || hoyISO(),
                sucursal: document.getElementById('c-suc').value.trim(),
                responsable: document.getElementById('c-resp').value.trim(),
                fondoInicial: n2(document.getElementById('c-fondo').value),
                ingresosEfectivo: n2(document.getElementById('c-ing').value),
                salidasEfectivo: n2(document.getElementById('c-sal').value),
                efectivoEsperado: r.esperado, efectivoContado: r.contado, diferencia: r.dif,
                denominaciones: denoms, notas: document.getElementById('c-notas').value.trim(),
                creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            cerrar();
        } catch (e) { alert('No se pudo guardar el cierre: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar cierre'; }
    };
    window.borrar = async function (id) {
        if (!confirm('¿Eliminar este cierre de caja?')) return;
        try { await deleteDoc(doc(db, 'bancosCierres', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function enPeriodo(fecha, periodo) {
        if (periodo === 'todo') return true;
        const d = new Date((fecha || '') + 'T00:00:00'); if (isNaN(d)) return false;
        const now = new Date();
        if (periodo === 'anio') return d.getFullYear() === now.getFullYear();
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }

    function render() {
        const fsuc = document.getElementById('f-suc').value, per = document.getElementById('f-periodo').value;
        const lista = cierres
            .filter(c => enPeriodo(c.fecha, per))
            .filter(c => !fsuc || (c.sucursal || '') === fsuc)
            .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || String((b.fechaCreacion && b.fechaCreacion.seconds) || '').localeCompare(String((a.fechaCreacion && a.fechaCreacion.seconds) || '')));
        const cont = document.getElementById('lista');
        if (!cierres.length) { cont.innerHTML = '<p class="empty">Aún no hay cierres. Registra el primero con «+ Nuevo cierre».</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin cierres para el filtro.</p>'; return; }
        cont.innerHTML = lista.map(c => {
            const dif = n2(c.diferencia);
            const cls = Math.abs(dif) < 0.005 ? 'ok' : (dif > 0 ? 'sob' : 'fal');
            const etq = Math.abs(dif) < 0.005 ? 'Cuadrado ✓' : (dif > 0 ? 'Sobrante ' + fmt0(dif) : 'Faltante ' + fmt0(Math.abs(dif)));
            const meta = [c.sucursal ? '🏢 ' + esc(c.sucursal) : '', c.responsable ? esc(c.responsable) : ''].filter(Boolean).join('  ·  ');
            return `<div class="order-card cl-card ${cls === 'ok' ? '' : 'dif'}">
                <div class="cl-ic">🧾</div>
                <div class="cl-info">
                    <b>${esc(fmtFecha(c.fecha))}</b>
                    ${meta ? `<div class="l">${meta}</div>` : ''}
                    <div class="cl-nums">
                        <span>Esperado <b>${fmt0(c.efectivoEsperado)}</b></span>
                        <span>Contado <b>${fmt0(c.efectivoContado)}</b></span>
                    </div>
                    ${c.notas ? `<div class="l">“${esc(c.notas)}”</div>` : ''}
                </div>
                <div class="dif-tag ${cls}">${etq}</div>
                <button class="del-btn" title="Eliminar" onclick="borrar('${c.id}')">🗑</button>
            </div>`;
        }).join('');
    }

    render();
</script>

</body>
</html>
