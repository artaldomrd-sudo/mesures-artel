<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Cuentas Bancarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 760px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .cu-card { display: flex; align-items: flex-start; gap: 14px; }
    .cu-ic { width: 46px; height: 46px; border-radius: 12px; background: #e9f0fb; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 auto; }
    .cu-info { flex: 1; min-width: 0; }
    .cu-info b { color: var(--artal-blue); font-size: 15.5px; }
    .cu-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .cu-saldo { font-weight: bold; font-size: 16px; margin-top: 4px; }
    .cu-saldo.pos { color: #1f9d61; } .cu-saldo.neg { color: #d9483b; }
    .b { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; letter-spacing: .3px; }
    .b.inactivo { background: #f1f1f4; color: #8a93a0; } .b.moneda { background: #eef3ff; color: #3457b2; } .b.tipo { background: #f3eefb; color: #7d3ac1; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions a, .row-actions button { border: none; border-radius: 8px; padding: 8px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 36px; box-sizing: border-box; display: inline-flex; align-items: center; text-decoration: none; }
    .b-mov { background: var(--artal-blue); color: #fff; } .b-editar { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 11px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; } .chk-line input { width: auto; min-height: 0; } .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="bancos.html" title="Volver">← Bancos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Cuentas Bancarias</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar"><button class="btn-y" onclick="abrirNueva()">+ Nueva cuenta</button></div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Nueva cuenta bancaria</h2>
        <label>Banco *</label>
        <input type="text" id="c-banco" list="bancos-list" placeholder="Ej. Banco Popular">
        <datalist id="bancos-list">
            <option value="Banco Popular Dominicano"></option><option value="Banco BHD"></option><option value="Banreservas"></option>
            <option value="Scotiabank"></option><option value="Banco Santa Cruz"></option><option value="Banco Caribe"></option>
            <option value="Banco Promerica"></option><option value="Banco BDI"></option><option value="Banco Vimenca"></option>
            <option value="Banco Ademi"></option><option value="APAP"></option><option value="Asociación Cibao"></option>
            <option value="Banco López de Haro"></option><option value="Bancamérica"></option><option value="Banco Lafise"></option><option value="Citibank"></option>
        </datalist>
        <label>Alias / nombre de la cuenta *</label>
        <input type="text" id="c-alias" placeholder="Ej. Popular Corriente Operaciones">
        <div class="grid2">
            <div><label>Número de cuenta</label><input type="text" id="c-numero" placeholder="000-0000000-0"></div>
            <div><label>Tipo</label><select id="c-tipo"><option value="corriente">Corriente</option><option value="ahorro">Ahorro</option></select></div>
        </div>
        <div class="grid2">
            <div><label>Moneda</label><select id="c-moneda"><option value="DOP">DOP (RD$)</option><option value="USD">USD (US$)</option><option value="EUR">EUR (€)</option></select></div>
            <div><label>Saldo inicial</label><input type="number" id="c-saldo" step="0.01" value="0"></div>
        </div>
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <textarea id="c-notas" style="min-height:48px"></textarea>
        <div class="chk-line"><input type="checkbox" id="c-activo" checked><label for="c-activo">Cuenta activa</label></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth([]);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const SIM = { DOP: 'RD$', USD: 'US$', EUR: '€' };
    const fmt = (x, mon) => (SIM[mon] || 'RD$') + ' ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let cuentas = [], movs = [];
    onSnapshot(collection(db, 'bancosCuentas'), (s) => { cuentas = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'bancosMovimientos'), (s) => { movs = s.docs.map(d => d.data()); render(); }, () => {});

    const saldoDe = (c) => n2(c.saldoInicial) + movs.filter(m => m.cuentaId === c.id).reduce((a, m) => a + (m.tipo === 'credito' ? n2(m.monto) : -n2(m.monto)), 0);

    window.abrirNueva = function () {
        editId = null; document.getElementById('modal-title').textContent = 'Nueva cuenta bancaria';
        ['c-banco', 'c-alias', 'c-numero', 'c-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('c-tipo').value = 'corriente';
        document.getElementById('c-moneda').value = 'DOP';
        document.getElementById('c-saldo').value = '0';
        document.getElementById('c-activo').checked = true;
        document.getElementById('modal').classList.add('show');
    };
    let editId = null;
    window.editar = function (id) {
        const c = cuentas.find(x => x.id === id); if (!c) return;
        editId = id; document.getElementById('modal-title').textContent = 'Editar cuenta';
        document.getElementById('c-banco').value = c.banco || '';
        document.getElementById('c-alias').value = c.alias || '';
        document.getElementById('c-numero').value = c.numero || '';
        document.getElementById('c-tipo').value = c.tipo || 'corriente';
        document.getElementById('c-moneda').value = c.moneda || 'DOP';
        document.getElementById('c-saldo').value = c.saldoInicial != null ? c.saldoInicial : 0;
        document.getElementById('c-notas').value = c.notas || '';
        document.getElementById('c-activo').checked = c.activo !== false;
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };
    window.guardar = async function () {
        const banco = document.getElementById('c-banco').value.trim();
        const alias = document.getElementById('c-alias').value.trim();
        if (!banco) { alert('Indica el banco.'); return; }
        if (!alias) { alert('Ponle un alias/nombre a la cuenta.'); return; }
        const datos = {
            banco, alias, numero: document.getElementById('c-numero').value.trim(),
            tipo: document.getElementById('c-tipo').value, moneda: document.getElementById('c-moneda').value,
            saldoInicial: n2(document.getElementById('c-saldo').value),
            notas: document.getElementById('c-notas').value.trim(),
            activo: document.getElementById('c-activo').checked,
            actualizado: serverTimestamp(), actualizadoPor: usuario.nombre
        };
        try {
            if (editId) await updateDoc(doc(db, 'bancosCuentas', editId), datos);
            else await addDoc(collection(db, 'bancosCuentas'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrar();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
    };
    window.borrar = async function (id) {
        const c = cuentas.find(x => x.id === id) || {};
        const n = movs.filter(m => m.cuentaId === id).length;
        if (n) { alert('Esta cuenta tiene ' + n + ' movimiento(s). Elimínalos o desactiva la cuenta en vez de borrarla.'); return; }
        if (!confirm('¿Eliminar la cuenta "' + (c.alias || '') + '"?')) return;
        try { await deleteDoc(doc(db, 'bancosCuentas', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const cont = document.getElementById('lista');
        if (!cuentas.length) { cont.innerHTML = '<p class="empty">Aún no hay cuentas. Crea la primera con «+ Nueva cuenta».</p>'; return; }
        cont.innerHTML = cuentas.slice().sort((a, b) => String(a.alias || '').localeCompare(String(b.alias || ''), 'es')).map(c => {
            const saldo = saldoDe(c);
            const meta = [esc(c.banco), c.numero ? 'N.º ' + esc(c.numero) : ''].filter(Boolean).join('  ·  ');
            return `<div class="order-card cu-card">
                <div class="cu-ic">🏦</div>
                <div class="cu-info">
                    <b>${esc(c.alias)}</b>
                    <span class="b tipo">${c.tipo === 'ahorro' ? 'Ahorro' : 'Corriente'}</span>
                    <span class="b moneda">${esc(c.moneda || 'DOP')}</span>
                    ${c.activo === false ? '<span class="b inactivo">Inactiva</span>' : ''}
                    <div class="l">${meta}</div>
                    <div class="cu-saldo ${saldo < 0 ? 'neg' : 'pos'}">${fmt(saldo, c.moneda)}</div>
                </div>
                <div class="row-actions">
                    <a class="b-mov" href="bancos-movimientos.html?cuenta=${c.id}">💳 Movimientos</a>
                    <button class="b-editar" onclick="editar('${c.id}')">✏</button>
                    <button class="b-borrar" onclick="borrar('${c.id}')">🗑</button>
                </div>
            </div>`;
        }).join('');
    }
</script>

</body>
</html>
