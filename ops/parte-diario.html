        if (otro) est.innerHTML = `<b class="ok">✓ Este día ya estás en el parte de ${esc(otro.encargadoNombre || otro.encargadoEmail)}</b> · no tienes que enviar el tuyo, salvo que hayas tenido gente aparte.`;
        else if (parteGuardado && !parteGuardado.borrador) est.innerHTML = `<b class="ok">✓ Enviado</b> el ${esc(fmtTs(parteGuardado.actualizado || parteGuardado.creado))} · puedes corregirlo y volver a enviar`;

        document.getElementById('p-resumen').textContent = `${ids.length} persona(s) · ${horasTot} h en total · un solo envío`;

    }
    // Hoja para elegir obra o actividad de una fila (sustituye a los dos desplegables).
    window.abrirObraSheet = function (i) {

    window.abrirPersonaSheet = function () {

    };
    const fmtTs = (v) => { const d = v && v.toDate ? v.toDate() : null; return d ? d.toLocaleString('es-DO', { dateStyle: 'short', timeStyle: 'short' }) : ''; };
    window.setLinea = function (i, campo, valor) {
        const l = parteActual.lineas[i]; if (!l) return;
        if (campo === 'horas') l.horas = Math.max(0, Math.min(16, n2(valor)));
        else if (campo === 'tipo') { l.tipo = valor; if (valor !== 'obra') { l.obraKey = ''; l.obraLabel = ''; } if (valor === 'ausente') l.horas = 0; else if (!n2(l.horas)) l.horas = n2(config.horasJornada) || JORNADA_H; }
        renderParte();
    };
    window.agregarLinea = function (empId) {
        const emp = empPorId(empId); const base = lineasDe(empId)[0];
        parteActual.lineas.push({ empleadoId: empId, nombre: (base && base.l.nombre) || (emp && emp.nombre) || empId, tipo: 'obra', obraKey: '', obraLabel: '', horas: base ? 4 : (n2(config.horasJornada) || JORNADA_H) });

    document.getElementById('add-persona').addEventListener('change', (e) => {

    window.enviarParte = async function () {
        if (!parteActual) return;
        const fecha = parteActual.fecha, enc = encargadoSel();
        parteActual.nota = document.getElementById('p-nota').value.trim();
        const lineas = parteActual.lineas.map(l => ({ empleadoId: l.empleadoId, nombre: l.nombre, tipo: l.tipo, obraKey: l.tipo === 'obra' ? (l.obraKey || '') : '', obraLabel: l.tipo === 'obra' ? (l.obraLabel || '') : '', horas: l.tipo === 'ausente' ? 0 : n2(l.horas), ...(l.origenValidacion ? { origenValidacion: l.origenValidacion } : {}) }));
        if (!lineas.length) { alert('El parte está vacío. Agrega al menos una persona (o quita el día si nadie trabajó).'); return; }
        const sinObra = lineas.filter(l => l.tipo === 'obra' && !l.obraKey).map(l => l.nombre);
        if (sinObra.length) { alert('Falta elegir la obra de: ' + [...new Set(sinObra)].join(', ') + '.'); return; }
        const sinHoras = lineas.filter(l => l.tipo !== 'ausente' && !(l.horas > 0)).map(l => l.nombre);
        if (sinHoras.length) { alert('Horas en 0 para: ' + [...new Set(sinHoras)].join(', ') + '. Pon las horas o márcalo como ausente.'); return; }
        // Misma persona dos veces en la misma obra (una fila «✓ validado» + otra escrita a mano): las horas se contarían dos veces.
        const rep = new Map(); lineas.forEach(l => { if (l.tipo === 'obra' && l.obraKey) { const k = l.empleadoId + '|' + l.obraKey; rep.set(k, (rep.get(k) || 0) + 1); } });
        const repetidas = [...new Set(lineas.filter(l => l.tipo === 'obra' && rep.get(l.empleadoId + '|' + l.obraKey) > 1).map(l => l.nombre + ' en ' + l.obraLabel))];
        if (repetidas.length && !confirm('Hay dos filas de la misma persona en la misma obra (las horas se sumarían dos veces):\n\n' + repetidas.join('\n') + '\n\n¿Es correcto? Cancelar = volver y quitar la fila repetida con ✕.')) return;
        // Resumen del día (obligatorio en el parte de HOY): cada cosa prevista marcada, motivo en las ❌, y las dos líneas.
        const esHoyParte = fecha === hoyStr();
        if (esHoyParte) {
            // Obras con horas en el parte que no estaban en lo previsto: también hay que decir cómo quedaron.
            const keysLineas = new Set(lineas.filter(l => l.tipo === 'obra' && l.obraKey).map(l => l.obraKey));
            const faltan = instCache.filter(j => ['pendiente', 'en_proceso'].includes(j.estado) && keysLineas.has(obraKeyDe(j.cliente, j.obra)) && !resumenActual.items.some(i => i.ref === 'inst:' + j.id));
            if (faltan.length) { faltan.forEach(j => resumenActual.items.push({ ref: 'inst:' + j.id, label: [j.cliente, j.obra].filter(Boolean).join(' — '), hecho: null, motivo: '', nota: '', estadoObra: '', regreso: '' })); alert('Trabajaste en ' + faltan.map(j => [j.cliente, j.obra].filter(Boolean).join(' — ')).join(' · ') + ': di cómo quedó la obra (paso 1).'); setPaso(1); return; }
            const sinObra = resumenActual.items.filter(i => i.ref.startsWith('inst:') && !i.estadoObra && !i.opcional); if (sinObra.length) { alert('Falta decir cómo quedó: ' + sinObra.map(i => i.label).join(' · ') + ' (paso 1).'); setPaso(1); return; }
            const ta = document.getElementById('res-cumplido'), tb = document.getElementById('res-nocumplido');
            if (ta) resumenActual.cumplido = ta.value; if (tb) resumenActual.noCumplido = tb.value;
            const sinMarcar = resumenActual.items.filter(i => i.hecho == null && !i.opcional);
            if (sinMarcar.length) { alert('En el resumen del día marca ✅ o ❌ en: ' + sinMarcar.map(i => i.label).join(' · ')); return; }
            const sinMotivo = resumenActual.items.filter(i => i.hecho === false && !i.motivo);
            if (sinMotivo.length) { alert('Di por qué no se hizo: ' + sinMotivo.map(i => i.label).join(' · ')); return; }
            if (resumenActual.cumplido.trim().length < 3) { alert('Falta la línea de lo que se cumplió hoy (paso 2).'); setPaso(2); return; }
            if (resumenActual.noCumplido.trim().length < 3) { alert('Falta la línea de lo que no se cumplió (paso 2). Si todo se cumplió, escribe «Nada».'); setPaso(2); return; }
        }
        // Nadie puede aparecer en el parte de DOS encargados el mismo día (evita contar doble el costo).
        // D3 (revisión 2026-10-09): si el otro parte es un BORRADOR (horas cargadas desde la ventana de Instalación, aún no enviado),
        // el encargado que envía puede resolverlo aquí mismo: quita a la persona de ese borrador y la deja en su parte. Si el otro
        // parte ya fue ENVIADO, se bloquea como antes (caso Wilson/Roosevelt 2026-09-30: quedó bloqueado por un borrador de Miki).
        const otros = partes.filter(p => p.fecha === fecha && String(p.encargadoEmail || '').toLowerCase() !== String(enc.email || '').toLowerCase());
        const dupEnviado = [], dupBorrador = [];
        lineas.forEach(l => otros.forEach(p => { if ((p.lineas || []).some(x => x.empleadoId === l.empleadoId)) (p.borrador ? dupBorrador : dupEnviado).push({ nombre: l.nombre, empleadoId: l.empleadoId, parte: p }); }));
        if (dupEnviado.length) { alert('No se puede enviar: estas personas ya están en el parte ENVIADO de otro encargado:\n\n' + [...new Set(dupEnviado.map(d => d.nombre + ' (lo reportó ' + (d.parte.encargadoNombre || d.parte.encargadoEmail) + ')'))].join('\n') + '\n\nQuítalas de tu parte o pídele al otro encargado que las quite del suyo.'); return; }
        if (dupBorrador.length) {
            const txt = [...new Set(dupBorrador.map(d => d.nombre + ' (borrador de ' + (d.parte.encargadoNombre || d.parte.encargadoEmail) + ')'))].join('\n');
            if (!confirm('Estas personas también están en un BORRADOR de otro encargado (horas cargadas al validar un trabajo):\n\n' + txt + '\n\n¿Quitarlas de ese borrador y dejarlas en tu parte? (Cancelar = no enviar todavía)')) return;
            const porParte = new Map(); dupBorrador.forEach(d => { const a = porParte.get(d.parte) || new Set(); a.add(d.empleadoId); porParte.set(d.parte, a); });
            for (const [p, ids] of porParte) {
                const restantes = (p.lineas || []).filter(x => !ids.has(x.empleadoId));
                const emails = [...new Set(restantes.map(x => { const e = empPorId(x.empleadoId); return e && e.correo ? String(e.correo).toLowerCase() : ''; }).filter(Boolean))];
                try { await setDoc(doc(db, 'partesDiarios', p.id || parteId(p.fecha, p.encargadoEmail)), { lineas: restantes, incluidosEmails: emails, actualizado: serverTimestamp(), editadoPor: usuario.nombre + ' (desde su parte)' }, { merge: true }); }
                catch (e) { alert('No se pudo corregir el borrador de ' + (p.encargadoNombre || p.encargadoEmail) + ': ' + e.message); return; }
            }
        }
        // G3: el costo por hora ya no va en la línea (lo veían los encargados); el servidor lo congela en partesCostos (solo finanzas).
        lineas.forEach(l => { delete l.costoHora; });
        const id = parteId(fecha, enc.email);
        const incluidosEmails = [...new Set(lineas.map(l => { const e = empPorId(l.empleadoId); return e && e.correo ? String(e.correo).toLowerCase() : ''; }).filter(Boolean))];
        const datos = { fecha, encargadoEmail: enc.email, encargadoNombre: enc.nombre, lineas, incluidosEmails, nota: parteActual.nota, actualizado: serverTimestamp(), editadoPor: usuario.nombre };
        if (esHoyParte || resumenActual.items.length || resumenActual.cumplido || resumenActual.noCumplido) datos.resumen = { items: resumenActual.items.filter(i => !(i.opcional && !i.estadoObra && i.hecho == null)).map(i => ({ ref: i.ref, label: i.label, hecho: i.hecho === true, motivo: i.motivo || '', nota: (i.nota || '').trim(), estadoObra: i.estadoObra || '', regreso: i.regreso || '', misionesHechas: i.misionesHechas || [] })), cumplido: resumenActual.cumplido.trim(), noCumplido: resumenActual.noCumplido.trim(), fechaISO: new Date().toISOString(), por: usuario.nombre };
        // Un borrador (horas cargadas al validar trabajos) pasa a parte enviado AHORA: `creado` = momento real del envío
        // (es la hora que mira el sistema de puntos para «a tiempo / tarde»).
        if (!parteGuardado || parteGuardado.borrador) datos.creado = serverTimestamp();
        if (parteGuardado && parteGuardado.borrador) datos.borrador = deleteField();
        const btn = document.getElementById('btn-enviar'); btn.disabled = true;
        try {
            await setDoc(doc(db, 'partesDiarios', id), datos, { merge: true });
            if (esHoyParte) limpiarCierre();   // parte enviado: se libera la pantalla (flecha, Mi plan, atrás)
            // La línea de estado pasa a «✓ Enviado» al instante (antes esperaba al siguiente cargarParte y seguía diciendo «sin enviar»).
            parteGuardado = { ...(parteGuardado || {}), ...datos, borrador: false, actualizado: { toDate: () => new Date() } };
            renderParte();
            if (esHoyParte) await aplicarObras(datos.resumen.items);
            const hora = new Date().toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('paso-ok').innerHTML = `<div class="done"><div class="ck">✓</div><h2>Parte enviado</h2><p>${esc(fmtFecha(fecha))} · ${esc(hora)}${esHoyParte ? '<br>En unos minutos el Coordinador te contesta' : ''}</p></div><button class="cta sec" onclick="setVista('plan')" style="margin-top:18px">Volver a mi día</button><button class="cta sec" onclick="setPaso(3)">Corregir el parte</button>`;
            setPaso(4);

            // obra — costos y dónde estaban —; la nómina la hace la contable con sus propios datos). Lo ÚNICO que sí llega a
            // RRHH (usuario 2026-09-28: «cuando se marca una ausencia sí puede llegar la información») es la AUSENCIA: una
            // persona con línea 'ausente' y sin horas ese día → rrhhAsistencia/{empId}_{fecha} estado 'ausente'. Gerencia la

            const porEmp = new Map(); lineas.forEach(l => { const c = porEmp.get(l.empleadoId) || { horas: 0, ausente: false }; c.horas += l.horas; if (l.tipo === 'ausente') c.ausente = true; porEmp.set(l.empleadoId, c); });

    // ---------------- Pendientes (para el aviso y para Control) ----------------
    function esLaborable(f) { const d = new Date(f + 'T12:00:00').getDay(); return d !== 0 && (!feriados.has(f) || feriadosTrab.has(f)); }
    // ¿Otro encargado ya reportó a esta persona ese día? (partes nuevos traen incluidosEmails; los
    // viejos se resuelven por empleadoId → correo).
    function incluidoPorOtro(email, fecha) {
        const em = String(email || '').toLowerCase();
        return partes.some(p => p.fecha === fecha && !p.borrador && String(p.encargadoEmail || '').toLowerCase() !== em &&
            (Array.isArray(p.incluidosEmails) ? p.incluidosEmails.includes(em) : (p.lineas || []).some(l => { const e = empPorId(l.empleadoId); return e && String(e.correo || '').toLowerCase() === em; })));
    }
    // Fecha desde la que se le exige el parte a cada encargado (Control → "desde"): Wilson desde el
    // 16/09/2026, Miki desde el 17/09 (volvió de vacaciones ese día). Sin fecha = siempre.
    const desdeDe = (email) => { const e = (config.encargados || []).find(x => String(x.email || '').toLowerCase() === String(email || '').toLowerCase()); return (e && e.desde) || '0000-00-00'; };
    function diasPendientes(email, nDias) {
        const out = []; const ahora = new Date();
        if (!(config.encargados || []).some(e => e.email === email)) return out;
        for (let k = 0; k < nDias; k++) {
            const f = addDias(hoyStr(), -k);
            if (!esLaborable(f)) continue;
            if (k === 0 && ahora.getHours() < 18) continue;   // hoy solo cuenta como pendiente desde las 6 pm
            if (f < desdeDe(email)) continue;   // antes de su fecha de arranque no se le exige nada
            if (partes.some(p => p.id === parteId(f, email) && !p.borrador)) continue;
            if (incluidoPorOtro(email, f)) continue;   // ese día trabajó bajo otro encargado (ej. Miki con Wilson)
            out.push(f);
        }
        return out;
    }
    // El encargado corrige sus propios partes hasta 6 DÍAS LABORABLES atrás (usuario 2026-09-23; domingos y feriados
    // no trabajados no cuentan); un día PENDIENTE (ventana del bloqueo, parte-gate.js) siempre se puede cargar.
    const LIMITE_CORRECCION_LABORABLES = 6;
    function fechaLimiteCorreccion() {
        let f = hoyStr(), n = 0;
        while (n < LIMITE_CORRECCION_LABORABLES) { f = addDias(f, -1); if (esLaborable(f)) n++; }
        return f;
    }
    function ajustarMinFecha() {
        const f = document.getElementById('p-fecha'); if (esAdmin) { f.min = ''; return; }
        const pend = diasPendientes(usuario.email, 7);
        const masViejo = pend.length ? pend[pend.length - 1] : '';
        const lim = fechaLimiteCorreccion();
        f.min = masViejo && masViejo < lim ? masViejo : lim;
    }
    function renderAvisoPendientes() {
        const box = document.getElementById('aviso-pend'); if (!box) return;
        ajustarMinFecha();
        const enc = encargadoSel();
        const soyEncargado = (config.encargados || []).some(e => e.email === enc.email);
        if (!soyEncargado) { box.innerHTML = ''; return; }
        const pend = diasPendientes(enc.email, 7).filter(f => f !== (parteActual && parteActual.fecha));
        const enlaces = pend.map(f => `<a href="#" onclick="irFecha('${f}');return false;" style="color:inherit;font-weight:bold">${esc(fmtFecha(f))}</a>`).join(' · ');
        box.innerHTML = pend.length ? `<div class="aviso"><b>Primero el parte de ${pend.length === 1 && pend[0] === addDias(hoyStr(), -1) ? 'ayer' : 'los días pendientes'}:</b> ${enlaces}</div>` : '';
    }
    window.irFecha = function (f) { document.getElementById('p-fecha').value = f; paso = 3; cargarParte(); if (vista !== 'cerrar') setVista('cerrar'); else setPaso(3); };

    // ====================== SIMULACIÓN GUIADA (?demo=midia): un día completo, de la mañana a la tarde ======================
    if (DEMO === 'midia') {
        const PASOS = [
            { t: '7:50 am · Tu plan de hoy', n: 'Es jueves por la mañana. Antes de salir, Wilson abre «Mi día» en Instalación. Arriba está su plan: solo las líneas del informe del Coordinador que le tocan a él. Si quiere el informe completo, lo abre con un toque. Al verlo aquí, el sistema ya lo cuenta como leído.', go: () => { setVista('plan'); resaltar('#plan-box'); } },
            { t: 'Lo que el sistema tiene a tu nombre', n: 'Debajo de las líneas del Coordinador van las demás cosas a su nombre: una reparación atrasada de ayer, un pedido en ruta por entregar, material que retirar en el proveedor. Cada línea de esta lista volverá por la tarde para marcarla hecha o no.', go: () => { setVista('plan'); resaltar('#plan-box .li'); ir('#plan-box'); } },
            { t: 'Te falta cerrar', n: 'La segunda tarjeta es lo que está abierto a su nombre y nadie más puede cerrar. El pedido de Toni lleva tres días «en ruta»: un toque en «Entregado». El recordatorio del viaje, «Hecho». Plaza Manuela hay que retomarla o cerrarla desde Instalación.', go: () => { setVista('plan'); resaltar('#cerrar-box .li'); ir('#cerrar-box'); } },
            { t: 'Un toque y listo', n: 'Wilson toca «Entregado» y «Hecho». Desaparecen de la lista y quedan registrados con su nombre y la hora. Diez segundos que antes se quedaban semanas sin hacer.', go: async () => { const c = window.confirm; window.confirm = () => true; const o = ordersCache.find(x => x.obra === 'Casa playa bonita'); if (o && o.enRuta) await regEntregado(o.id); const ci = citasAbiertas.find(x => /Santo Domingo/.test(x.titulo || '')); if (ci) await regCitaHecha(ci.id); window.confirm = c; setTimeout(() => { setVista('plan'); resaltar('#cerrar-box'); ir('#cerrar-box'); }, 300); } },
            { t: 'Durante el día', n: 'El equipo sale a la obra. El día pasa como siempre: Niza se termina pero se alarga, Riviera Coson 2 no se alcanza, y en Jaraba no tenían la masilla. Nada de esto hay que escribirlo por WhatsApp: se cuenta a las 5:30.', go: () => { aviso(''); setVista('plan'); ir('#plan-box'); } },
            { t: '5:30 pm · Llega el aviso', n: 'A las cinco y media suena el teléfono: «Antes de salir: parte y resumen del día». Wilson lo toca desde la obra y se abre «Gestionar el día», en tres pasos.', go: () => { aviso('📝 Antes de salir: parte y resumen del día — Marca lo que se cumplió y lo que no, pon las horas del equipo y envía.'); setTimeout(() => { paso = 1; setVista('cerrar'); }, 700); } },
            { t: 'Paso 1 · ¿Cómo quedó el día?', n: 'Cada obra se cierra o se pausa: Niza, terminada. Plaza Manuela, pausada, y elige el día en que vuelven: el lunes. Riviera Coson 2: no fuimos, y el motivo «se alargó otra obra». La masilla: no, «faltó material». Al enviar, el sistema cierra Niza y pone a Plaza Manuela la fecha del lunes en Instalación. Sin marcar todo, no pasa al siguiente paso.', go: () => { aviso(''); demoResumen(); paso = 1; setVista('cerrar'); } },
            { t: 'Paso 2 · En dos líneas', n: 'Qué se cumplió y qué no, como se lo contaría a Dylan por teléfono. Debajo ya ve lo que tiene mañana a su nombre. Si todo se cumplió, escribe «Nada».', go: () => { demoResumen(); setPaso(2); } },
            { t: 'Paso 3 · Horas del equipo', n: 'El parte de siempre, más simple: cada persona con su obra y las horas con menos y más. Hoy Wilson y el ayudante estuvieron en Niza nueve horas. Quien no estuvo con él, se quita con la equis.', go: () => { demoHoras(); setPaso(3); } },
            { t: 'Enviar: un solo botón', n: 'Wilson toca «Enviar parte y resumen». Horas, hecho o no, y las dos líneas viajan juntos. Son las 5:41 de la tarde: a tiempo.', go: async () => { const a = window.alert, c = window.confirm; window.alert = () => {}; window.confirm = () => true; await enviarParte(); window.alert = a; window.confirm = c; } },
            { t: 'Minutos después: el Coordinador contesta', n: 'Antes de llegar a la casa le entra un aviso: «Recibido, Wilson». Repite lo que marcó, lo que quedó pendiente y lo que tiene mañana a su nombre. Quien reporta y recibe respuesta, sigue reportando.', go: () => { demoAcuse(); setTimeout(() => { setVista('plan'); const m = informesMios.find(x => /Recibido/.test(x.asunto || '')); if (m) verInforme(m.id); }, 400); } },
            { t: 'Mañana 7:50 · Informe cruzado', n: 'A la mañana siguiente el plan sale del resumen de Wilson y del de Miki. Riviera Coson 2 aparece como primera tarea de Wilson; la masilla pasó a la oficina; y lo que Miki marcó como no hecho en Aloha se reclama a ALUCUFEL. Nadie tuvo que llamar a nadie.', go: () => { cerrarSheet(); demoManana(); setTimeout(() => { setVista('plan'); resaltar('#plan-box'); }, 300); } },
            { t: 'Fin de la simulación', n: 'Eso es todo: dos momentos al día, en la misma pantalla. Por la mañana leer; a las 5:30, cinco minutos para contar el día. Con eso la oficina planifica y ustedes dejan de explicar por WhatsApp. Pueden volver a cualquier paso con las flechas.', go: () => { cerrarSheet(); setVista('plan'); } },
        ];
        let paso = -1;
        const ir = (sel, centro) => { const el = document.querySelector(sel); if (!el) return; if (centro) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); else { const y = el.getBoundingClientRect().top + window.scrollY - 150; window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); } };
        const plegarInforme = () => document.querySelectorAll('#mi-dia details[open]').forEach(d => { d.open = false; });
        const resaltar = (sel) => { document.querySelectorAll('.tour-hi').forEach(e => e.classList.remove('tour-hi')); document.querySelectorAll(sel).forEach(e => e.classList.add('tour-hi')); };
        const aviso = (txt) => { let b = document.getElementById('tour-push'); if (!txt) { if (b) b.remove(); return; } if (!b) { b = document.createElement('div'); b.id = 'tour-push'; document.body.appendChild(b); } b.innerHTML = '<span>🔔</span><div><b>ARTAL · ahora</b><br>' + esc(txt) + '</div>'; };
        function demoResumen() {
            const hoyD = new Date(), lun = new Date(hoyD); lun.setDate(lun.getDate() + ((8 - lun.getDay()) % 7 || 7));
            resumenActual.items.forEach(it => { if (/Niza/.test(it.label)) { it.hecho = true; it.estadoObra = 'terminada'; } else if (/Riviera/.test(it.label)) { it.hecho = false; it.estadoObra = 'nofui'; it.motivo = 'otra_obra'; it.nota = 'Niza tomó todo el día'; } else if (/Masilla/.test(it.label)) { it.hecho = false; it.motivo = 'material'; it.nota = 'Jaraba no la tenía'; } else if (/Plaza Manuela/.test(it.label)) { it.hecho = true; it.estadoObra = 'pausa'; it.regreso = ymd(lun); } else it.hecho = true; });
            resumenActual.cumplido = 'Terminamos las ventanas del segundo piso de Niza y entregamos el material de Toni.';
            resumenActual.noCumplido = 'Riviera Coson 2 queda para mañana: Niza tomó todo el día. La masilla no estaba en Jaraba, hay que pedirla a otro sitio.';
            renderResumen();
        }
        function demoHoras() {
            const k = obraKeyDe('Marie Hélène', 'Niza Villa personal'), lbl = 'Marie Hélène — Niza Villa personal';
            parteActual.lineas = parteActual.lineas.filter(l => ['e1', 'e4'].includes(l.empleadoId)).map(l => ({ ...l, tipo: 'obra', obraKey: k, obraLabel: lbl, horas: 9 }));
            if (!parteActual.lineas.length) parteActual.lineas = [{ empleadoId: 'e1', nombre: 'Wilson (demo)', tipo: 'obra', obraKey: k, obraLabel: lbl, horas: 9 }, { empleadoId: 'e4', nombre: 'Ayudante Cuatro (demo)', tipo: 'obra', obraKey: k, obraLabel: lbl, horas: 9 }];
            if (vista === 'cerrar' && paso === 3) renderParte();
        }
        function demoAcuse() {
            const st = window.__demoStore; if (!st || st.mensajes.ack) return;
            st.mensajes.ack = { tipo: 'aviso_coordinador', asunto: '✅ Recibido tu parte de hoy · mañana', fecha: { toDate: () => new Date() }, destinatarios: [usuario.email], remitenteEmail: 'coordinador@artal', remitenteNombre: 'Coordinador de Obras (IA)', acuses: {},
                cuerpo: `Recibido, Wilson. Tu parte de hoy llegó a las 17:41: 2 personas, 18 h en total.\n\nCumplido hoy (2): Marie Hélène — Niza Villa personal · Entregar: Toni — Casa playa bonita.\nTus palabras: «Terminamos las ventanas del segundo piso de Niza y entregamos el material de Toni.»\n\nNo cumplido (3): Gregory — Riviera Coson 2 — Se alargó otra obra: Niza tomó todo el día · Comprar / retirar: Masilla siliconizada — Faltó material: Jaraba no la tenía · Jose Manuel — Plaza Manuela — Cambio de plan de la oficina: retomamos el lunes.\n\nMañana tienes a tu nombre: Gregory — Riviera Coson 2. Lo que quedó pendiente hoy lo verás en el informe de las 7:50 con la propuesta para resolverlo.\n\n— Coordinador de Obras` };
            window.__demoFire();
        }
        function demoManana() {
            const st = window.__demoStore; if (!st || st.mensajes.m2) return;
            const m = new Date(); m.setDate(m.getDate() + 1); const dia = m.toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long' });
            st.mensajes.m1.tipo = 'informe_viejo';
            st.mensajes.m2 = { tipo: 'informe_coordinador', asunto: '🗓️ Informe matinal — ' + dia + ' (simulado)', fecha: { toDate: () => new Date() }, destinatarios: [usuario.email], remitenteEmail: 'coordinador@artal', remitenteNombre: 'Coordinador de Obras (IA)', acuses: {},
                cuerpo: `INFORME MATINAL — ${dia} (generado a las 7:50)\n\nHOY EN OBRA (propuesta; Wilson confirma o cambia)\n- Wilson → Gregory, Riviera Coson 2 a primera hora: ayer no se alcanzó porque Niza tomó todo el día (según Wilson). Lleva las piezas de la corredera.\n- Miki + Instalador Tres → ECO 83, Villa Aloha-1 parte 2: siguen con las puertas 1 y 2. Las hojas de la puerta 3 las reclamó la oficina a ALUCUFEL ayer tarde (según Miki faltaron).\n- Ayer, según Wilson: Niza terminada, Toni entregado; Plaza Manuela se retoma el lunes.\n- Ayer, según Miki: Aloha parte 2 al 70 %; faltaron las hojas de la puerta 3.\n\nTRANSPORTES\n- Masilla siliconizada: Jaraba no la tenía (Wilson). Sara la pide hoy a Ferretería del Este; Wilson la retira mañana en el viaje.\n\nRESUELTO DESDE AYER\n- Toni — Casa playa bonita: entregado (marcado por Wilson).\n- Viaje a Santo Domingo: recordatorio cerrado.\n\n🟡 ATENCIÓN (esta semana)\nA1. Plaza Manuela: Wilson la retoma el lunes; la oficina confirma con el cliente.\n🟢 EN CURSO SIN INCIDENCIAS: 2` };
            window.__demoFire();
        }
        window.tourGo = async function (n) {
            if (n < 0 || n >= PASOS.length) return; paso = n; const p = PASOS[n];
            document.querySelectorAll('.tour-hi').forEach(e => e.classList.remove('tour-hi'));
            try { await p.go(); } catch (e) { console.warn('tour', e); }
            const bar = document.getElementById('tour-bar');
            bar.innerHTML = `<div class="tour-t"><span>${n + 1} / ${PASOS.length}</span> ${esc(p.t)}</div><div class="tour-n">${esc(p.n)}</div><div class="tour-b"><button onclick="tourGo(${n - 1})" ${n === 0 ? 'disabled' : ''}>‹ Atrás</button><button class="voz" onclick="tourVoz()">🔊 Leer</button><button class="sig" onclick="tourGo(${n + 1})" ${n === PASOS.length - 1 ? 'disabled' : ''}>Siguiente ›</button></div>`;
        };
        window.tourVoz = function () { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(PASOS[paso].n); u.lang = 'es-MX'; const v = speechSynthesis.getVoices().find(x => /es[-_]MX|Paulina/i.test(x.lang + x.name)) || speechSynthesis.getVoices().find(x => /^es/i.test(x.lang)); if (v) u.voice = v; u.rate = 0.95; speechSynthesis.speak(u); } catch (_) { } };
        const css = document.createElement('style'); css.textContent = `#aviso-pend{display:none}body{padding-bottom:190px}#tour-bar{font-family:Arimo}#tour-bar{position:fixed;left:0;right:0;bottom:0;background:#0A3D62;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:9998;box-shadow:0 -4px 16px rgba(0,0,0,.25)}#tour-bar .tour-t{font-weight:bold;font-size:15px;color:#f4c430}#tour-bar .tour-t span{background:rgba(255,255,255,.15);border-radius:999px;padding:2px 9px;font-size:12px;color:#fff;margin-right:6px}#tour-bar .tour-n{font-size:14px;line-height:1.4;margin:6px 0 10px;max-width:760px}#tour-bar .tour-b{display:flex;gap:8px}#tour-bar button{border:0;border-radius:9px;padding:10px 14px;font-family:Arimo;font-weight:bold;font-size:14px;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;min-height:44px}#tour-bar button.sig{background:#f4c430;color:#0A3D62;flex:1}#tour-bar button:disabled{opacity:.35}.tour-hi{outline:3px solid #f4c430;outline-offset:3px;border-radius:10px}#tour-push{position:fixed;top:12px;left:12px;right:12px;z-index:9999;background:#1b2430;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:520px;margin:0 auto}#tour-push span{font-size:22px}`; document.head.appendChild(css);
        const bar = document.createElement('div'); bar.id = 'tour-bar'; document.body.appendChild(bar);
        setTimeout(() => tourGo(0), 900);
    }
    function renderTodo() {
        if (!arrancado) return;
        const act = document.activeElement, dentro = act && (document.getElementById('personas').contains(act) || act.id === 'p-nota' || document.getElementById('resumen-dia').contains(act));
        if (parteActual && !dentro && vista === 'cerrar') { if (paso === 3) renderParte(); else if (paso < 3) renderResumen(); }
        renderMiDia();
        poblarEncargados();
        renderAvisoPendientes();
    }
</script>
