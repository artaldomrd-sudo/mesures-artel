<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Listas de Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 980px; }
    .nota-citrus { background: #eef3ff; border: 1.5px solid #ccd9f5; color: #33518f; border-radius: 10px; padding: 9px 13px; font-size: 12.5px; margin: 0 0 12px; line-height: 1.5; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
    .bar select { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; min-width: 220px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-o { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue); border-radius: 9px; padding: 10px 14px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .lista-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 10px; }
    .lista-head .nom { color: var(--artal-blue); font-size: 17px; font-weight: bold; }
    .badge-pub { font-size: 10.5px; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; color: #1f9d61; background: #e7f7ee; border-radius: 20px; padding: 3px 10px; }
    .lista-desc { font-size: 12.5px; color: #667; }
    .mini { border: none; border-radius: 8px; padding: 7px 11px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 36px; }
    .mini.pub { background: #e7f7ee; color: #1f9d61; } .mini.ed { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; } .mini.del { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .tabla-wrap { overflow-x: auto; }
    table.pr { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
    table.pr th { background: var(--artal-blue); color: #fff; font-size: 11px; text-transform: uppercase; padding: 8px 8px; text-align: right; }
    table.pr th.l { text-align: left; }
    table.pr td { padding: 8px; border-bottom: 1px solid #eef1f4; text-align: right; font-variant-numeric: tabular-nums; }
    table.pr td.l { text-align: left; }
    table.pr td.prod { font-weight: bold; color: #334; }
    .itbis-chip { font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 20px; }
    .itbis-chip.si { background: #f3eefb; color: #7d3ac1; } .itbis-chip.no { background: #eef1f4; color: #889; }
    .row-act button { background: transparent; border: none; cursor: pointer; font-size: 14px; color: #c9ced6; } .row-act button:hover { color: var(--artal-blue); } .row-act button.d:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-row { display: flex; align-items: center; gap: 9px; margin: 12px 0 2px; }
    .chk-row input { width: auto; min-height: 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="ventas.html" title="Volver a Ventas">← Ventas</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Listas de Precios</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="nota-citrus">ℹ️ Estas listas alimentan las cotizaciones y están pensadas para <b>mapear a los ítems y precios de Citrus</b> cuando se conecte. La facturación fiscal sigue en Citrus.</div>
    <div class="bar">
        <select id="sel-lista" onchange="render()"></select>
        <button class="btn-o" onclick="abrirLista()">+ Nueva lista</button>
        <button class="btn-y" onclick="abrirItem()">+ Producto</button>
    </div>
    <div id="cab"></div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<datalist id="prod-list"></datalist>
<datalist id="unid-list"></datalist>

<!-- Modal: nueva/editar lista -->
<div class="modal-overlay" id="modal-lista">
    <div class="modal-box">
        <h2 id="lista-title">Nueva lista de precios</h2>
        <label>Nombre *</label>
        <input type="text" id="l-nombre" placeholder="Ej. Pública, Mayorista, Contratista">
        <label>Descripción <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="l-desc" placeholder="Para quién aplica esta lista">
        <div class="chk-row"><input type="checkbox" id="l-publica"><label for="l-publica" style="margin:0">Es la lista pública (catálogo al cliente)</label></div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-lista')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarLista()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal: nuevo/editar producto -->
<div class="modal-overlay" id="modal-item">
    <div class="modal-box">
        <h2 id="item-title">Producto de la lista</h2>
        <label>Producto / servicio *</label>
        <input type="text" id="i-prod" list="prod-list" placeholder="Ej. Ventana corredera E70">
        <div class="grid2">
            <div><label>Unidad</label><input type="text" id="i-unid" list="unid-list" placeholder="m², ud, ml…"></div>
            <div><label>Precio (RD$) *</label><input type="number" id="i-precio" min="0" step="0.01"></div>
        </div>
        <div class="chk-row"><input type="checkbox" id="i-itbis"><label for="i-itbis" style="margin:0">El precio lleva ITBIS (18%)</label></div>
        <label>Nota <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="i-nota" placeholder="Detalle, condición…">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-item')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarItem()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['cotizaciones']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let listas = [], items = [], editListaId = null, editItemId = null;

    onSnapshot(collection(db, 'ventasListasPrecios'), (s) => {
        listas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.activo !== false).sort((a, b) => (b.publica ? 1 : 0) - (a.publica ? 1 : 0) || String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));
        llenarListas(); render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'ventasPrecioItems'), (s) => { items = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    onSnapshot(collection(db, 'productos'), (s) => {
        const nombres = s.docs.map(d => (d.data().nombre || '')).filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));
        document.getElementById('prod-list').innerHTML = nombres.map(n => `<option value="${esc(n)}"></option>`).join('');
    }, () => {});
    onSnapshot(collection(db, 'productosUnidades'), (s) => {
        const u = s.docs.map(d => (d.data().nombre || d.data().abrev || '')).filter(Boolean);
        document.getElementById('unid-list').innerHTML = [...new Set(u)].map(n => `<option value="${esc(n)}"></option>`).join('');
    }, () => {});

    function llenarListas() {
        const sel = document.getElementById('sel-lista'); const cur = sel.value;
        sel.innerHTML = listas.length ? listas.map(l => `<option value="${esc(l.id)}">${esc(l.nombre)}${l.publica ? ' ⭐' : ''}</option>`).join('') : '<option value="">— Sin listas —</option>';
        if (cur && listas.some(l => l.id === cur)) sel.value = cur;
    }
    const listaSel = () => listas.find(l => l.id === document.getElementById('sel-lista').value) || null;
    const itemsLista = (id) => items.filter(i => i.listaId === id);
    const precioConItbis = (i) => i.itbis ? n2(i.precio) * 1.18 : n2(i.precio);

    // ---------- Listas ----------
    window.cerrar = function (id) { document.getElementById(id).classList.remove('show'); };
    window.abrirLista = function () {
        editListaId = null; document.getElementById('lista-title').textContent = 'Nueva lista de precios';
        document.getElementById('l-nombre').value = ''; document.getElementById('l-desc').value = ''; document.getElementById('l-publica').checked = false;
        document.getElementById('modal-lista').classList.add('show');
    };
    window.editarLista = function () {
        const l = listaSel(); if (!l) return;
        editListaId = l.id; document.getElementById('lista-title').textContent = 'Editar lista';
        document.getElementById('l-nombre').value = l.nombre || ''; document.getElementById('l-desc').value = l.descripcion || ''; document.getElementById('l-publica').checked = !!l.publica;
        document.getElementById('modal-lista').classList.add('show');
    };
    window.guardarLista = async function () {
        const nombre = document.getElementById('l-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre de la lista.'); return; }
        const publica = document.getElementById('l-publica').checked;
        const btn = document.querySelector('#modal-lista .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            // Solo una lista puede ser la pública: si se marca esta, se desmarca cualquier otra.
            if (publica) {
                const otras = await getDocs(query(collection(db, 'ventasListasPrecios'), where('publica', '==', true)));
                for (const d of otras.docs) if (d.id !== editListaId) await updateDoc(doc(db, 'ventasListasPrecios', d.id), { publica: false });
            }
            const datos = { nombre, descripcion: document.getElementById('l-desc').value.trim(), publica };
            let id = editListaId;
            if (editListaId) await updateDoc(doc(db, 'ventasListasPrecios', editListaId), datos);
            else { const r = await addDoc(collection(db, 'ventasListasPrecios'), { ...datos, activo: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() }); id = r.id; }
            document.getElementById('sel-lista').value = id;
            cerrar('modal-lista'); render();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.borrarLista = async function () {
        const l = listaSel(); if (!l) return;
        const cuantos = itemsLista(l.id).length;
        if (!confirm('¿Eliminar la lista "' + l.nombre + '"' + (cuantos ? ' y sus ' + cuantos + ' productos' : '') + '?')) return;
        try {
            for (const i of itemsLista(l.id)) await deleteDoc(doc(db, 'ventasPrecioItems', i.id)).catch(() => {});
            await deleteDoc(doc(db, 'ventasListasPrecios', l.id));
        } catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.togglePublica = async function () {
        const l = listaSel(); if (!l) return;
        try {
            if (!l.publica) {
                const otras = await getDocs(query(collection(db, 'ventasListasPrecios'), where('publica', '==', true)));
                for (const d of otras.docs) await updateDoc(doc(db, 'ventasListasPrecios', d.id), { publica: false });
            }
            await updateDoc(doc(db, 'ventasListasPrecios', l.id), { publica: !l.publica });
        } catch (e) { alert('No se pudo: ' + e.message); }
    };

    // ---------- Items ----------
    window.abrirItem = function () {
        if (!listaSel()) { alert('Primero elige (o crea) una lista.'); return; }
        editItemId = null; document.getElementById('item-title').textContent = 'Agregar producto';
        ['i-prod', 'i-unid', 'i-precio', 'i-nota'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('i-itbis').checked = false;
        document.getElementById('modal-item').classList.add('show');
    };
    window.editarItem = function (id) {
        const it = items.find(x => x.id === id); if (!it) return;
        editItemId = id; document.getElementById('item-title').textContent = 'Editar producto';
        document.getElementById('i-prod').value = it.producto || ''; document.getElementById('i-unid').value = it.unidad || '';
        document.getElementById('i-precio').value = it.precio != null ? it.precio : ''; document.getElementById('i-nota').value = it.nota || '';
        document.getElementById('i-itbis').checked = !!it.itbis;
        document.getElementById('modal-item').classList.add('show');
    };
    window.guardarItem = async function () {
        const l = listaSel(); if (!l) return;
        const producto = document.getElementById('i-prod').value.trim(), precio = n2(document.getElementById('i-precio').value);
        if (!producto) { alert('Escribe el producto.'); return; }
        if (precio <= 0) { alert('Escribe el precio.'); return; }
        const datos = { listaId: l.id, producto, unidad: document.getElementById('i-unid').value.trim(), precio, itbis: document.getElementById('i-itbis').checked, nota: document.getElementById('i-nota').value.trim() };
        const btn = document.querySelector('#modal-item .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            if (editItemId) await updateDoc(doc(db, 'ventasPrecioItems', editItemId), datos);
            else await addDoc(collection(db, 'ventasPrecioItems'), { ...datos, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp() });
            cerrar('modal-item');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.borrarItem = async function (id) {
        if (!confirm('¿Eliminar este producto de la lista?')) return;
        try { await deleteDoc(doc(db, 'ventasPrecioItems', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const cont = document.getElementById('lista'), cab = document.getElementById('cab');
        if (!listas.length) { cab.innerHTML = ''; cont.innerHTML = '<p class="empty">No hay listas de precios. Crea una con «+ Nueva lista» (ej. Pública, Mayorista).</p>'; return; }
        const l = listaSel(); if (!l) { cab.innerHTML = ''; cont.innerHTML = '<p class="empty">Elige una lista.</p>'; return; }
        cab.innerHTML = `<div class="lista-head">
            <span class="nom">${esc(l.nombre)}</span>
            ${l.publica ? '<span class="badge-pub">⭐ Pública</span>' : ''}
            ${l.descripcion ? `<span class="lista-desc">${esc(l.descripcion)}</span>` : ''}
            <span style="flex:1"></span>
            <button class="mini pub" onclick="togglePublica()">${l.publica ? 'Quitar pública' : '⭐ Marcar pública'}</button>
            <button class="mini ed" onclick="editarLista()">✏ Editar</button>
            <button class="mini del" onclick="borrarLista()">🗑</button>
        </div>`;

        const lista = itemsLista(l.id).slice().sort((a, b) => String(a.producto || '').localeCompare(String(b.producto || ''), 'es'));
        if (!lista.length) { cont.innerHTML = '<p class="empty">Esta lista no tiene productos. Agrega uno con «+ Producto».</p>'; return; }
        cont.innerHTML = `<div class="tabla-wrap"><table class="pr">
            <thead><tr><th class="l">Producto / servicio</th><th class="l">Unidad</th><th>Precio</th><th>ITBIS</th><th>Precio final</th><th></th></tr></thead>
            <tbody>${lista.map(i => `<tr>
                <td class="l prod">${esc(i.producto)}${i.nota ? ` <span style="font-weight:normal;color:#8a93a0;font-size:11px">· ${esc(i.nota)}</span>` : ''}</td>
                <td class="l">${esc(i.unidad || '')}</td>
                <td>${fmt(i.precio)}</td>
                <td><span class="itbis-chip ${i.itbis ? 'si' : 'no'}">${i.itbis ? '+18%' : 'exento'}</span></td>
                <td><b>${fmt(precioConItbis(i))}</b></td>
                <td class="row-act"><button onclick="editarItem('${i.id}')" title="Editar">✏</button> <button class="d" onclick="borrarItem('${i.id}')" title="Eliminar">🗑</button></td>
            </tr>`).join('')}</tbody>
        </table></div>`;
    }

    render();
</script>

</body>
</html>
