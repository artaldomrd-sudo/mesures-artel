<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Coordinador de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    /* Layout tipo WhatsApp (Dylan 2026-11-02): la página NO hace scroll; el hilo es su propio contenedor con scroll y la caja de
       escribir queda siempre a la vista debajo, sin tapar nada. Así se lee arriba y se escribe abajo sin perder el sitio. */
    html, body { height: 100%; }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }   /* móvil: la barra del navegador no empuja la caja fuera de la pantalla */
    #msg-fab { display: none !important; }   /* aquí estorba: taparía «Enviar»; la banda roja de arriba sigue avisando de mensajes nuevos */
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; }
    main { max-width: 820px; width: 100%; box-sizing: border-box; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0; }
    #hilo { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 2px 12px; overscroll-behavior: contain; }
    #ir-abajo { display: none; position: absolute; right: 18px; bottom: 12px; background: var(--artal-blue, #0A3D62); color: #fff; border: none; border-radius: 100px; padding: 8px 12px; font-family: 'Arimo'; font-weight: bold; font-size: 12.5px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
    #ir-abajo.show { display: block; }
    .hilo-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .barra .b { border: none; border-radius: 10px; padding: 10px 14px; font-weight: bold; font-family: 'Arimo'; font-size: 13.5px; cursor: pointer; min-height: 42px; }
    .b-inf { background: var(--artal-blue, #0A3D62); color: #fff; }
    .b-inf[disabled] { opacity: .6; cursor: wait; }
    .barra select { padding: 9px 10px; border: 1.5px solid #dde3ea; border-radius: 10px; font-family: 'Arimo'; font-size: 13.5px; background: #fff; min-height: 42px; }
    .barra .nota { font-size: 12px; color: #889; }
    .dia { text-align: center; margin: 18px 0 8px; font-size: 12px; color: #889; text-transform: uppercase; letter-spacing: .5px; }
    .burb { max-width: 92%; border-radius: 14px; padding: 10px 14px; margin: 6px 0; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .burb .quien { font-size: 11.5px; color: #889; margin-bottom: 4px; font-weight: bold; white-space: normal; }
    .bot { background: #fff; border-left: 4px solid var(--artal-blue, #0A3D62); margin-right: auto; }
    .bot.informe { border-left-color: #f2c94c; }
    .bot.err { border-left-color: #c0392b; }
    .yo { background: #e7f1fb; margin-left: auto; }
    .estado { font-size: 12px; color: #b9770e; margin: 0 0 6px auto; text-align: right; max-width: 92%; }
    .plegado .cuerpo { max-height: 120px; overflow: hidden; position: relative; }
    .plegado .cuerpo::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, #fff); }
    .ver { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--artal-blue, #0A3D62); font-weight: bold; cursor: pointer; white-space: normal; }
    .burb a { color: var(--artal-blue, #0A3D62); }
    .caja { flex: none; background: rgba(255,255,255,.96); border-top: 1px solid #e3e8ee; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
    .caja .in { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    .caja textarea { flex: 1; min-height: 46px; max-height: 160px; padding: 10px 12px; border: 1.5px solid #cfd8e3; border-radius: 12px; font-family: 'Arimo'; font-size: 15px; resize: vertical; }
    .caja button { background: var(--artal-blue, #0A3D62); color: #fff; border: none; border-radius: 12px; padding: 0 16px; min-height: 46px; font-weight: bold; font-family: 'Arimo'; font-size: 14px; cursor: pointer; }
    .caja .pista { max-width: 820px; margin: 4px auto 0; font-size: 11.5px; color: #889; }
    .empty { color: #889; text-align: center; padding: 30px 10px; }
</style>
</head>
<body>
<header>
    <div class="header-title">
        <a class="btn-back" id="btn-back" href="index.html" title="Volver">← Volver</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Coordinador de Obras</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>
<main>
    <div class="barra">
        <select id="inf-para"><option value="hoy">Informe de hoy</option><option value="manana">Informe de mañana (dejarlo listo)</option></select>
        <button class="b b-inf" id="btn-informe" onclick="hacerInforme()">📝 Hacer informe ahora</button>
        <span class="nota" id="inf-nota">El informe matinal llega solo a las 7:50 (lun–sáb). Aquí lo pides cuando quieras; tarda 1–2 minutos.</span>
    </div>
    <div class="hilo-wrap">
        <div id="hilo"><p class="empty">Cargando la conversación…</p></div>
        <button id="ir-abajo" type="button" onclick="irAbajo()">↓ Ir al final</button>
    </div>
</main>
<div class="caja">
    <div class="in">
        <textarea id="txt" placeholder="Escríbele al Coordinador: haz A2 · envía M1 · anota que PABLO queda en pausa hasta el lunes · mueve Cocoloba al martes 8:00" oninput="draft = this.value"></textarea>
        <button id="btn-enviar" onclick="enviar()">Enviar</button>
    </div>
    <div class="pista" id="pista"></div>
</div>

<script type="module">
    import './mensajeria-widget.js';   // botón ✉️ Mensajes + banda roja de mensajes nuevos (2026-11-02)
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { enableNotifications } from './notifications.js';
    import { db } from './firebase-config.js';
    import { collection, doc, query, where, onSnapshot, addDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    // Una sola conversación con el Coordinador de Obras (IA), 2026-11-01 (Dylan: «cada día entro a la misma; por la mañana recibo el
    // informe y en el día vamos cuadrando»). Lee lo que ya existe: informes (`mensajes` tipo informe_coordinador), mis respuestas
    // (`coordinadorRespuestas`, las procesa coordinadorRespuestaProcesar) y las contestaciones del agente (`mensajes` tipo
    // respuesta_coordinador). Escribir aquí = crear una respuesta anclada al informe más reciente, igual que desde Mensajería.
    // «Hacer informe ahora» llama a la función coordinadorInformeAhora (admin) para hoy o para mañana.
    const FN_INFORME = 'https://us-central1-artal-operaciones.cloudfunctions.net/coordinadorInformeAhora';
    const usuario = await requireAuth([]);   // gerencia; Wilson entra por permiso de página cuando Dylan lo decida (las reglas ya le dejan leer y responder)
    const esAdmin = usuario.roles.includes('admin');
    const miEmail = String(usuario.email || '').trim().toLowerCase();
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));
    wireBackButton(usuario.roles);
    if (!esAdmin) document.getElementById('btn-informe').style.display = 'none';
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    const ms = (v) => v && typeof v.toDate === 'function' ? v.toDate().getTime() : (v ? new Date(v).getTime() || 0 : 0);
    const hora = (v) => ms(v) ? new Date(ms(v)).toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' }) : '';
    const diaTxt = (v) => { const d = new Date(ms(v)); const hoy = new Date(); const ayer = new Date(Date.now() - 86400000); const f = (x) => x.toDateString();
        return f(d) === f(hoy) ? 'Hoy' : f(d) === f(ayer) ? 'Ayer' : d.toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long' }); };
    const sanitKey = (e) => String(e || '').toLowerCase().replace(/[.@]/g, '_');

    let mensajes = [], respuestas = [], draft = '', abiertos = new Set();
    window.draft = '';
    const qMsg = esAdmin ? query(collection(db, 'mensajes'), where('tipo', 'in', ['informe_coordinador', 'respuesta_coordinador']))
                         : query(collection(db, 'mensajes'), where('destinatarios', 'array-contains', miEmail));
    onSnapshot(qMsg, (s) => { mensajes = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.tipo === 'informe_coordinador' || m.tipo === 'respuesta_coordinador'); render(); },
        (e) => { document.getElementById('hilo').innerHTML = `<p class="empty">No se pudo leer: ${esc(e.code || e.message)}</p>`; });
    const qResp = esAdmin ? collection(db, 'coordinadorRespuestas') : query(collection(db, 'coordinadorRespuestas'), where('destinatariosInforme', 'array-contains', miEmail));
    onSnapshot(qResp, (s) => { respuestas = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => { respuestas = []; });

    const informes = () => mensajes.filter(m => m.tipo === 'informe_coordinador').sort((a, b) => ms(a.fecha) - ms(b.fecha));
    const ultimoInforme = () => informes().slice(-1)[0] || null;

    let primeraVez = true, pegadoAbajo = true;   // si el usuario subió a leer, un mensaje nuevo NO lo arrastra abajo: se le ofrece «↓ Ir al final»
    const hiloEl = document.getElementById('hilo');
    hiloEl.addEventListener('scroll', () => { pegadoAbajo = hiloEl.scrollHeight - hiloEl.scrollTop - hiloEl.clientHeight < 80; document.getElementById('ir-abajo').classList.toggle('show', !pegadoAbajo); });
    window.irAbajo = () => { hiloEl.scrollTop = hiloEl.scrollHeight; };
    function render() {
        const infs = informes(); const ult = ultimoInforme();
        const bots = mensajes.filter(m => m.tipo === 'respuesta_coordinador');
        const contestadas = new Set(bots.map(b => b.respuestaId).filter(Boolean));
        const items = [
            ...infs.map(m => ({ t: ms(m.fecha), k: 'informe', m })),
            ...respuestas.map(r => ({ t: ms(r.fecha) || Date.now(), k: 'yo', r })),
            ...bots.map(m => ({ t: ms(m.fecha), k: 'bot', m })),
        ].sort((a, b) => a.t - b.t).slice(-200);   // la conversación es una sola; se muestran los últimos 200 mensajes
        let html = '', diaPrev = '';
        items.forEach(it => {
            const d = diaTxt(it.t); if (d !== diaPrev) { html += `<div class="dia">${esc(d)}</div>`; diaPrev = d; }
            if (it.k === 'informe') {
                const m = it.m, abierto = abiertos.has(m.id) || m.id === (ult && ult.id);
                html += `<div class="burb bot informe ${abierto ? '' : 'plegado'}" id="m-${m.id}"><div class="quien">🗓️ ${esc(m.asunto || 'Informe matinal')} · ${esc(hora(m.fecha))}${m.generadoPor === 'cloud-function' ? '' : ''}</div><div class="cuerpo">${linkify(m.cuerpo || '')}</div>${abierto ? '' : `<span class="ver" onclick="abrirInforme('${m.id}')">Ver el informe completo ▾</span>`}</div>`;
            } else if (it.k === 'yo') {
                const r = it.r; const pend = (r.estado === 'pendiente' || r.estado === 'procesando') && !contestadas.has(r.id);
                html += `<div class="burb yo"><div class="quien">${esc(r.por || 'Tú')} · ${esc(hora(r.fecha))}</div>${esc(r.texto || '')}</div>`;
                if (pend) html += `<div class="estado">⏳ El Coordinador está trabajando en esto (suele tardar menos de un minuto)…</div>`;
                else if ((r.estado === 'error' || r.estado === 'rechazada') && !contestadas.has(r.id)) html += `<div class="estado">${r.estado === 'error' ? '⚠️ Hubo un error' : '⛔ No pudo atenderlo'}${r.resultado ? ': ' + esc(r.resultado).slice(0, 300) : ''}</div>`;
            } else {
                const m = it.m;
                html += `<div class="burb bot ${m.error ? 'err' : ''}"><div class="quien">🤖 ${esc(m.remitenteNombre || 'Coordinador de Obras')} · ${esc(hora(m.fecha))}${m.acciones ? ` · ${m.acciones} acción${m.acciones === 1 ? '' : 'es'}` : ''}</div>${linkify(m.cuerpo || '')}</div>`;
            }
        });
        const hilo = document.getElementById('hilo');
        hilo.innerHTML = html || '<p class="empty">Todavía no hay informes. Pide uno con «Hacer informe ahora».</p>';
        document.getElementById('pista').textContent = ult ? `Tu mensaje se responde sobre el informe más reciente (${ult.asunto || ''}). El Coordinador ejecuta lo que puede solo y te cuenta aquí lo que hizo.` : 'Primero hace falta un informe.';
        if (html && (primeraVez || pegadoAbajo)) { requestAnimationFrame(() => { hilo.scrollTop = hilo.scrollHeight; }); primeraVez = false; }
        // Estar en la conversación = leer: se marca el acuse de TODO lo que se ve (informes y contestaciones del agente), así el
        // badge y la banda roja de Mensajería no avisan de lo que ya tienes delante (Dylan 2026-11-02).
        if (!usuario.esEspejo && document.visibilityState === 'visible') mensajes.forEach(m => acusar(m));
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
    window.abrirInforme = (id) => { abiertos.add(id); render(); };

    // Acuse de lectura (lo mismo que hace Mensajería), para que el badge y los contadores cuadren. Solo lo que es para mí.
    const acusados = new Set();
    async function acusar(m) {
        const k = sanitKey(miEmail); if (acusados.has(m.id) || (m.acuses && m.acuses[k] && m.acuses[k].leido)) { acusados.add(m.id); return; }
        if (!(m.paraTodos === true || (Array.isArray(m.destinatarios) && m.destinatarios.map(x => String(x).toLowerCase()).includes(miEmail)))) { acusados.add(m.id); return; }
        acusados.add(m.id);
        try { await updateDoc(doc(db, 'mensajes', m.id), { ['acuses.' + k]: { leido: true, fecha: new Date().toISOString(), nombre: usuario.nombre, email: miEmail } }); } catch (_) { }
    }

    window.enviar = async () => {
        const ta = document.getElementById('txt'); const texto = (ta.value || '').trim(); const m = ultimoInforme();
        if (!m) { alert('Todavía no hay un informe al que responder. Pide uno con «Hacer informe ahora».'); return; }
        if (!texto) return; if (texto.length > 3900) { alert('Demasiado largo: máximo 3900 caracteres.'); return; }
        if (usuario.esEspejo) { alert('Vista espejo: solo lectura.'); return; }
        const btn = document.getElementById('btn-enviar'); btn.disabled = true;
        try {
            await addDoc(collection(db, 'coordinadorRespuestas'), {
                informeId: m.id, informeAsunto: m.asunto || '', texto, por: usuario.nombre, porEmail: miEmail,
                fecha: serverTimestamp(), estado: 'pendiente', destinatariosInforme: Array.isArray(m.destinatarios) ? m.destinatarios : []
            });
            ta.value = ''; window.draft = ''; pegadoAbajo = true; setTimeout(() => { hiloEl.scrollTop = hiloEl.scrollHeight; }, 300);
        } catch (e) { alert('No se pudo enviar: ' + (e && e.message ? e.message : e)); } finally { btn.disabled = false; }
    };
    document.getElementById('txt').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(160, e.target.scrollHeight) + 'px'; });
    document.getElementById('txt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); window.enviar(); } });

    window.hacerInforme = async () => {
        const para = document.getElementById('inf-para').value;
        const d = new Date(); if (para === 'manana') d.setDate(d.getDate() + 1);
        const p = (n) => String(n).padStart(2, '0'); const fecha = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        const yaHay = informes().some(m => String(m.asunto || '').includes(d.toLocaleDateString('es-DO', { day: 'numeric' }) + ' de ' + d.toLocaleDateString('es-DO', { month: 'long' })));
        if (yaHay && !confirm('Ya hay un informe para esa fecha. ¿Generar otro con los datos de ahora?')) return;
        const btn = document.getElementById('btn-informe'); btn.disabled = true; btn.textContent = '⏳ Preparando el informe…';
        document.getElementById('inf-nota').textContent = 'Leyendo el panel, el clima y el informe anterior. Aparece aquí abajo cuando esté (1–2 minutos).';
        try {
            const token = await auth.currentUser.getIdToken();
            const r = await fetch(FN_INFORME, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ fecha, forzar: true }) });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
            document.getElementById('inf-nota').textContent = 'Informe publicado. Si no aparece en unos segundos, recarga la página.';
            pegadoAbajo = true; setTimeout(() => { hiloEl.scrollTop = hiloEl.scrollHeight; }, 1500);
        } catch (e) {
            document.getElementById('inf-nota').textContent = 'No se pudo generar: ' + (e.message || e);
        } finally { btn.disabled = false; btn.textContent = '📝 Hacer informe ahora'; }
    };
</script>
</body>
</html>
