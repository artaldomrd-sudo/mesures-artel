<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Trabajo en Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    .order-card { border-left-color: #9b59b6; }
    .btn-instalado { background: #9b59b6; color: #fff; }
    .checklist-note { font-size: 12.5px; color: #e67e22; margin-top: 8px; font-weight: bold; }
    .aprobacion-form { margin-top: 12px; padding: 12px; background: var(--artal-light); border-radius: 8px; display: none; }
    .aprobacion-form label { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); display: block; margin-bottom: 4px; }
    .aprobacion-form input[type="text"] { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; min-height: 42px; }
    .signature-canvas { width: 100%; max-width: 320px; height: 130px; border: 1.5px solid #ddd; border-radius: 7px; background: #fff; touch-action: none; display: block; }
    .signature-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .signature-row button { background: transparent; border: 1.5px solid #ccc; color: #666; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: 'Arimo'; }
    .sec-title { font-size: 15px; color: var(--artal-blue); margin: 0 0 10px; font-weight: bold; }
    #agenda-section { margin-bottom: 24px; }
    .ag-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid #3498db; padding: 12px 14px; margin-bottom: 10px; }
    .ag-card.estado-en_proceso { border-left-color: #f39c12; }
    .ag-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .ag-head b { color: var(--artal-blue); }
    .ag-fecha { font-size: 12.5px; color: #444; font-weight: bold; white-space: nowrap; }
    .ag-meta { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.5; }
    .ag-badge { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; color: #fff; background: #3498db; }
    .ag-badge.en_proceso { background: #f39c12; }
    .ag-navrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .ag-nav { font-size: 12.5px; font-weight: bold; text-decoration: none; padding: 8px 13px; border-radius: 7px; background: var(--artal-light); color: var(--artal-blue); }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver al panel">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Trabajo en Obra</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <section id="agenda-section">
        <h2 class="sec-title">🗓️ Mi agenda de instalación</h2>
        <div id="agenda-list"><p class="empty">Cargando…</p></div>
    </section>
    <h2 class="sec-title">🔧 Obras listas para instalar</h2>
    <div id="orders-list"><p class="empty">Cargando…</p></div>
</main>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { enableNotifications } from './notifications.js';
    import { db } from './firebase-config.js';
    import { collection, query, where, onSnapshot, doc, updateDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { openOrderPreview } from './order-preview.js';
    import { setupSignaturePad } from './signature.js';
    window.openOrderPreview = openOrderPreview;

    const usuario = await requireAuth(['instalador', 'ayudante']);
    wireBackButton(usuario.roles);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function checklistResuelto(o) {
        const items = o.items || [];
        if (!items.length) return true;
        const status = o.itemStatusInstalador || {};
        return items.every(it => status[it.id] && status[it.id].estado);
    }

    function itemsFaltantes(o) {
        const items = o.items || [];
        const status = o.itemStatusInstalador || {};
        return items.filter(it => !(status[it.id] && status[it.id].estado)).length;
    }

    function orderCardHTML(id, o) {
        const resuelto = checklistResuelto(o);
        const faltan = itemsFaltantes(o);
        const esCompra = o.docType === 'COMPRA_DIRECTA';
        const esParcial = o.status === 'parcialmente_listo';
        const metaLine = esCompra
            ? `Compra directa · Proveedor: ${esc(o.proveedor)} · ${esc(o.totalItems) || 0} artículo(s) · <a href="${esc(o.compraPdfUrl)}" target="_blank">Ver orden de compra</a>`
            : `${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems · <a href="#" onclick="openOrderPreview('${id}', 'instalador'); return false;">Ver hoja de fabricación</a>`;
        return `
        <div class="order-card" ${esParcial ? 'style="border-left-color:#e67e22;"' : ''}>
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
            </div>
            <div class="order-meta">
                ${metaLine}
                ${o.asignadoInstaladorNombre ? ' · 👤 Asignado a ' + esc(o.asignadoInstaladorNombre) : ''}
            </div>
            ${esParcial ? `<div class="checklist-note" style="color:#e67e22;">⚠ Pedido PARCIAL — no todos los ítems están listos. Abre "Ver hoja" para ver cuáles sí, marcados en verde.</div>` : ''}
            ${resuelto ? '' : `<div class="checklist-note">⚠ Faltan ${faltan} ítem(s) por completar en el checklist. Ábrelo en "Ver hoja de fabricación" y marca las etapas de cada ítem.</div>`}
            <div class="actions">
                <button class="btn-instalado" ${resuelto ? '' : 'disabled style="opacity:0.5;cursor:default;"'} onclick="${resuelto ? `abrirAprobacion('${id}')` : ''}">✅ Registrar instalación (firma)</button>
                ${esCompra ? '' : `<button class="btn-deshacer" onclick="regresarAFabrica('${id}')" title="Aún no está listo, regresar a fábrica">↩ No está listo</button>`}
            </div>
            <div class="aprobacion-form" id="aprobacion-${id}">
                <label>Nombre del cliente</label>
                <input type="text" id="aprobacion-nombre-${id}" placeholder="Nombre completo">
                <label>Firma del cliente</label>
                <canvas class="signature-canvas" id="firma-${id}" width="320" height="130"></canvas>
                <div class="signature-row">
                    <button type="button" onclick="limpiarFirma('${id}')">Borrar firma</button>
                </div>
                <button class="btn-instalado" style="margin-top:10px;" onclick="confirmarInstalacion('${id}')">Confirmar instalación</button>
            </div>
        </div>`;
    }

    let signaturePads = {};

    function render(docs) {
        const list = document.getElementById('orders-list');
        // La asignación (ver historial.html) es solo informativa: cualquier instalador ve todos
        // los pedidos, así uno puede cubrir al otro si falta.
        // Las Compra Directa (docType COMPRA_DIRECTA) NO se instalan: son artículos comprados ya
        // hechos que solo se recogen/entregan — van únicamente al chofer, no a esta pantalla. Si
        // alguna compra puntual necesitara instalarse, se agenda desde Instalaciones (gerencia).
        const pendientes = docs.filter(d => !d.data().instalado && d.data().docType !== 'COMPRA_DIRECTA');
        signaturePads = {};
        if (!pendientes.length) { list.innerHTML = '<p class="empty">No hay obras listas para instalar.</p>'; return; }
        list.innerHTML = pendientes.map(d => orderCardHTML(d.id, d.data())).join('');
        pendientes.forEach(d => {
            const canvas = document.getElementById('firma-' + d.id);
            if (canvas) signaturePads[d.id] = setupSignaturePad(canvas);
        });
    }

    const q = query(collection(db, 'orders'), where('status', 'in', ['listo_para_cargar', 'parcialmente_listo']));
    onSnapshot(q, (snap) => render(snap.docs), (err) => {
        document.getElementById('orders-list').innerHTML = '<p class="empty">Error cargando pedidos: ' + err.message + '</p>';
    });

    // ---------- Mi agenda de instalación (colección `instalaciones`) ----------
    // Muestra, arriba de las obras, los trabajos agendados a ESTE instalador (fecha + GPS +
    // estado). Los cambios de estado/fotos siguen viviendo en Agenda de Instalación
    // (instalaciones.html), que audita cada cambio; aquí es una vista de consulta + navegación.
    function parseGps(input) {
        if (!input) return null;
        const s = String(input).trim();
        const m = s.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
        if (m) return { lat: m[1], lng: m[2] };
        if (/^https?:\/\//i.test(s)) return { url: s };
        return null;
    }
    const wazeUrl = (g) => `https://waze.com/ul?ll=${g.lat},${g.lng}&navigate=yes`;
    const mapsUrl = (g) => g.url ? g.url : `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}`;
    const AG_ESTADO = { pendiente: 'Pendiente', en_proceso: 'En proceso', completado: 'Completado' };

    // Asignada a mí: por email en asignados[] (varios instaladores) o el campo singular heredado.
    function agendaMia(j) {
        const email = usuario.email;
        if (Array.isArray(j.asignados) && j.asignados.length) return j.asignados.some(a => a && a.email === email);
        return j.instaladorEmail === email;
    }
    const agFecha = (j) => (j.fecha && j.fecha.toDate) ? j.fecha.toDate() : null;
    function agFechaTxt(j) {
        const ini = agFecha(j);
        if (!ini) return j.estado === 'en_proceso' ? '🔧 En curso' : '📋 Sin fecha';
        const fin = (j.fechaFin && j.fechaFin.toDate) ? j.fechaFin.toDate() : null;
        const fD = (d) => d.toLocaleDateString('es-DO', { weekday: 'short', day: 'numeric', month: 'short' });
        if (j.modoFecha === 'rango') return fin ? `${fD(ini)} → ${fD(fin)}` : `Desde ${fD(ini)}`;
        return `${fD(ini)} · ${ini.toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' })}`;
    }

    function agendaCardHTML(j) {
        const lugar = [j.cliente, j.obra].filter(Boolean).join(' — ');
        const g = parseGps(j.gps);
        const estado = j.estado || 'pendiente';
        let nav = '';
        if (g) {
            const b = [];
            if (g.lat) b.push(`<a class="ag-nav" href="${wazeUrl(g)}" target="_blank" rel="noopener">🚗 Waze</a>`);
            b.push(`<a class="ag-nav" href="${mapsUrl(g)}" target="_blank" rel="noopener">📍 Maps</a>`);
            nav = `<div class="ag-navrow">${b.join('')}</div>`;
        }
        return `
        <div class="ag-card estado-${estado}">
            <div class="ag-head">
                <b>${esc(lugar) || 'Sin cliente'}</b>
                <span class="ag-fecha">${esc(agFechaTxt(j))}</span>
            </div>
            <div class="ag-meta">
                <span class="ag-badge ${estado}">${esc(AG_ESTADO[estado] || estado)}</span>
                ${j.direccion ? ' · 📌 ' + esc(j.direccion) : ''}
                ${j.notas ? '<br>' + esc(j.notas) : ''}
                ${j.orderId ? `<br><a href="#" onclick="openOrderPreview('${j.orderId}', 'instalador'); return false;">Ver hoja de fabricación</a>` : ''}
            </div>
            ${nav}
        </div>`;
    }

    onSnapshot(collection(db, 'instalaciones'), (snap) => {
        const list = document.getElementById('agenda-list');
        const mias = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(j => agendaMia(j) && (j.estado || 'pendiente') !== 'completado');
        // Primero las que tienen fecha (ascendente), luego las sin fecha.
        mias.sort((a, b) => {
            const da = agFecha(a), db_ = agFecha(b);
            if (da && db_) return da - db_;
            if (da) return -1;
            if (db_) return 1;
            return 0;
        });
        list.innerHTML = mias.length
            ? mias.map(agendaCardHTML).join('')
            : '<p class="empty">No tienes instalaciones agendadas.</p>';
    }, (err) => {
        document.getElementById('agenda-list').innerHTML = '<p class="empty">Error cargando la agenda: ' + esc(err.message) + '</p>';
    });

    window.abrirAprobacion = function (id) {
        const form = document.getElementById('aprobacion-' + id);
        if (form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
    };

    window.limpiarFirma = function (id) {
        if (signaturePads[id]) signaturePads[id].clear();
    };

    window.confirmarInstalacion = async function (id) {
        const nombre = document.getElementById('aprobacion-nombre-' + id).value.trim();
        const pad = signaturePads[id];
        if (!nombre) { alert('Escribe el nombre del cliente.'); return; }
        if (!pad || pad.isEmpty()) { alert('Falta la firma del cliente.'); return; }

        const snap = await getDoc(doc(db, 'orders', id));
        const yaEntregado = snap.exists() && snap.data().entregado === true;
        await updateDoc(doc(db, 'orders', id), {
            instalado: true,
            fechaInstalado: serverTimestamp(),
            clienteAprobacion: { nombre, firma: pad.toDataUrl(), fecha: serverTimestamp() },
            ...(yaEntregado ? { status: 'completado' } : {})
        });
    };
    window.regresarAFabrica = async function (id) {
        if (!confirm('¿Regresar este pedido a fábrica? Desaparecerá de la lista de instalación y de la del chofer hasta que fábrica lo vuelva a dejar listo.')) return;
        await updateDoc(doc(db, 'orders', id), { status: 'en_fabrica' });
    };
</script>

</body>
</html>
