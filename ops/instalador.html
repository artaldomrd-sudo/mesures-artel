<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Trabajo en Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    /* Tres tipos, cada uno con su color: 🔔 recordatorio (naranja), 📌 trabajo asignado /
       agenda (azul), 🏗️ obra lista para instalar (morado). */
    main section { margin-bottom: 26px; }
    .sec-title { font-size: 15px; margin: 0 0 10px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .sec-title::before { content: ''; width: 5px; height: 18px; border-radius: 3px; display: inline-block; }
    .sec-title.rec { color: #d35400; }
    .sec-title.rec::before { background: #e67e22; }
    .sec-title.ag { color: #1f6aa5; }
    .sec-title.ag::before { background: #3498db; }
    .sec-title.obra { color: #7d3c98; }
    .sec-title.obra::before { background: #9b59b6; }

    .pill-mia { display: inline-block; background: #2ecc71; color: #fff; font-size: 10.5px; font-weight: bold; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
    .sin-asignar { color: #c0392b; font-weight: bold; }

    /* Recordatorio (naranja) */
    .rec-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid #e67e22; padding: 12px 14px; margin-bottom: 10px; }
    .rec-card .rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .rec-card .rec-head b { color: #d35400; }
    .rec-fecha { font-size: 12.5px; color: #444; font-weight: bold; white-space: nowrap; }
    .rec-meta { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.5; }

    /* Trabajo asignado / agenda (azul) */
    .ag-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid #3498db; padding: 12px 14px; margin-bottom: 10px; }
    .ag-card.estado-en_proceso { border-left-color: #f39c12; }
    .ag-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .ag-head b { color: #1f6aa5; }
    .ag-fecha { font-size: 12.5px; color: #444; font-weight: bold; white-space: nowrap; }
    .ag-meta { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.5; }
    .ag-badge { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; color: #fff; background: #3498db; }
    .ag-badge.en_proceso { background: #f39c12; }
    .ag-navrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .ag-nav { font-size: 12.5px; font-weight: bold; text-decoration: none; padding: 8px 13px; border-radius: 7px; background: var(--artal-light); color: var(--artal-blue); }

    /* Obra lista para instalar (morado) */
    .order-card { border-left-color: #9b59b6; }
    .btn-instalado { background: #9b59b6; color: #fff; }
    .btn-parcial { background: #e67e22; color: #fff; }
    .checklist-note { font-size: 12.5px; color: #e67e22; margin-top: 8px; font-weight: bold; }
    .esperando-note { font-size: 12.5px; color: #c0392b; margin-top: 8px; font-weight: bold; }
    .aprobacion-form { margin-top: 12px; padding: 12px; background: var(--artal-light); border-radius: 8px; display: none; }
    .aprobacion-form label { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); display: block; margin-bottom: 4px; }
    .aprobacion-form input[type="text"] { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; min-height: 42px; }
    .signature-canvas { width: 100%; max-width: 320px; height: 130px; border: 1.5px solid #ddd; border-radius: 7px; background: #fff; touch-action: none; display: block; }
    .signature-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .signature-row button { background: transparent; border: 1.5px solid #ccc; color: #666; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; font-family: 'Arimo'; }

    /* Botón "+ Agregar" por sección y controles rápidos en las tarjetas */
    .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 10px; }
    .sec-head .sec-title { margin: 0; }
    .btn-add { background: var(--artal-blue); color: #fff; border: none; border-radius: 7px; padding: 8px 12px; font-size: 12.5px; font-weight: bold; font-family: 'Arimo'; cursor: pointer; white-space: nowrap; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .card-actions select { padding: 7px 9px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 12.5px; }
    .mini-btn { border: 1.5px solid #ddd; background: #fff; color: #555; border-radius: 7px; padding: 7px 11px; font-size: 12.5px; font-family: 'Arimo'; cursor: pointer; }
    .reprog-row { display: none; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .reprog-row input { padding: 8px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 13px; }

    /* Modal (propio de esta pantalla; shared.css no lo trae) */
    .modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-ov.show { display: flex; }
    .modal-bx { background: #fff; border-radius: var(--radius); padding: 18px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
    .modal-bx h2 { font-size: 16px; color: var(--artal-blue); margin: 0 0 12px; }
    .modal-bx label { font-size: 12.5px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-bx input, .modal-bx textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; box-sizing: border-box; min-height: 42px; }
    .modal-bx textarea { min-height: 58px; }
    .modal-acts { display: flex; gap: 10px; margin-top: 16px; }
    .modal-acts button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-family: 'Arimo'; font-size: 14px; cursor: pointer; }
    .modal-acts .cancelar { background: #eee; color: #555; }
    .modal-acts .guardar { background: var(--artal-blue); color: #fff; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver al panel">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Trabajo en Obra</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <section>
        <div class="sec-head">
            <h2 class="sec-title rec">🔔 Recordatorios</h2>
            <button class="btn-add" onclick="abrirModalRec()">+ Recordatorio</button>
        </div>
        <div id="rec-list"><p class="empty">Cargando…</p></div>
    </section>
    <section>
        <div class="sec-head">
            <h2 class="sec-title ag">📌 Trabajos asignados (agenda)</h2>
            <button class="btn-add" onclick="abrirModalTrabajo()">+ Trabajo</button>
        </div>
        <div id="agenda-list"><p class="empty">Cargando…</p></div>
    </section>
    <section>
        <h2 class="sec-title obra">🏗️ Obras listas para instalar</h2>
        <div id="orders-list"><p class="empty">Cargando…</p></div>
    </section>
</main>

<!-- Modal: nuevo recordatorio (colección citas) -->
<div class="modal-ov" id="modal-rec">
    <div class="modal-bx">
        <h2>🔔 Nuevo recordatorio</h2>
        <label>¿Qué hay que recordar?</label>
        <input type="text" id="rec-titulo" placeholder="Ej: Llamar al cliente antes de ir">
        <label>Fecha y hora (opcional)</label>
        <input type="datetime-local" id="rec-fecha">
        <label>Nota (opcional)</label>
        <textarea id="rec-nota" placeholder="Detalles…"></textarea>
        <div class="modal-acts">
            <button class="cancelar" onclick="cerrarModalRec()">Cancelar</button>
            <button class="guardar" onclick="guardarRec()">Guardar</button>
        </div>
    </div>
</div>

<!-- Modal: nuevo trabajo (colección instalaciones) -->
<div class="modal-ov" id="modal-trabajo">
    <div class="modal-bx">
        <h2>📌 Nuevo trabajo</h2>
        <label>Cliente</label>
        <input type="text" id="tr-cliente" placeholder="Nombre del cliente">
        <label>Obra / Ubicación</label>
        <input type="text" id="tr-obra" placeholder="Obra o dirección">
        <label>Dirección / referencia (opcional)</label>
        <input type="text" id="tr-direccion" placeholder="Cómo llegar">
        <label>GPS (opcional — coordenadas o link de Maps)</label>
        <input type="text" id="tr-gps" placeholder="18.47, -69.89 o link">
        <label>Fecha y hora (opcional)</label>
        <input type="datetime-local" id="tr-fecha">
        <label>Nota (opcional)</label>
        <textarea id="tr-nota" placeholder="Detalles…"></textarea>
        <div class="modal-acts">
            <button class="cancelar" onclick="cerrarModalTrabajo()">Cancelar</button>
            <button class="guardar" onclick="guardarTrabajo()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { enableNotifications } from './notifications.js';
    import { db } from './firebase-config.js';
    import { collection, query, where, onSnapshot, doc, updateDoc, getDoc, addDoc, deleteDoc, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { openOrderPreview } from './order-preview.js';
    import { setupSignaturePad } from './signature.js';
    import { fotosThumbsHTML, fotoAddBtnHTML } from './fotos.js';
    window.openOrderPreview = openOrderPreview;

    const usuario = await requireAuth(['instalador', 'ayudante']);
    wireBackButton(usuario.roles);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Nombres asignados a un doc (agenda o cita): soporta el array asignados[] (varias personas)
    // y el par singular heredado. Devuelve [] si no hay nadie asignado.
    function nombresAsignados(d) {
        if (Array.isArray(d.asignados) && d.asignados.length) return d.asignados.map(a => a && a.nombre).filter(Boolean);
        if (d.instaladorNombre || d.asignadoNombre) return [d.instaladorNombre || d.asignadoNombre];
        return [];
    }
    function asignadaAMi(d) {
        const email = usuario.email;
        if (Array.isArray(d.asignados) && d.asignados.length) return d.asignados.some(a => a && a.email === email);
        return d.instaladorEmail === email || d.asignadoEmail === email;
    }
    // Etiqueta de asignación para la tarjeta (a quién le toca). Nunca oculta un trabajo por no
    // estar asignado a mí: si no hay nadie, se marca "sin asignar" en rojo para que se agende.
    function asignadoTxt(d) {
        const noms = nombresAsignados(d);
        if (!noms.length) return '<span class="sin-asignar">⚠ Sin asignar</span>';
        return '🔧 ' + noms.map(esc).join(', ') + (asignadaAMi(d) ? '<span class="pill-mia">Para ti</span>' : '');
    }

    const fD = (d) => d.toLocaleDateString('es-DO', { weekday: 'short', day: 'numeric', month: 'short' });
    const fHora = (d) => d.toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' });

    /* ============ 🔔 RECORDATORIOS (colección `citas`) ============ */
    // Muestra los avisos/citas dirigidos al equipo de instalación (asignadoA:'instalador'),
    // creados desde el Calendario por gerencia. Se muestran TODOS los del equipo (no solo los
    // míos) para que nada quede oculto si se olvidan de marcar a la persona.
    function recFechaTxt(c) {
        const f = (c.fecha && c.fecha.toDate) ? c.fecha.toDate() : null;
        if (!f) return '';
        return `${fD(f)} · ${fHora(f)}`;
    }
    // Una fila del checklist (etapa o persona) — mismo criterio que el Calendario: al marcar una,
    // el recordatorio NO desaparece para las demás; solo cierra cuando todas están hechas.
    function recEtapaRow(hecha, titulo, nombre, fnCall) {
        const sub = nombre ? ` <span style="color:#889;font-size:12px">· ${esc(nombre)}</span>` : '';
        const btn = hecha
            ? `<button class="mini-btn" style="border-color:var(--artal-blue);color:var(--artal-blue)" onclick="${fnCall}">↩ Reabrir</button>`
            : `<button class="mini-btn" onclick="${fnCall}">✓ Hecho</button>`;
        return `<div style="display:flex;align-items:center;gap:8px;background:${hecha ? '#eafaf0' : '#f6f8fb'};border:1px solid ${hecha ? '#bfe8cd' : '#e6ecf3'};border-radius:8px;padding:6px 9px;margin-top:5px;font-size:13px">
            <span style="${hecha ? 'text-decoration:line-through;color:#7a8a99' : ''}">${esc(titulo)}</span>${sub}
            <span style="margin-left:auto">${btn}</span></div>`;
    }
    function recCardHTML(c) {
        const icono = c.tipo === 'cita' ? '📅' : '🔔';
        const lugar = [c.cliente, c.obra].filter(Boolean).join(' — ');
        const et = Array.isArray(c.etapas) ? c.etapas : [];
        const asg = Array.isArray(c.asignados) ? c.asignados : [];
        const cp = Array.isArray(c.completadoPor) ? c.completadoPor : [];
        let checklist = '';
        if (et.length) {
            checklist = et.map((e, i) => recEtapaRow(!!e.hecha, e.titulo || 'Tarea', e.nombre || '', `completarEtapaRec('${c.id}',${i})`)).join('');
        } else if (asg.length > 1) {
            checklist = asg.map(p => recEtapaRow(cp.includes(p.email), p.nombre || p.email, '', `asistioRecPersona('${c.id}','${p.email}')`)).join('');
        }
        const acciones = checklist
            ? `<button class="mini-btn" onclick="borrarRec('${c.id}')">🗑</button>`
            : `<button class="mini-btn" onclick="marcarRecHecho('${c.id}')">✓ Hecho</button>
               <button class="mini-btn" onclick="borrarRec('${c.id}')">🗑</button>`;
        return `
        <div class="rec-card">
            <div class="rec-head">
                <b>${icono} ${esc(c.titulo) || 'Recordatorio'}</b>
                <span class="rec-fecha">${esc(recFechaTxt(c))}</span>
            </div>
            <div class="rec-meta">
                ${asignadoTxt(c)}
                ${lugar ? '<br>📍 ' + esc(lugar) : ''}
                ${c.descripcion ? '<br>' + esc(c.descripcion) : ''}
            </div>
            ${checklist}
            ${fotosThumbsHTML(c.fotos, { coleccion: 'citas', id: c.id, puedeBorrar: true })}
            ${fotoAddBtnHTML({ coleccion: 'citas', id: c.id, pdf: true })}
            <div class="card-actions">
                ${acciones}
            </div>
        </div>`;
    }
    let recsCache = [];
    onSnapshot(query(collection(db, 'citas'), where('asignadoA', '==', 'instalador')), (snap) => {
        const list = document.getElementById('rec-list');
        const recs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.completada !== true);
        recsCache = recs;
        recs.sort((a, b) => {
            const fa = (a.fecha && a.fecha.toDate) ? a.fecha.toDate() : null;
            const fb = (b.fecha && b.fecha.toDate) ? b.fecha.toDate() : null;
            if (fa && fb) return fa - fb;
            if (fa) return -1; if (fb) return 1; return 0;
        });
        list.innerHTML = recs.length ? recs.map(recCardHTML).join('') : '<p class="empty">No hay recordatorios.</p>';
    }, (err) => {
        document.getElementById('rec-list').innerHTML = '<p class="empty">Error cargando recordatorios: ' + esc(err.message) + '</p>';
    });

    /* ============ 📌 TRABAJOS ASIGNADOS / AGENDA (colección `instalaciones`) ============ */
    // Se muestran TODAS las instalaciones no completadas (asignadas o no), para que nunca quede
    // la pantalla en blanco por un trabajo sin asignar. Los cambios de estado/fotos siguen en
    // Agenda de Instalación (instalaciones.html), que audita cada cambio.
    function parseGps(input) {
        if (!input) return null;
        const s = String(input).trim();
        const m = s.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
        if (m) return { lat: m[1], lng: m[2] };
        if (/^https?:\/\//i.test(s)) return { url: s };
        return null;
    }
    const wazeUrl = (g) => `https://waze.com/ul?ll=${g.lat},${g.lng}&navigate=yes`;
    const mapsUrl = (g) => g.url ? g.url : `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}`;
    const AG_ESTADO = { pendiente: 'Pendiente', en_proceso: 'En proceso', completado: 'Completado' };

    const agFecha = (j) => (j.fecha && j.fecha.toDate) ? j.fecha.toDate() : null;
    function agFechaTxt(j) {
        const ini = agFecha(j);
        if (!ini) return j.estado === 'en_proceso' ? '🔧 En curso' : '📋 Sin fecha';
        const fin = (j.fechaFin && j.fechaFin.toDate) ? j.fechaFin.toDate() : null;
        if (j.modoFecha === 'rango') return fin ? `${fD(ini)} → ${fD(fin)}` : `Desde ${fD(ini)}`;
        return `${fD(ini)} · ${fHora(ini)}`;
    }
    function agendaCardHTML(j) {
        const lugar = [j.cliente, j.obra].filter(Boolean).join(' — ');
        const g = parseGps(j.gps);
        const estado = j.estado || 'pendiente';
        let nav = '';
        if (g) {
            const b = [];
            if (g.lat) b.push(`<a class="ag-nav" href="${wazeUrl(g)}" target="_blank" rel="noopener">🚗 Waze</a>`);
            b.push(`<a class="ag-nav" href="${mapsUrl(g)}" target="_blank" rel="noopener">📍 Maps</a>`);
            nav = `<div class="ag-navrow">${b.join('')}</div>`;
        }
        return `
        <div class="ag-card estado-${estado}">
            <div class="ag-head">
                <b>${esc(lugar) || 'Sin cliente'}</b>
                <span class="ag-fecha">${esc(agFechaTxt(j))}</span>
            </div>
            <div class="ag-meta">
                <span class="ag-badge ${estado}">${esc(AG_ESTADO[estado] || estado)}</span>
                · ${asignadoTxt(j)}
                ${j.direccion ? '<br>📌 ' + esc(j.direccion) : ''}
                ${j.notas ? '<br>' + esc(j.notas) : ''}
                ${j.orderId ? `<br><a href="#" onclick="openOrderPreview('${j.orderId}', 'instalador'); return false;">Ver hoja de fabricación</a>` : ''}
            </div>
            ${nav}
            ${fotosThumbsHTML(j.fotos, { coleccion: 'instalaciones', id: j.id, puedeBorrar: true })}
            ${fotoAddBtnHTML({ coleccion: 'instalaciones', id: j.id, pdf: true })}
            <div class="card-actions">
                <select onchange="cambiarEstadoJob('${j.id}', this.value)" title="Actualizar estado">
                    ${Object.keys(AG_ESTADO).map(k => `<option value="${k}" ${k === estado ? 'selected' : ''}>${AG_ESTADO[k]}</option>`).join('')}
                </select>
                <button class="mini-btn" onclick="toggleReprog('${j.id}')">🕑 Reprogramar</button>
            </div>
            <div class="reprog-row" id="reprog-${j.id}">
                <input type="datetime-local" id="reprog-input-${j.id}">
                <button class="mini-btn" onclick="reprogramarJob('${j.id}')">Guardar fecha</button>
            </div>
        </div>`;
    }
    let agendaCache = {};
    onSnapshot(collection(db, 'instalaciones'), (snap) => {
        const list = document.getElementById('agenda-list');
        agendaCache = {};
        snap.docs.forEach(d => { agendaCache[d.id] = d.data(); });
        const jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(j => (j.estado || 'pendiente') !== 'completado');
        // Míos primero, luego por fecha ascendente (los sin fecha al final).
        jobs.sort((a, b) => {
            const ma = asignadaAMi(a), mb = asignadaAMi(b);
            if (ma !== mb) return ma ? -1 : 1;
            const da = agFecha(a), db_ = agFecha(b);
            if (da && db_) return da - db_;
            if (da) return -1; if (db_) return 1; return 0;
        });
        list.innerHTML = jobs.length ? jobs.map(agendaCardHTML).join('') : '<p class="empty">No hay instalaciones agendadas.</p>';
    }, (err) => {
        document.getElementById('agenda-list').innerHTML = '<p class="empty">Error cargando la agenda: ' + esc(err.message) + '</p>';
    });

    /* ============ 🏗️ OBRAS LISTAS PARA INSTALAR (colección `orders`) ============ */
    function checklistResuelto(o) {
        const items = o.items || [];
        if (!items.length) return true;
        const status = o.itemStatusInstalador || {};
        return items.every(it => status[it.id] && status[it.id].estado);
    }
    function contarItems(o) {
        const items = o.items || [];
        const status = o.itemStatusInstalador || {};
        const total = items.length;
        const resueltos = items.filter(it => status[it.id] && status[it.id].estado).length;
        const instalados = items.filter(it => status[it.id] && status[it.id].estado === 'instalado').length;
        return { total, resueltos, instalados, faltan: total - resueltos };
    }

    function orderCardHTML(id, o) {
        const c = contarItems(o);
        const resuelto = c.total === 0 || c.resueltos === c.total;
        const entregado = o.entregado === true;
        const esCompra = o.docType === 'COMPRA_DIRECTA';
        const esParcialFab = o.status === 'parcialmente_listo';
        const yaParcialInst = o.status === 'parcialmente_instalado';
        // Avance parcial: entregado, con al menos un ítem instalado pero no todos.
        const puedeParcial = entregado && c.instalados > 0 && c.instalados < c.total;
        // Registrar instalación completa: checklist resuelto Y ya entregado por el chofer.
        const puedeInstalar = resuelto && entregado;

        const metaLine = esCompra
            ? `Compra directa · Proveedor: ${esc(o.proveedor)} · ${esc(o.totalItems) || 0} artículo(s) · <a href="${esc(o.compraPdfUrl)}" target="_blank">Ver orden de compra</a>`
            : `${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems · <a href="#" onclick="openOrderPreview('${id}', 'instalador'); return false;">Ver hoja de fabricación</a>`;

        let borde = '';
        if (yaParcialInst) borde = 'style="border-left-color:#e67e22;"';
        else if (esParcialFab) borde = 'style="border-left-color:#f39c12;"';

        return `
        <div class="order-card" ${borde}>
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
            </div>
            <div class="order-meta">
                ${metaLine}
                · ${asignadoTxt({ asignados: o.asignadosInstalador, instaladorNombre: o.asignadoInstaladorNombre, instaladorEmail: o.asignadoInstaladorEmail })}
            </div>
            ${yaParcialInst ? `<div class="checklist-note">🟠 Parcialmente instalado — quedan ${c.total - c.instalados} ítem(s) por instalar. Termínalos cuando estén listos.</div>` : ''}
            ${esParcialFab ? `<div class="checklist-note" style="color:#f39c12;">⚠ Pedido PARCIAL de fábrica — no todos los ítems llegaron listos. Abre "Ver hoja" para ver cuáles sí (en verde).</div>` : ''}
            ${!entregado ? `<div class="esperando-note">🚚 Esperando que el chofer entregue este pedido. No se puede instalar hasta confirmar la entrega.</div>`
                : (resuelto ? '' : `<div class="checklist-note">⚠ Faltan ${c.faltan} ítem(s) por marcar en el checklist. Ábrelo en "Ver hoja de fabricación".</div>`)}
            <div class="actions">
                <button class="btn-instalado" ${puedeInstalar ? '' : 'disabled style="opacity:0.5;cursor:default;"'} onclick="${puedeInstalar ? `abrirAprobacion('${id}')` : ''}">✅ Registrar instalación (firma)</button>
                ${puedeParcial ? `<button class="btn-parcial" onclick="guardarAvanceParcial('${id}')">💾 Guardar avance parcial (${c.instalados}/${c.total})</button>` : ''}
                ${esCompra ? '' : `<button class="btn-deshacer" onclick="regresarAFabrica('${id}')" title="Aún no está listo, regresar a fábrica">↩ No está listo</button>`}
            </div>
            <div class="aprobacion-form" id="aprobacion-${id}">
                <label>Nombre del cliente</label>
                <input type="text" id="aprobacion-nombre-${id}" placeholder="Nombre completo">
                <label>Firma del cliente</label>
                <canvas class="signature-canvas" id="firma-${id}" width="320" height="130"></canvas>
                <div class="signature-row">
                    <button type="button" onclick="limpiarFirma('${id}')">Borrar firma</button>
                </div>
                <button class="btn-instalado" style="margin-top:10px;" onclick="confirmarInstalacion('${id}')">Confirmar instalación</button>
            </div>
        </div>`;
    }

    let signaturePads = {};

    function render(docs) {
        const list = document.getElementById('orders-list');
        // Cualquier instalador ve todas las obras (la asignación es informativa, así uno cubre al
        // otro). Las Compra Directa NO se instalan (solo se recogen/entregan → van al chofer).
        const pendientes = docs.filter(d => !d.data().instalado && d.data().docType !== 'COMPRA_DIRECTA');
        signaturePads = {};
        if (!pendientes.length) { list.innerHTML = '<p class="empty">No hay obras listas para instalar.</p>'; return; }
        list.innerHTML = pendientes.map(d => orderCardHTML(d.id, d.data())).join('');
        pendientes.forEach(d => {
            const canvas = document.getElementById('firma-' + d.id);
            if (canvas) signaturePads[d.id] = setupSignaturePad(canvas);
        });
    }

    // Incluye 'parcialmente_instalado' para que una obra a medio instalar siga visible y se pueda
    // terminar después.
    const q = query(collection(db, 'orders'), where('status', 'in', ['listo_para_cargar', 'parcialmente_listo', 'parcialmente_instalado']));
    onSnapshot(q, (snap) => render(snap.docs), (err) => {
        document.getElementById('orders-list').innerHTML = '<p class="empty">Error cargando pedidos: ' + err.message + '</p>';
    });

    window.abrirAprobacion = function (id) {
        const form = document.getElementById('aprobacion-' + id);
        if (form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
    };

    window.limpiarFirma = function (id) {
        if (signaturePads[id]) signaturePads[id].clear();
    };

    window.confirmarInstalacion = async function (id) {
        const nombre = document.getElementById('aprobacion-nombre-' + id).value.trim();
        const pad = signaturePads[id];
        if (!nombre) { alert('Escribe el nombre del cliente.'); return; }
        if (!pad || pad.isEmpty()) { alert('Falta la firma del cliente.'); return; }

        // Regla firme: no se puede instalar antes de que el chofer entregue. Se revuelve a leer el
        // doc por si la entrega cambió justo ahora en otro dispositivo.
        const snap = await getDoc(doc(db, 'orders', id));
        if (!snap.exists() || snap.data().entregado !== true) {
            alert('El chofer todavía no ha entregado este pedido. No puedes registrar la instalación hasta que la entrega esté confirmada.');
            return;
        }
        await updateDoc(doc(db, 'orders', id), {
            instalado: true,
            fechaInstalado: serverTimestamp(),
            clienteAprobacion: { nombre, firma: pad.toDataUrl(), fecha: serverTimestamp() },
            status: 'completado'   // ya entregado (validado arriba) → queda completado
        });
    };

    // Guardar avance parcial: deja el pedido como 'parcialmente_instalado' con los ítems ya
    // marcados como instalados (en itemStatusInstalador, desde "Ver hoja"). Sigue visible para
    // terminar el resto luego. También exige entrega del chofer.
    window.guardarAvanceParcial = async function (id) {
        const snap = await getDoc(doc(db, 'orders', id));
        if (!snap.exists() || snap.data().entregado !== true) {
            alert('El chofer todavía no ha entregado este pedido.');
            return;
        }
        if (!confirm('¿Guardar avance parcial? El pedido quedará como "Parcialmente instalado" y seguirá en tu lista para terminar el resto de los ítems después.')) return;
        await updateDoc(doc(db, 'orders', id), {
            status: 'parcialmente_instalado',
            fechaParcialInstalado: serverTimestamp()
        });
    };

    window.regresarAFabrica = async function (id) {
        if (!confirm('¿Regresar este pedido a fábrica? Desaparecerá de la lista de instalación y de la del chofer hasta que fábrica lo vuelva a dejar listo.')) return;
        await updateDoc(doc(db, 'orders', id), { status: 'en_fabrica' });
    };

    /* ===== Recordatorios: crear / marcar hecho / borrar (el instalador se los pone a sí mismo) ===== */
    const yo = { email: usuario.email, nombre: usuario.nombre };
    window.abrirModalRec = function () {
        document.getElementById('rec-titulo').value = '';
        document.getElementById('rec-fecha').value = '';
        document.getElementById('rec-nota').value = '';
        document.getElementById('modal-rec').classList.add('show');
    };
    window.cerrarModalRec = function () { document.getElementById('modal-rec').classList.remove('show'); };
    window.guardarRec = async function () {
        const titulo = document.getElementById('rec-titulo').value.trim();
        if (!titulo) { alert('Escribe qué hay que recordar.'); return; }
        const fechaStr = document.getElementById('rec-fecha').value;
        const nota = document.getElementById('rec-nota').value.trim();
        try {
            await addDoc(collection(db, 'citas'), {
                tipo: 'recordatorio',
                titulo, descripcion: nota,
                fecha: fechaStr ? Timestamp.fromDate(new Date(fechaStr)) : null,
                asignadoA: 'instalador',
                asignados: [yo],
                creadoPorNombre: usuario.nombre,
                completada: false,
                recordatorios: [], recordatoriosEnviados: [], recordatoriosPendientes: false,
                fechaCreacion: serverTimestamp()
            });
            cerrarModalRec();
        } catch (e) { alert('No se pudo guardar: ' + e.message); }
    };
    window.marcarRecHecho = async function (id) {
        if (!confirm('¿Marcar como hecho?\n\nSi lo marcas por error, puedes reabrirlo desde el Calendario.')) return;
        try { await updateDoc(doc(db, 'citas', id), { completada: true, fechaCompletada: serverTimestamp(), recordatoriosPendientes: false }); }
        catch (e) { alert('No se pudo marcar: ' + e.message); }
    };
    // Marcar UNA etapa hecha (o reabrirla). Solo cierra el recordatorio cuando todas están hechas.
    window.completarEtapaRec = async function (id, idx) {
        const c = recsCache.find(x => x.id === id); if (!c) return;
        const et = (Array.isArray(c.etapas) ? c.etapas : []).map(e => ({ ...e }));
        if (!et[idx]) return;
        const marcando = !et[idx].hecha;
        if (marcando && !confirm(`¿Marcar la etapa «${et[idx].titulo || 'Tarea'}» como hecha?`)) return;
        et[idx].hecha = marcando;
        et[idx].fechaHecha = marcando ? new Date().toISOString() : null;
        const completa = et.every(e => e.hecha);
        try { await updateDoc(doc(db, 'citas', id), { etapas: et, completada: completa, recordatoriosPendientes: completa ? false : (Array.isArray(c.recordatorios) && c.recordatorios.length > 0) }); }
        catch (e) { alert('No se pudo actualizar: ' + e.message); }
    };
    // Marcar hecho lo de UNA persona (recordatorio de varias sin etapas). Sigue pendiente para quien falte.
    window.asistioRecPersona = async function (id, email) {
        const c = recsCache.find(x => x.id === id); if (!c) return;
        const asg = Array.isArray(c.asignados) ? c.asignados : [];
        let cp = Array.isArray(c.completadoPor) ? c.completadoPor.slice() : [];
        const ya = cp.includes(email);
        const p = asg.find(x => x.email === email);
        if (!ya && !confirm(`¿Marcar como hecho lo de ${p ? p.nombre : email}?`)) return;
        cp = ya ? cp.filter(e => e !== email) : cp.concat([email]);
        const completa = asg.length > 0 && asg.every(x => cp.includes(x.email));
        try { await updateDoc(doc(db, 'citas', id), { completadoPor: cp, completada: completa, recordatoriosPendientes: completa ? false : (Array.isArray(c.recordatorios) && c.recordatorios.length > 0) }); }
        catch (e) { alert('No se pudo actualizar: ' + e.message); }
    };
    window.borrarRec = async function (id) {
        if (!confirm('¿Borrar este recordatorio?')) return;
        try { await deleteDoc(doc(db, 'citas', id)); }
        catch (e) { alert('No se pudo borrar: ' + e.message); }
    };

    /* ===== Trabajos (agenda): crear / cambiar estado / reprogramar ===== */
    window.abrirModalTrabajo = function () {
        ['tr-cliente', 'tr-obra', 'tr-direccion', 'tr-gps', 'tr-fecha', 'tr-nota'].forEach(i => document.getElementById(i).value = '');
        document.getElementById('modal-trabajo').classList.add('show');
    };
    window.cerrarModalTrabajo = function () { document.getElementById('modal-trabajo').classList.remove('show'); };
    window.guardarTrabajo = async function () {
        const cliente = document.getElementById('tr-cliente').value.trim();
        if (!cliente) { alert('Escribe el cliente.'); return; }
        const obra = document.getElementById('tr-obra').value.trim();
        const direccion = document.getElementById('tr-direccion').value.trim();
        const gps = document.getElementById('tr-gps').value.trim();
        const fechaStr = document.getElementById('tr-fecha').value;
        const notas = document.getElementById('tr-nota').value.trim();
        try {
            await addDoc(collection(db, 'instalaciones'), {
                cliente, obra, direccion, gps,
                modoFecha: fechaStr ? 'unica' : 'sin_fecha',
                fecha: fechaStr ? Timestamp.fromDate(new Date(fechaStr)) : null,
                fechaFin: null,
                asignados: [yo],
                instaladorEmail: yo.email, instaladorNombre: yo.nombre,
                estado: 'pendiente', notas,
                recordatorios: [], recordatoriosEnviados: [], recordatoriosPendientes: false,
                orderId: null,
                origen: 'instalador',
                creadoPorNombre: usuario.nombre,
                fechaCreacion: serverTimestamp()
            });
            cerrarModalTrabajo();
        } catch (e) { alert('No se pudo guardar: ' + e.message); }
    };

    // Cambio de estado con el mismo registro de auditoría que usa la Agenda de Instalación.
    window.cambiarEstadoJob = async function (id, estado) {
        const j = agendaCache[id] || {};
        const ahora = serverTimestamp();
        const cambios = { estado, estadoPor: usuario.nombre, estadoPorEmail: usuario.email, estadoFecha: ahora };
        if (estado === 'completado') {
            cambios.validadoPor = usuario.nombre;
            cambios.validadoPorEmail = usuario.email;
            cambios.validadoFecha = ahora;
        }
        try {
            await updateDoc(doc(db, 'instalaciones', id), cambios);
            await addDoc(collection(db, 'movimientosInstalaciones'), {
                instalacionId: id, cliente: j.cliente || '', obra: j.obra || '',
                estado, por: usuario.nombre, porEmail: usuario.email, fecha: ahora
            });
        } catch (e) { alert('No se pudo cambiar el estado: ' + e.message); }
    };

    window.toggleReprog = function (id) {
        const row = document.getElementById('reprog-' + id);
        if (!row) return;
        const abrir = row.style.display !== 'flex';
        row.style.display = abrir ? 'flex' : 'none';
        if (abrir) {
            // Prellena con la fecha actual del trabajo, si tiene.
            const j = agendaCache[id];
            const f = j && j.fecha && j.fecha.toDate ? j.fecha.toDate() : null;
            if (f) {
                const pad = (n) => String(n).padStart(2, '0');
                document.getElementById('reprog-input-' + id).value =
                    `${f.getFullYear()}-${pad(f.getMonth() + 1)}-${pad(f.getDate())}T${pad(f.getHours())}:${pad(f.getMinutes())}`;
            }
        }
    };
    window.reprogramarJob = async function (id) {
        const val = document.getElementById('reprog-input-' + id).value;
        if (!val) { alert('Elige la nueva fecha y hora.'); return; }
        try {
            await updateDoc(doc(db, 'instalaciones', id), {
                fecha: Timestamp.fromDate(new Date(val)),
                modoFecha: 'unica',
                // Al mover la fecha, los recordatorios vuelven a evaluarse desde cero.
                recordatoriosEnviados: []
            });
        } catch (e) { alert('No se pudo reprogramar: ' + e.message); }
    };
</script>

</body>
</html>
