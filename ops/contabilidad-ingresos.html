<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Ingresos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    main { max-width: none !important; width: 100% !important; margin: 0 !important; flex: 1; display: flex; flex-direction: column; padding: 0 !important; min-height: 0; gap: 0 !important; }
    .subtabs { display: flex; gap: 6px; background: #fff; box-shadow: var(--shadow); padding: 8px 10px; width: 100%; box-sizing: border-box; }
    .subtabs button { flex: 1; padding: 11px 6px; border: none; background: transparent; color: var(--artal-blue); border-radius: 10px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .subtabs button.active { background: var(--artal-blue); color: #fff; }
    .frame-wrap { flex: 1; min-height: 0; }
    iframe#emb { width: 100%; height: 100%; border: none; display: block; background: transparent; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="contabilidad.html" title="Volver a Contabilidad">← Contabilidad</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>💰 Ingresos</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="subtabs">
        <button id="t-registrados" class="active" onclick="setTab('registrados')">Registrados</button>
        <button id="t-porcobrar" onclick="setTab('porcobrar')">Por cobrar (clientes)</button>
    </div>
    <div class="frame-wrap"><iframe id="emb" title="Ingresos"></iframe></div>
</main>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    const usuario = await requireAuth(['contable']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const SRC = {
        registrados: 'contabilidad-movimientos.html?embed=1&tipo=ingreso',
        porcobrar: 'contabilidad-cxcp.html?embed=1&tab=cobrar'
    };
    const frame = document.getElementById('emb');
    window.setTab = function (t) {
        ['registrados', 'porcobrar'].forEach(k => document.getElementById('t-' + k).classList.toggle('active', k === t));
        if (frame.getAttribute('data-tab') !== t) { frame.setAttribute('data-tab', t); frame.src = SRC[t]; }
    };
    setTab('registrados');
</script>

</body>
</html>
