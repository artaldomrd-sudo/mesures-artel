<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — ALUCUFEL: Fábrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css?v=20260806">
<style>
    .order-card.status-pendiente_fabrica { border-left-color: var(--artal-yellow); }
    .order-card.status-en_fabrica { border-left-color: #3498db; }
    .order-card.status-parcialmente_listo { border-left-color: #e67e22; }
    .order-card.status-listo_para_cargar { border-left-color: #2ecc71; }
    .order-card.status-completado { border-left-color: #999; }
    .status-pendiente_fabrica .badge { background: var(--artal-yellow); color: var(--artal-blue); }
    .status-en_fabrica .badge { background: #3498db; color: #fff; }
    .status-parcialmente_listo .badge { background: #e67e22; color: #fff; }
    .status-listo_para_cargar .badge { background: #2ecc71; color: #fff; }
    .status-completado .badge { background: #999; color: #fff; }
    .btn-marcar { background: #8e44ad; color: #fff; }
    .btn-parcial { background: #e67e22; color: #fff; }
    .comment-box { margin-top: 10px; }
    .comment-box textarea { width: 100%; padding: 8px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 13px; min-height: 50px; }
    .comment-box button { margin-top: 6px; padding: 8px 14px; border: none; border-radius: 7px; background: var(--artal-blue); color: #fff; font-weight: bold; font-family: 'Arimo'; cursor: pointer; }
    .assign-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .assign-row label { font-size: 12px; color: #666; font-weight: bold; }
    .assign-row select { flex: 1; min-width: 160px; padding: 9px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 13px; }
    .assign-row button { padding: 9px 14px; border: none; border-radius: 7px; background: var(--artal-blue); color: #fff; font-weight: bold; font-family: 'Arimo'; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="index.html" title="Volver a ALUCUFEL">← ALUCUFEL</a>
        <img class="logo" src="../../logo.png" alt="ARTAL">
        <h1>Fábrica</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos de citas en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="tabs">
        <button class="tab-btn active" id="tab-pendientes" onclick="setTab('pendientes')">Pendientes</button>
        <button class="tab-btn" id="tab-enviados" onclick="setTab('enviados')">Enviados</button>
    </div>
    <div id="orders-list"><p class="empty">Cargando…</p></div>
</main>

<script type="module">
    import { requireAuth, auth, signOut } from '../auth-common.js';
    import { enableNotifications } from '../notifications.js';
    import { db } from '../firebase-config.js';
    import { collection, query, where, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { openOrderPreview } from '../order-preview.js';
    window.openOrderPreview = openOrderPreview;

    const usuario = await requireAuth(['fabrica']);
    const esGerencia = usuario.roles.includes('admin');
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));

    const STATUS_LABEL = {
        pendiente_fabrica: 'Pendiente',
        en_fabrica: 'En fábrica',
        parcialmente_listo: 'Parcialmente listo',
        listo_para_cargar: 'Listo para cargar',
        completado: 'Completado'
    };
    const PENDIENTES = ['pendiente_fabrica', 'en_fabrica', 'parcialmente_listo'];
    const ENVIADOS = ['listo_para_cargar', 'completado'];

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Control de chofer: Wilson por defecto (siempre) para que la carga le llegue directo, más
    // los choferes registrados y la obra ya asignada si es otra, más la opción de escribir un
    // nombre nuevo a mano para casos especiales. La asignación de chofer es solo informativa.
    function choferControlHTML(id, o) {
        const actual = o.asignadoChoferNombre != null ? o.asignadoChoferNombre : 'Wilson';
        const base = ['Wilson', ...choferesCache.map(u => u.nombre).filter(Boolean)];
        if (actual && !base.includes(actual)) base.push(actual);
        const nombres = [...new Set(base)];
        const opts = nombres.map(n => `<option value="${esc(n)}" ${n === actual ? 'selected' : ''}>${esc(n)}</option>`).join('');
        return `<select id="asignar-chofer-${id}" onchange="onChoferSel('${id}')">
                    ${opts}
                    <option value="" ${actual === '' ? 'selected' : ''}>(sin asignar — cualquiera)</option>
                    <option value="__nuevo__">➕ Escribir chofer nuevo…</option>
                </select>
                <input type="text" id="asignar-chofer-nuevo-${id}" placeholder="Nombre del chofer nuevo" style="display:none;flex:1;min-width:160px;padding:9px;border:1.5px solid #ddd;border-radius:7px;font-family:'Arimo';font-size:13px;">`;
    }
    window.onChoferSel = function (id) {
        const sel = document.getElementById('asignar-chofer-' + id);
        document.getElementById('asignar-chofer-nuevo-' + id).style.display = sel.value === '__nuevo__' ? 'block' : 'none';
    };

    function orderCardHTML(id, o) {
        let actionsHtml;
        if (o.status === 'pendiente_fabrica') {
            actionsHtml = `<div class="actions"><button class="btn-tomar" onclick="tomarPedido('${id}')">Tomar pedido</button></div>`;
        } else if (o.status === 'en_fabrica' || o.status === 'parcialmente_listo') {
            actionsHtml = `<div class="actions">
                <button class="btn-marcar" onclick="openOrderPreview('${id}', 'fabrica')">🏷 Marcar ítems listos</button>
                <button class="btn-parcial" onclick="parcialmenteListo('${id}')">Parcialmente listo para cargar</button>
                <button class="btn-listo" onclick="listoParaCargar('${id}')">Listo para cargar (completo)</button>
                ${o.status === 'en_fabrica' ? `<button class="btn-deshacer" onclick="deshacerTomarPedido('${id}')" title="Regresar a Pendiente">↩ Deshacer</button>` : ''}
            </div>`;
        } else {
            actionsHtml = '';
        }
        return `
        <div class="order-card status-${o.status}">
            <div class="order-head">
                <b>${esc(o.cliente) || 'Sin cliente'} — ${esc(o.obra)}</b>
                <span class="badge">${STATUS_LABEL[o.status] || esc(o.status)}</span>
            </div>
            <div class="order-meta">
                ${esc(o.docType)} · ${esc(o.material)} ${esc(o.color)} · ${esc(o.totalItems) || 0} ítems ·
                <a href="#" onclick="openOrderPreview('${id}'); return false;">Ver hoja de fabricación</a>
                · <a href="../etiquetas.html?orderId=${id}" target="_blank">🏷 Etiquetas</a>
                ${(o.fechaCotizado || o.fechaSolicitada) && (o.fechaCotizado || o.fechaSolicitada).toDate ? `<br><span style="color:#667;">📤 Recibido: <b>${esc((o.fechaCotizado || o.fechaSolicitada).toDate().toLocaleString('es-DO', { dateStyle: 'medium', timeStyle: 'short' }))}</b></span>` : ''}
            </div>
            ${o.status === 'parcialmente_listo' ? `<div style="font-size:12.5px;font-weight:bold;color:#e67e22;margin-top:8px;">⚠ Solo parte de este pedido está lista — usa "Marcar ítems listos" para ver/actualizar cuáles.</div>` : ''}
            ${o.comentarioParaFabrica && !o.comentarioParaFabricaAtendido ? `<div style="margin-top:8px;background:#fdecea;border:1.5px solid #f5b7b1;border-radius:9px;padding:9px 11px;">
                <div style="font-size:12.5px;font-weight:bold;color:#c0392b;">📌 Instrucción de la oficina${o.comentarioParaFabricaPor ? ' (' + esc(o.comentarioParaFabricaPor) + ')' : ''}:</div>
                <div style="font-size:13px;color:#333;margin:4px 0;white-space:pre-wrap;">${esc(o.comentarioParaFabrica)}</div>
                <button onclick="atenderInstruccion('${id}')" style="background:#0A3D62;color:#fff;border:none;border-radius:7px;padding:7px 11px;font-weight:bold;font-family:'Arimo';font-size:12.5px;cursor:pointer;">Marcar atendido</button>
            </div>` : ''}
            ${actionsHtml}
            <div class="assign-row">
                <label>Chofer:</label>
                ${choferControlHTML(id, o)}
                <button onclick="guardarAsignacion('${id}')">Guardar asignación</button>
            </div>
            <div class="comment-box">
                <textarea id="comentario-${id}" placeholder="Comentario sobre este pedido (problemas de producción, etc.)">${esc(o.comentarioFabrica)}</textarea>
                <button onclick="guardarComentario('${id}')">Guardar comentario</button>
            </div>
            ${esGerencia ? `<div style="margin-top:8px;"><a href="#" onclick="eliminarPedido('${id}'); return false;" style="color:#e74c3c;font-size:12.5px;font-weight:bold;">🗑 Eliminar obra (gerencia)</a></div>` : ''}
        </div>`;
    }

    let currentTab = 'pendientes';
    let allOrders = [];
    let choferesCache = [];

    window.setTab = function (tab) {
        currentTab = tab;
        document.getElementById('tab-pendientes').classList.toggle('active', tab === 'pendientes');
        document.getElementById('tab-enviados').classList.toggle('active', tab === 'enviados');
        render();
    };

    function render() {
        const statuses = currentTab === 'pendientes' ? PENDIENTES : ENVIADOS;
        // Los envíos directos a Instalaciones (directoInstalacion) no pasan por fábrica: se
        // ocultan. Igual los de destino "interno" (los fabrica ARTAL, no ALUCUFEL) — ver
        // ops/fabrica-interna.html.
        const docs = allOrders.filter(d => statuses.includes(d.data().status) && !d.data().directoInstalacion && d.data().destino !== 'interno');
        const list = document.getElementById('orders-list');
        if (!docs.length) {
            list.innerHTML = currentTab === 'pendientes'
                ? '<p class="empty">No hay pedidos pendientes.</p>'
                : '<p class="empty">No hay pedidos enviados todavía.</p>';
            return;
        }
        const sorted = docs.slice().sort((a, b) => (a.data().status > b.data().status ? 1 : -1));
        list.innerHTML = sorted.map(d => orderCardHTML(d.id, d.data())).join('');
    }

    const q = query(collection(db, 'orders'), where('status', 'in', [...PENDIENTES, ...ENVIADOS]));
    onSnapshot(q, (snap) => { allOrders = snap.docs; render(); }, (err) => {
        document.getElementById('orders-list').innerHTML = '<p class="empty">Error cargando pedidos: ' + err.message + '</p>';
    });

    // Choferes registrados, para el selector de asignación (Wilson va por defecto igual, aunque
    // no esté registrado como usuario — la asignación de chofer es solo informativa).
    onSnapshot(query(collection(db, 'usuarios'), where('rol', 'array-contains', 'chofer')), (snap) => {
        choferesCache = snap.docs.map(d => ({ email: d.id, ...d.data() }));
        render();
    });

    // Asigna el chofer al pedido (mismos campos que leen Historial, Chofer e Instalador para
    // mostrar "Asignado a …"). Con Wilson por defecto, ALUCUFEL no tiene que ponerlo a mano.
    window.guardarAsignacion = async function (id) {
        const choferRaw = document.getElementById('asignar-chofer-' + id).value;
        const choferNombre = choferRaw === '__nuevo__'
            ? document.getElementById('asignar-chofer-nuevo-' + id).value.trim()
            : choferRaw;
        const chofer = choferesCache.find(u => u.nombre === choferNombre);
        try {
            await updateDoc(doc(db, 'orders', id), {
                asignadoChoferEmail: chofer ? chofer.email : null,
                asignadoChoferNombre: choferNombre || null
            });
            alert('Chofer asignado.');
        } catch (e) {
            alert('No se pudo guardar la asignación: ' + e.message);
        }
    };

    window.tomarPedido = async function (id) {
        await updateDoc(doc(db, 'orders', id), { status: 'en_fabrica', fechaEnFabrica: serverTimestamp() });
    };
    window.listoParaCargar = async function (id) {
        if (!confirm('¿Marcar el pedido como LISTO PARA CARGAR (completo)?\n\nPasará a chofer e instalador.')) return;
        // Al marcar todo el pedido como listo, se marcan también todos los ítems como listos
        // individualmente (por si venía de "parcialmente listo" y quedaban ítems sin marcar).
        const docSnap = allOrders.find(d => d.id === id);
        const items = docSnap ? (docSnap.data().items || []) : [];
        const cambios = { status: 'listo_para_cargar', fechaListoParaCargar: serverTimestamp() };
        items.forEach(it => { cambios[`itemsListosFabrica.${it.id}`] = true; });
        await updateDoc(doc(db, 'orders', id), cambios);
    };
    window.parcialmenteListo = async function (id) {
        if (!confirm('¿Marcar como PARCIALMENTE LISTO?\n\nSe enviará a chofer/instalador lo que ya esté marcado como listo.')) return;
        await updateDoc(doc(db, 'orders', id), { status: 'parcialmente_listo', fechaParcialListo: serverTimestamp() });
    };
    window.deshacerTomarPedido = async function (id) {
        if (!confirm('¿Regresar el pedido a "Pendiente"?')) return;
        await updateDoc(doc(db, 'orders', id), { status: 'pendiente_fabrica' });
    };
    window.guardarComentario = async function (id) {
        const texto = document.getElementById('comentario-' + id).value.trim();
        await updateDoc(doc(db, 'orders', id), {
            comentarioFabrica: texto,
            comentarioFabricaFecha: serverTimestamp(),
            comentarioFabricaAtendido: texto ? false : true
        });
        alert('Comentario guardado.');
    };
    // Marcar como vista la instrucción que envió la oficina (comentarioParaFabrica).
    window.atenderInstruccion = async function (id) {
        try { await updateDoc(doc(db, 'orders', id), { comentarioParaFabricaAtendido: true }); }
        catch (e) { alert('No se pudo: ' + e.message); }
    };

    // Solo gerencia (admin): borrar una obra enviada por duplicado o por error. Doble
    // confirmación para no borrar por accidente.
    window.eliminarPedido = async function (id) {
        const o = allOrders.find(d => d.id === id);
        const nombre = o ? [o.data().cliente, o.data().obra].filter(Boolean).join(' — ') : '';
        if (!confirm(`¿Eliminar la obra "${nombre}"? Esta acción no se puede deshacer.`)) return;
        if (!confirm('Confirma de nuevo: se borrará definitivamente de la plataforma.')) return;
        try {
            await deleteDoc(doc(db, 'orders', id));
        } catch (e) {
            alert('No se pudo eliminar: ' + e.message);
        }
    };
</script>

</body>
</html>
