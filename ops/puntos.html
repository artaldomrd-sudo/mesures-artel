<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Puntos del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 980px; }
    .tabs { display: flex; gap: 6px; background: #fff; border-radius: 12px; padding: 5px; box-shadow: var(--shadow); margin-bottom: 14px; flex-wrap: wrap; }
    .tab { flex: 1; min-width: 130px; padding: 11px 8px; border: none; background: transparent; color: var(--artal-blue); border-radius: 9px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .tab.active { background: var(--artal-blue); color: #fff; }
    .tabpanel { display: none; } .tabpanel.active { display: block; }
    .card { background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; }
    .hint { font-size: 12.5px; color: #8a93a0; line-height: 1.5; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .kpi { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; border-top: 4px solid var(--artal-blue); }
    .kpi .v { font-size: 26px; font-weight: bold; color: var(--artal-blue); } .kpi .l { font-size: 12px; color: #667; margin-top: 2px; }
    .kpi.pos { border-top-color: #1f9d61; } .kpi.pos .v { color: #1f9d61; }
    .kpi.neg { border-top-color: #d9483b; } .kpi.neg .v { color: #d9483b; }
    table.rep { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); font-size: 13.5px; }
    table.rep th { background: var(--artal-blue); color: #fff; text-align: left; padding: 9px 10px; font-size: 12px; }
    table.rep td { padding: 8px 10px; border-bottom: 1px solid #eef1f4; vertical-align: top; }
    table.rep td.n, table.rep th.n { text-align: right; white-space: nowrap; }
    table.rep tr.sel td { background: #eef4fb; }
    .tabla-wrap { overflow-x: auto; margin-bottom: 12px; }
    .pts { font-weight: bold; white-space: nowrap; } .pts.pos { color: #1f9d61; } .pts.neg { color: #d9483b; } .pts.cero { color: #8a93a0; }
    .ev { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eef1f4; font-size: 13.5px; align-items: flex-start; }
    .ev:last-child { border-bottom: none; }
    .ev .ico { font-size: 18px; width: 26px; text-align: center; }
    .ev .txt { flex: 1; line-height: 1.45; } .ev .meta { font-size: 12px; color: #8a93a0; }
    .ev .p { min-width: 46px; text-align: right; }
    .lock { text-align: center; padding: 40px 16px; }
    .lock .big { font-size: 54px; } .lock h2 { color: var(--artal-blue); margin: 8px 0; } .lock p { color: #667; line-height: 1.5; }
    .persona { color: var(--artal-blue); font-weight: bold; cursor: pointer; text-decoration: underline; }
    .btn { border: none; border-radius: 9px; padding: 10px 14px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 42px; background: var(--artal-blue); color: #fff; }
    .btn.o { background: #fff; color: var(--artal-blue); border: 1.5px solid var(--artal-blue); }
    .btn.rojo { background: #d9483b; }
    .btn:disabled { opacity: .5; cursor: default; }
    .frm { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .frm label { display: block; font-size: 12px; color: #667; margin-bottom: 3px; }
    .frm input, .frm select, .frm textarea { width: 100%; padding: 9px 10px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; box-sizing: border-box; background: #fff; }
    .regla { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eef1f4; font-size: 13.5px; }
    .regla input { width: 80px; padding: 7px 8px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; text-align: right; }
    .sw { display: flex; align-items: center; gap: 10px; background: #fff7e0; border-left: 4px solid #f5b400; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13.5px; }
    .sw.on { background: #e7f7ee; border-left-color: #1f9d61; }
    .enc { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; border-left: 5px solid #f5b400; }
    .enc.resp { border-left-color: #1f9d61; }
    .enc .t { font-weight: bold; color: var(--artal-blue); } .enc .m { font-size: 13px; color: #556; margin-top: 4px; line-height: 1.5; }
    .enc .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .enc .acts a, .enc .acts button { font-size: 12.5px; padding: 8px 10px; min-height: 36px; border-radius: 8px; text-decoration: none; }
    .stars { color: #f5b400; letter-spacing: 1px; }
    .ok { color: #1f9d61; font-size: 13px; min-height: 18px; }
    .empty { color: #8a93a0; font-size: 13.5px; padding: 8px 0; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" id="btn-back" href="index.html" title="Volver">← Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Puntos del equipo</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="cont"><p class="empty">Cargando…</p></div>
</main>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { db } from './firebase-config.js';
    import './mensajeria-widget.js';
    import { collection, doc, onSnapshot, query, orderBy, limit, setDoc, serverTimestamp, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['instalador', 'ayudante', 'chofer', 'cotizaciones', 'contable', 'comunicaciones', 'capacitador']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    if (typeof wireBackButton === 'function') wireBackButton(usuario.roles);
    const esAdmin = usuario.roles.includes('admin');

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = (n) => String(n).padStart(2, '0');
    const hoyStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
    const fD = (s) => String(s || '').slice(0, 10).split('-').reverse().join('/');
    const fechaDe = (e) => e.fechaEvento || (e.fecha && e.fecha.toDate ? e.fecha.toDate().toISOString().slice(0, 10) : '');
    const fmtHora = (ts) => { try { return ts.toDate().toLocaleString('es-DO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; } };
    const ek = (email) => String(email || '').toLowerCase().replace(/[.@]/g, '_');
    const signo = (n) => (n > 0 ? '+' : '') + n;
    const clase = (n) => n > 0 ? 'pos' : n < 0 ? 'neg' : 'cero';
    const ICO = { parte: '📝', trabajo: '🔧', trabajo_vencido: '⏰', msg: '✉️', encuesta: '⭐', academia: '🎓', supervisor: '👔' };
    const FN = 'https://us-central1-artal-operaciones.cloudfunctions.net/puntosEvaluarAhora';
    const URL_BASE = 'https://artaldomrd-sudo.github.io/mesures-artel/';
    const ROLES_EQUIPO = ['instalador', 'ayudante', 'chofer'];

    const DEF = { visibleEquipo: false, desde: '2026-09-24', horaLimiteParte: '18:00', diasVencido: 3, reglas: { parteATiempo: 10, parteTarde: 3, parteFalta: -10, trabajoATiempo: 10, trabajoUnDia: 0, trabajoTarde: -10, trabajoVencido: -5, msgLeido24: 2, msgNoLeido48: -3, encuesta5: 15, encuesta4: 5, encuesta3: 0, encuesta2: -10, encuesta1: -20 } };
    const REGLAS_TXT = [
        ['parteATiempo', '📝 Parte diario enviado antes de la hora límite'], ['parteTarde', '📝 Parte enviado el mismo día, después de la hora límite'], ['parteFalta', '📝 Día laborable sin parte (o enviado días después)'],
        ['trabajoATiempo', '🔧 Trabajo de instalación completado el día agendado'], ['trabajoUnDia', '🔧 Completado un día después'], ['trabajoTarde', '🔧 Completado dos o más días después'], ['trabajoVencido', '⏰ Trabajo agendado y sin completar ni reprogramar (una sola vez)'],
        ['msgLeido24', '✉️ Comunicado leído en menos de 24 h'], ['msgNoLeido48', '✉️ Comunicado sin leer a las 48 h'],
        ['encuesta5', '⭐ Cliente califica 5 estrellas (cada asignado)'], ['encuesta4', '⭐ 4 estrellas'], ['encuesta3', '⭐ 3 estrellas'], ['encuesta2', '⭐ 2 estrellas'], ['encuesta1', '⭐ 1 estrella']
    ];

    let config = { ...DEF }, ultima = null, eventos = [], equipo = [], encuestas = [];
    let tab = 'equipo', personaSel = '', cargado = { cfg: false, ev: false, eq: false };
    const cont = document.getElementById('cont');

    onSnapshot(doc(db, 'puntosConfig', 'general'), (s) => { const c = s.exists() ? s.data() : {}; config = { ...DEF, ...c, reglas: { ...DEF.reglas, ...(c.reglas || {}) } }; cargado.cfg = true; render(); });
    onSnapshot(doc(db, 'puntosConfig', 'ultimaEvaluacion'), (s) => { ultima = s.exists() ? s.data() : null; render(); });
    onSnapshot(query(collection(db, 'puntos'), orderBy('fecha', 'desc'), limit(3000)), (s) => { eventos = s.docs.map(d => ({ id: d.id, ...d.data() })); cargado.ev = true; render(); });
    onSnapshot(collection(db, 'equipo'), (s) => {
        equipo = s.docs.map(d => ({ email: d.id.toLowerCase(), ...d.data() })).filter(u => u.activo !== false && (Array.isArray(u.rol) ? u.rol : [u.rol]).some(r => ROLES_EQUIPO.includes(r)));
        equipo.sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || '')));
        cargado.eq = true; render();
    });
    if (esAdmin) onSnapshot(query(collection(db, 'encuestas'), orderBy('creada', 'desc'), limit(200)), (s) => { encuestas = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); });

    // Solo cuentan los eventos desde `config.desde` (lo anterior a la fecha de arranque no cuenta).
    const validos = () => eventos.filter(e => fechaDe(e) >= config.desde);
    const de = (email) => validos().filter(e => String(e.email || '').toLowerCase() === email);
    const suma = (arr) => arr.reduce((s, e) => s + (Number(e.puntos) || 0), 0);
    const mesActual = () => hoyStr().slice(0, 7);
    const hace7 = () => { const d = new Date(); d.setDate(d.getDate() - 7); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

    function render() {
        if (!cargado.cfg || !cargado.ev || !cargado.eq) return;
        if (!esAdmin) { renderMio(); return; }
        cont.innerHTML = `
            <div class="sw ${config.visibleEquipo ? 'on' : ''}">
                <span style="font-size:20px">${config.visibleEquipo ? '👁️' : '🔒'}</span>
                <div style="flex:1"><b>${config.visibleEquipo ? 'El equipo YA ve sus puntos.' : 'Modo silencioso: el equipo todavía NO ve nada.'}</b> Los puntos se acumulan desde el ${fD(config.desde)}. Cuando las reglas estén como quieres, activa la visibilidad en ⚙️ Reglas.</div>
            </div>
            <div class="tabs">
                <button class="tab ${tab === 'equipo' ? 'active' : ''}" onclick="setTab('equipo')">👥 Equipo</button>
                <button class="tab ${tab === 'encuestas' ? 'active' : ''}" onclick="setTab('encuestas')">⭐ Encuestas de clientes</button>
                <button class="tab ${tab === 'reglas' ? 'active' : ''}" onclick="setTab('reglas')">⚙️ Reglas y valores</button>
                <button class="tab ${tab === 'mio' ? 'active' : ''}" onclick="setTab('mio')">👤 Cómo lo ve cada uno</button>
            </div>
            <div id="panel"></div>`;
        const p = document.getElementById('panel');
        if (tab === 'equipo') p.innerHTML = htmlEquipo();
        else if (tab === 'encuestas') p.innerHTML = htmlEncuestas();
        else if (tab === 'reglas') p.innerHTML = htmlReglas();
        else p.innerHTML = htmlVista(personaSel || (equipo[0] && equipo[0].email) || usuario.email, true);
    }
    window.setTab = (t) => { tab = t; render(); };
    window.verPersona = (email) => { personaSel = email; tab = 'mio'; render(); };

    // ---- Equipo (admin) ------------------------------------------------------------------------
    function htmlEquipo() {
        const filas = equipo.map(u => {
            const ev = de(u.email);
            const mes = suma(ev.filter(e => fechaDe(e).startsWith(mesActual())));
            const sem = suma(ev.filter(e => fechaDe(e) >= hace7()));
            const ult = ev[0];
            return { u, total: suma(ev), mes, sem, n: ev.length, ult };
        }).sort((a, b) => b.total - a.total);
        const tot = filas.reduce((s, f) => s + f.total, 0);
        return `
            <div class="kpis">
                <div class="kpi"><div class="v">${equipo.length}</div><div class="l">personas del equipo de obra</div></div>
                <div class="kpi ${clase(tot)}"><div class="v">${signo(tot)}</div><div class="l">puntos acumulados en total</div></div>
                <div class="kpi"><div class="v">${validos().length}</div><div class="l">eventos desde el ${fD(config.desde)}</div></div>
                <div class="kpi"><div class="v" style="font-size:15px;margin-top:6px">${ultima && ultima.fecha ? fD(ultima.fecha) : '—'}</div><div class="l">última evaluación nocturna${ultima && ultima.corrida ? ' · ' + fmtHora(ultima.corrida) : ''}</div></div>
            </div>
            <div class="tabla-wrap"><table class="rep"><thead><tr><th>#</th><th>Persona</th><th class="n">Total</th><th class="n">Este mes</th><th class="n">7 días</th><th class="n">Eventos</th><th>Último evento</th></tr></thead><tbody>
            ${filas.map((f, i) => `<tr><td>${i + 1}</td><td><span class="persona" onclick="verPersona('${esc(f.u.email)}')">${esc(f.u.nombre || f.u.email)}</span><div class="hint">${esc((Array.isArray(f.u.rol) ? f.u.rol : [f.u.rol]).join(', '))}</div></td>
                <td class="n pts ${clase(f.total)}">${signo(f.total)}</td><td class="n pts ${clase(f.mes)}">${signo(f.mes)}</td><td class="n pts ${clase(f.sem)}">${signo(f.sem)}</td><td class="n">${f.n}</td>
                <td style="font-size:12.5px">${f.ult ? `${ICO[f.ult.tipo] || '•'} ${esc(f.ult.detalle || '')} <span class="hint">(${fD(fechaDe(f.ult))})</span>` : '<span class="hint">sin eventos todavía</span>'}</td></tr>`).join('')}
            ${!filas.length ? '<tr><td colspan="7" class="empty">No hay personas con rol instalador, ayudante o chofer en el equipo.</td></tr>' : ''}
            </tbody></table></div>
            <div class="card">
                <b>👔 Dar o quitar puntos a mano</b>
                <div class="hint" style="margin-bottom:8px">Para reconocer algo que el sistema no mide (una obra impecable, ayudar a un compañero) o descontar por algo grave. Queda registrado con tu nombre y el motivo, la persona lo ve igual que los demás eventos.</div>
                <div class="frm">
                    <div><label>Persona</label><select id="m-email">${equipo.map(u => `<option value="${esc(u.email)}">${esc(u.nombre || u.email)}</option>`).join('')}</select></div>
                    <div><label>Puntos (negativo para quitar)</label><input type="number" id="m-pts" value="5" step="1"></div>
                    <div style="grid-column:1/-1"><label>Motivo (lo verá la persona)</label><input type="text" id="m-motivo" maxlength="200" placeholder="Ej: Dejó la obra de Altea 11 impecable y el cliente llamó para agradecer"></div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="btn" onclick="darPuntos()">Registrar</button><span class="ok" id="m-ok"></span></div>
            </div>`;
    }
    window.darPuntos = async () => {
        const email = document.getElementById('m-email').value, pts = Math.round(Number(document.getElementById('m-pts').value) || 0), motivo = document.getElementById('m-motivo').value.trim();
        const ok = document.getElementById('m-ok');
        if (!email || !pts || !motivo) { ok.style.color = '#d9483b'; ok.textContent = 'Elige persona, puntos distintos de 0 y escribe el motivo.'; return; }
        const u = equipo.find(x => x.email === email) || {};
        const id = `${ek(email)}__supervisor__${Date.now()}`;
        try {
            await setDoc(doc(db, 'puntos', id), { email, nombre: u.nombre || email, origen: 'supervisor', tipo: 'supervisor', ref: id, puntos: pts, detalle: `${motivo} — ${usuario.nombre}`, fechaEvento: hoyStr(), fecha: serverTimestamp(), creadoPor: usuario.email });
            ok.style.color = '#1f9d61'; ok.textContent = `Listo: ${signo(pts)} para ${u.nombre || email}.`; document.getElementById('m-motivo').value = '';
        } catch (e) { ok.style.color = '#d9483b'; ok.textContent = 'Error: ' + e.message; }
    };
    window.borrarEvento = async (id) => { if (!confirm('¿Borrar este evento de puntos? No se puede deshacer.')) return; try { await deleteDoc(doc(db, 'puntos', id)); } catch (e) { alert('Error: ' + e.message); } };

    // ---- Vista de una persona (la misma que verá el equipo) -------------------------------------
    function htmlVista(email, admin) {
        const u = equipo.find(x => x.email === email) || { email, nombre: email === usuario.email ? usuario.nombre : email };
        const ev = de(email);
        const total = suma(ev), mes = suma(ev.filter(e => fechaDe(e).startsWith(mesActual()))), sem = suma(ev.filter(e => fechaDe(e) >= hace7()));
        const porDia = {};
        ev.forEach(e => { const f = fechaDe(e); (porDia[f] = porDia[f] || []).push(e); });
        const dias = Object.keys(porDia).sort().reverse();
        return `
            ${admin ? `<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>Ver como:</b><select onchange="verPersona(this.value)" style="padding:9px 10px;border:1.5px solid #ddd;border-radius:9px;font-family:'Arimo';font-size:14px">${equipo.map(x => `<option value="${esc(x.email)}" ${x.email === email ? 'selected' : ''}>${esc(x.nombre || x.email)}</option>`).join('')}</select><span class="hint">Así se verá la pantalla de esta persona cuando actives la visibilidad.</span></div>` : ''}
            <div class="kpis">
                <div class="kpi ${clase(total)}"><div class="v">${signo(total)}</div><div class="l">puntos en total${admin ? '' : ' · ' + esc(u.nombre || '')}</div></div>
                <div class="kpi ${clase(mes)}"><div class="v">${signo(mes)}</div><div class="l">este mes</div></div>
                <div class="kpi ${clase(sem)}"><div class="v">${signo(sem)}</div><div class="l">últimos 7 días</div></div>
            </div>
            <div class="card">
                <b>¿Cómo se ganan y se pierden?</b>
                <div class="hint" style="margin-top:4px">${resumenReglas()}</div>
            </div>
            <div class="card">
                <b>Historial</b>
                ${!dias.length ? `<p class="empty">Todavía no hay eventos. El sistema evalúa cada noche a las 11:45 pm desde el ${fD(config.desde)}.</p>` : ''}
                ${dias.map(f => `<div style="margin-top:10px;font-weight:bold;color:var(--artal-blue);font-size:13px">${fD(f)} <span class="pts ${clase(suma(porDia[f]))}" style="font-weight:normal">(${signo(suma(porDia[f]))})</span></div>
                    ${porDia[f].map(e => `<div class="ev"><div class="ico">${ICO[e.tipo] || ICO[e.origen] || '•'}</div><div class="txt">${esc(e.detalle || e.tipo)}${admin ? ` <span class="meta">· ${esc(e.origen || '')}${e.creadoPor && e.creadoPor !== 'sistema' ? ' · ' + esc(e.creadoPor) : ''} <a href="#" style="color:#d9483b" onclick="borrarEvento('${esc(e.id)}');return false;" title="Borrar">🗑</a></span>` : ''}</div><div class="p pts ${clase(Number(e.puntos) || 0)}">${signo(Number(e.puntos) || 0)}</div></div>`).join('')}`).join('')}
            </div>`;
    }
    function resumenReglas() {
        const R = config.reglas;
        return [
            `📝 Parte diario antes de las ${config.horaLimiteParte}: <b>${signo(R.parteATiempo)}</b> · después, el mismo día: <b>${signo(R.parteTarde)}</b> · día sin parte: <b>${signo(R.parteFalta)}</b>.`,
            `🔧 Trabajo completado el día agendado: <b>${signo(R.trabajoATiempo)}</b> · un día después: <b>${signo(R.trabajoUnDia)}</b> · dos o más: <b>${signo(R.trabajoTarde)}</b> · agendado y olvidado más de ${config.diasVencido} días: <b>${signo(R.trabajoVencido)}</b>.`,
            `✉️ Comunicado leído en menos de 24 h: <b>${signo(R.msgLeido24)}</b> · sin leer a las 48 h: <b>${signo(R.msgNoLeido48)}</b>.`,
            `⭐ El cliente califica el trabajo: 5★ <b>${signo(R.encuesta5)}</b> · 4★ <b>${signo(R.encuesta4)}</b> · 3★ <b>${signo(R.encuesta3)}</b> · 2★ <b>${signo(R.encuesta2)}</b> · 1★ <b>${signo(R.encuesta1)}</b>.`,
            `🎓 Aprobar un examen de la Academia suma los puntos del curso. 👔 Gerencia puede sumar o restar a mano con un motivo.`
        ].join('<br>');
    }
    function renderMio() {
        if (!config.visibleEquipo) {
            cont.innerHTML = `<div class="card lock"><div class="big">🔒</div><h2>Próximamente</h2><p>Aquí verás tus puntos por usar bien la plataforma: parte diario a tiempo, trabajos completados el día agendado, comunicados leídos y la opinión de los clientes.<br>Gerencia lo activará cuando esté listo.</p></div>`;
            return;
        }
        cont.innerHTML = htmlVista(usuario.email, false);
    }

    // ---- Encuestas (admin) ---------------------------------------------------------------------
    const waTexto = (e) => encodeURIComponent(`Hola${e.respuesta && e.respuesta.nombre ? ' ' + e.respuesta.nombre : ''}, somos ARTAL. Acabamos de terminar el trabajo en ${[e.cliente, e.obra].filter(Boolean).join(' — ')}. ¿Nos regalas 1 minuto para contarnos cómo fue? 🙏\n${e.url || (URL_BASE + 'ops/satisfaccion.html?t=' + e.id)}`);
    function htmlEncuestas() {
        const pend = encuestas.filter(e => e.estado !== 'respondida'), resp = encuestas.filter(e => e.estado === 'respondida');
        const prom = resp.length ? (resp.reduce((s, e) => s + (Number(e.respuesta && e.respuesta.general) || 0), 0) / resp.length).toFixed(1) : '—';
        const tarjeta = (e) => {
            const r = e.respuesta || {}; const g = Number(r.general) || 0;
            return `<div class="enc ${e.estado === 'respondida' ? 'resp' : ''}">
                <div class="t">${esc([e.cliente, e.obra].filter(Boolean).join(' — '))}</div>
                <div class="m">Trabajo completado el ${fD(e.fechaTrabajo)}${e.completadoPor ? ' por ' + esc(e.completadoPor) : ''} · equipo: ${esc((e.asignados || []).map(a => a.nombre || a.email).join(', ') || '—')}</div>
                ${e.estado === 'respondida' ? `<div class="m"><span class="stars">${'★'.repeat(g)}${'☆'.repeat(5 - g)}</span> <b>${g}/5</b>${r.puntualidad ? ' · puntualidad ' + r.puntualidad : ''}${r.limpieza ? ' · limpieza ' + r.limpieza : ''}${r.trato ? ' · trato ' + r.trato : ''}${r.recomendaria != null ? ' · ¿recomendaría? ' + (r.recomendaria ? 'sí' : 'no') : ''}${r.comentario ? '<br>«' + esc(r.comentario) + '»' : ''}${r.nombre ? ' — ' + esc(r.nombre) : ''} <span class="hint">(${fD(r.fecha)}) · ${signo(Number(e.puntosAplicados) || 0)} pts a cada asignado</span></div>`
                : `<div class="m">⏳ Pendiente de respuesta del cliente. Enlace: <span class="hint" style="word-break:break-all">${esc(e.url || '')}</span></div>
                   <div class="acts"><a class="btn" style="background:#25D366" href="https://wa.me/?text=${waTexto(e)}" target="_blank" rel="noopener">📲 Enviar por WhatsApp</a><button class="btn o" onclick="copiar('${esc(e.url || '')}', this)">⧉ Copiar enlace</button></div>`}
            </div>`;
        };
        return `
            <div class="kpis">
                <div class="kpi"><div class="v">${pend.length}</div><div class="l">encuestas pendientes de enviar / responder</div></div>
                <div class="kpi pos"><div class="v">${resp.length}</div><div class="l">respondidas</div></div>
                <div class="kpi"><div class="v">${prom}</div><div class="l">calificación promedio (de 5)</div></div>
            </div>
            <p class="hint" style="margin:0 0 10px">Cada trabajo de instalación completado genera una encuesta con un enlace único. El instalador (o tú) se lo manda al cliente por WhatsApp desde la tarjeta del trabajo en Instalación, o desde aquí. Al responder, los puntos se aplican a los asignados y te llega el resultado por Mensajería.</p>
            ${encuestas.length ? [...pend, ...resp].map(tarjeta).join('') : '<p class="empty">Todavía no hay encuestas: se crean solas al completar trabajos desde el ' + fD(config.desde) + '.</p>'}`;
    }
    window.copiar = async (txt, btn) => { try { await navigator.clipboard.writeText(txt); const o = btn.textContent; btn.textContent = '✓ Copiado'; setTimeout(() => btn.textContent = o, 1500); } catch (_) { prompt('Copia el enlace:', txt); } };

    // ---- Reglas (admin) ------------------------------------------------------------------------
    function htmlReglas() {
        const R = config.reglas;
        return `
            <div class="card">
                <label style="display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer"><input type="checkbox" id="r-visible" ${config.visibleEquipo ? 'checked' : ''} style="width:20px;height:20px"> <b>El equipo puede ver sus puntos</b></label>
                <div class="hint" style="margin:4px 0 0 30px">Apagado = solo gerencia ve esta pantalla; el equipo ve "Próximamente". Enciéndelo cuando las reglas estén definidas. Al encenderlo aparece el enlace "⭐ Mis puntos" en Instalación y Academia.</div>
                <div class="frm" style="margin-top:12px">
                    <div><label>Se cuentan los puntos desde</label><input type="date" id="r-desde" value="${esc(config.desde)}"></div>
                    <div><label>Hora límite del parte diario</label><input type="time" id="r-hora" value="${esc(config.horaLimiteParte)}"></div>
                    <div><label>Trabajo "olvidado" después de (días)</label><input type="number" id="r-venc" min="1" value="${Number(config.diasVencido) || 3}"></div>
                </div>
            </div>
            <div class="card">
                <b>Puntos por evento</b> <span class="hint">(positivo suma, negativo resta)</span>
                ${REGLAS_TXT.map(([k, txt]) => `<div class="regla"><span>${txt}</span><input type="number" step="1" id="r-${k}" value="${Number(R[k]) || 0}"></div>`).join('')}
                <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="guardarReglas()">💾 Guardar reglas</button><span class="ok" id="r-ok"></span></div>
            </div>
            <div class="card">
                <b>Evaluación</b>
                <div class="hint" style="margin:4px 0 10px">El sistema evalúa solo cada noche a las 11:45 pm (hora RD) el día que termina. Puedes forzarla ahora para hoy o para un día concreto: volver a evaluar un día no duplica puntos, solo actualiza.${ultima ? ` Última corrida: ${ultima.fecha ? fD(ultima.fecha) : ''} — ${ultima.partes || 0} partes, ${ultima.trabajos || 0} trabajos, ${ultima.vencidos || 0} vencidos, ${ultima.mensajes || 0} comunicados${ultima.omitido ? ' (omitida: anterior a la fecha de inicio)' : ''}.` : ''}</div>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="date" id="e-fecha" value="${hoyStr()}" style="padding:9px 10px;border:1.5px solid #ddd;border-radius:9px;font-family:'Arimo';font-size:14px"><button class="btn o" id="e-btn" onclick="evaluar()">▶ Evaluar esa fecha ahora</button><span class="ok" id="e-ok"></span></div>
            </div>`;
    }
    window.guardarReglas = async () => {
        const ok = document.getElementById('r-ok');
        const reglas = {}; REGLAS_TXT.forEach(([k]) => reglas[k] = Math.round(Number(document.getElementById('r-' + k).value) || 0));
        try {
            await setDoc(doc(db, 'puntosConfig', 'general'), { visibleEquipo: document.getElementById('r-visible').checked, desde: document.getElementById('r-desde').value || DEF.desde, horaLimiteParte: document.getElementById('r-hora').value || '18:00', diasVencido: Math.max(1, Math.round(Number(document.getElementById('r-venc').value) || 3)), reglas, actualizadoPor: usuario.email, actualizado: serverTimestamp() }, { merge: true });
            ok.style.color = '#1f9d61'; ok.textContent = 'Guardado. Los eventos futuros usan estos valores (los ya registrados no cambian).';
        } catch (e) { ok.style.color = '#d9483b'; ok.textContent = 'Error: ' + e.message; }
    };
    window.evaluar = async () => {
        const ok = document.getElementById('e-ok'), btn = document.getElementById('e-btn'); btn.disabled = true; ok.style.color = '#667'; ok.textContent = 'Evaluando…';
        try {
            const tok = await auth.currentUser.getIdToken();
            const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify({ fecha: document.getElementById('e-fecha').value }) });
            const j = await r.json();
            if (!r.ok || j.error) throw new Error(j.error || r.status);
            ok.style.color = '#1f9d61'; ok.textContent = j.omitido ? 'Fecha anterior al inicio: no se evalúa.' : `Listo: ${j.partes} partes · ${j.trabajos} trabajos · ${j.vencidos} vencidos · ${j.mensajes} comunicados.`;
        } catch (e) { ok.style.color = '#d9483b'; ok.textContent = 'Error: ' + e.message; }
        btn.disabled = false;
    };
</script>
</body>
</html>
