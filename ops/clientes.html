<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 900px; }
    .intro { color: #667; font-size: 13px; margin: 0 0 12px; }
    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 8px 14px; }
    .kpi .n { font-size: 18px; font-weight: bold; color: var(--artal-blue); line-height: 1; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar input.buscar, .bar select { padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; }
    .bar input.buscar { flex: 1; min-width: 160px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .cli-card { display: flex; align-items: flex-start; gap: 14px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--artal-blue); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex: 0 0 auto; }
    .cli-info { flex: 1; min-width: 0; }
    .cli-info b { color: var(--artal-blue); font-size: 15.5px; }
    .cli-info .meta { font-size: 12.5px; color: #667; margin-top: 3px; }
    .badges { display: inline-flex; gap: 6px; flex-wrap: wrap; vertical-align: middle; }
    .b { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; letter-spacing: .3px; }
    .b.activo { background: #e7f7ee; color: #1f9d61; } .b.inactivo { background: #f1f1f4; color: #8a93a0; }
    .b.internacional { background: #eef3ff; color: #3457b2; } .b.credito { background: #fff2dc; color: #c07a12; }
    .b.dgii { background: #e6f7f6; color: #12908a; } .b.doc { background: #f3eefb; color: #7d3ac1; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button { border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; min-height: 38px; }
    .b-editar { background: var(--artal-blue); color: #fff; }
    .b-toggle { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue) !important; }
    .b-borrar { background: transparent; color: #e74c3c; border: 1.5px solid #e74c3c !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 11px 0 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .modal-box textarea { min-height: 56px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .chk-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; } .chk-line input { width: auto; min-height: 0; } .chk-line label { margin: 0; font-weight: normal; color: #333; font-size: 13.5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="ventas.html" title="Volver a Ventas">← Ventas</a>
        <a class="btn-back" href="index.html" title="Ir al Panel de Control">🏠 Panel</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Clientes</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <p class="intro">Directorio de clientes de ARTAL. Se integra con los clientes que ya sincroniza el cuaderno de medidas.</p>
    <div class="kpis" id="kpis"></div>
    <div class="bar">
        <button class="btn-y" onclick="abrirNuevo()">+ Crear cliente</button>
        <input class="buscar" id="buscar" placeholder="Buscar por nombre, documento, teléfono, ciudad…" oninput="render()">
        <select id="f-estado" onchange="render()"><option value="">Estado: todos</option><option value="activo">Activos</option><option value="inactivo">No activos</option></select>
        <select id="f-tipo" onchange="render()"><option value="">Nac./Int.: todos</option><option value="nacional">Nacional</option><option value="internacional">Internacional</option></select>
    </div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 id="modal-title">Crear cliente</h2>
        <label>Nombre / Razón social *</label>
        <input type="text" id="c-nombre" placeholder="Nombre del cliente o empresa">
        <div class="grid2">
            <div><label>Tipo de cliente</label><select id="c-tipocli"><option value="nacional">Nacional</option><option value="internacional">Internacional</option></select></div>
            <div><label>Crédito</label><select id="c-credito"><option value="contado">Contado</option><option value="credito">Crédito</option></select></div>
        </div>
        <div class="grid2">
            <div><label>Tipo de documento</label><select id="c-tipodoc"><option value="">Sin documento</option><option value="RNC">RNC</option><option value="Cédula">Cédula</option><option value="Pasaporte">Pasaporte</option></select></div>
            <div><label>Número de documento</label><input type="text" id="c-documento" placeholder="RNC / Cédula / Pasaporte"></div>
        </div>
        <div class="grid2">
            <div><label>Teléfono</label><input type="tel" id="c-telefono" placeholder="809-000-0000"></div>
            <div><label>Correo</label><input type="email" id="c-correo" placeholder="correo@ejemplo.com"></div>
        </div>
        <div class="grid2">
            <div><label>Ciudad</label><input type="text" id="c-ciudad" placeholder="Santo Domingo…"></div>
            <div><label>Categoría <span class="lbl-opt">— opcional</span></label><input type="text" id="c-categoria" list="cat-list" placeholder="Ej. Constructora, Particular…"><datalist id="cat-list"><option value="Particular"></option><option value="Constructora"></option><option value="Arquitecto/Diseñador"></option><option value="Empresa"></option><option value="Recurrente"></option></datalist></div>
        </div>
        <label>Dirección</label>
        <input type="text" id="c-direccion" placeholder="Dirección">
        <label>Lista de precios <span class="lbl-opt">— la que se le aplica al cotizar</span></label>
        <select id="c-lista"><option value="">— Pública / por defecto —</option></select>
        <div class="grid2">
            <div><label>Estado</label><select id="c-estado"><option value="activo">Activo</option><option value="inactivo">No activo</option></select></div>
            <div class="chk-line" style="align-self:end"><input type="checkbox" id="c-dgii"><label for="c-dgii">Verificado por DGII</label></div>
        </div>
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <textarea id="c-notas" placeholder="Información adicional…"></textarea>
        <p class="intro" style="margin:8px 0 0">La verificación automática de RNC con la DGII llegará al conectar Citrus; por ahora «Verificado por DGII» se marca a mano.</p>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar()">Cancelar</button>
            <button class="btn-guardar" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    // Equipo de cotizaciones + admin (los que arman cotizaciones/pedidos usan el directorio).
    const usuario = await requireAuth(['cotizaciones']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const iniciales = (n) => (String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('') || '?').toUpperCase();
    const normKey = (s) => String(s || '').trim().toLowerCase();  // misma clave que el cuaderno (normClienteKey)

    let clientes = [], listas = [], editId = null;

    onSnapshot(collection(db, 'clientes'), (snap) => {
        clientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    // Listas de precios (Ventas → Listas de precios) para asignarle una a cada cliente.
    onSnapshot(collection(db, 'ventasListasPrecios'), (snap) => {
        listas = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.activo !== false).sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));
        const sel = document.getElementById('c-lista'); const cur = sel.value;
        sel.innerHTML = '<option value="">— Pública / por defecto —</option>' + listas.map(l => `<option value="${esc(l.id)}">${esc(l.nombre)}${l.publica ? ' ⭐' : ''}</option>`).join('');
        sel.value = cur;
        render();
    }, () => {});
    const listaNombre = (id) => { const l = listas.find(x => x.id === id); return l ? l.nombre : ''; };

    const estadoDe = (c) => c.estado || 'activo';
    const tipoDe = (c) => c.tipoCliente || 'nacional';

    window.abrirNuevo = function () {
        editId = null;
        document.getElementById('modal-title').textContent = 'Crear cliente';
        ['c-nombre', 'c-documento', 'c-telefono', 'c-correo', 'c-ciudad', 'c-categoria', 'c-direccion', 'c-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('c-tipocli').value = 'nacional';
        document.getElementById('c-credito').value = 'contado';
        document.getElementById('c-tipodoc').value = '';
        document.getElementById('c-estado').value = 'activo';
        document.getElementById('c-dgii').checked = false;
        document.getElementById('c-lista').value = '';
        document.getElementById('modal').classList.add('show');
    };
    window.editar = function (id) {
        const c = clientes.find(x => x.id === id); if (!c) return;
        editId = id;
        document.getElementById('modal-title').textContent = 'Editar cliente';
        document.getElementById('c-nombre').value = c.nombre || '';
        document.getElementById('c-tipocli').value = tipoDe(c);
        document.getElementById('c-credito').value = c.credito || 'contado';
        document.getElementById('c-tipodoc').value = c.tipoDocumento || '';
        document.getElementById('c-documento').value = c.documento || '';
        document.getElementById('c-telefono').value = c.telefono || '';
        document.getElementById('c-correo').value = c.correo || '';
        document.getElementById('c-ciudad').value = c.ciudad || '';
        document.getElementById('c-categoria').value = c.categoria || '';
        document.getElementById('c-direccion').value = c.direccion || '';
        document.getElementById('c-estado').value = estadoDe(c);
        document.getElementById('c-dgii').checked = !!c.verificadoDGII;
        document.getElementById('c-lista').value = c.listaPreciosId || '';
        document.getElementById('c-notas').value = c.notas || '';
        document.getElementById('modal').classList.add('show');
    };
    window.cerrar = function () { document.getElementById('modal').classList.remove('show'); };

    window.guardar = async function () {
        const nombre = document.getElementById('c-nombre').value.trim();
        if (!nombre) { alert('Escribe el nombre del cliente.'); return; }
        const datos = {
            nombre,
            tipoCliente: document.getElementById('c-tipocli').value,
            credito: document.getElementById('c-credito').value,
            tipoDocumento: document.getElementById('c-tipodoc').value,
            documento: document.getElementById('c-documento').value.trim(),
            telefono: document.getElementById('c-telefono').value.trim(),
            correo: document.getElementById('c-correo').value.trim(),
            ciudad: document.getElementById('c-ciudad').value.trim(),
            categoria: document.getElementById('c-categoria').value.trim(),
            direccion: document.getElementById('c-direccion').value.trim(),
            estado: document.getElementById('c-estado').value,
            verificadoDGII: document.getElementById('c-dgii').checked,
            listaPreciosId: document.getElementById('c-lista').value,
            listaPreciosNombre: listaNombre(document.getElementById('c-lista').value),
            actualizado: serverTimestamp(), actualizadoPor: usuario.nombre
        };
        try {
            // ID = clave normalizada del nombre (misma que usa el cuaderno) para NO duplicar.
            // merge:true para conservar `obras` u otros campos que sincroniza el cuaderno.
            const id = editId || normKey(nombre);
            await setDoc(doc(db, 'clientes', id), datos, { merge: true });
            cerrar();
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
    };
    window.toggle = async function (id) {
        const c = clientes.find(x => x.id === id); if (!c) return;
        try { await updateDoc(doc(db, 'clientes', id), { estado: estadoDe(c) === 'activo' ? 'inactivo' : 'activo' }); }
        catch (e) { alert('No se pudo: ' + e.message); }
    };
    window.borrar = async function (id) {
        const c = clientes.find(x => x.id === id) || {};
        if (!confirm('¿Eliminar a "' + (c.nombre || '') + '" del directorio?\n\n(Si vuelve a aparecer en una medida del cuaderno, se recreará automáticamente.)')) return;
        try { await deleteDoc(doc(db, 'clientes', id)); } catch (e) { alert('No se pudo eliminar: ' + e.message); }
    };

    function render() {
        const term = (document.getElementById('buscar').value || '').toLowerCase().trim();
        const fe = document.getElementById('f-estado').value, ft = document.getElementById('f-tipo').value;
        // KPIs
        const total = clientes.length;
        const nac = clientes.filter(c => tipoDe(c) === 'nacional').length;
        const int = clientes.filter(c => tipoDe(c) === 'internacional').length;
        const act = clientes.filter(c => estadoDe(c) === 'activo').length;
        const inact = clientes.filter(c => estadoDe(c) === 'inactivo').length;
        const dgii = clientes.filter(c => c.verificadoDGII).length;
        const rnc = clientes.filter(c => c.tipoDocumento === 'RNC' && c.documento).length;
        document.getElementById('kpis').innerHTML = [
            ['Total', total], ['Nacional', nac], ['Internacional', int], ['Activos', act], ['No activos', inact], ['Verif. DGII', dgii], ['Con RNC', rnc]
        ].map(([l, n]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

        let lista = clientes.slice();
        if (fe) lista = lista.filter(c => estadoDe(c) === fe);
        if (ft) lista = lista.filter(c => tipoDe(c) === ft);
        if (term) lista = lista.filter(c => [c.nombre, c.documento, c.telefono, c.correo, c.ciudad, c.categoria].some(v => String(v || '').toLowerCase().includes(term)));
        lista.sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));

        const cont = document.getElementById('lista');
        if (!clientes.length) { cont.innerHTML = '<p class="empty">Aún no hay clientes. Crea el primero con «+ Crear cliente».</p>'; return; }
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin resultados para el filtro.</p>'; return; }
        cont.innerHTML = lista.map(cardHTML).join('');
    }

    function cardHTML(c) {
        const est = estadoDe(c), tipo = tipoDe(c);
        const badges = [
            `<span class="b ${est}">${est === 'activo' ? 'Activo' : 'No activo'}</span>`,
            tipo === 'internacional' ? '<span class="b internacional">Internacional</span>' : '',
            (c.credito === 'credito') ? '<span class="b credito">Crédito</span>' : '',
            c.verificadoDGII ? '<span class="b dgii">✓ DGII</span>' : '',
            (c.tipoDocumento && c.documento) ? `<span class="b doc">${esc(c.tipoDocumento)}</span>` : ''
        ].filter(Boolean).join('');
        const linea2 = [
            (c.tipoDocumento && c.documento) ? esc(c.tipoDocumento + ' ' + c.documento) : '',
            c.telefono ? '📞 ' + esc(c.telefono) : '',
            c.ciudad ? '📍 ' + esc(c.ciudad) : '',
            c.categoria ? '🏷️ ' + esc(c.categoria) : '',
            c.listaPreciosId ? '💲 ' + esc(listaNombre(c.listaPreciosId) || c.listaPreciosNombre || 'Lista') : ''
        ].filter(Boolean).join('  ·  ');
        return `<div class="order-card cli-card">
            <span class="avatar">${esc(iniciales(c.nombre))}</span>
            <div class="cli-info">
                <b>${esc(c.nombre) || 'Sin nombre'}</b> <span class="badges">${badges}</span>
                ${linea2 ? `<div class="meta">${linea2}</div>` : ''}
                ${c.correo ? `<div class="meta">✉ ${esc(c.correo)}</div>` : ''}
            </div>
            <div class="row-actions">
                <button class="b-editar" onclick="editar('${c.id}')">✏ Editar</button>
                <button class="b-toggle" onclick="toggle('${c.id}')">${est === 'activo' ? 'Desactivar' : 'Activar'}</button>
                <button class="b-borrar" onclick="borrar('${c.id}')">🗑</button>
            </div>
        </div>`;
    }
</script>

</body>
</html>
