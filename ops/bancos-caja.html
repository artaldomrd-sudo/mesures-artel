<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Caja Chica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 920px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar select { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; min-width: 200px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-g { background: #e74c3c; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-r { background: #2ecc71; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-o { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue); border-radius: 9px; padding: 10px 14px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-a { background: #6c5ce7; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .arq-alert { display: flex; align-items: center; gap: 10px; background: #fdecea; border: 1.5px solid #f5b7b1; color: #a5281b; border-radius: 12px; padding: 12px 16px; margin: 0 0 12px; font-weight: bold; font-size: 14px; }
    .arq-ok { display: flex; flex-wrap: wrap; gap: 8px 18px; background: #ecf9f1; border: 1.5px solid #b7e4c7; color: #1e7a48; border-radius: 12px; padding: 10px 16px; margin: 0 0 12px; font-size: 13px; }
    .arq-ok b { color: #1e7a48; }
    .arq-ok .dif { color: #c0392b; font-weight: bold; }
    .mv-card.arqueo { border-left-color: #6c5ce7; } .mv-ic.arqueo { background: #eee9fb; }
    .mv-monto.arqueo { color: #6c5ce7; }
    .mv-fotos-wrap { margin-top: 8px; }

    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 10px 16px; flex: 1; min-width: 130px; }
    .kpi .n { font-size: 18px; font-weight: bold; line-height: 1; } .kpi .n.fondo { color: var(--artal-blue); } .kpi .n.saldo { color: #1f9d61; } .kpi .n.rep { color: #c07a12; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
    .caja-meta { font-size: 12.5px; color: #667; margin: -6px 0 12px; }

    .mv-card { display: flex; align-items: flex-start; gap: 12px; border-left: 4px solid #ccc; }
    .mv-card.gasto { border-left-color: #e74c3c; } .mv-card.reposicion { border-left-color: #2ecc71; } .mv-card.apertura { border-left-color: #2f6fd0; }
    .mv-ic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 auto; }
    .mv-ic.gasto { background: #fdeaea; } .mv-ic.reposicion { background: #e7f7ee; } .mv-ic.apertura { background: #e9f0fb; }
    .mv-info { flex: 1; min-width: 0; } .mv-info b { color: var(--artal-blue); font-size: 14px; }
    .mv-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .mv-monto { font-weight: bold; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .mv-monto.gasto { color: #d9483b; } .mv-monto.reposicion, .mv-monto.apertura { color: #1f9d61; }
    .b { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 20px; background: #eef1f4; color: #556; }
    .del-btn { background: transparent; border: none; color: #c9ced6; cursor: pointer; font-size: 15px; } .del-btn:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 14px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 11px 0 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="bancos.html" title="Volver">← Bancos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Caja Chica</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar">
        <select id="sel-caja" onchange="render()"></select>
        <button class="btn-o" onclick="abrirCaja()">+ Nueva caja</button>
        <button class="btn-g" onclick="abrirGasto()">− Gasto</button>
        <button class="btn-r" onclick="abrirRepo()">+ Reponer fondo</button>
        <button class="btn-a" onclick="abrirArqueo()">🧮 Arqueo</button>
        <button class="btn-o" onclick="abrirReporte()">📊 Reporte</button>
    </div>
    <div id="arqueo-banner"></div>
    <div class="kpis" id="kpis"></div>
    <div class="caja-meta" id="caja-meta"></div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<datalist id="suc-list"></datalist>
<datalist id="cat-caja"><option value="Combustible / transporte"></option><option value="Alimentación / atenciones"></option><option value="Materiales menores"></option><option value="Herramientas menores"></option><option value="Papelería / oficina"></option><option value="Mensajería / envíos"></option><option value="Limpieza"></option><option value="Mantenimiento menor"></option><option value="Peajes / parqueo"></option><option value="Otro gasto"></option></datalist>

<!-- Modal: nueva caja -->
<div class="modal-overlay" id="modal-caja">
    <div class="modal-box">
        <h2>Nueva caja chica</h2>
        <label>Nombre *</label>
        <input type="text" id="c-nombre" placeholder="Ej. Caja Showroom Las Terrenas">
        <div class="grid2">
            <div><label>Sucursal / área</label><input type="text" id="c-suc" list="suc-list" placeholder="Sucursal"></div>
            <div><label>Responsable</label><input type="text" id="c-resp" placeholder="Nombre"></div>
        </div>
        <label>Fondo fijo (RD$) *</label>
        <input type="number" id="c-fondo" min="0" step="0.01" placeholder="Ej. 10000">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-caja')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarCaja()">Crear caja</button>
        </div>
    </div>
</div>

<!-- Modal: gasto -->
<div class="modal-overlay" id="modal-gasto">
    <div class="modal-box">
        <h2>Gasto de caja chica</h2>
        <div class="grid2">
            <div><label>Fecha</label><input type="date" id="g-fecha"></div>
            <div><label>Monto (RD$) *</label><input type="number" id="g-monto" min="0" step="0.01"></div>
        </div>
        <label>Concepto *</label>
        <input type="text" id="g-concepto" placeholder="Ej. Gasolina motor, café reunión…">
        <div class="grid2">
            <div><label>Categoría</label><input type="text" id="g-categoria" list="cat-caja" placeholder="Categoría"></div>
            <div><label>Referencia <span class="lbl-opt">— opcional</span></label><input type="text" id="g-ref" placeholder="Nº recibo"></div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:normal;font-size:13px;color:#333;"><input type="checkbox" id="g-conta" checked style="width:auto;min-height:auto"> Registrar también en <b>Contabilidad (Gastos)</b></label>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-gasto')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarGasto()">Registrar gasto</button>
        </div>
    </div>
</div>

<!-- Modal: reposición -->
<div class="modal-overlay" id="modal-repo">
    <div class="modal-box">
        <h2>Reponer fondo</h2>
        <div class="grid2">
            <div><label>Fecha</label><input type="date" id="r-fecha"></div>
            <div><label>Monto (RD$) *</label><input type="number" id="r-monto" min="0" step="0.01"></div>
        </div>
        <label>Sale de la cuenta bancaria <span class="lbl-opt">— opcional (genera el débito)</span></label>
        <select id="r-cuenta"><option value="">— Solo registrar en la caja —</option></select>
        <label>Referencia <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="r-ref" placeholder="Nº cheque/transf.">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-repo')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarRepo()">Reponer</button>
        </div>
    </div>
</div>

<!-- Modal: arqueo (conteo de efectivo real) -->
<div class="modal-overlay" id="modal-arqueo">
    <div class="modal-box">
        <h2>🧮 Arqueo de caja</h2>
        <div class="caja-meta" id="arq-esperado" style="margin:0 0 10px"></div>
        <div class="grid2">
            <div><label>Turno</label><select id="a-turno"><option value="am">Mañana (8:00 am)</option><option value="pm">Tarde (4:55 pm)</option></select></div>
            <div><label>Fecha</label><input type="date" id="a-fecha"></div>
        </div>
        <label>Efectivo REAL contado (RD$) *</label>
        <input type="number" id="a-monto" min="0" step="0.01" oninput="calcDifArqueo()" placeholder="Cuenta el efectivo físico y ponlo aquí">
        <div class="caja-meta" id="a-dif" style="margin:8px 0 0"></div>
        <label>Nota <span class="lbl-opt">— obligatoria si hay diferencia</span></label>
        <input type="text" id="a-nota" placeholder="Ej: falta RD$200, se prestó a…">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-arqueo')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarArqueo()">Guardar arqueo</button>
        </div>
    </div>
</div>

<!-- Modal: reporte por período -->
<div class="modal-overlay" id="modal-reporte">
    <div class="modal-box" style="max-width:640px">
        <h2>📊 Reporte por período</h2>
        <div class="grid2">
            <div><label>Desde</label><input type="date" id="rep-desde"></div>
            <div><label>Hasta</label><input type="date" id="rep-hasta"></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:12px;">
            <button class="btn-cancelar" style="flex:1" onclick="cerrar('modal-reporte')">Cerrar</button>
            <button class="btn-guardar" style="flex:1" onclick="generarReporte()">Generar</button>
        </div>
        <div id="rep-out" style="margin-top:16px"></div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { fotosThumbsHTML, fotoAddBtnHTML } from './fotos.js?v=20260812';
    import { collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['contable']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { maximumFractionDigits: 0 });
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: '2-digit', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    let cajas = [], movs = [], cuentas = [];

    onSnapshot(collection(db, 'bancosCajaChica'), (s) => {
        cajas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.activo !== false).sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));
        llenarCajas(); render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'bancosCajaMovimientos'), (s) => { movs = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    onSnapshot(collection(db, 'bancosCuentas'), (s) => {
        cuentas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.activo !== false);
        const sel = document.getElementById('r-cuenta'); const cur = sel.value;
        sel.innerHTML = '<option value="">— Solo registrar en la caja —</option>' + cuentas.map(c => `<option value="${esc(c.id)}">${esc(c.alias)}</option>`).join(''); sel.value = cur;
    }, () => {});
    onSnapshot(collection(db, 'rrhhSucursales'), (s) => {
        const nombres = s.docs.map(d => (d.data().nombre || '')).filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));
        document.getElementById('suc-list').innerHTML = nombres.map(n => `<option value="${esc(n)}"></option>`).join('');
    }, () => {});

    function llenarCajas() {
        const sel = document.getElementById('sel-caja'); const cur = sel.value;
        sel.innerHTML = cajas.length ? cajas.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}${c.sucursal ? ' — ' + esc(c.sucursal) : ''}</option>`).join('') : '<option value="">— Sin cajas —</option>';
        if (cur && cajas.some(c => c.id === cur)) sel.value = cur;
    }
    const cajaSel = () => cajas.find(c => c.id === document.getElementById('sel-caja').value) || null;
    const movsCaja = (id) => movs.filter(m => m.cajaId === id);
    // El saldo solo lo mueven apertura/reposición (+) y gasto (−). El arqueo es un conteo, no mueve.
    const saldoCaja = (id) => movsCaja(id).reduce((a, m) => a + (m.tipo === 'gasto' ? -n2(m.monto) : (m.tipo === 'arqueo' ? 0 : n2(m.monto))), 0);
    const arqueoHoy = (id, turno) => movsCaja(id).find(m => m.tipo === 'arqueo' && m.fecha === hoyISO() && m.turno === turno) || null;

    // ---------- Modales ----------
    window.cerrar = function (id) { document.getElementById(id).classList.remove('show'); };
    window.abrirCaja = function () {
        ['c-nombre', 'c-suc', 'c-resp', 'c-fondo'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('modal-caja').classList.add('show');
    };
    window.guardarCaja = async function () {
        const nombre = document.getElementById('c-nombre').value.trim();
        const fondo = n2(document.getElementById('c-fondo').value);
        if (!nombre) { alert('Escribe el nombre de la caja.'); return; }
        if (fondo <= 0) { alert('Escribe el fondo fijo asignado.'); return; }
        const btn = document.querySelector('#modal-caja .btn-guardar'); btn.disabled = true; btn.textContent = 'Creando…';
        try {
            const ref = await addDoc(collection(db, 'bancosCajaChica'), {
                nombre, sucursal: document.getElementById('c-suc').value.trim(), responsable: document.getElementById('c-resp').value.trim(),
                fondoFijo: fondo, activo: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            // Apertura: entra el efectivo del fondo fijo, para que el saldo arranque en el fondo.
            await addDoc(collection(db, 'bancosCajaMovimientos'), {
                cajaId: ref.id, tipo: 'apertura', fecha: hoyISO(), concepto: 'Apertura de fondo fijo', monto: fondo,
                creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            document.getElementById('sel-caja').value = ref.id;
            cerrar('modal-caja'); render();
        } catch (e) { alert('No se pudo crear: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Crear caja'; }
    };
    window.abrirGasto = function () {
        if (!cajaSel()) { alert('Primero elige (o crea) una caja.'); return; }
        ['g-monto', 'g-concepto', 'g-categoria', 'g-ref'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('g-fecha').value = hoyISO();
        document.getElementById('g-conta').checked = true;
        document.getElementById('modal-gasto').classList.add('show');
    };
    window.guardarGasto = async function () {
        const c = cajaSel(); if (!c) return;
        const concepto = document.getElementById('g-concepto').value.trim();
        const monto = n2(document.getElementById('g-monto').value);
        if (!concepto) { alert('Escribe el concepto.'); return; }
        if (monto <= 0) { alert('Escribe el monto.'); return; }
        const saldo = saldoCaja(c.id);
        if (monto > saldo && !confirm('El gasto (' + fmt(monto) + ') es mayor al efectivo en caja (' + fmt(saldo) + '). ¿Registrarlo igual?')) return;
        const fecha = document.getElementById('g-fecha').value || hoyISO();
        const categoria = document.getElementById('g-categoria').value.trim();
        const referencia = document.getElementById('g-ref').value.trim();
        const aConta = document.getElementById('g-conta').checked;
        const btn = document.querySelector('#modal-gasto .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            // Si va a Contabilidad, se crea primero el gasto ahí para guardar su id en el movimiento
            // de caja (así al borrar el gasto de caja se puede quitar también de Contabilidad).
            let contaMovId = null;
            if (aConta) {
                try {
                    const cref = await addDoc(collection(db, 'contaMovimientos'), {
                        tipo: 'gasto', fecha, concepto, categoria: categoria || 'Caja chica', monto, itbis: 0,
                        metodo: 'Efectivo (caja chica)', tercero: '', rnc: '', ncf: '',
                        notas: 'Caja chica: ' + (c.nombre || '') + (referencia ? ' · ' + referencia : ''),
                        origen: 'caja_chica', cajaId: c.id, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                    });
                    contaMovId = cref.id;
                } catch (e2) { alert('El gasto se guardará en la caja, pero no se pudo pasar a Contabilidad: ' + (e2 && e2.message ? e2.message : e2)); }
            }
            await addDoc(collection(db, 'bancosCajaMovimientos'), {
                cajaId: c.id, tipo: 'gasto', fecha, concepto, categoria, monto, referencia,
                contaMovId, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            cerrar('modal-gasto');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Registrar gasto'; }
    };
    window.abrirRepo = function () {
        const c = cajaSel(); if (!c) { alert('Primero elige (o crea) una caja.'); return; }
        document.getElementById('r-fecha').value = hoyISO();
        // Sugiere reponer justo lo gastado (fondo fijo − saldo actual).
        const porReponer = Math.max(0, n2(c.fondoFijo) - saldoCaja(c.id));
        document.getElementById('r-monto').value = porReponer ? porReponer.toFixed(2) : '';
        document.getElementById('r-cuenta').value = ''; document.getElementById('r-ref').value = '';
        document.getElementById('modal-repo').classList.add('show');
    };
    window.guardarRepo = async function () {
        const c = cajaSel(); if (!c) return;
        const monto = n2(document.getElementById('r-monto').value);
        if (monto <= 0) { alert('Escribe el monto a reponer.'); return; }
        const cuentaId = document.getElementById('r-cuenta').value;
        const ref = document.getElementById('r-ref').value.trim();
        const btn = document.querySelector('#modal-repo .btn-guardar'); btn.disabled = true; btn.textContent = 'Reponiendo…';
        try {
            await addDoc(collection(db, 'bancosCajaMovimientos'), {
                cajaId: c.id, tipo: 'reposicion', fecha: document.getElementById('r-fecha').value || hoyISO(), concepto: 'Reposición de fondo',
                monto, referencia: ref, cuentaBancoId: cuentaId, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            // Si sale de una cuenta bancaria, genera el débito allí (el efectivo se retiró del banco).
            if (cuentaId) {
                const cta = cuentas.find(x => x.id === cuentaId);
                await addDoc(collection(db, 'bancosMovimientos'), {
                    cuentaId, tipo: 'debito', monto, fecha: document.getElementById('r-fecha').value || hoyISO(),
                    descripcion: 'Reposición caja chica: ' + (c.nombre || ''), referencia: ref, origen: 'caja_chica',
                    conciliado: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                });
                if (!cta) { /* cuenta borrada: el movimiento igual queda registrado */ }
            }
            cerrar('modal-repo');
        } catch (e) { alert('No se pudo reponer: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Reponer'; }
    };
    // ---------- Arqueo (conteo de efectivo real vs. sistema) ----------
    window.abrirArqueo = function () {
        const c = cajaSel(); if (!c) { alert('Primero elige (o crea) una caja.'); return; }
        document.getElementById('a-fecha').value = hoyISO();
        // Turno automático según la hora: antes de la 1 pm = mañana; después = tarde.
        document.getElementById('a-turno').value = (new Date().getHours() < 13) ? 'am' : 'pm';
        document.getElementById('a-monto').value = '';
        document.getElementById('a-nota').value = '';
        const esperado = saldoCaja(c.id);
        document.getElementById('arq-esperado').innerHTML = `Según el sistema debe haber <b>${fmt(esperado)}</b> en efectivo. Cuenta el dinero físico y regístralo.`;
        calcDifArqueo();
        document.getElementById('modal-arqueo').classList.add('show');
    };
    window.calcDifArqueo = function () {
        const c = cajaSel(); if (!c) return;
        const el = document.getElementById('a-dif');
        const val = document.getElementById('a-monto').value;
        if (val === '') { el.innerHTML = ''; return; }
        const dif = n2(val) - saldoCaja(c.id);
        if (Math.abs(dif) < 0.005) el.innerHTML = '<b style="color:#1e7a48">✓ Cuadra perfecto.</b>';
        else el.innerHTML = `<b style="color:#c0392b">${dif > 0 ? 'Sobrante' : 'Faltante'} de ${fmt(Math.abs(dif))}</b> — explica el motivo en la nota.`;
    };
    window.guardarArqueo = async function () {
        const c = cajaSel(); if (!c) return;
        const val = document.getElementById('a-monto').value;
        if (val === '' || n2(val) < 0) { alert('Escribe el efectivo real contado.'); return; }
        const esperado = saldoCaja(c.id);
        const contado = n2(val);
        const dif = contado - esperado;
        const nota = document.getElementById('a-nota').value.trim();
        if (Math.abs(dif) >= 0.005 && !nota) { alert('Hay una diferencia. Escribe una nota explicando el sobrante/faltante.'); return; }
        const turno = document.getElementById('a-turno').value;
        const fecha = document.getElementById('a-fecha').value || hoyISO();
        if (arqueoHoy(c.id, turno) && fecha === hoyISO() && !confirm('Ya hay un arqueo de ese turno hoy. ¿Registrar otro igual?')) return;
        const btn = document.querySelector('#modal-arqueo .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            await addDoc(collection(db, 'bancosCajaMovimientos'), {
                cajaId: c.id, tipo: 'arqueo', turno, fecha,
                concepto: 'Arqueo ' + (turno === 'am' ? 'mañana' : 'tarde'),
                montoContado: contado, montoEsperado: esperado, diferencia: dif, monto: contado, nota,
                creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            cerrar('modal-arqueo');
        } catch (e) { alert('No se pudo guardar el arqueo: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar arqueo'; }
    };
    window.borrarMov = async function (id) {
        const m = movs.find(x => x.id === id); if (!m) return;
        if (m.tipo === 'apertura') { alert('No se puede borrar la apertura del fondo. Si quieres cerrar la caja, es mejor dejarla inactiva (próximamente).'); return; }
        if (!confirm('¿Eliminar este movimiento de caja?' + (m.contaMovId ? ' (también se quitará de Contabilidad)' : ''))) return;
        try {
            await deleteDoc(doc(db, 'bancosCajaMovimientos', id));
            if (m.contaMovId) { try { await deleteDoc(doc(db, 'contaMovimientos', m.contaMovId)); } catch (e2) { /* si ya no existe, no pasa nada */ } }
        } catch (e) { alert('No se pudo: ' + e.message); }
    };

    // ---------- Reporte por período + exportar ----------
    const primerDiaMes = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; };
    let repData = null;
    window.abrirReporte = function () {
        if (!cajaSel()) { alert('Primero elige una caja.'); return; }
        document.getElementById('rep-desde').value = primerDiaMes();
        document.getElementById('rep-hasta').value = hoyISO();
        document.getElementById('rep-out').innerHTML = '';
        document.getElementById('modal-reporte').classList.add('show');
    };
    window.generarReporte = function () {
        const c = cajaSel(); if (!c) return;
        const desde = document.getElementById('rep-desde').value, hasta = document.getElementById('rep-hasta').value;
        const lista = movsCaja(c.id).filter(m => m.tipo !== 'arqueo' && (!desde || (m.fecha || '') >= desde) && (!hasta || (m.fecha || '') <= hasta))
            .sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')));
        const gastos = lista.filter(m => m.tipo === 'gasto'), repos = lista.filter(m => m.tipo === 'reposicion');
        const totGasto = gastos.reduce((a, m) => a + n2(m.monto), 0), totRepo = repos.reduce((a, m) => a + n2(m.monto), 0);
        const cat = {};
        gastos.forEach(m => { const k = (m.categoria || '').trim() || 'Sin categoría'; cat[k] = (cat[k] || 0) + n2(m.monto); });
        const catRows = Object.entries(cat).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td style="padding:6px;border-bottom:1px solid #f0f0f0">${esc(k)}</td><td style="padding:6px;border-bottom:1px solid #f0f0f0;text-align:right">${fmt(v)}</td></tr>`).join('');
        repData = { caja: c.nombre || '', desde, hasta, lista };
        document.getElementById('rep-out').innerHTML =
            `<div class="kpis"><div class="kpi"><div class="n" style="color:#d9483b">${fmt0(totGasto)}</div><div class="l">Gastado (${gastos.length})</div></div>` +
            `<div class="kpi"><div class="n" style="color:#1f9d61">${fmt0(totRepo)}</div><div class="l">Repuesto (${repos.length})</div></div></div>` +
            `<table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:13px"><thead><tr><th style="text-align:left;border-bottom:1.5px solid #e5e9ee;padding:6px">Categoría</th><th style="text-align:right;border-bottom:1.5px solid #e5e9ee;padding:6px">Gastado</th></tr></thead><tbody>${catRows || '<tr><td colspan="2" style="padding:8px;color:#999">Sin gastos en el período.</td></tr>'}</tbody></table>` +
            `<div style="display:flex;gap:10px;margin-top:14px"><button class="btn-r" style="flex:1" onclick="descargarCSV()">⬇️ Descargar CSV</button><button class="btn-o" style="flex:1" onclick="imprimirReporte()">🖨 Imprimir</button></div>`;
    };
    window.descargarCSV = function () {
        if (!repData) return;
        const filas = [['Fecha', 'Tipo', 'Concepto', 'Categoría', 'Referencia', 'Monto', 'Registrado por']];
        repData.lista.forEach(m => filas.push([m.fecha || '', m.tipo || '', m.concepto || '', m.categoria || '', m.referencia || '', n2(m.monto).toFixed(2), m.creadoPor || '']));
        const csv = filas.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
        a.download = `caja_${(repData.caja || '').replace(/[^a-z0-9]/gi, '_')}_${repData.desde}_a_${repData.hasta}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
    };
    window.imprimirReporte = function () {
        if (!repData) return;
        const rows = repData.lista.map(m => `<tr><td>${esc(fmtFecha(m.fecha))}</td><td>${esc(m.tipo || '')}</td><td>${esc(m.concepto || '')}</td><td>${esc(m.categoria || '')}</td><td style="text-align:right">${fmt(m.monto)}</td></tr>`).join('');
        const w = window.open('', '_blank');
        if (!w) { alert('El navegador bloqueó la ventana de impresión. Usa "Descargar CSV".'); return; }
        w.document.write(`<html><head><title>Reporte caja chica</title><style>body{font-family:Arial,sans-serif;padding:22px;color:#222}h1{color:#1c4e7a;font-size:18px;margin:0 0 4px}p{color:#555;margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left}</style></head><body><h1>Caja chica: ${esc(repData.caja)}</h1><p>Período: ${esc(repData.desde)} a ${esc(repData.hasta)}</p><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Categoría</th><th style="text-align:right">Monto</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
        w.document.close(); w.focus(); w.print();
    };

    function render() {
        const cont = document.getElementById('lista');
        if (!cajas.length) { cont.innerHTML = '<p class="empty">No hay cajas chicas. Crea una con «+ Nueva caja».</p>'; document.getElementById('kpis').innerHTML = ''; document.getElementById('caja-meta').textContent = ''; document.getElementById('arqueo-banner').innerHTML = ''; return; }
        const c = cajaSel(); if (!c) { cont.innerHTML = '<p class="empty">Elige una caja.</p>'; document.getElementById('arqueo-banner').innerHTML = ''; return; }
        const saldo = saldoCaja(c.id);
        const porReponer = Math.max(0, n2(c.fondoFijo) - saldo);
        document.getElementById('kpis').innerHTML =
            `<div class="kpi"><div class="n fondo">${fmt0(c.fondoFijo)}</div><div class="l">Fondo fijo</div></div>` +
            `<div class="kpi"><div class="n saldo">${fmt0(saldo)}</div><div class="l">Efectivo en caja</div></div>` +
            `<div class="kpi"><div class="n rep">${fmt0(porReponer)}</div><div class="l">Por reponer</div></div>`;
        document.getElementById('caja-meta').textContent = [c.responsable ? 'Responsable: ' + c.responsable : '', c.sucursal ? 'Sucursal: ' + c.sucursal : ''].filter(Boolean).join('   ·   ');

        // Arqueo del día: aviso si falta el de la mañana (8:00) o el de la tarde (4:55), y estado.
        const am = arqueoHoy(c.id, 'am'), pm = arqueoHoy(c.id, 'pm');
        const mins = (() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); })();
        const pend = [];
        if (mins >= 8 * 60 && !am) pend.push('☀️ el de la MAÑANA (8:00 am)');
        if (mins >= 16 * 60 + 55 && !pm) pend.push('🌙 el de la TARDE (4:55 pm)');
        let ban = '';
        if (pend.length) ban += `<div class="arq-alert"><span>⚠ Falta el arqueo: ${pend.join(' y ')}.</span><button class="btn-a" style="margin-left:auto" onclick="abrirArqueo()">🧮 Hacer arqueo</button></div>`;
        const okItems = [];
        [['am', '☀️ Mañana', am], ['pm', '🌙 Tarde', pm]].forEach(([k, lbl, a]) => {
            if (!a) return;
            const d = n2(a.diferencia);
            okItems.push(`<span><b>${lbl}:</b> ${fmt0(a.montoContado)} ${Math.abs(d) < 0.005 ? '· cuadra ✓' : `· <span class="dif">${d > 0 ? 'sobrante' : 'faltante'} ${fmt0(Math.abs(d))}</span>`}</span>`);
        });
        if (okItems.length) ban += `<div class="arq-ok">${okItems.join('')}</div>`;
        document.getElementById('arqueo-banner').innerHTML = ban;

        const lista = movsCaja(c.id).slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || String((b.fechaCreacion && b.fechaCreacion.seconds) || '').localeCompare(String((a.fechaCreacion && a.fechaCreacion.seconds) || '')));
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin movimientos en esta caja.</p>'; return; }
        const ICO = { gasto: '⬇️', reposicion: '⬆️', apertura: '🟢', arqueo: '🧮' };
        const SIGNO = { gasto: '− ', reposicion: '+ ', apertura: '+ ' };
        const NOM = { gasto: 'Gasto', reposicion: 'Reposición', apertura: 'Apertura', arqueo: 'Arqueo' };
        cont.innerHTML = lista.map(m => {
            const t = m.tipo || 'gasto';
            let sub, fotos = '';
            if (t === 'arqueo') {
                const d = n2(m.diferencia);
                sub = [fmtFecha(m.fecha), m.turno === 'am' ? 'mañana' : 'tarde', 'esperado ' + fmt0(m.montoEsperado), Math.abs(d) < 0.005 ? 'cuadra ✓' : `${d > 0 ? 'sobrante' : 'faltante'} ${fmt0(Math.abs(d))}`, m.nota ? '“' + esc(m.nota) + '”' : '', m.creadoPor ? 'por ' + esc(m.creadoPor) : ''].filter(Boolean).join('  ·  ');
            } else {
                sub = [fmtFecha(m.fecha), m.categoria ? esc(m.categoria) : '', m.referencia ? '# ' + esc(m.referencia) : '', m.creadoPor ? 'por ' + esc(m.creadoPor) : ''].filter(Boolean).join('  ·  ');
            }
            if (t === 'gasto') fotos = `<div class="mv-fotos-wrap">${fotosThumbsHTML(m.fotos, { coleccion: 'bancosCajaMovimientos', id: m.id, puedeBorrar: true })}${fotoAddBtnHTML({ coleccion: 'bancosCajaMovimientos', id: m.id, label: '📷 Recibo' })}</div>`;
            return `<div class="order-card mv-card ${t}">
                <div class="mv-ic ${t}">${ICO[t] || '•'}</div>
                <div class="mv-info">
                    <b>${esc(m.concepto || NOM[t])}</b> <span class="b">${NOM[t] || t}</span>
                    <div class="mv-monto ${t}">${SIGNO[t] || ''}${fmt(t === 'arqueo' ? m.montoContado : m.monto)}</div>
                    ${sub ? `<div class="l">${sub}</div>` : ''}
                    ${fotos}
                </div>
                ${t === 'apertura' ? '' : `<button class="del-btn" title="Eliminar" onclick="borrarMov('${m.id}')">🗑</button>`}
            </div>`;
        }).join('');
    }

    render();
</script>

</body>
</html>
