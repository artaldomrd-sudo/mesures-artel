<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Reuniones de seguimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 900px; }
    .intro { font-size: 13px; color: #667; margin: 0 0 14px; line-height: 1.5; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 16px; }
    .btn-y { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 9px; padding: 10px 16px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-ghost { background: transparent; border: 1.5px solid #cfd6dd; color: var(--artal-blue); border-radius: 9px; padding: 9px 14px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; }
    .btn-blue { background: var(--artal-blue); color: #fff; border: none; border-radius: 9px; padding: 11px 18px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .crumbs { font-size: 12.5px; color: #8a93a0; margin-bottom: 12px; }
    .crumbs a { color: var(--artal-blue); font-weight: bold; text-decoration: none; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .emp-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; cursor: pointer; border-top: 4px solid var(--artal-blue); }
    .emp-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -10px rgba(0,0,0,.35); }
    .emp-card .n { font-weight: bold; color: var(--artal-blue); font-size: 16px; }
    .emp-card .p { font-size: 12.5px; color: #667; margin-top: 3px; }
    .emp-card .m { font-size: 12px; color: #8a93a0; margin-top: 10px; }
    .emp-card .pend { display: inline-block; background: #fef0e6; color: #c76a1c; font-weight: bold; border-radius: 20px; padding: 2px 9px; font-size: 11px; margin-top: 8px; }

    .r-list { display: flex; flex-direction: column; gap: 10px; }
    .r-row { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; cursor: pointer; border-left: 4px solid var(--artal-blue); }
    .r-row .f { font-weight: bold; color: var(--artal-blue); font-size: 15px; }
    .r-row .s { font-size: 12.5px; color: #667; margin-top: 4px; }
    .empty { color: #8a93a0; font-size: 13px; padding: 20px 4px; text-align: center; }

    .detalle h2 { color: var(--artal-blue); font-size: 22px; margin: 2px 0 2px; }
    .detalle .sub { font-size: 13px; color: #8a93a0; margin-bottom: 4px; }
    .detalle .hdr-meta { font-size: 12.5px; color: #667; margin-bottom: 16px; }
    .sec { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 14px; }
    .sec h3 { color: var(--artal-blue); font-size: 15.5px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .03em; }
    .qa { margin-bottom: 12px; }
    .qa .q { font-weight: bold; color: #33404a; font-size: 14px; }
    .qa .a { font-size: 14.5px; color: #2f3944; line-height: 1.55; white-space: pre-wrap; margin-top: 3px; }
    .qa .a.vacia { color: #b3bcc4; font-style: italic; }
    .neci { margin-bottom: 8px; } .neci b { color: #33404a; } .neci span { color: #4a5661; }
    .guia { font-size: 12.5px; color: #9aa4ae; font-style: italic; line-height: 1.45; margin: 2px 0 8px; }

    table.acu { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.acu th { text-align: left; background: #eef1f4; color: #556; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; }
    table.acu td { padding: 10px; border-bottom: 1px solid #eef1f4; vertical-align: top; }
    .est-pill { font-size: 11px; font-weight: bold; border-radius: 20px; padding: 3px 10px; cursor: pointer; border: none; font-family: 'Arimo'; }
    .est-pill.pendiente { background: #fef0e6; color: #c76a1c; }
    .est-pill.cumplido { background: #e7f7ee; color: #1f9d61; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: bold; color: var(--artal-blue); margin-bottom: 4px; }
    .field input, .field textarea, .field select { width: 100%; box-sizing: border-box; border: 1.5px solid #d4dbe2; border-radius: 8px; padding: 9px 11px; font-family: 'Arimo'; font-size: 14px; }
    .field textarea { min-height: 60px; resize: vertical; line-height: 1.5; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 620px) { .row3, .row2 { grid-template-columns: 1fr; } }
    .mini { background: transparent; border: none; color: #c0392b; cursor: pointer; font-weight: bold; font-size: 13px; }
    .addlink { background: transparent; border: 1.5px dashed #cfd6dd; color: var(--artal-blue); border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 12.5px; cursor: pointer; font-family: 'Arimo'; }
    .seg-box { background: #fbf7ef; border-left: 3px solid #e8890c; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
    .seg-box .t { font-weight: bold; color: #8a6320; font-size: 13px; margin-bottom: 8px; }
    .seg-item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 13.5px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(10,30,50,.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-bg.show { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { color: var(--artal-blue); margin: 0 0 10px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Reuniones de seguimiento</h1>
    </div>
    <div class="who">
        <a class="btn-back" href="rrhh.html">← RRHH</a>
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main id="cont"><p class="intro">Cargando…</p></main>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    // Gerencia (admin) gestiona todo; el empleado entra a ver SOLO las suyas (por su correo).
    const usuario = await requireAuth(['instalador', 'ayudante', 'chofer', 'cotizaciones', 'contable', 'comunicaciones']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    wireBackButton(usuario.roles);
    const esAdmin = usuario.roles.includes('admin');
    if (!esAdmin) document.querySelector('.btn-back').style.display = 'none';

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fFecha = (yyyymmdd) => { if (!yyyymmdd) return ''; const d = new Date(yyyymmdd + 'T12:00:00'); return isNaN(d) ? yyyymmdd : d.toLocaleDateString('es-DO', { day: '2-digit', month: 'long', year: 'numeric' }); };
    function addDias(yyyymmdd, n) { const d = new Date((yyyymmdd || hoyISO()) + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    let empleadosCache = [];
    let reunionesCache = [];
    let vista = 'inicio';   // inicio | timeline | detalle | editar
    let empSel = null;      // {id,nombre,correo,puestoTexto} en foco
    let reuSel = null;      // id de la reunión abierta
    let edit = null;        // objeto en edición

    onSnapshot(collection(db, 'rrhhEmpleados'), (snap) => {
        empleadosCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (vista === 'inicio') render();
    }, () => {});

    onSnapshot(collection(db, 'rrhhReuniones'), (snap) => {
        reunionesCache = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
        render();
    }, () => { reunionesCache = []; render(); });

    const reunionesDe = (correo, empId) => reunionesCache.filter(r =>
        (empId && r.empleadoId === empId) || (correo && (r.empleadoCorreo || '').toLowerCase() === (correo || '').toLowerCase()));
    const puestoDe = (e) => [Array.isArray(e.cargoNombres) ? e.cargoNombres.join(' · ') : (e.cargoNombre || ''), e.departamentoNombre].filter(Boolean).join(' · ');
    const acuerdosPendientes = (r) => (r.acuerdos || []).filter(a => a.estado !== 'cumplido').length;

    // ---------------- Render ----------------
    function render() {
        const cont = document.getElementById('cont');
        if (!esAdmin) return renderEmpleado(cont);
        if (vista === 'inicio') cont.innerHTML = renderInicio();
        else if (vista === 'timeline') cont.innerHTML = renderTimeline();
        else if (vista === 'detalle') cont.innerHTML = renderDetalle();
        else if (vista === 'editar') { cont.innerHTML = renderEditar(); }
    }

    // --- Empleado (solo lectura de las suyas) ---
    function renderEmpleado(cont) {
        const mias = reunionesDe(usuario.email, null);
        if (vista === 'detalle') { cont.innerHTML = renderDetalle(true); return; }
        if (!mias.length) { cont.innerHTML = `<p class="intro">Aquí verás tus reuniones de seguimiento y los objetivos acordados con la empresa.</p><div class="empty">Todavía no tienes reuniones registradas.</div>`; return; }
        cont.innerHTML = `<p class="intro">Tus reuniones de seguimiento con la empresa. Toca una para ver los acuerdos y tus objetivos.</p>
            <div class="r-list">${mias.map(r => rowReunion(r)).join('')}</div>`;
    }

    function rowReunion(r) {
        const pend = acuerdosPendientes(r);
        return `<div class="r-row" onclick="abrirReunion('${r.id}')">
            <div class="f">Reunión del ${esc(fFecha(r.fecha))}</div>
            <div class="s">${(r.acuerdos || []).length} acuerdo(s)${pend ? ` · ${pend} objetivo(s) en curso` : ' · todos cumplidos'}${r.proximaFecha ? ` · próxima: ${esc(fFecha(r.proximaFecha))}` : ''}</div>
        </div>`;
    }

    // --- Admin: inicio (empleados) ---
    function renderInicio() {
        const conReunion = empleadosCache.slice().filter(e => (e.estado || 'activo') === 'activo')
            .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
        const cards = conReunion.map(e => {
            const rs = reunionesDe(e.correo, e.id);
            const ult = rs[0];
            const pend = rs.reduce((n, r) => n + acuerdosPendientes(r), 0);
            return `<div class="emp-card" onclick="abrirEmpleado('${e.id}')">
                <div class="n">${esc(e.nombre || 'Sin nombre')}</div>
                <div class="p">${esc(puestoDe(e) || '—')}</div>
                <div class="m">${rs.length ? `${rs.length} reunión(es) · última ${esc(fFecha(ult.fecha))}` : 'Sin reuniones aún'}</div>
                ${pend ? `<span class="pend">${pend} objetivo(s) en curso</span>` : ''}
            </div>`;
        }).join('');
        return `<p class="intro">Reunión individual de seguimiento (cada 90 días). Elige un empleado para ver su historial, crear una nueva reunión y dar seguimiento a los objetivos.</p>
            <div class="bar"><button class="btn-ghost" onclick="abrirImportar()">⬆️ Importar reuniones</button></div>
            <div class="grid">${cards || '<div class="empty">No hay empleados activos. Agrégalos en RRHH → Empleados.</div>'}</div>`;
    }

    // --- Admin: timeline de un empleado ---
    function renderTimeline() {
        const e = empleadosCache.find(x => x.id === empSel); if (!e) { vista = 'inicio'; return renderInicio(); }
        const rs = reunionesDe(e.correo, e.id);
        return `<div class="crumbs"><a onclick="irInicio()">← Empleados</a></div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
                <h2 style="color:var(--artal-blue);margin:0">${esc(e.nombre || '')}</h2>
                <button class="btn-y" onclick="nuevaReunion('${e.id}')">＋ Nueva reunión</button>
            </div>
            <div class="sub" style="color:#8a93a0;font-size:13px;margin-bottom:16px">${esc(puestoDe(e) || '')}${e.correo ? ' · ' + esc(e.correo) : ' · (sin correo — no podrá verlas al iniciar sesión)'}</div>
            ${rs.length ? `<div class="r-list">${rs.map(r => rowReunion(r)).join('')}</div>` : '<div class="empty">Aún no hay reuniones. Crea la primera con “＋ Nueva reunión”.</div>'}`;
    }

    // --- Detalle de una reunión (lectura) ---
    function renderDetalle(modoEmpleado) {
        const r = reunionesCache.find(x => x.id === reuSel);
        const volverA = modoEmpleado ? `<a onclick="irInicio()">← Mis reuniones</a>` : `<a onclick="abrirEmpleado('${r ? r.empleadoId : ''}')">← ${esc(r ? r.empleadoNombre : '')}</a>`;
        if (!r) return `<div class="crumbs">${volverA}</div><div class="empty">Reunión no encontrada.</div>`;
        const secHtml = (r.secciones || []).map(s => `<div class="sec"><h3>${esc(s.titulo || '')}</h3>
            ${s.guia && !modoEmpleado ? `<div class="guia">${esc(s.guia)}</div>` : ''}
            ${(s.preguntas || []).map(p => `<div class="qa"><div class="q">${esc(p.q || '')}</div>${p.guia && !modoEmpleado ? `<div class="guia">${esc(p.guia)}</div>` : ''}<div class="a ${p.a ? '' : 'vacia'}">${p.a ? esc(p.a) : '(sin respuesta)'}</div></div>`).join('')}
            </div>`).join('');
        const reconoce = r.reconozco ? `<div class="sec"><h3>Lo que le reconozco</h3><div class="qa"><div class="a">${esc(r.reconozco)}</div></div></div>` : '';
        const nec = (r.necesito && r.necesito.length) ? `<div class="sec"><h3>Lo que necesito de ti</h3>${r.necesito.map((n, i) => `<div class="neci"><b>${i + 1}. ${esc(n.titulo || '')}</b>${n.detalle ? `<br><span>${esc(n.detalle)}</span>` : ''}</div>`).join('')}</div>` : '';
        const plan = (r.plan && (r.plan.texto || r.plan.reaccion)) ? `<div class="sec"><h3>El plan / el camino</h3>${r.plan.texto ? `<div class="qa"><div class="a">${esc(r.plan.texto)}</div></div>` : ''}${r.plan.reaccion ? `<div class="qa"><div class="q">Su reacción</div><div class="a">${esc(r.plan.reaccion)}</div></div>` : ''}</div>` : '';
        const meta = r.meta90 ? `<div class="sec"><h3>Meta concreta · próximos 90 días</h3><div class="qa"><div class="a">${esc(r.meta90)}</div></div></div>` : '';
        const acu = `<div class="sec"><h3>Acuerdos de esta reunión</h3>
            ${(r.acuerdos && r.acuerdos.length) ? `<table class="acu"><thead><tr><th>Acuerdo</th><th>Quién</th><th>Para cuándo</th><th>Estado</th></tr></thead><tbody>
                ${r.acuerdos.map((a, i) => `<tr><td>${esc(a.texto || '')}</td><td>${esc(a.quien || '')}</td><td>${esc(a.paraCuando || '')}</td>
                    <td>${esAdmin ? `<button class="est-pill ${a.estado === 'cumplido' ? 'cumplido' : 'pendiente'}" onclick="toggleAcuerdo('${r.id}',${i})">${a.estado === 'cumplido' ? '✓ Cumplido' : '⏳ Pendiente'}</button>`
                    : `<span class="est-pill ${a.estado === 'cumplido' ? 'cumplido' : 'pendiente'}">${a.estado === 'cumplido' ? '✓ Cumplido' : '⏳ Pendiente'}</span>`}</td></tr>`).join('')}
                </tbody></table>` : '<div class="empty">Sin acuerdos escritos.</div>'}</div>`;
        const notas = r.notas ? `<div class="sec"><h3>Notas libres</h3><div class="qa"><div class="a">${esc(r.notas)}</div></div></div>` : '';
        const admBtns = (esAdmin && !modoEmpleado) ? `<div class="bar" style="margin-top:16px"><button class="btn-ghost" onclick="editarReunion('${r.id}')">✏️ Editar</button><button class="btn-ghost" onclick="borrarReunion('${r.id}')" style="color:#c0392b;border-color:#e6b8b3">🗑️ Eliminar</button></div>` : '';
        return `<div class="crumbs">${volverA}</div>
            <div class="detalle">
                <h2>${esc(r.empleadoNombre || '')}</h2>
                <div class="sub">${esc(r.puestoTexto || '')}</div>
                <div class="hdr-meta">Reunión del <b>${esc(fFecha(r.fecha))}</b>${r.horaInicio ? ` · ${esc(r.horaInicio)}–${esc(r.horaFin || '')}` : ''}${r.lugar ? ` · ${esc(r.lugar)}` : ''}${r.proximaFecha ? ` · Próxima: <b>${esc(fFecha(r.proximaFecha))}</b>` : ''}</div>
                ${secHtml}${reconoce}${nec}${plan}${meta}${acu}${notas}${admBtns}
            </div>`;
    }

    // ---------------- Navegación ----------------
    window.irInicio = () => { vista = 'inicio'; render(); window.scrollTo(0, 0); };
    window.abrirEmpleado = (id) => { empSel = id; vista = 'timeline'; render(); window.scrollTo(0, 0); };
    window.abrirReunion = (id) => { reuSel = id; vista = 'detalle'; render(); window.scrollTo(0, 0); };

    window.toggleAcuerdo = async (rid, i) => {
        const r = reunionesCache.find(x => x.id === rid); if (!r) return;
        const acuerdos = (r.acuerdos || []).map((a, j) => j === i ? { ...a, estado: a.estado === 'cumplido' ? 'pendiente' : 'cumplido' } : a);
        try { await updateDoc(doc(db, 'rrhhReuniones', rid), { acuerdos }); } catch (e) { alert('No se pudo: ' + (e.message || e)); }
    };
    window.borrarReunion = async (rid) => {
        if (!confirm('¿Eliminar esta reunión? No se puede deshacer.')) return;
        try { await deleteDoc(doc(db, 'rrhhReuniones', rid)); vista = 'timeline'; render(); }
        catch (e) { alert('No se pudo: ' + (e.message || e)); }
    };

    // ---------------- Editor (crear / editar) ----------------
    const plantillaVacia = (e) => ({
        empleadoId: e ? e.id : '', empleadoNombre: e ? (e.nombre || '') : '', empleadoCorreo: e ? (e.correo || '') : '',
        puestoTexto: e ? puestoDe(e) : '', fecha: hoyISO(), horaInicio: '', horaFin: '', lugar: 'OFICINA', gerente: usuario.nombre,
        secciones: [{ titulo: 'Cómo va / cómo se siente', preguntas: [{ q: '', a: '' }] }],
        reconozco: '', necesito: [], plan: { texto: '', reaccion: '' }, meta90: '',
        acuerdos: [{ texto: '', quien: e ? (e.nombre || '') : '', paraCuando: '90 días', estado: 'pendiente' }],
        notas: '', proximaFecha: addDias(hoyISO(), 90), seguimientoPrevio: []
    });

    window.nuevaReunion = (empId) => {
        const e = empleadosCache.find(x => x.id === empId);
        edit = plantillaVacia(e);
        // Coherencia: arrastra preguntas de la última reunión (respuestas en blanco) y objetivos pendientes.
        const prev = reunionesDe(e ? e.correo : '', empId)[0];
        if (prev) {
            if (Array.isArray(prev.secciones) && prev.secciones.length) {
                edit.secciones = prev.secciones.map(s => ({ titulo: s.titulo || '', guia: s.guia || '', preguntas: (s.preguntas || []).map(p => ({ q: p.q || '', guia: p.guia || '', a: '' })) }));
            }
            if (Array.isArray(prev.necesito)) edit.necesito = prev.necesito.map(n => ({ titulo: n.titulo || '', detalle: '' }));
            edit.seguimientoPrevio = (prev.acuerdos || []).map(a => ({ texto: a.texto || '', quien: a.quien || '', estado: a.estado === 'cumplido' ? 'cumplido' : 'pendiente' }));
        }
        vista = 'editar'; render(); window.scrollTo(0, 0);
    };
    window.editarReunion = (rid) => {
        const r = reunionesCache.find(x => x.id === rid); if (!r) return;
        edit = JSON.parse(JSON.stringify(r)); edit._id = rid;
        if (!edit.plan) edit.plan = { texto: '', reaccion: '' };
        ['secciones', 'necesito', 'acuerdos', 'seguimientoPrevio'].forEach(k => { if (!Array.isArray(edit[k])) edit[k] = []; });
        vista = 'editar'; render(); window.scrollTo(0, 0);
    };

    function renderEditar() {
        const e = edit;
        const segHtml = (e.seguimientoPrevio && e.seguimientoPrevio.length) ? `<div class="seg-box"><div class="t">Seguimiento de la reunión anterior — ¿se cumplieron?</div>
            ${e.seguimientoPrevio.map((s, i) => `<div class="seg-item"><select class="seg-estado" data-i="${i}" style="width:auto;padding:5px 8px"><option value="pendiente" ${s.estado !== 'cumplido' ? 'selected' : ''}>⏳ Pendiente</option><option value="cumplido" ${s.estado === 'cumplido' ? 'selected' : ''}>✓ Cumplido</option></select><span>${esc(s.texto)} <i style="color:#9aa4ae">(${esc(s.quien)})</i></span></div>`).join('')}
            </div>` : '';
        const secHtml = e.secciones.map((s, si) => `<div class="sec sec-block" data-si="${si}">
            <div class="field"><label>Título de la sección</label><input class="sec-titulo" value="${esc(s.titulo || '')}"></div>
            <div class="preguntas">${(s.preguntas || []).map((p, pi) => `<div class="preg-row" data-pi="${pi}" style="margin-bottom:10px;padding-left:10px;border-left:2px solid #eef1f4">
                <div class="field"><label>Pregunta</label><input class="preg-q" value="${esc(p.q || '')}"></div>
                <div class="field"><label>Respuesta</label><textarea class="preg-a">${esc(p.a || '')}</textarea></div>
                <button class="mini" onclick="delPreg(${si},${pi})">− quitar pregunta</button>
            </div>`).join('')}</div>
            <button class="addlink" onclick="addPreg(${si})">＋ Pregunta</button>
            <button class="mini" style="margin-left:10px" onclick="delSec(${si})">Eliminar sección</button>
        </div>`).join('');
        const necHtml = e.necesito.map((n, i) => `<div class="nec-row row2" data-i="${i}" style="margin-bottom:8px">
            <input class="nec-tit" placeholder="Punto (ej. Iniciativa)" value="${esc(n.titulo || '')}">
            <div style="display:flex;gap:6px"><input class="nec-det" placeholder="Detalle" value="${esc(n.detalle || '')}"><button class="mini" onclick="delNec(${i})">×</button></div>
        </div>`).join('');
        const acuHtml = e.acuerdos.map((a, i) => `<div class="acu-row" data-i="${i}" style="margin-bottom:10px;padding:10px;border:1px solid #eef1f4;border-radius:8px">
            <div class="field"><label>Acuerdo concreto</label><textarea class="acu-texto">${esc(a.texto || '')}</textarea></div>
            <div class="row3">
                <div class="field"><label>Quién</label><input class="acu-quien" value="${esc(a.quien || '')}"></div>
                <div class="field"><label>Para cuándo</label><input class="acu-cuando" value="${esc(a.paraCuando || '90 días')}"></div>
                <div class="field"><label>Estado</label><select class="acu-estado"><option value="pendiente" ${a.estado !== 'cumplido' ? 'selected' : ''}>Pendiente</option><option value="cumplido" ${a.estado === 'cumplido' ? 'selected' : ''}>Cumplido</option></select></div>
            </div>
            <button class="mini" onclick="delAcu(${i})">− quitar acuerdo</button>
        </div>`).join('');

        return `<div class="crumbs"><a onclick="cancelarEdit()">← Cancelar</a></div>
            <h2 style="color:var(--artal-blue);margin:0 0 4px">${e._id ? 'Editar' : 'Nueva'} reunión — ${esc(e.empleadoNombre)}</h2>
            <div class="sub" style="color:#8a93a0;font-size:13px;margin-bottom:16px">${esc(e.puestoTexto || '')}</div>
            <div class="sec">
                <div class="field"><label>Puesto / antigüedad (encabezado)</label><input id="e-puesto" value="${esc(e.puestoTexto || '')}"></div>
                <div class="row3">
                    <div class="field"><label>Fecha</label><input id="e-fecha" type="date" value="${esc(e.fecha || hoyISO())}"></div>
                    <div class="field"><label>Hora inicio</label><input id="e-hini" value="${esc(e.horaInicio || '')}"></div>
                    <div class="field"><label>Hora fin</label><input id="e-hfin" value="${esc(e.horaFin || '')}"></div>
                </div>
                <div class="row2"><div class="field"><label>Lugar</label><input id="e-lugar" value="${esc(e.lugar || '')}"></div>
                <div class="field"><label>Gerente</label><input id="e-gerente" value="${esc(e.gerente || '')}"></div></div>
            </div>
            ${segHtml}
            <h3 style="color:var(--artal-blue);font-size:14px;margin:18px 0 8px">Secciones y preguntas</h3>
            ${secHtml}
            <button class="addlink" onclick="addSec()">＋ Agregar sección</button>

            <div class="sec" style="margin-top:16px"><div class="field"><label>Lo que le reconozco</label><textarea id="e-reconozco">${esc(e.reconozco || '')}</textarea></div></div>
            <div class="sec"><label style="display:block;font-size:12px;font-weight:bold;color:var(--artal-blue);margin-bottom:6px">Lo que necesito de ti (puntos)</label>${necHtml}<button class="addlink" onclick="addNec()">＋ Punto</button></div>
            <div class="sec"><div class="field"><label>El plan / el camino que le ofrezco</label><textarea id="e-plan-texto">${esc((e.plan || {}).texto || '')}</textarea></div>
                <div class="field"><label>Su reacción</label><textarea id="e-plan-reaccion">${esc((e.plan || {}).reaccion || '')}</textarea></div></div>
            <div class="sec"><div class="field"><label>Meta concreta · próximos 90 días</label><textarea id="e-meta90">${esc(e.meta90 || '')}</textarea></div></div>

            <h3 style="color:var(--artal-blue);font-size:14px;margin:18px 0 8px">Acuerdos de esta reunión</h3>
            ${acuHtml}
            <button class="addlink" onclick="addAcu()">＋ Acuerdo</button>

            <div class="sec" style="margin-top:16px"><div class="field"><label>Notas libres</label><textarea id="e-notas">${esc(e.notas || '')}</textarea></div>
                <div class="field"><label>Próxima reunión de seguimiento</label><input id="e-proxima" type="date" value="${esc(e.proximaFecha || '')}"></div>
                <label style="font-size:12.5px;color:#556"><input type="checkbox" id="e-recordar" checked> Crear recordatorio para gerencia en esa fecha</label>
            </div>
            <div class="bar"><button class="btn-blue" id="btn-guardar" onclick="guardarReunion()">💾 Guardar reunión</button><button class="btn-ghost" onclick="cancelarEdit()">Cancelar</button></div>`;
    }

    // Lee todos los campos del DOM al objeto `edit` (antes de agregar/quitar o guardar).
    function leerEdit() {
        const g = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
        edit.puestoTexto = g('e-puesto'); edit.fecha = g('e-fecha'); edit.horaInicio = g('e-hini'); edit.horaFin = g('e-hfin');
        edit.lugar = g('e-lugar'); edit.gerente = g('e-gerente'); edit.reconozco = g('e-reconozco');
        edit.plan = { texto: g('e-plan-texto'), reaccion: g('e-plan-reaccion') }; edit.meta90 = g('e-meta90');
        edit.notas = g('e-notas'); edit.proximaFecha = g('e-proxima');
        document.querySelectorAll('.sec-block').forEach(bl => {
            const si = +bl.dataset.si; if (!edit.secciones[si]) return;
            edit.secciones[si].titulo = bl.querySelector('.sec-titulo').value;
            bl.querySelectorAll('.preg-row').forEach(pr => { const pi = +pr.dataset.pi; if (edit.secciones[si].preguntas[pi]) { edit.secciones[si].preguntas[pi].q = pr.querySelector('.preg-q').value; edit.secciones[si].preguntas[pi].a = pr.querySelector('.preg-a').value; } });
        });
        document.querySelectorAll('.nec-row').forEach(nr => { const i = +nr.dataset.i; if (edit.necesito[i]) { edit.necesito[i].titulo = nr.querySelector('.nec-tit').value; edit.necesito[i].detalle = nr.querySelector('.nec-det').value; } });
        document.querySelectorAll('.acu-row').forEach(ar => { const i = +ar.dataset.i; if (edit.acuerdos[i]) { edit.acuerdos[i].texto = ar.querySelector('.acu-texto').value; edit.acuerdos[i].quien = ar.querySelector('.acu-quien').value; edit.acuerdos[i].paraCuando = ar.querySelector('.acu-cuando').value; edit.acuerdos[i].estado = ar.querySelector('.acu-estado').value; } });
        document.querySelectorAll('.seg-estado').forEach(se => { const i = +se.dataset.i; if (edit.seguimientoPrevio[i]) edit.seguimientoPrevio[i].estado = se.value; });
    }

    window.addSec = () => { leerEdit(); edit.secciones.push({ titulo: '', preguntas: [{ q: '', a: '' }] }); render(); };
    window.delSec = (si) => { leerEdit(); edit.secciones.splice(si, 1); render(); };
    window.addPreg = (si) => { leerEdit(); edit.secciones[si].preguntas.push({ q: '', a: '' }); render(); };
    window.delPreg = (si, pi) => { leerEdit(); edit.secciones[si].preguntas.splice(pi, 1); render(); };
    window.addNec = () => { leerEdit(); edit.necesito.push({ titulo: '', detalle: '' }); render(); };
    window.delNec = (i) => { leerEdit(); edit.necesito.splice(i, 1); render(); };
    window.addAcu = () => { leerEdit(); edit.acuerdos.push({ texto: '', quien: edit.empleadoNombre || '', paraCuando: '90 días', estado: 'pendiente' }); render(); };
    window.delAcu = (i) => { leerEdit(); edit.acuerdos.splice(i, 1); render(); };
    window.cancelarEdit = () => { edit = null; vista = empSel ? 'timeline' : 'inicio'; render(); window.scrollTo(0, 0); };

    window.guardarReunion = async () => {
        leerEdit();
        const crearRecordatorio = (document.getElementById('e-recordar') || {}).checked;
        const btn = document.getElementById('btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        const data = { ...edit };
        delete data._id;
        data.actualizada = Date.now();
        try {
            let rid = edit._id;
            if (rid) { await updateDoc(doc(db, 'rrhhReuniones', rid), data); }
            else { data.creadoPor = usuario.nombre; data.fechaCreacion = serverTimestamp(); const ref = await addDoc(collection(db, 'rrhhReuniones'), data); rid = ref.id; }
            if (crearRecordatorio && data.proximaFecha) await crearReminder(data, rid);
            reuSel = rid; vista = 'detalle'; edit = null; render(); window.scrollTo(0, 0);
        } catch (e) { alert('No se pudo guardar: ' + (e.message || e)); btn.disabled = false; btn.textContent = '💾 Guardar reunión'; }
    };

    async function crearReminder(data, rid) {
        try {
            const fechaObj = new Date((data.proximaFecha) + 'T09:00:00');
            await addDoc(collection(db, 'citas'), {
                tipo: 'recordatorio', titulo: 'Reunión de seguimiento — ' + (data.empleadoNombre || ''),
                descripcion: 'Toca la próxima reunión 1-a-1 (cada 90 días).', fecha: Timestamp.fromDate(fechaObj), duracionMin: 0,
                asignadoA: 'gerente', asignados: [{ nombre: usuario.nombre, email: usuario.email }],
                completadoPor: [], completada: false, creadoPorNombre: usuario.nombre,
                origen: 'reunion', reunionId: rid
            });
        } catch (e) { /* best-effort: si falla el recordatorio, la reunión ya quedó guardada */ }
    }

    // ---------------- Importar (sembrar reuniones reales sin exponerlas en el código) ----------------
    window.abrirImportar = () => {
        document.getElementById('imp-modal').classList.add('show');
        document.getElementById('imp-json').value = '';
        document.getElementById('imp-msg').textContent = '';
    };
    window.cerrarImportar = () => document.getElementById('imp-modal').classList.remove('show');
    window.hacerImportar = async () => {
        const msg = document.getElementById('imp-msg');
        let arr;
        try { arr = JSON.parse(document.getElementById('imp-json').value); } catch (e) { msg.textContent = '❌ El texto no es un JSON válido.'; return; }
        if (!Array.isArray(arr)) arr = [arr];
        msg.textContent = 'Importando ' + arr.length + '…';
        let ok = 0;
        for (const r of arr) {
            try {
                r.actualizada = Date.now(); r.creadoPor = r.creadoPor || usuario.nombre; r.fechaCreacion = serverTimestamp();
                if (!Array.isArray(r.seguimientoPrevio)) r.seguimientoPrevio = [];
                const ref = await addDoc(collection(db, 'rrhhReuniones'), r);
                if (r.proximaFecha) await crearReminder(r, ref.id);
                ok++;
            } catch (e) { /* sigue con las demás */ }
        }
        msg.textContent = `✓ Importadas ${ok} de ${arr.length}.`;
        setTimeout(cerrarImportar, 1200);
    };

    // Modal de importar (solo admin lo abre).
    document.body.insertAdjacentHTML('beforeend', `<div class="modal-bg" id="imp-modal"><div class="modal">
        <h3>Importar reuniones</h3>
        <p style="font-size:12.5px;color:#667;line-height:1.5">Pega aquí el texto (JSON) de las reuniones que te pasaron. Se guardan en la base privada; nunca en el código público. Úsalo una sola vez para sembrar las reuniones ya hechas.</p>
        <textarea id="imp-json" style="width:100%;min-height:200px;border:1.5px solid #d4dbe2;border-radius:8px;padding:10px;font-family:monospace;font-size:12px"></textarea>
        <div id="imp-msg" style="font-size:13px;color:var(--artal-blue);margin:8px 0;font-weight:bold"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" onclick="cerrarImportar()">Cancelar</button><button class="btn-blue" onclick="hacerImportar()">Importar</button></div>
    </div></div>`);

    render();
</script>

</body>
</html>
