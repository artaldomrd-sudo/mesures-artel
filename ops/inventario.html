<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260806">
<style>
    main { max-width: 820px; }
    #search-input { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-family: 'Arimo'; font-size: 15px; min-height: 48px; background: #fff; }
    h2.section-title { font-size: 14px; color: var(--artal-blue); margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .seed-btn { background: var(--artal-yellow); color: var(--artal-blue); border: none; border-radius: 10px; padding: 12px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .new-item-btn { background: var(--artal-blue); color: #fff; border: none; border-radius: 10px; padding: 12px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .item-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; border-left: 6px solid var(--artal-blue); }
    .item-card.low { border-left-color: #e74c3c; }
    .item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .item-head b { color: var(--artal-blue); font-size: 15px; }
    .item-qty { font-size: 20px; font-weight: bold; color: var(--artal-blue); }
    .item-qty .unidad { font-size: 12px; font-weight: normal; color: #888; }
    .item-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .item-actions button { padding: 9px 14px; border: none; border-radius: 7px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; font-size: 13px; }
    .btn-tomar { background: #e67e22; color: #fff; }
    .btn-agregar { background: #2ecc71; color: #fff; }
    .btn-precio { background: #16a085; color: #fff; }
    .btn-eliminar { background: #e74c3c; color: #fff; }
    .eliminar-form { border: 1.5px solid #e74c3c; background: #fdecea !important; }
    .item-precios { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; font-size: 12.5px; }
    .item-precios .costo { color: #888; }
    .item-precios .venta { color: #16a085; font-weight: bold; }
    .item-precios .margen { color: #999; }
    .inline-form { display: none; margin-top: 10px; padding: 10px; background: var(--artal-light); border-radius: 8px; }
    .inline-form.show { display: block; }
    /* Secciones colapsables */
    .cat-block { margin-bottom: 10px; }
    .cat-card { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: none; border-left: 5px solid var(--artal-blue); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; cursor: pointer; font-family: 'Arimo'; text-align: left; min-height: 54px; }
    .cat-card:hover { background: #f7fafd; }
    .cat-card .cat-name { font-weight: bold; color: var(--artal-blue); font-size: 16px; }
    .cat-card .cat-meta { font-size: 12.5px; color: #8a93a0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .cat-low { color: #e74c3c; font-weight: bold; }
    .cat-arrow { font-size: 13px; color: var(--artal-blue); }
    .cat-body { display: none; padding: 8px 0 2px; }
    .cat-block.open .cat-body { display: block; }
    .btn-editar { background: var(--artal-blue); color: #fff; }
    .grid2-inv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stock-warn { font-size: 12px; font-weight: bold; border-radius: 7px; padding: 4px 9px; margin-top: 6px; display: inline-block; }
    .stock-warn.low { background: #fff3e0; color: #b9770e; }
    .stock-warn.out { background: #fdecea; color: #c0392b; }
    /* Resumen superior */
    .inv-kpis { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .inv-kpi { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 16px; flex: 1; min-width: 130px; }
    .inv-kpi .n { font-size: 20px; font-weight: bold; color: var(--artal-blue); }
    .inv-kpi .n.warn { color: #b9770e; } .inv-kpi .n.out { color: #c0392b; }
    .inv-kpi .l { font-size: 11px; color: #8a93a0; text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }
    .btn-hist { background: #f0f3f7; color: var(--artal-blue); }
    .hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eef1f4; font-size: 13.5px; }
    .hist-cant { font-weight: bold; } .hist-cant.pos { color: #1e8f4e; } .hist-cant.neg { color: #c0392b; }
    .hist-meta { font-size: 11.5px; color: #8a93a0; text-align: right; white-space: nowrap; }
    .conteo-tabla { width: 100%; border-collapse: collapse; }
    .conteo-tabla th { font-size: 10.5px; text-transform: uppercase; color: #778; text-align: left; padding: 6px; border-bottom: 1.5px solid #eef1f4; }
    .conteo-tabla td { padding: 6px; border-bottom: 1px solid #f2f4f7; font-size: 13px; }
    .conteo-tabla input { width: 90px; padding: 7px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; text-align: right; }
    .conteo-tabla tr.dif input { border-color: #f39c12; background: #fff8e8; }
    .conteo-cat { font-weight: bold; color: var(--artal-blue); background: #f6f8fa; }
    /* Cuadros de categoría (3 columnas, tipo Panel de Control) */
    .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 900px) { .inv-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .inv-grid { grid-template-columns: 1fr; } }
    .inv-cat-tile { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 20px 18px; cursor: pointer; border: 1px solid #eef1f5; transition: transform .12s, box-shadow .12s; }
    .inv-cat-tile:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(28,78,122,.45); }
    .inv-cat-tile .emoji { font-size: 30px; line-height: 1; }
    .inv-cat-tile .title { font-size: 17px; font-weight: bold; color: var(--artal-blue); margin-top: 10px; }
    .inv-cat-tile .desc { font-size: 13px; color: #8a93a0; margin-top: 4px; }
    .btn-back-cat { background: #eef4fb; color: var(--artal-blue); border: none; border-radius: 100px; padding: 9px 16px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; font-size: 13.5px; min-height: 40px; }
    .subsec-title { font-size: 14px; font-weight: bold; color: var(--artal-blue); border-bottom: 2px solid #eef1f5; padding-bottom: 6px; margin: 16px 0 8px; }
    .subsec-title .l { font-weight: normal; color: #8a93a0; font-size: 12px; }
    .item-ref { font-size: 12px; color: #8a93a0; margin-top: -2px; }
    .color-group-title { font-size: 13px; font-weight: bold; color: var(--artal-blue); background: #eef4fb; border-radius: 8px; padding: 6px 12px; margin: 12px 0 6px; }
    .color-group-title span { font-weight: normal; color: #8a93a0; }
    .color-fbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
    .color-fbtn { background: #fff; border: 1.5px solid #d7dee6; color: var(--artal-blue); border-radius: 100px; padding: 8px 16px; font-weight: bold; font-size: 13px; cursor: pointer; font-family: 'Arimo'; min-height: 40px; }
    .color-fbtn.active { background: var(--artal-blue); color: #fff; border-color: var(--artal-blue); }
    .inline-form label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 8px 0 4px; }
    .inline-form input { width: 100%; padding: 9px; border: 1.5px solid #ddd; border-radius: 7px; font-family: 'Arimo'; font-size: 14px; min-height: 40px; }
    .inline-form .row-actions { display: flex; gap: 8px; margin-top: 10px; }
    .inline-form .row-actions button { flex: 1; padding: 10px; border: none; border-radius: 7px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 420px; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 16px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; }
    .categoria-row { display: flex; gap: 8px; align-items: flex-end; }
    .categoria-row select { flex: 1; }
    .categoria-row button { white-space: nowrap; padding: 10px 12px; border: none; border-radius: 8px; background: var(--artal-light); color: var(--artal-blue); font-weight: bold; cursor: pointer; font-family: 'Arimo'; font-size: 13px; min-height: 44px; }
    .movs-list { font-size: 12.5px; color: #555; }
    .movs-list li { margin-bottom: 4px; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" id="btn-back" href="index.html" title="Volver">← Volver</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Inventario</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="notif-btn" title="Recibir avisos en este dispositivo">🔔 Notificaciones</button>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div id="admin-tools" style="display:none; gap:10px;">
        <button class="seed-btn" id="seed-btn" onclick="sembrarCatalogo()" style="display:none;">📦 Crear catálogo inicial de perfiles</button>
        <button class="seed-btn" id="seed-btn-sellantes" onclick="sembrarSellantes()" style="display:none;">🧪 Crear categorías Silicón/Urethano/Masilla</button>
        <button class="seed-btn" onclick="abrirConteo()">📋 Conteo físico</button>
        <button class="new-item-btn" onclick="abrirNuevoItem()">+ Agregar ítem nuevo al catálogo</button>
    </div>
    <div class="inv-kpis" id="inv-kpis"></div>
    <input type="text" id="search-input" placeholder="🔎 Buscar en el inventario…">

    <div id="categorias-container"><p class="empty">Cargando…</p></div>
</main>

<div class="modal-overlay" id="nuevo-item-overlay">
    <div class="modal-box">
        <h2>Agregar ítem nuevo</h2>
        <label>Categoría</label>
        <div class="categoria-row">
            <select id="nuevo-categoria" onchange="onNuevoCatChange()"></select>
            <button type="button" onclick="crearCategoria()">+ Nueva categoría</button>
        </div>
        <div id="nuevo-subgrupo-row" style="display:none">
            <label>Sección / grupo</label>
            <select id="nuevo-subgrupo"></select>
        </div>
        <label>Nombre del ítem</label>
        <input type="text" id="nuevo-tipo" placeholder="Ej: Riel superior 2 vías">
        <label>Referencia de producto <span style="font-weight:normal;color:#999">(opcional)</span></label>
        <input type="text" id="nuevo-referencia" placeholder="Ej: código / SKU del proveedor">
        <label id="nuevo-color-label">Color</label>
        <input type="text" id="nuevo-color" placeholder="Ej: Blanco">
        <label>Unidad</label>
        <input type="text" id="nuevo-unidad" placeholder="Ej: barras, unidades, galones">
        <label>Cantidad inicial</label>
        <input type="number" id="nuevo-cantidad" value="0" min="0">
        <label>Cantidad mínima <span style="font-weight:normal;color:#999">(avisa cuando baje de aquí; 0 = sin aviso)</span></label>
        <input type="number" id="nuevo-minimo" value="0" min="0">
        <label>Costo (por unidad)</label>
        <input type="number" id="nuevo-costo" value="0" min="0" step="0.01">
        <label>Precio de venta (por unidad)</label>
        <input type="number" id="nuevo-venta" value="0" min="0" step="0.01">
        <div class="modal-actions">
            <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarNuevoItem()">Cancelar</button>
            <button class="btn-agregar" onclick="guardarNuevoItem()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut, wireBackButton } from './auth-common.js';
    import { enableNotifications } from './notifications.js';
    import { fotosThumbsHTML, fotoAddBtnHTML } from './fotos.js?v=20260810c';
    import { db } from './firebase-config.js';
    import {
        collection, addDoc, doc, setDoc, updateDoc, deleteDoc, onSnapshot, increment, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    // Categorías base fijas + las que se vayan creando desde "+ Nueva categoría"
    // (colección `categoriasInventario`, un doc por categoría con { nombre }).
    const CATEGORIAS_BASE = [
        { key: 'perfil', label: 'Perfiles de aluminio' },
        { key: 'herraje', label: 'Herrajes' },
        { key: 'consumible', label: 'Consumibles' }
    ];
    // Sub-secciones DENTRO de una categoría (dividen sus ítems por el campo `subgrupo`).
    // Herramientas → por equipo; Accesorios puertas/ventanas/vidrios → por tipo de elemento.
    const SUBGRUPOS_HERR = [
        { key: 'equipo1', emoji: '👷', label: 'Equipo 1 de instalación' },
        { key: 'equipo2', emoji: '👷', label: 'Equipo 2 de instalación' },
        { key: 'comunes', emoji: '🔧', label: 'Comunes (compartidas)' }
    ];
    const SUBGRUPOS_ACC = [
        { key: 'puertas_alu', emoji: '🚪', label: 'Puertas de aluminio' },
        { key: 'ventanas_alu', emoji: '🪟', label: 'Ventanas de aluminio' },
        { key: 'puertas_vidrio', emoji: '🔳', label: 'Puertas de vidrio' },
        { key: 'mamparas_vidrio', emoji: '🚿', label: 'Mamparas de vidrio' },
        { key: 'barandas', emoji: '🚧', label: 'Barandas de vidrio' }
    ];
    const SUBGRUPOS_CONS = [
        { key: 'pintura', emoji: '🎨', label: 'Pintura' },
        { key: 'discos', emoji: '🪚', label: 'Discos de corte' },
        { key: 'mechas', emoji: '🌀', label: 'Mechas / brocas' },
        { key: 'tornilleria', emoji: '🔩', label: 'Tornillos y fijaciones' },
        { key: 'quimicos', emoji: '🧴', label: 'Alcohol / químicos' },
        { key: 'abrasivos', emoji: '🧽', label: 'Lijas / abrasivos' },
        { key: 'otros', emoji: '📦', label: 'Otros consumibles' }
    ];
    // Qué categorías se dividen en sub-secciones (por coincidencia de nombre, así funciona aunque
    // la categoría se renombre luego mientras conserve la palabra clave). `defecto` = a dónde caen
    // los ítems sin sub-sección asignada (si no, caen a la primera).
    const SUBGRUPOS_POR_CAT = [
        { match: /herramient/i, subs: SUBGRUPOS_HERR, defecto: 'comunes', vacio: 'Vacío — agrega herramientas a este equipo.' },
        { match: /accesorio/i, subs: SUBGRUPOS_ACC, vacio: 'Vacío — sin ítems en esta sección.' },
        { match: /consumible/i, subs: SUBGRUPOS_CONS, defecto: 'otros', vacio: 'Vacío — sin ítems en esta sección.' }
    ];
    const cfgSubgrupos = (cat) => (cat ? (SUBGRUPOS_POR_CAT.find(s => s.match.test(cat.label || '')) || null) : null);
    const subgruposDeCat = (cat) => { const c = cfgSubgrupos(cat); return c ? c.subs : null; };
    const vacioDeCat = (cat) => { const c = cfgSubgrupos(cat); return c ? c.vacio : 'Vacío.'; };
    const defectoDeCat = (cat) => { const c = cfgSubgrupos(cat); return c ? (c.defecto || c.subs[0].key) : null; };
    // Grupos "sintéticos": un cuadro que agrupa VARIAS categorías reales como sub-secciones
    // (a diferencia de Herramientas, que es UNA categoría dividida por el campo `subgrupo`).
    // "Selladores" junta las categorías Silicón / Masilla / Urethano sin mover ningún dato:
    // los ítems siguen guardados en su categoría real, solo se muestran agrupados.
    const GRUPOS_SINTETICOS = [
        { key: '__selladores', label: 'Selladores', emoji: '🧴', sub: ['silicon', 'masilla', 'urethano'] }
    ];
    const grupoDe = (key) => GRUPOS_SINTETICOS.find(g => g.key === key) || null;
    const catsAbsorbidas = () => new Set(GRUPOS_SINTETICOS.flatMap(g => g.sub));
    let categoriasCustom = [];
    function todasLasCategorias() {
        return [...CATEGORIAS_BASE, ...categoriasCustom.map(c => ({ key: c.id, label: c.nombre }))];
    }
    const catByKey = (key) => todasLasCategorias().find(c => c.key === key) || null;
    const subgruposDeKey = (key) => subgruposDeCat(catByKey(key));
    const defectoDeKey = (key) => defectoDeCat(catByKey(key));
    const esCategoriaCustom = (key) => categoriasCustom.some(c => c.id === key);
    const sgOptionsHTML = (subs, sel) => subs.map(s => `<option value="${s.key}" ${sel === s.key ? 'selected' : ''}>${s.emoji ? s.emoji + ' ' : ''}${esc(s.label)}</option>`).join('');
    function poblarSelectCategoria() {
        const sel = document.getElementById('nuevo-categoria');
        if (!sel) return;
        const prev = sel.value;
        sel.innerHTML = todasLasCategorias().map(c => `<option value="${esc(c.key)}">${esc(c.label)}</option>`).join('');
        if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
        onNuevoCatChange();
    }
    // Muestra y puebla el selector de sub-sección según la categoría elegida (Herramientas,
    // Accesorios…). Si la categoría no tiene sub-secciones, se oculta.
    window.onNuevoCatChange = function () {
        const sel = document.getElementById('nuevo-categoria');
        const row = document.getElementById('nuevo-subgrupo-row');
        const sg = document.getElementById('nuevo-subgrupo');
        if (!sel || !row) return;
        const subs = subgruposDeKey(sel.value);
        if (subs && sg) { sg.innerHTML = sgOptionsHTML(subs, sg.value); row.style.display = 'block'; }
        else { row.style.display = 'none'; }
    };

    // Gerencia (admin) + chofer + instalador + ayudante consumen del inventario. Fábrica/
    // contratista (Alucufel) queda fuera a propósito. Solo admin agrega stock/precio/elimina;
    // el resto (incluidos los ayudantes) solo puede "Tomar".
    const usuario = await requireAuth(['chofer', 'instalador', 'ayudante']);
    const esAdmin = usuario.roles.includes('admin');
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);
    document.getElementById('notif-btn').onclick = () => enableNotifications(document.getElementById('notif-btn'));
    if (esAdmin) document.getElementById('admin-tools').style.display = 'flex';
    wireBackButton(usuario.roles);

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    const PERFILES_SEED = [
        { tipo: 'Tubo 100x45 (1 3/4"x4")', unidad: 'barras' },
        { tipo: 'Tubo 100x100 (4"x4")', unidad: 'barras' },
        { tipo: 'Moldura U 3/8"', unidad: 'barras' },
        { tipo: 'Angular 25x25', unidad: 'barras' },
        { tipo: 'Angular 20x20', unidad: 'barras' }
    ];
    const COLORES_SEED = ['Blanco', 'Negro', 'Grafito', 'Plata'];
    const CONSUMIBLES_SEED = [
        { tipo: 'Silicón', unidad: 'tubos' },
        { tipo: 'Masilla', unidad: 'galones' },
        { tipo: 'Uretano', unidad: 'galones' },
        { tipo: 'Discos de corte', unidad: 'unidades' },
        { tipo: 'Mechas de metal', unidad: 'unidades' },
        { tipo: 'Mechas de concreto', unidad: 'unidades' },
        { tipo: 'Tornillos', unidad: 'cajas' }
    ];
    const SELLANTES_SEED = [
        { categoria: 'silicon', nombreCategoria: 'Silicón', items: [
            { tipo: 'Silicón Negro', unidad: 'tubos' },
            { tipo: 'Silicón Blanco', unidad: 'tubos' },
            { tipo: 'Silicón Transparente', unidad: 'tubos' }
        ] },
        { categoria: 'urethano', nombreCategoria: 'Urethano', items: [
            { tipo: 'Urethano Blanco', unidad: 'galones' },
            { tipo: 'Urethano Negro', unidad: 'galones' }
        ] },
        { categoria: 'masilla', nombreCategoria: 'Masilla', items: [
            { tipo: 'Masilla Siliconizada Blanca', unidad: 'galones' },
            { tipo: 'Masilla Negra', unidad: 'galones' }
        ] }
    ];

    let allItems = [];

    function money(n) {
        return 'RD$ ' + Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const minimoDe = (it) => Number(it.minimo) || 0;
    const sinStockDe = (it) => (Number(it.cantidad) || 0) <= 0;
    const bajoMinimoDe = (it) => minimoDe(it) > 0 && (Number(it.cantidad) || 0) <= minimoDe(it) && !sinStockDe(it);
    function itemCardHTML(item) {
        const sinStock = sinStockDe(item), bajo = bajoMinimoDe(item), low = sinStock || bajo, min = minimoDe(item);
        const subsEdit = subgruposDeKey(item.categoria);
        const label = item.color ? `${esc(item.tipo)} — ${esc(item.color)}` : esc(item.tipo);
        const costo = Number(item.costo || 0);
        const venta = Number(item.venta || 0);
        const margen = venta - costo;
        const margenPct = costo > 0 ? Math.round((margen / costo) * 100) : null;
        return `
        <div class="item-card ${low ? 'low' : ''}">
            <div class="item-head">
                <b>${label}</b>
                <span class="item-qty">${item.cantidad} <span class="unidad">${esc(item.unidad)}</span></span>
            </div>
            ${item.referencia ? `<div class="item-ref">Ref: ${esc(item.referencia)}</div>` : ''}
            ${sinStock ? `<div class="stock-warn out">⛔ Sin stock${min ? ` · mínimo ${min} ${esc(item.unidad)}` : ''}</div>` : (bajo ? `<div class="stock-warn low">⚠ Stock bajo · mínimo ${min} ${esc(item.unidad)}</div>` : '')}
            ${esAdmin ? `
            <div class="item-precios">
                <span class="costo">Costo: ${money(costo)}</span>
                <span class="venta">Venta: ${money(venta)}</span>
                ${margenPct !== null ? `<span class="margen">Margen: ${money(margen)} (${margenPct}%)</span>` : ''}
            </div>` : ''}
            ${fotosThumbsHTML(item.fotos, { coleccion: 'inventario', id: item.id, puedeBorrar: esAdmin })}
            ${fotoAddBtnHTML({ coleccion: 'inventario', id: item.id, label: '📷 Foto del ítem' })}
            <div class="item-actions">
                <button class="btn-tomar" onclick="abrirTomar('${item.id}')">📤 Tomar</button>
                <button class="btn-hist" onclick="abrirHistorial('${item.id}')">🕘 Historial</button>
                ${esAdmin ? `<button class="btn-agregar" onclick="abrirAgregar('${item.id}')">📥 Agregar stock</button>` : ''}
                ${esAdmin ? `<button class="btn-precio" onclick="abrirPrecio('${item.id}')">💲 Precio</button>` : ''}
                ${esAdmin ? `<button class="btn-editar" onclick="abrirEditar('${item.id}')">✏ Editar</button>` : ''}
                ${esAdmin ? `<button class="btn-eliminar" onclick="abrirEliminar('${item.id}')">🗑 Eliminar</button>` : ''}
            </div>
            <div class="inline-form" id="tomar-${item.id}">
                <label>Cantidad a tomar</label>
                <input type="number" id="tomar-cant-${item.id}" min="1" value="1">
                <label>¿Para qué obra/motivo?</label>
                <input type="text" id="tomar-nota-${item.id}" placeholder="Ej: Obra Gisell - Spirit de las Terrenas">
                <div class="row-actions">
                    <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarForm('tomar-${item.id}')">Cancelar</button>
                    <button class="btn-tomar" onclick="confirmarTomar('${item.id}')">Confirmar</button>
                </div>
            </div>
            ${esAdmin ? `
            <div class="inline-form" id="agregar-${item.id}">
                <div class="grid2-inv">
                    <div><label>Cantidad a agregar</label><input type="number" id="agregar-cant-${item.id}" min="1" value="1"></div>
                    <div><label>Costo por ${esc(item.unidad)} <span style="font-weight:normal;color:#999">(de esta compra)</span></label><input type="number" id="agregar-costo-${item.id}" min="0" step="0.01" value="${costo || ''}" placeholder="RD$"></div>
                </div>
                <div class="grid2-inv" style="margin-top:6px">
                    <div><label>Proveedor <span style="font-weight:normal;color:#999">(opcional)</span></label><input type="text" id="agregar-prov-${item.id}" placeholder="Nombre"></div>
                    <div><label>NCF <span style="font-weight:normal;color:#999">(opcional)</span></label><input type="text" id="agregar-ncf-${item.id}" placeholder="B01…"></div>
                </div>
                <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:normal;font-size:13px;"><input type="checkbox" id="agregar-gasto-${item.id}" style="width:auto"> Registrar la compra como <b>gasto</b> en Contabilidad</label>
                <div class="row-actions">
                    <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarForm('agregar-${item.id}')">Cancelar</button>
                    <button class="btn-agregar" onclick="confirmarAgregar('${item.id}')">Confirmar</button>
                </div>
            </div>
            <div class="inline-form" id="editar-${item.id}">
                <label>Nombre del ítem</label>
                <input type="text" id="editar-tipo-${item.id}" value="${esc(item.tipo || '')}">
                <label>Referencia de producto <span style="font-weight:normal;color:#999">(opcional)</span></label>
                <input type="text" id="editar-ref-${item.id}" value="${esc(item.referencia || '')}" placeholder="Ej: código / SKU del proveedor">
                <label>Color / variante <span style="font-weight:normal;color:#999">(opcional)</span></label>
                <input type="text" id="editar-color-${item.id}" value="${esc(item.color || '')}" placeholder="Ej: Negro, Blanco…">
                <div class="grid2-inv" style="margin-top:8px">
                    <div><label>Unidad</label><input type="text" id="editar-unidad-${item.id}" value="${esc(item.unidad || '')}"></div>
                    <div><label>Categoría</label><select id="editar-cat-${item.id}" onchange="onEditarCatChange('${item.id}')">${todasLasCategorias().map(c => `<option value="${esc(c.key)}" ${c.key === item.categoria ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></div>
                </div>
                <div class="grid2-inv" style="margin-top:8px">
                    <div><label>Cantidad mínima <span style="font-weight:normal;color:#999">(0 = sin aviso)</span></label><input type="number" id="editar-min-${item.id}" min="0" value="${Number(item.minimo) || 0}"></div>
                    <div id="editar-sg-row-${item.id}" style="${subsEdit ? '' : 'display:none'}"><label>Sección / grupo</label><select id="editar-sg-${item.id}">${subsEdit ? sgOptionsHTML(subsEdit, item.subgrupo || defectoDeKey(item.categoria)) : ''}</select></div>
                </div>
                <div class="row-actions">
                    <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarForm('editar-${item.id}')">Cancelar</button>
                    <button class="btn-editar" onclick="confirmarEditar('${item.id}')">Guardar cambios</button>
                </div>
            </div>
            <div class="inline-form" id="precio-${item.id}">
                <label>Costo (por ${esc(item.unidad)})</label>
                <input type="number" id="precio-costo-${item.id}" min="0" step="0.01" value="${costo}">
                <label>Precio de venta (por ${esc(item.unidad)})</label>
                <input type="number" id="precio-venta-${item.id}" min="0" step="0.01" value="${venta}">
                <div class="row-actions">
                    <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarForm('precio-${item.id}')">Cancelar</button>
                    <button class="btn-precio" onclick="confirmarPrecio('${item.id}')">Guardar</button>
                </div>
            </div>
            <div class="inline-form eliminar-form" id="eliminar-${item.id}">
                <p style="margin:0 0 6px;font-size:13px;color:#c0392b;font-weight:bold;">⚠ ¿Eliminar "${label}" del catálogo?</p>
                <p style="margin:0 0 8px;font-size:12px;color:#666;">Esta acción no se puede deshacer. El historial de movimientos de este ítem no se borra.</p>
                <div class="row-actions">
                    <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarForm('eliminar-${item.id}')">Cancelar</button>
                    <button class="btn-eliminar" onclick="confirmarEliminar('${item.id}')">Sí, eliminar definitivamente</button>
                </div>
            </div>` : ''}
        </div>`;
    }

    // Navegación por niveles (siempre cuadros): null = grid de categorías; catSel = dentro de una
    // categoría/grupo; subSel = dentro de una sub-sección de esa categoría.
    let catSel = null, subSel = null, colorFiltro = null;
    window.abrirCat = function (key) { catSel = key; subSel = null; colorFiltro = null; render(); window.scrollTo(0, 0); };
    window.abrirSub = function (key) { subSel = key; colorFiltro = null; render(); window.scrollTo(0, 0); };
    window.cerrarCat = function () { catSel = null; subSel = null; colorFiltro = null; render(); window.scrollTo(0, 0); };
    window.cerrarSub = function () { subSel = null; colorFiltro = null; render(); window.scrollTo(0, 0); };
    window.setColorFiltro = function (k) { colorFiltro = k || null; render(); };
    window.renombrarCategoria = async function (key) {
        const cat = catByKey(key);
        if (!cat || !esCategoriaCustom(key)) return;
        const nuevo = prompt('Nuevo nombre de la categoría:', cat.label);
        if (nuevo == null) return;
        const n = nuevo.trim();
        if (!n) { alert('El nombre no puede quedar vacío.'); return; }
        try { await updateDoc(doc(db, 'categoriasInventario', key), { nombre: n }); }
        catch (e) { alert('No se pudo renombrar: ' + e.message); }
    };
    function emojiCat(cat) {
        const l = (cat.label || '').toLowerCase();
        if (/perfil/.test(l)) return '🪟';
        if (/herraje/.test(l)) return '🔩';
        if (/consumible/.test(l)) return '⚙️';
        if (/herramient/.test(l)) return '🧰';
        if (/vidrio/.test(l)) return '🪞';
        if (/silic|uretan|masilla|sellad|sellante/.test(l)) return '🧴';
        return '📦';
    }
    // Devuelve las sub-secciones de un catSel (o null si esa categoría no se divide). Unifica los
    // dos casos: grupo sintético (Selladores → sub = categorías reales) y categoría con subgrupos
    // (Herramientas / Accesorios → sub = SUBGRUPOS por el campo `subgrupo`). Cada def trae ya sus
    // ítems, para reusarse en el grid de sub-cuadros y en el detalle de una sub-sección.
    function subdefsDe(catSelKey) {
        const g = grupoDe(catSelKey);
        if (g) {
            return {
                titulo: g.label, emoji: g.emoji, esCustom: false,
                defs: g.sub.map(k => { const c = catByKey(k); return c ? { key: k, emoji: emojiCat(c), label: c.label, items: allItems.filter(it => it.categoria === k) } : null; }).filter(Boolean)
            };
        }
        const c = catByKey(catSelKey);
        if (!c) return null;
        const subs = subgruposDeCat(c);
        if (!subs) return null;
        const catItems = allItems.filter(it => it.categoria === c.key);
        const def = defectoDeCat(c);
        return {
            titulo: c.label, emoji: emojiCat(c), esCustom: esCategoriaCustom(c.key),
            defs: subs.map(sg => ({ key: sg.key, emoji: sg.emoji, label: sg.label, items: catItems.filter(it => (it.subgrupo || def) === sg.key) }))
        };
    }
    // Agrupa una lista de ítems por color: Negro/Negro mate juntos, Cromado juntos, el resto por
    // su propio color, y "Sin color" al final. Así quedan ordenados dentro de cada sección.
    function colorGrupo(item) {
        const c = (item.color || '').toLowerCase().trim();
        if (!c) return { key: 'z_sincolor', label: 'Sin color' };
        if (/negro|mate|black/.test(c)) return { key: 'a_negro', label: 'Negro / Negro mate' };
        if (/cromad|cromo|chrome|inox|niquel|níquel|satin|satín/.test(c)) return { key: 'b_cromado', label: 'Cromado' };
        return { key: 'c_' + c, label: item.color };
    }
    // Botones de filtro rápido por color (Negro / Cromado). Solo aparecen si hay ítems de ese
    // color en la lista. "Todos" quita el filtro.
    function colorFiltroBarHTML(items) {
        const nNegro = items.filter(it => colorGrupo(it).key === 'a_negro').length;
        const nCromo = items.filter(it => colorGrupo(it).key === 'b_cromado').length;
        if (!nNegro && !nCromo) return '';
        const btn = (k, label) => `<button class="color-fbtn ${(colorFiltro || '') === k ? 'active' : ''}" onclick="setColorFiltro('${k}')">${label}</button>`;
        return `<div class="color-fbar">${btn('', 'Todos')}${nNegro ? btn('a_negro', `⚫ Negro (${nNegro})`) : ''}${nCromo ? btn('b_cromado', `⚪ Cromado (${nCromo})`) : ''}</div>`;
    }
    function itemsListHTML(items) {
        const lista = colorFiltro ? items.filter(it => colorGrupo(it).key === colorFiltro) : items;
        const bar = colorFiltroBarHTML(items);
        if (colorFiltro) {   // ya filtrado a un color: lista simple, sin encabezados de grupo
            return bar + (lista.length ? lista.map(itemCardHTML).join('') : '<p class="empty">Sin ítems de ese color en esta sección.</p>');
        }
        const grupos = {};
        lista.forEach(it => { const g = colorGrupo(it); (grupos[g.key] = grupos[g.key] || { label: g.label, items: [] }).items.push(it); });
        const keys = Object.keys(grupos).sort();
        if (keys.length <= 1) return bar + lista.map(itemCardHTML).join('');   // un solo color: sin encabezados
        return bar + keys.map(k => {
            const g = grupos[k];
            return `<div class="color-group-title">${esc(g.label)} <span>· ${g.items.length}</span></div>${g.items.map(itemCardHTML).join('')}`;
        }).join('');
    }
    function actualizarSeedBtns() {
        if (!esAdmin) return;
        const perfiles = allItems.filter(it => it.categoria === 'perfil');
        const seedBtn = document.getElementById('seed-btn'); if (seedBtn) seedBtn.style.display = perfiles.length ? 'none' : 'block';
        const yaSell = ['silicon', 'urethano', 'masilla'].some(k => categoriasCustom.some(c => c.id === k));
        const seedSell = document.getElementById('seed-btn-sellantes'); if (seedSell) seedSell.style.display = yaSell ? 'none' : 'block';
    }

    function render() {
        const term = document.getElementById('search-input').value.trim().toLowerCase();
        const filtered = allItems.filter(it => !term || ((it.tipo || '') + ' ' + (it.color || '') + ' ' + (it.referencia || '')).toLowerCase().includes(term));

        // Resumen superior (sobre TODO el inventario).
        if (esAdmin) {
            const valorTotal = allItems.reduce((a, it) => a + (Number(it.cantidad) || 0) * (Number(it.costo) || 0), 0);
            document.getElementById('inv-kpis').innerHTML =
                `<div class="inv-kpi"><div class="n">${money(valorTotal)}</div><div class="l">Valor del inventario</div></div>` +
                `<div class="inv-kpi"><div class="n warn">${allItems.filter(bajoMinimoDe).length}</div><div class="l">Bajo mínimo</div></div>` +
                `<div class="inv-kpi"><div class="n out">${allItems.filter(sinStockDe).length}</div><div class="l">Sin stock</div></div>`;
        }

        const container = document.getElementById('categorias-container');

        // Buscando: lista plana de resultados a través de todas las categorías.
        if (term) {
            container.innerHTML = filtered.length ? filtered.map(itemCardHTML).join('') : '<p class="empty">Sin resultados para la búsqueda.</p>';
            actualizarSeedBtns(); return;
        }

        // Un cuadro (mismo estilo en todos los niveles). `onclick` cambia según el nivel.
        const tileHTML = (onclick, label, emoji, items) => {
            const sin = items.filter(sinStockDe).length, bajo = items.filter(bajoMinimoDe).length;
            const alertas = [sin ? `${sin} sin stock` : '', bajo ? `${bajo} bajo mínimo` : ''].filter(Boolean).join(' · ');
            return `<div class="card-link inv-cat-tile" onclick="${onclick}">
                <div class="emoji">${emoji}</div>
                <div class="title">${esc(label)}</div>
                <div class="desc">${items.length} ítem(s)${alertas ? ` · <span style="color:#c0392b;font-weight:bold">${alertas}</span>` : ''}</div>
            </div>`;
        };
        const volverInv = '<button class="btn-back-cat" onclick="cerrarCat()">← Volver al inventario</button>';

        if (catSel) {
            const sd = subdefsDe(catSel);
            // Categoría/grupo CON sub-secciones.
            if (sd) {
                if (!subSel) {
                    // Nivel 2: cuadros de sub-sección (mismo grid de 3 columnas).
                    const renombrar = (esAdmin && sd.esCustom) ? ` <button class="btn-back-cat" onclick="renombrarCategoria('${esc(catSel)}')">✏ Renombrar</button>` : '';
                    const tiles = sd.defs.map(d => tileHTML(`abrirSub('${esc(d.key)}')`, d.label, d.emoji, d.items));
                    container.innerHTML = `${volverInv}${renombrar}<h2 class="section-title" style="margin:12px 0 10px">${sd.emoji} ${esc(sd.titulo)}</h2><div class="inv-grid">${tiles.join('')}</div>`;
                    actualizarSeedBtns(); return;
                }
                // Nivel 3: ítems de una sub-sección.
                const d = sd.defs.find(x => x.key === subSel);
                const items = d ? d.items : [];
                const volverSub = `<button class="btn-back-cat" onclick="cerrarSub()">← ${esc(sd.titulo)}</button>`;
                const cuerpo = items.length ? itemsListHTML(items) : '<p class="empty">Sin ítems en esta sección todavía.</p>';
                container.innerHTML = `${volverSub}<h2 class="section-title" style="margin:12px 0 10px">${d ? d.emoji + ' ' + esc(d.label) : ''}</h2>${cuerpo}`;
                actualizarSeedBtns(); return;
            }
            // Categoría SIN sub-secciones: ítems directos.
            const cat = catByKey(catSel);
            if (cat) {
                const items = allItems.filter(it => it.categoria === cat.key);
                const renombrar = (esAdmin && esCategoriaCustom(cat.key)) ? ` <button class="btn-back-cat" onclick="renombrarCategoria('${esc(cat.key)}')">✏ Renombrar</button>` : '';
                const cuerpo = items.length ? itemsListHTML(items) : '<p class="empty">No hay ítems en esta categoría todavía.</p>';
                container.innerHTML = `${volverInv}${renombrar}<h2 class="section-title" style="margin:12px 0 10px">${emojiCat(cat)} ${esc(cat.label)}</h2>${cuerpo}`;
                actualizarSeedBtns(); return;
            }
            catSel = null;
        }

        // Nivel 1: cuadros de categoría en 3 columnas. Primero las categorías reales (las
        // absorbidas por un grupo sintético se omiten), luego los grupos sintéticos.
        const absorb = catsAbsorbidas();
        const tiles = todasLasCategorias().filter(c => !absorb.has(c.key))
            .map(c => tileHTML(`abrirCat('${esc(c.key)}')`, c.label, emojiCat(c), allItems.filter(it => it.categoria === c.key)));
        GRUPOS_SINTETICOS.forEach(g => {
            tiles.push(tileHTML(`abrirCat('${esc(g.key)}')`, g.label, g.emoji, allItems.filter(it => g.sub.includes(it.categoria))));
        });
        container.innerHTML = '<div class="inv-grid">' + tiles.join('') + '</div>';
        actualizarSeedBtns();
    }

    document.getElementById('search-input').addEventListener('input', render);

    onSnapshot(collection(db, 'categoriasInventario'), (snap) => {
        categoriasCustom = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        poblarSelectCategoria();
        render();
    });

    onSnapshot(collection(db, 'inventario'), (snap) => {
        allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        allItems.sort((a, b) => (a.tipo + (a.color || '')).localeCompare(b.tipo + (b.color || '')));
        render();
    }, (err) => {
        document.getElementById('categorias-container').innerHTML = '<p class="empty">Error cargando inventario: ' + err.message + '</p>';
    });

    poblarSelectCategoria();

    // Movimientos (consumo / restock / ajuste) para el historial por ítem.
    let movs = [];
    onSnapshot(collection(db, 'movimientosInventario'), (snap) => {
        movs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (histItemId && document.getElementById('hist-overlay').classList.contains('show')) pintarHistorial();
    }, () => {});

    let histItemId = null;
    const fmtFechaHora = (ts) => (ts && ts.toDate ? ts.toDate().toLocaleString('es-DO', { dateStyle: 'medium', timeStyle: 'short' }) : '');
    window.abrirHistorial = function (id) { histItemId = id; pintarHistorial(); document.getElementById('hist-overlay').classList.add('show'); };
    window.cerrarHistorial = function () { document.getElementById('hist-overlay').classList.remove('show'); histItemId = null; };
    function pintarHistorial() {
        const item = allItems.find(it => it.id === histItemId) || {};
        document.getElementById('hist-titulo').textContent = 'Historial · ' + (item.tipo || '') + (item.color ? ' — ' + item.color : '');
        const lista = movs.filter(m => m.itemId === histItemId)
            .sort((a, b) => ((b.fecha && b.fecha.seconds) || 0) - ((a.fecha && a.fecha.seconds) || 0));
        const cont = document.getElementById('hist-body');
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin movimientos registrados para este ítem.</p>'; return; }
        const TIPO = { consumo: '📤 Tomado', restock: '📥 Reabastecido', ajuste: '📋 Ajuste de conteo' };
        cont.innerHTML = lista.map(m => {
            const signo = (Number(m.cantidad) || 0) >= 0 ? '+' : '';
            const extra = [m.proveedor ? 'Prov: ' + esc(m.proveedor) : '', m.ncf ? 'NCF: ' + esc(m.ncf) : '', m.costoUnitario ? money(m.costoUnitario) + '/u' : ''].filter(Boolean).join(' · ');
            return `<div class="hist-row">
                <div><b>${TIPO[m.tipo] || esc(m.tipo || '')}</b> <span class="hist-cant ${(Number(m.cantidad) || 0) >= 0 ? 'pos' : 'neg'}">${signo}${m.cantidad} ${esc(item.unidad || '')}</span>
                    ${m.nota ? `<div class="l">${esc(m.nota)}</div>` : ''}${extra ? `<div class="l">${extra}</div>` : ''}</div>
                <div class="hist-meta">${esc(m.usuarioNombre || '')}<br>${esc(fmtFechaHora(m.fecha))}</div>
            </div>`;
        }).join('');
    }

    window.crearCategoria = async function () {
        const nombre = (prompt('Nombre de la nueva categoría (ej: Vidrios, Sellantes…):') || '').trim();
        if (!nombre) return;
        const yaExiste = todasLasCategorias().some(c => c.label.toLowerCase() === nombre.toLowerCase());
        if (yaExiste) { alert('Ya existe una categoría con ese nombre.'); return; }
        try {
            const ref_ = await addDoc(collection(db, 'categoriasInventario'), { nombre, creadoFecha: serverTimestamp() });
            categoriasCustom.push({ id: ref_.id, nombre });
            poblarSelectCategoria();
            document.getElementById('nuevo-categoria').value = ref_.id;
        } catch (e) {
            alert('No se pudo crear la categoría: ' + e.message);
        }
    };

    window.sembrarCatalogo = async function () {
        if (!confirm('¿Crear el catálogo inicial de perfiles (5 tipos x 4 colores)? Solo hace falta una vez.')) return;
        try {
            for (const p of PERFILES_SEED) {
                for (const color of COLORES_SEED) {
                    await addDoc(collection(db, 'inventario'), {
                        tipo: p.tipo, color, categoria: 'perfil', unidad: p.unidad, cantidad: 0,
                        costo: 0, venta: 0, creadoFecha: serverTimestamp()
                    });
                }
            }
            for (const c of CONSUMIBLES_SEED) {
                await addDoc(collection(db, 'inventario'), {
                    tipo: c.tipo, color: null, categoria: 'consumible', unidad: c.unidad, cantidad: 0,
                    costo: 0, venta: 0, creadoFecha: serverTimestamp()
                });
            }
            alert('Catálogo creado. Ahora usa "Agregar stock" en cada ítem para poner las cantidades reales.');
        } catch (e) {
            alert('No se pudo crear el catálogo: ' + e.message);
        }
    };

    window.sembrarSellantes = async function () {
        if (!confirm('¿Crear las categorías Silicón, Urethano y Masilla con sus variantes? Solo hace falta una vez.')) return;
        try {
            for (const grupo of SELLANTES_SEED) {
                await setDoc(doc(db, 'categoriasInventario', grupo.categoria), { nombre: grupo.nombreCategoria, creadoFecha: serverTimestamp() }, { merge: true });
                for (const it of grupo.items) {
                    await addDoc(collection(db, 'inventario'), {
                        tipo: it.tipo, color: null, categoria: grupo.categoria, unidad: it.unidad, cantidad: 0,
                        costo: 0, venta: 0, creadoFecha: serverTimestamp()
                    });
                }
            }
            alert('Categorías creadas. Ahora usa "Agregar stock" en cada ítem para poner las cantidades reales.');
        } catch (e) {
            alert('No se pudo crear: ' + e.message);
        }
    };

    // ---------- Conteo físico ----------
    window.abrirConteo = function () {
        let html = '<table class="conteo-tabla"><thead><tr><th>Ítem</th><th style="text-align:right">Sistema</th><th style="text-align:right">Real contado</th></tr></thead><tbody>';
        todasLasCategorias().forEach(cat => {
            const items = allItems.filter(it => it.categoria === cat.key);
            if (!items.length) return;
            html += `<tr><td colspan="3" class="conteo-cat">${esc(cat.label)}</td></tr>`;
            items.forEach(it => {
                const label = it.color ? esc(it.tipo) + ' — ' + esc(it.color) : esc(it.tipo);
                const q = Number(it.cantidad) || 0;
                html += `<tr><td>${label} <span style="color:#999">${esc(it.unidad || '')}</span></td><td style="text-align:right;color:#888">${q}</td><td style="text-align:right"><input type="number" data-id="${esc(it.id)}" data-actual="${q}" value="${q}" oninput="marcarDif(this)"></td></tr>`;
            });
        });
        html += '</tbody></table>';
        document.getElementById('conteo-body').innerHTML = html;
        document.getElementById('conteo-overlay').classList.add('show');
    };
    window.marcarDif = function (inp) { const tr = inp.closest('tr'); if (tr) tr.classList.toggle('dif', Number(inp.value) !== Number(inp.dataset.actual)); };
    window.cerrarConteo = function () { document.getElementById('conteo-overlay').classList.remove('show'); };
    window.guardarConteo = async function () {
        const cambios = Array.from(document.querySelectorAll('#conteo-body input[data-id]'))
            .map(i => ({ id: i.dataset.id, actual: Number(i.dataset.actual), nuevo: Number(i.value) }))
            .filter(c => !isNaN(c.nuevo) && c.nuevo !== c.actual);
        if (!cambios.length) { alert('No hay cambios en el conteo.'); return; }
        if (!confirm(`Se ajustarán ${cambios.length} ítem(s) a la cantidad real contada. ¿Continuar?`)) return;
        try {
            for (const c of cambios) {
                const item = allItems.find(it => it.id === c.id) || {};
                await updateDoc(doc(db, 'inventario', c.id), { cantidad: c.nuevo });
                await addDoc(collection(db, 'movimientosInventario'), {
                    itemId: c.id, itemTipo: item.tipo, itemColor: item.color || null,
                    tipo: 'ajuste', cantidad: c.nuevo - c.actual, nota: 'Ajuste por conteo físico (de ' + c.actual + ' a ' + c.nuevo + ')',
                    usuarioNombre: usuario.nombre, usuarioEmail: usuario.email, fecha: serverTimestamp()
                });
            }
            cerrarConteo();
            alert('Conteo aplicado: ' + cambios.length + ' ajuste(s).');
        } catch (e) { alert('No se pudo aplicar el conteo: ' + e.message); }
    };

    window.abrirNuevoItem = function () {
        // Preseleccionar la categoría (y sub-sección) donde está parado el usuario, para no tener
        // que elegirla otra vez y evitar guardarla por error en la que quedó de antes.
        const sel = document.getElementById('nuevo-categoria');
        if (sel && catSel) {
            const g = grupoDe(catSel);
            if (g) {
                // Grupo sintético (Selladores): la categoría real es la sub-sección elegida.
                if (subSel && [...sel.options].some(o => o.value === subSel)) sel.value = subSel;
            } else if ([...sel.options].some(o => o.value === catSel)) {
                sel.value = catSel;
            }
            onNuevoCatChange();  // muestra/puebla el selector de sub-sección según la categoría
            const sg = document.getElementById('nuevo-subgrupo');
            if (sg && subSel && !g && [...sg.options].some(o => o.value === subSel)) sg.value = subSel;
        }
        document.getElementById('nuevo-item-overlay').classList.add('show');
    };
    window.cerrarNuevoItem = function () {
        document.getElementById('nuevo-item-overlay').classList.remove('show');
    };
    window.guardarNuevoItem = async function () {
        const categoria = document.getElementById('nuevo-categoria').value;
        const tipo = document.getElementById('nuevo-tipo').value.trim();
        const referencia = document.getElementById('nuevo-referencia').value.trim();
        const color = document.getElementById('nuevo-color').value.trim();
        const unidad = document.getElementById('nuevo-unidad').value.trim() || 'unidades';
        const cantidad = Number(document.getElementById('nuevo-cantidad').value) || 0;
        const minimo = Number(document.getElementById('nuevo-minimo').value) || 0;
        const costo = Number(document.getElementById('nuevo-costo').value) || 0;
        const venta = Number(document.getElementById('nuevo-venta').value) || 0;
        if (!tipo) { alert('Escribe el nombre del ítem.'); return; }
        const subsNuevo = subgruposDeKey(categoria);
        const subgrupo = subsNuevo ? (document.getElementById('nuevo-subgrupo').value || defectoDeKey(categoria)) : null;
        try {
            await addDoc(collection(db, 'inventario'), {
                tipo, referencia: referencia || null, color: color || null,
                categoria, subgrupo, unidad, cantidad, minimo, costo, venta, creadoFecha: serverTimestamp()
            });
            cerrarNuevoItem();
            document.getElementById('nuevo-tipo').value = '';
            document.getElementById('nuevo-referencia').value = '';
            document.getElementById('nuevo-color').value = '';
            document.getElementById('nuevo-cantidad').value = '0';
            document.getElementById('nuevo-minimo').value = '0';
            document.getElementById('nuevo-costo').value = '0';
            document.getElementById('nuevo-venta').value = '0';
        } catch (e) {
            alert('No se pudo guardar: ' + e.message);
        }
    };

    window.abrirTomar = function (id) {
        cerrarTodosLosForms();
        const el = document.getElementById('tomar-' + id);
        if (el) el.classList.add('show');
    };
    window.abrirAgregar = function (id) {
        cerrarTodosLosForms();
        const el = document.getElementById('agregar-' + id);
        if (el) el.classList.add('show');
    };
    window.abrirPrecio = function (id) {
        cerrarTodosLosForms();
        const el = document.getElementById('precio-' + id);
        if (el) el.classList.add('show');
    };
    window.abrirEditar = function (id) {
        cerrarTodosLosForms();
        const el = document.getElementById('editar-' + id);
        if (el) el.classList.add('show');
    };
    window.onEditarCatChange = function (id) {
        const sel = document.getElementById('editar-cat-' + id);
        const row = document.getElementById('editar-sg-row-' + id);
        const sg = document.getElementById('editar-sg-' + id);
        if (!sel || !row) return;
        const subs = subgruposDeKey(sel.value);
        if (subs && sg) { sg.innerHTML = sgOptionsHTML(subs, sg.value); row.style.display = 'block'; }
        else { row.style.display = 'none'; }
    };
    window.confirmarEditar = async function (id) {
        const tipo = (document.getElementById('editar-tipo-' + id).value || '').trim();
        if (!tipo) { alert('El nombre no puede quedar vacío.'); return; }
        const referencia = (document.getElementById('editar-ref-' + id).value || '').trim();
        const color = (document.getElementById('editar-color-' + id).value || '').trim();
        const unidad = (document.getElementById('editar-unidad-' + id).value || '').trim();
        const categoria = document.getElementById('editar-cat-' + id).value;
        const minimo = Number(document.getElementById('editar-min-' + id).value) || 0;
        const sgEl = document.getElementById('editar-sg-' + id);
        const subsEd = subgruposDeKey(categoria);
        const subgrupo = subsEd ? ((sgEl && sgEl.value) || defectoDeKey(categoria)) : null;
        try {
            await updateDoc(doc(db, 'inventario', id), { tipo, referencia: referencia || null, color: color || null, unidad, categoria, subgrupo, minimo });
            cerrarForm('editar-' + id);
        } catch (e) { alert('No se pudo guardar: ' + e.message); }
    };
    window.abrirEliminar = function (id) {
        cerrarTodosLosForms();
        const el = document.getElementById('eliminar-' + id);
        if (el) el.classList.add('show');
    };
    window.cerrarForm = function (elId) {
        const el = document.getElementById(elId);
        if (el) el.classList.remove('show');
    };
    function cerrarTodosLosForms() {
        document.querySelectorAll('.inline-form.show').forEach(el => el.classList.remove('show'));
    }

    window.confirmarTomar = async function (id) {
        const item = allItems.find(it => it.id === id);
        const cantidad = Number(document.getElementById('tomar-cant-' + id).value);
        const nota = document.getElementById('tomar-nota-' + id).value.trim();
        if (!cantidad || cantidad <= 0) { alert('Escribe una cantidad válida.'); return; }
        if (!nota) { alert('Escribe para qué obra o motivo estás tomando este material.'); return; }
        if (cantidad > item.cantidad) {
            if (!confirm(`Solo quedan ${item.cantidad} ${item.unidad}. ¿Tomar de todos modos (quedará en negativo)?`)) return;
        }
        try {
            await updateDoc(doc(db, 'inventario', id), { cantidad: increment(-cantidad) });
            await addDoc(collection(db, 'movimientosInventario'), {
                itemId: id, itemTipo: item.tipo, itemColor: item.color || null,
                tipo: 'consumo', cantidad: -cantidad, nota,
                usuarioNombre: usuario.nombre, usuarioEmail: usuario.email,
                fecha: serverTimestamp()
            });
            cerrarForm('tomar-' + id);
        } catch (e) {
            alert('No se pudo registrar: ' + e.message);
        }
    };

    window.confirmarAgregar = async function (id) {
        const item = allItems.find(it => it.id === id);
        const cantidad = Number(document.getElementById('agregar-cant-' + id).value);
        if (!cantidad || cantidad <= 0) { alert('Escribe una cantidad válida.'); return; }
        const costoU = Number(document.getElementById('agregar-costo-' + id).value) || 0;
        const proveedor = (document.getElementById('agregar-prov-' + id).value || '').trim();
        const ncf = (document.getElementById('agregar-ncf-' + id).value || '').trim().toUpperCase();
        const crearGasto = document.getElementById('agregar-gasto-' + id).checked;
        try {
            const cambios = { cantidad: increment(cantidad) };
            if (costoU > 0) cambios.costo = costoU;   // el costo del ítem se actualiza con el de esta última compra
            await updateDoc(doc(db, 'inventario', id), cambios);
            await addDoc(collection(db, 'movimientosInventario'), {
                itemId: id, itemTipo: item.tipo, itemColor: item.color || null,
                tipo: 'restock', cantidad, nota: 'Reabastecimiento' + (proveedor ? ' · ' + proveedor : ''),
                costoUnitario: costoU || null, proveedor: proveedor || null, ncf: ncf || null,
                usuarioNombre: usuario.nombre, usuarioEmail: usuario.email, fecha: serverTimestamp()
            });
            // Crear el gasto en Contabilidad (best-effort): aparece en Gastos y desde ahí puede ir a Citrus.
            if (crearGasto && costoU > 0) {
                try {
                    await addDoc(collection(db, 'contaMovimientos'), {
                        tipo: 'gasto', fecha: new Date().toISOString().slice(0, 10),
                        concepto: 'Compra inventario: ' + item.tipo + (item.color ? ' — ' + item.color : ''),
                        categoria: 'Materiales / insumos', monto: costoU * cantidad, itbis: 0,
                        metodo: 'Transferencia', tercero: proveedor, rnc: '', ncf,
                        notas: cantidad + ' ' + (item.unidad || '') + ' × ' + money(costoU),
                        creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                    });
                } catch (e2) { alert('El stock se agregó, pero no se pudo crear el gasto: ' + (e2 && e2.message ? e2.message : e2)); }
            }
            cerrarForm('agregar-' + id);
        } catch (e) {
            alert('No se pudo registrar: ' + e.message);
        }
    };

    window.confirmarPrecio = async function (id) {
        const costo = Number(document.getElementById('precio-costo-' + id).value) || 0;
        const venta = Number(document.getElementById('precio-venta-' + id).value) || 0;
        try {
            await updateDoc(doc(db, 'inventario', id), { costo, venta });
            cerrarForm('precio-' + id);
        } catch (e) {
            alert('No se pudo guardar el precio: ' + e.message);
        }
    };

    // Doble seguridad: hay que desplegar el aviso rojo (1er clic) y luego, además, confirmar en
    // el diálogo del navegador (2do clic) — así no se borra un ítem por un toque accidental.
    window.confirmarEliminar = async function (id) {
        const item = allItems.find(it => it.id === id);
        if (!item) return;
        const label = item.color ? `${item.tipo} — ${item.color}` : item.tipo;
        if (!confirm(`Confirma de nuevo: ¿eliminar "${label}" del catálogo? Esta acción no se puede deshacer.`)) return;
        try {
            await deleteDoc(doc(db, 'inventario', id));
            await addDoc(collection(db, 'movimientosInventario'), {
                itemId: id, itemTipo: item.tipo, itemColor: item.color || null,
                tipo: 'eliminado', cantidad: 0, nota: 'Ítem eliminado del catálogo',
                usuarioNombre: usuario.nombre, usuarioEmail: usuario.email,
                fecha: serverTimestamp()
            });
        } catch (e) {
            alert('No se pudo eliminar: ' + e.message);
        }
    };
</script>

<div class="modal-overlay" id="hist-overlay">
    <div class="modal-box" style="max-width:520px">
        <h2 id="hist-titulo">Historial</h2>
        <div id="hist-body" style="max-height:60vh;overflow:auto;margin-top:6px"></div>
        <div class="modal-actions"><button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarHistorial()">Cerrar</button></div>
    </div>
</div>

<div class="modal-overlay" id="conteo-overlay">
    <div class="modal-box" style="max-width:560px">
        <h2>📋 Conteo físico</h2>
        <p style="font-size:13px;color:#667;margin:0 0 10px;">Escribe la cantidad <b>real contada</b> de cada ítem. Al guardar, solo se ajustan los que cambien (queda registrado en el historial como “ajuste de conteo”).</p>
        <div id="conteo-body" style="max-height:62vh;overflow:auto"></div>
        <div class="modal-actions">
            <button style="background:transparent;border:1.5px solid #ddd;color:#888;" onclick="cerrarConteo()">Cancelar</button>
            <button class="btn-agregar" onclick="guardarConteo()">Guardar conteo</button>
        </div>
    </div>
</div>

</body>
</html>
