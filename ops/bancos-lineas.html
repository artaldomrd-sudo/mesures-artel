<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Líneas de Crédito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20260805">
<style>
    main { max-width: 920px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar select { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; min-width: 200px; }
    .btn-o { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue); border-radius: 9px; padding: 10px 14px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-d { background: #e67e22; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-p { background: #2ecc71; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 10px 16px; flex: 1; min-width: 130px; }
    .kpi .n { font-size: 18px; font-weight: bold; line-height: 1; } .kpi .n.lim { color: var(--artal-blue); } .kpi .n.disp { color: #1f9d61; } .kpi .n.usado { color: #e67e22; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
    .prog { height: 8px; background: #eef1f4; border-radius: 6px; overflow: hidden; margin: 6px 0 14px; }
    .prog > span { display: block; height: 100%; background: linear-gradient(90deg, #f0a020, #e67e22); }
    .meta { font-size: 12.5px; color: #667; margin: -8px 0 12px; }

    .mv-card { display: flex; align-items: flex-start; gap: 12px; border-left: 4px solid #ccc; }
    .mv-card.disposicion { border-left-color: #e67e22; } .mv-card.pago { border-left-color: #2ecc71; }
    .mv-ic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 auto; }
    .mv-ic.disposicion { background: #fdf0e2; } .mv-ic.pago { background: #e7f7ee; }
    .mv-info { flex: 1; min-width: 0; } .mv-info b { color: var(--artal-blue); font-size: 14px; }
    .mv-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .mv-monto { font-weight: bold; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .mv-monto.disposicion { color: #d9691f; } .mv-monto.pago { color: #1f9d61; }
    .del-btn { background: transparent; border: none; color: #c9ced6; cursor: pointer; font-size: 15px; } .del-btn:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="bancos.html" title="Volver">← Bancos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Líneas de Crédito</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar">
        <select id="sel-linea" onchange="render()"></select>
        <button class="btn-o" onclick="abrirLinea()">+ Nueva línea</button>
        <button class="btn-d" onclick="abrirMov('disposicion')">− Disposición</button>
        <button class="btn-p" onclick="abrirMov('pago')">+ Pago</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="prog" id="prog" style="display:none"><span id="prog-bar"></span></div>
    <div class="meta" id="meta"></div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<!-- Modal: nueva línea -->
<div class="modal-overlay" id="modal-linea">
    <div class="modal-box">
        <h2>Nueva línea de crédito</h2>
        <label>Nombre / entidad *</label>
        <input type="text" id="l-nombre" placeholder="Ej. LOC Banco Popular">
        <div class="grid2">
            <div><label>Banco</label><input type="text" id="l-banco" placeholder="Banco"></div>
            <div><label>Límite (RD$) *</label><input type="number" id="l-limite" min="0" step="0.01"></div>
        </div>
        <div class="grid2">
            <div><label>Tasa anual (%) <span class="lbl-opt">— opcional</span></label><input type="number" id="l-tasa" min="0" step="0.01" placeholder="Ej. 16"></div>
            <div><label>Fecha de apertura</label><input type="date" id="l-fecha"></div>
        </div>
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="l-notas" placeholder="Garantía, nº de línea…">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-linea')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarLinea()">Crear línea</button>
        </div>
    </div>
</div>

<!-- Modal: movimiento (disposición / pago) -->
<div class="modal-overlay" id="modal-mov">
    <div class="modal-box">
        <h2 id="mov-title">Movimiento</h2>
        <div class="grid2">
            <div><label>Fecha</label><input type="date" id="m-fecha"></div>
            <div><label>Monto (RD$) *</label><input type="number" id="m-monto" min="0" step="0.01"></div>
        </div>
        <label>Concepto <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="m-concepto" placeholder="Motivo">
        <label id="m-cuenta-lbl">Entra a la cuenta bancaria <span class="lbl-opt">— opcional (genera el movimiento)</span></label>
        <select id="m-cuenta"><option value="">— Solo registrar en la línea —</option></select>
        <label>Referencia <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="m-ref" placeholder="Nº transf./cheque">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-mov')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarMov()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['contable']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { maximumFractionDigits: 0 });
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: '2-digit', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    let lineas = [], movs = [], cuentas = [], movTipo = 'disposicion';

    onSnapshot(collection(db, 'bancosLineas'), (s) => {
        lineas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.activo !== false).sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));
        llenarLineas(); render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'bancosLineaMovimientos'), (s) => { movs = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    onSnapshot(collection(db, 'bancosCuentas'), (s) => {
        cuentas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.activo !== false);
        const sel = document.getElementById('m-cuenta'); const cur = sel.value;
        sel.innerHTML = '<option value="">— Solo registrar en la línea —</option>' + cuentas.map(c => `<option value="${esc(c.id)}">${esc(c.alias)}</option>`).join(''); sel.value = cur;
    }, () => {});

    function llenarLineas() {
        const sel = document.getElementById('sel-linea'); const cur = sel.value;
        sel.innerHTML = lineas.length ? lineas.map(l => `<option value="${esc(l.id)}">${esc(l.nombre)}${l.banco ? ' — ' + esc(l.banco) : ''}</option>`).join('') : '<option value="">— Sin líneas —</option>';
        if (cur && lineas.some(l => l.id === cur)) sel.value = cur;
    }
    const lineaSel = () => lineas.find(l => l.id === document.getElementById('sel-linea').value) || null;
    const movsLinea = (id) => movs.filter(m => m.lineaId === id);
    const dispuesto = (id) => movsLinea(id).reduce((a, m) => a + (m.tipo === 'disposicion' ? n2(m.monto) : -n2(m.monto)), 0);

    // ---------- Modales ----------
    window.cerrar = function (id) { document.getElementById(id).classList.remove('show'); };
    window.abrirLinea = function () {
        ['l-nombre', 'l-banco', 'l-limite', 'l-tasa', 'l-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('l-fecha').value = hoyISO();
        document.getElementById('modal-linea').classList.add('show');
    };
    window.guardarLinea = async function () {
        const nombre = document.getElementById('l-nombre').value.trim(), limite = n2(document.getElementById('l-limite').value);
        if (!nombre) { alert('Escribe el nombre de la línea.'); return; }
        if (limite <= 0) { alert('Escribe el límite de la línea.'); return; }
        const btn = document.querySelector('#modal-linea .btn-guardar'); btn.disabled = true; btn.textContent = 'Creando…';
        try {
            const ref = await addDoc(collection(db, 'bancosLineas'), {
                nombre, banco: document.getElementById('l-banco').value.trim(), limite,
                tasaAnual: n2(document.getElementById('l-tasa').value), fechaApertura: document.getElementById('l-fecha').value || hoyISO(),
                notas: document.getElementById('l-notas').value.trim(), activo: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            document.getElementById('sel-linea').value = ref.id;
            cerrar('modal-linea'); render();
        } catch (e) { alert('No se pudo crear: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Crear línea'; }
    };
    window.abrirMov = function (tipo) {
        if (!lineaSel()) { alert('Primero elige (o crea) una línea.'); return; }
        movTipo = tipo;
        document.getElementById('mov-title').textContent = tipo === 'disposicion' ? 'Disposición (usar la línea)' : 'Pago (abonar a la línea)';
        document.getElementById('m-cuenta-lbl').innerHTML = (tipo === 'disposicion' ? 'Entra a la cuenta bancaria' : 'Sale de la cuenta bancaria') + ' <span class="lbl-opt">— opcional (genera el movimiento)</span>';
        document.getElementById('m-fecha').value = hoyISO();
        ['m-monto', 'm-concepto', 'm-ref'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('m-cuenta').value = '';
        document.getElementById('modal-mov').classList.add('show');
    };
    window.guardarMov = async function () {
        const l = lineaSel(); if (!l) return;
        const monto = n2(document.getElementById('m-monto').value);
        if (monto <= 0) { alert('Escribe el monto.'); return; }
        if (movTipo === 'disposicion') {
            const disp = dispuesto(l.id), libre = n2(l.limite) - disp;
            if (monto > libre && !confirm('La disposición (' + fmt(monto) + ') supera el disponible (' + fmt(libre) + '). ¿Registrarla igual?')) return;
        }
        const cuentaId = document.getElementById('m-cuenta').value, ref = document.getElementById('m-ref').value.trim();
        const concepto = document.getElementById('m-concepto').value.trim(), fecha = document.getElementById('m-fecha').value || hoyISO();
        const btn = document.querySelector('#modal-mov .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            await addDoc(collection(db, 'bancosLineaMovimientos'), {
                lineaId: l.id, tipo: movTipo, fecha, monto, concepto, referencia: ref, cuentaBancoId: cuentaId,
                creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            // Enlace opcional con banco: disposición entra (crédito) a la cuenta; pago sale (débito).
            if (cuentaId) {
                await addDoc(collection(db, 'bancosMovimientos'), {
                    cuentaId, tipo: movTipo === 'disposicion' ? 'credito' : 'debito', monto, fecha,
                    descripcion: (movTipo === 'disposicion' ? 'Disposición LOC: ' : 'Pago LOC: ') + (l.nombre || ''),
                    referencia: ref, origen: 'linea_credito', conciliado: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                });
            }
            cerrar('modal-mov');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.borrarMov = async function (id) {
        if (!confirm('¿Eliminar este movimiento de la línea?')) return;
        try { await deleteDoc(doc(db, 'bancosLineaMovimientos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const cont = document.getElementById('lista');
        if (!lineas.length) { cont.innerHTML = '<p class="empty">No hay líneas de crédito. Crea una con «+ Nueva línea».</p>'; document.getElementById('kpis').innerHTML = ''; document.getElementById('prog').style.display = 'none'; document.getElementById('meta').textContent = ''; return; }
        const l = lineaSel(); if (!l) { cont.innerHTML = '<p class="empty">Elige una línea.</p>'; return; }
        const disp = dispuesto(l.id), libre = Math.max(0, n2(l.limite) - disp), pct = n2(l.limite) ? Math.min(100, Math.round(disp / n2(l.limite) * 100)) : 0;
        document.getElementById('kpis').innerHTML =
            `<div class="kpi"><div class="n lim">${fmt0(l.limite)}</div><div class="l">Límite</div></div>` +
            `<div class="kpi"><div class="n usado">${fmt0(disp)}</div><div class="l">Dispuesto (${pct}%)</div></div>` +
            `<div class="kpi"><div class="n disp">${fmt0(libre)}</div><div class="l">Disponible</div></div>`;
        document.getElementById('prog').style.display = 'block';
        document.getElementById('prog-bar').style.width = pct + '%';
        document.getElementById('meta').textContent = [l.banco ? 'Banco: ' + l.banco : '', l.tasaAnual ? 'Tasa: ' + n2(l.tasaAnual) + '%' : '', l.notas ? l.notas : ''].filter(Boolean).join('   ·   ');

        const lista = movsLinea(l.id).slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || String((b.fechaCreacion && b.fechaCreacion.seconds) || '').localeCompare(String((a.fechaCreacion && a.fechaCreacion.seconds) || '')));
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin movimientos en esta línea. Registra una disposición o un pago.</p>'; return; }
        const ICO = { disposicion: '⬆️', pago: '⬇️' }, NOM = { disposicion: 'Disposición', pago: 'Pago' }, SIG = { disposicion: '+ ', pago: '− ' };
        cont.innerHTML = lista.map(m => {
            const t = m.tipo === 'pago' ? 'pago' : 'disposicion';
            const cta = m.cuentaBancoId ? (cuentas.find(c => c.id === m.cuentaBancoId) || {}).alias : '';
            const sub = [fmtFecha(m.fecha), cta ? '🏦 ' + esc(cta) : '', m.referencia ? '# ' + esc(m.referencia) : '', m.creadoPor ? 'por ' + esc(m.creadoPor) : ''].filter(Boolean).join('  ·  ');
            return `<div class="order-card mv-card ${t}">
                <div class="mv-ic ${t}">${ICO[t]}</div>
                <div class="mv-info">
                    <b>${esc(m.concepto || NOM[t])}</b>
                    <div class="mv-monto ${t}">${SIG[t]}${fmt(m.monto)}</div>
                    ${sub ? `<div class="l">${sub}</div>` : ''}
                </div>
                <button class="del-btn" title="Eliminar" onclick="borrarMov('${m.id}')">🗑</button>
            </div>`;
        }).join('');
    }

    render();
</script>

</body>
</html>
