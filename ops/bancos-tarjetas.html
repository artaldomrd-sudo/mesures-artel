<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTAL — Tarjetas Corporativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
    main { max-width: 920px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
    .bar select { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 9px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; background: #fff; min-width: 200px; }
    .btn-o { background: transparent; color: var(--artal-blue); border: 1.5px solid var(--artal-blue); border-radius: 9px; padding: 10px 14px; font-weight: bold; font-size: 13.5px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-c { background: #9b59b6; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }
    .btn-p { background: #2ecc71; color: #fff; border: none; border-radius: 9px; padding: 11px 15px; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Arimo'; min-height: 44px; }

    .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
    .kpi { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 10px 16px; flex: 1; min-width: 130px; }
    .kpi .n { font-size: 18px; font-weight: bold; line-height: 1; } .kpi .n.lim { color: var(--artal-blue); } .kpi .n.disp { color: #1f9d61; } .kpi .n.usado { color: #9b59b6; }
    .kpi .l { font-size: 10.5px; color: #778; text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
    .prog { height: 8px; background: #eef1f4; border-radius: 6px; overflow: hidden; margin: 6px 0 14px; }
    .prog > span { display: block; height: 100%; background: linear-gradient(90deg, #b06fd0, #9b59b6); }
    .meta { font-size: 12.5px; color: #667; margin: -8px 0 12px; }

    .mv-card { display: flex; align-items: flex-start; gap: 12px; border-left: 4px solid #ccc; }
    .mv-card.consumo { border-left-color: #9b59b6; } .mv-card.pago { border-left-color: #2ecc71; }
    .mv-ic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 auto; }
    .mv-ic.consumo { background: #f3eafb; } .mv-ic.pago { background: #e7f7ee; }
    .mv-info { flex: 1; min-width: 0; } .mv-info b { color: var(--artal-blue); font-size: 14px; }
    .mv-info .l { font-size: 12.5px; color: #667; margin-top: 3px; }
    .b { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 20px; background: #eef1f4; color: #556; }
    .mv-monto { font-weight: bold; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .mv-monto.consumo { color: #8e44ad; } .mv-monto.pago { color: #1f9d61; }
    .del-btn { background: transparent; border: none; color: #c9ced6; cursor: pointer; font-size: 15px; } .del-btn:hover { color: #e74c3c; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px; }
    .modal-box h2 { color: var(--artal-blue); font-size: 17px; margin: 0 0 12px; }
    .modal-box label { font-size: 12px; font-weight: bold; color: var(--artal-blue); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Arimo'; font-size: 14px; min-height: 44px; box-sizing: border-box; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lbl-opt { font-weight: normal; color: #8a93a0; font-size: 11px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-family: 'Arimo'; min-height: 46px; }
    .btn-guardar { background: #2ecc71; color: #fff; } .btn-cancelar { background: transparent; color: #888; border: 1.5px solid #ddd !important; }
</style>
</head>
<body>

<header>
    <div class="header-title">
        <a class="btn-back" href="bancos.html" title="Volver">← Bancos</a>
        <img class="logo" src="../logo.png" alt="ARTAL">
        <h1>Tarjetas Corporativas</h1>
    </div>
    <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn">Cerrar sesión</button>
    </div>
</header>

<main>
    <div class="bar">
        <select id="sel-tarjeta" onchange="render()"></select>
        <button class="btn-o" onclick="abrirTarjeta()">+ Nueva tarjeta</button>
        <button class="btn-c" onclick="abrirMov('consumo')">− Consumo</button>
        <button class="btn-p" onclick="abrirMov('pago')">+ Pago</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="prog" id="prog" style="display:none"><span id="prog-bar"></span></div>
    <div class="meta" id="meta"></div>
    <div id="lista"><p class="empty">Cargando…</p></div>
</main>

<datalist id="cat-tar"><option value="Combustible / transporte"></option><option value="Alimentación / atenciones"></option><option value="Materiales / insumos"></option><option value="Herramientas"></option><option value="Publicidad"></option><option value="Suscripciones / software"></option><option value="Viáticos / viajes"></option><option value="Papelería / oficina"></option><option value="Otro consumo"></option></datalist>

<!-- Modal: nueva tarjeta -->
<div class="modal-overlay" id="modal-tarjeta">
    <div class="modal-box">
        <h2>Nueva tarjeta corporativa</h2>
        <div class="grid2">
            <div><label>Banco *</label><input type="text" id="t-banco" placeholder="Ej. Banco Popular"></div>
            <div><label>Últimos 4 dígitos</label><input type="text" id="t-ult4" inputmode="numeric" maxlength="4" placeholder="1234"></div>
        </div>
        <label>Titular / responsable</label>
        <input type="text" id="t-titular" placeholder="Nombre de quien la usa">
        <div class="grid2">
            <div><label>Límite (RD$) *</label><input type="number" id="t-limite" min="0" step="0.01"></div>
            <div><label>Tasa anual (%) <span class="lbl-opt">— opcional</span></label><input type="number" id="t-tasa" min="0" step="0.01" placeholder="Ej. 60"></div>
        </div>
        <label>Notas <span class="lbl-opt">— opcional</span></label>
        <input type="text" id="t-notas" placeholder="Día de corte, etc.">
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-tarjeta')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarTarjeta()">Crear tarjeta</button>
        </div>
    </div>
</div>

<!-- Modal: movimiento (consumo / pago) -->
<div class="modal-overlay" id="modal-mov">
    <div class="modal-box">
        <h2 id="mov-title">Movimiento</h2>
        <div class="grid2">
            <div><label>Fecha</label><input type="date" id="m-fecha"></div>
            <div><label>Monto (RD$) *</label><input type="number" id="m-monto" min="0" step="0.01"></div>
        </div>
        <label>Concepto *</label>
        <input type="text" id="m-concepto" placeholder="Ej. Combustible, almuerzo cliente…">
        <div class="grid2" id="cat-wrap">
            <div><label>Categoría</label><input type="text" id="m-categoria" list="cat-tar" placeholder="Categoría"></div>
            <div><label>Referencia <span class="lbl-opt">— opcional</span></label><input type="text" id="m-ref" placeholder="Nº"></div>
        </div>
        <div id="cuenta-wrap">
            <label>Sale de la cuenta bancaria <span class="lbl-opt">— opcional (genera el débito)</span></label>
            <select id="m-cuenta"><option value="">— Solo registrar en la tarjeta —</option></select>
        </div>
        <div class="modal-actions">
            <button class="btn-cancelar" onclick="cerrar('modal-mov')">Cancelar</button>
            <button class="btn-guardar" onclick="guardarMov()">Guardar</button>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth, auth, signOut } from './auth-common.js';
    import { db } from './firebase-config.js';
    import { collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const usuario = await requireAuth(['contable']);
    document.getElementById('user-name').textContent = usuario.nombre;
    document.getElementById('signout-btn').onclick = () => signOut(auth);

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n2 = (x) => (Number(x) || 0);
    const fmt = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = (x) => 'RD$ ' + n2(x).toLocaleString('es-DO', { maximumFractionDigits: 0 });
    const fmtFecha = (s) => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('es-DO', { day: '2-digit', month: 'short', year: 'numeric' }); };
    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    const nombreTarjeta = (t) => (t.banco || 'Tarjeta') + (t.ultimos4 ? ' ****' + t.ultimos4 : '');

    let tarjetas = [], movs = [], cuentas = [], movTipo = 'consumo';

    onSnapshot(collection(db, 'bancosTarjetas'), (s) => {
        tarjetas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.activo !== false).sort((a, b) => nombreTarjeta(a).localeCompare(nombreTarjeta(b), 'es'));
        llenarTarjetas(); render();
    }, (err) => { document.getElementById('lista').innerHTML = '<p class="empty">Error: ' + err.message + '</p>'; });
    onSnapshot(collection(db, 'bancosTarjetaMovimientos'), (s) => { movs = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    onSnapshot(collection(db, 'bancosCuentas'), (s) => {
        cuentas = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.activo !== false);
        const sel = document.getElementById('m-cuenta'); const cur = sel.value;
        sel.innerHTML = '<option value="">— Solo registrar en la tarjeta —</option>' + cuentas.map(c => `<option value="${esc(c.id)}">${esc(c.alias)}</option>`).join(''); sel.value = cur;
    }, () => {});

    function llenarTarjetas() {
        const sel = document.getElementById('sel-tarjeta'); const cur = sel.value;
        sel.innerHTML = tarjetas.length ? tarjetas.map(t => `<option value="${esc(t.id)}">${esc(nombreTarjeta(t))}${t.titular ? ' — ' + esc(t.titular) : ''}</option>`).join('') : '<option value="">— Sin tarjetas —</option>';
        if (cur && tarjetas.some(t => t.id === cur)) sel.value = cur;
    }
    const tarjetaSel = () => tarjetas.find(t => t.id === document.getElementById('sel-tarjeta').value) || null;
    const movsTarjeta = (id) => movs.filter(m => m.tarjetaId === id);
    const saldoTarjeta = (id) => movsTarjeta(id).reduce((a, m) => a + (m.tipo === 'consumo' ? n2(m.monto) : -n2(m.monto)), 0);

    // ---------- Modales ----------
    window.cerrar = function (id) { document.getElementById(id).classList.remove('show'); };
    window.abrirTarjeta = function () {
        ['t-banco', 't-ult4', 't-titular', 't-limite', 't-tasa', 't-notas'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('modal-tarjeta').classList.add('show');
    };
    window.guardarTarjeta = async function () {
        const banco = document.getElementById('t-banco').value.trim(), limite = n2(document.getElementById('t-limite').value);
        if (!banco) { alert('Escribe el banco de la tarjeta.'); return; }
        if (limite <= 0) { alert('Escribe el límite de la tarjeta.'); return; }
        const btn = document.querySelector('#modal-tarjeta .btn-guardar'); btn.disabled = true; btn.textContent = 'Creando…';
        try {
            const ref = await addDoc(collection(db, 'bancosTarjetas'), {
                banco, ultimos4: document.getElementById('t-ult4').value.replace(/\D/g, '').slice(0, 4), titular: document.getElementById('t-titular').value.trim(),
                limite, tasaAnual: n2(document.getElementById('t-tasa').value), notas: document.getElementById('t-notas').value.trim(),
                activo: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            document.getElementById('sel-tarjeta').value = ref.id;
            cerrar('modal-tarjeta'); render();
        } catch (e) { alert('No se pudo crear: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Crear tarjeta'; }
    };
    window.abrirMov = function (tipo) {
        if (!tarjetaSel()) { alert('Primero elige (o crea) una tarjeta.'); return; }
        movTipo = tipo;
        document.getElementById('mov-title').textContent = tipo === 'consumo' ? 'Consumo (cargo a la tarjeta)' : 'Pago (abono a la tarjeta)';
        // Categoría solo aplica a consumos; la cuenta bancaria (débito) solo al pago.
        document.getElementById('cat-wrap').style.display = tipo === 'consumo' ? 'grid' : 'none';
        document.getElementById('cuenta-wrap').style.display = tipo === 'pago' ? 'block' : 'none';
        document.getElementById('m-fecha').value = hoyISO();
        ['m-monto', 'm-concepto', 'm-categoria', 'm-ref'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('m-cuenta').value = '';
        document.getElementById('modal-mov').classList.add('show');
    };
    window.guardarMov = async function () {
        const t = tarjetaSel(); if (!t) return;
        const monto = n2(document.getElementById('m-monto').value), concepto = document.getElementById('m-concepto').value.trim();
        if (!concepto) { alert('Escribe el concepto.'); return; }
        if (monto <= 0) { alert('Escribe el monto.'); return; }
        if (movTipo === 'consumo') {
            const saldo = saldoTarjeta(t.id), libre = n2(t.limite) - saldo;
            if (monto > libre && !confirm('El consumo (' + fmt(monto) + ') supera el disponible (' + fmt(libre) + '). ¿Registrarlo igual?')) return;
        }
        const cuentaId = movTipo === 'pago' ? document.getElementById('m-cuenta').value : '';
        const ref = document.getElementById('m-ref').value.trim(), fecha = document.getElementById('m-fecha').value || hoyISO();
        const btn = document.querySelector('#modal-mov .btn-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
        try {
            await addDoc(collection(db, 'bancosTarjetaMovimientos'), {
                tarjetaId: t.id, tipo: movTipo, fecha, monto, concepto,
                categoria: movTipo === 'consumo' ? document.getElementById('m-categoria').value.trim() : '',
                referencia: ref, cuentaBancoId: cuentaId, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
            });
            // El pago de la tarjeta puede salir de una cuenta bancaria (genera el débito allí).
            if (cuentaId) {
                await addDoc(collection(db, 'bancosMovimientos'), {
                    cuentaId, tipo: 'debito', monto, fecha, descripcion: 'Pago tarjeta ' + nombreTarjeta(t),
                    referencia: ref, origen: 'tarjeta', conciliado: true, creadoPor: usuario.nombre, fechaCreacion: serverTimestamp()
                });
            }
            cerrar('modal-mov');
        } catch (e) { alert('No se pudo guardar: ' + (e && e.message ? e.message : e)); }
        finally { btn.disabled = false; btn.textContent = 'Guardar'; }
    };
    window.borrarMov = async function (id) {
        if (!confirm('¿Eliminar este movimiento de la tarjeta?')) return;
        try { await deleteDoc(doc(db, 'bancosTarjetaMovimientos', id)); } catch (e) { alert('No se pudo: ' + e.message); }
    };

    function render() {
        const cont = document.getElementById('lista');
        if (!tarjetas.length) { cont.innerHTML = '<p class="empty">No hay tarjetas. Crea una con «+ Nueva tarjeta».</p>'; document.getElementById('kpis').innerHTML = ''; document.getElementById('prog').style.display = 'none'; document.getElementById('meta').textContent = ''; return; }
        const t = tarjetaSel(); if (!t) { cont.innerHTML = '<p class="empty">Elige una tarjeta.</p>'; return; }
        const saldo = saldoTarjeta(t.id), libre = Math.max(0, n2(t.limite) - saldo), pct = n2(t.limite) ? Math.min(100, Math.round(saldo / n2(t.limite) * 100)) : 0;
        document.getElementById('kpis').innerHTML =
            `<div class="kpi"><div class="n lim">${fmt0(t.limite)}</div><div class="l">Límite</div></div>` +
            `<div class="kpi"><div class="n usado">${fmt0(saldo)}</div><div class="l">Saldo usado (${pct}%)</div></div>` +
            `<div class="kpi"><div class="n disp">${fmt0(libre)}</div><div class="l">Disponible</div></div>`;
        document.getElementById('prog').style.display = 'block';
        document.getElementById('prog-bar').style.width = pct + '%';
        document.getElementById('meta').textContent = [t.titular ? 'Titular: ' + t.titular : '', t.tasaAnual ? 'Tasa: ' + n2(t.tasaAnual) + '%' : '', t.notas ? t.notas : ''].filter(Boolean).join('   ·   ');

        const lista = movsTarjeta(t.id).slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || String((b.fechaCreacion && b.fechaCreacion.seconds) || '').localeCompare(String((a.fechaCreacion && a.fechaCreacion.seconds) || '')));
        if (!lista.length) { cont.innerHTML = '<p class="empty">Sin movimientos en esta tarjeta. Registra un consumo o un pago.</p>'; return; }
        const ICO = { consumo: '🛒', pago: '⬇️' }, NOM = { consumo: 'Consumo', pago: 'Pago' }, SIG = { consumo: '+ ', pago: '− ' };
        cont.innerHTML = lista.map(m => {
            const ty = m.tipo === 'pago' ? 'pago' : 'consumo';
            const cta = m.cuentaBancoId ? (cuentas.find(c => c.id === m.cuentaBancoId) || {}).alias : '';
            const sub = [fmtFecha(m.fecha), m.categoria ? esc(m.categoria) : '', cta ? '🏦 ' + esc(cta) : '', m.creadoPor ? 'por ' + esc(m.creadoPor) : ''].filter(Boolean).join('  ·  ');
            return `<div class="order-card mv-card ${ty}">
                <div class="mv-ic ${ty}">${ICO[ty]}</div>
                <div class="mv-info">
                    <b>${esc(m.concepto || NOM[ty])}</b> <span class="b">${NOM[ty]}</span>
                    <div class="mv-monto ${ty}">${SIG[ty]}${fmt(m.monto)}</div>
                    ${sub ? `<div class="l">${sub}</div>` : ''}
                </div>
                <button class="del-btn" title="Eliminar" onclick="borrarMov('${m.id}')">🗑</button>
            </div>`;
        }).join('');
    }

    render();
</script>

</body>
</html>
